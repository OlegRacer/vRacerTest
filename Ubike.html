<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouBike 2.0 Taiwan Radar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: calc(100vh - 105px); }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Головна панель керування -->
    <header class="bg-white shadow-md p-2">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
            
            <!-- Заголовок -->
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🚲</span>
                <div>
                    <h1 class="font-bold text-sm sm:text-base leading-tight">YouBike 2.0 Radar</h1>
                    <p id="statusBadge" class="text-[10px] text-gray-500 font-medium">Готовий до роботи</p>
                </div>
            </div>

            <!-- Елементи керування -->
            <div class="flex items-center gap-1.5 flex-wrap">
                
                <!-- Вибір міста -->
                <select id="citySelect" onchange="loadCityData()" class="border border-gray-300 rounded-lg px-2 py-1 bg-white text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                    <option value="taoyuan">Таоюань (桃園)</option>
                    <option value="taipei">Тайбей (台北)</option>
                    <option value="newtaipei">Новий Тайбей (新北)</option>
                </select>

                <!-- Вибір радіуса -->
                <select id="radiusSelect" onchange="filterAndRenderStations()" class="border border-gray-300 rounded-lg px-2 py-1 bg-white text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                    <option value="1">Радіус: 1 км</option>
                    <option value="0.5">Радіус: 500 м</option>
                    <option value="2">Радіус: 2 км</option>
                    <option value="all">Усі станції</option>
                </select>

                <!-- Кнопка оновлення -->
                <button onclick="loadCityData()" id="refreshBtn" title="Оновити дані" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition shadow-sm flex items-center gap-1">
                    <span id="refreshIcon">🔄</span> <span class="hidden sm:inline">Оновити</span>
                </button>

                <!-- Кнопка GPS -->
                <button onclick="getUserLocation()" id="gpsBtn" title="Моя геопозиція" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition shadow-sm flex items-center gap-1">
                    🎯 GPS
                </button>
            </div>
        </div>
    </header>

    <!-- Інформаційна смужка статусу -->
    <div id="statusBar" class="bg-blue-50 border-b border-blue-100 text-blue-800 px-3 py-1 text-xs flex justify-between items-center font-medium">
        <span id="statusMessage">Завантаження інформації про станції...</span>
        <span id="stationCount" class="font-bold bg-blue-200 text-blue-900 px-2 py-0.5 rounded-full text-[10px]">0 станцій</span>
    </div>

    <!-- Інтерактивна мапа -->
    <div id="map" class="w-full"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Ініціалізація карти (центр за замовчуванням - Таоюань)
        const map = L.map('map').setView([24.9537, 121.2257], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let userMarker = null;
        let userCircle = null;
        let userLat = null;
        let userLng = null;
        let allStationsData = [];
        let isLoading = false;

        // Центри регіонів
        const cityCenters = {
            taoyuan: [24.9537, 121.2257],
            taipei: [25.0330, 121.5654],
            newtaipei: [25.0130, 121.4660]
        };

        // Багаторівневі маршрути завантаження даних (з аварійними проксі)
        const citySources = {
            taoyuan: [
                "https://data.tycg.gov.tw/api/v1/rest/datastore/3833d826-801e-49f2-a10c-5d8619f4cb1d?format=json&limit=2000",
                "https://corsproxy.io/?" + encodeURIComponent("https://data.tycg.gov.tw/api/v1/rest/datastore/3833d826-801e-49f2-a10c-5d8619f4cb1d?format=json&limit=2000"),
                "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://data.tycg.gov.tw/api/v1/rest/datastore/3833d826-801e-49f2-a10c-5d8619f4cb1d?format=json&limit=2000")
            ],
            taipei: [
                "https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json",
                "https://corsproxy.io/?" + encodeURIComponent("https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json")
            ],
            newtaipei: [
                "https://data.ntpc.gov.tw/api/datasets/01077226-5124-4ed3-8dd6-581023a0731e/json?page=0&size=2000",
                "https://corsproxy.io/?" + encodeURIComponent("https://data.ntpc.gov.tw/api/datasets/01077226-5124-4ed3-8dd6-581023a0731e/json?page=0&size=2000"),
                "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://data.ntpc.gov.tw/api/datasets/01077226-5124-4ed3-8dd6-581023a0731e/json?page=0&size=2000")
            ]
        };

        // Розрахунок відстані в кілометрах (Haversine formula)
        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Оновлення текстового статусу
        function updateStatus(msg, type = 'info', count = null) {
            const bar = document.getElementById('statusBar');
            const statusMsg = document.getElementById('statusMessage');
            const statusBadge = document.getElementById('statusBadge');
            const stationCount = document.getElementById('stationCount');

            statusMsg.textContent = msg;

            if (count !== null) {
                stationCount.textContent = `${count} станцій`;
            }

            if (type === 'loading') {
                bar.className = "bg-amber-50 border-b border-amber-100 text-amber-800 px-3 py-1 text-xs flex justify-between items-center font-medium";
                statusBadge.textContent = "Завантаження...";
                statusBadge.className = "text-[10px] text-amber-600 font-bold";
            } else if (type === 'success') {
                bar.className = "bg-emerald-50 border-b border-emerald-100 text-emerald-800 px-3 py-1 text-xs flex justify-between items-center font-medium";
                statusBadge.textContent = "Дані оновлено";
                statusBadge.className = "text-[10px] text-emerald-600 font-bold";
            } else if (type === 'error') {
                bar.className = "bg-rose-50 border-b border-rose-100 text-rose-800 px-3 py-1 text-xs flex justify-between items-center font-medium";
                statusBadge.textContent = "Помилка завантаження";
                statusBadge.className = "text-[10px] text-rose-600 font-bold";
            }
        }

        // Головна функція завантаження даних з failover
        async function loadCityData() {
            if (isLoading) return;
            isLoading = true;

            const city = document.getElementById('citySelect').value;
            const sources = citySources[city] || [];
            
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('spin');

            updateStatus(`Підключення до серверів (${city})...`, 'loading');

            // Якщо немає геолокації, переміщуємо мапу на центр міста
            if (!userLat && cityCenters[city]) {
                map.setView(cityCenters[city], 13);
            }

            let loadedData = null;
            let successUrl = null;

            // Послідовне опитування джерел даних
            for (let i = 0; i < sources.length; i++) {
                const url = sources[i];
                try {
                    updateStatus(`Отримання даних (спроба ${i + 1}/${sources.length})...`, 'loading');
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 с таймаут

                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                    
                    const json = await response.json();
                    
                    // Універсальна нормалізація форматів даних
                    if (Array.isArray(json)) {
                        loadedData = json;
                    } else if (json.result && Array.isArray(json.result.records)) {
                        loadedData = json.result.records;
                    } else if (Array.isArray(json.data)) {
                        loadedData = json.data;
                    } else if (typeof json === 'string') {
                        const parsed = JSON.parse(json);
                        loadedData = Array.isArray(parsed) ? parsed : (parsed.result?.records || parsed.data || null);
                    }

                    if (loadedData && loadedData.length > 0) {
                        successUrl = url;
                        break;
                    }
                } catch (err) {
                    console.warn(`Спроба ${i + 1} для ${city} невдала:`, err.message);
                }
            }

            refreshIcon.classList.remove('spin');
            isLoading = false;

            if (loadedData && loadedData.length > 0) {
                allStationsData = loadedData;
                updateStatus(`Завантажено успішно (${allStationsData.length} станцій в базі)`, 'success', allStationsData.length);
                filterAndRenderStations();
            } else {
                allStationsData = [];
                markersLayer.clearLayers();
                updateStatus(`Не вдалося завантажити дані для ${city}. Перевірте мережу.`, 'error', 0);
            }
        }

        // Отримання координат GPS
        function getUserLocation() {
            if (!navigator.geolocation) {
                alert("Ваш браузер не підтримує геолокацію.");
                return;
            }

            updateStatus("Запит геолокації GPS...", "loading");

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;

                    if (userMarker) map.removeLayer(userMarker);
                    if (userCircle) map.removeLayer(userCircle);

                    // Маркер позиції користувача
                    userMarker = L.circleMarker([userLat, userLng], {
                        radius: 8,
                        fillColor: "#3b82f6",
                        color: "#ffffff",
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 1
                    }).addTo(map).bindPopup("<b>Ви тут</b>").openPopup();

                    map.setView([userLat, userLng], 15);
                    updateStatus("Геолокацію отримано!", "success");
                    filterAndRenderStations();
                },
                (error) => {
                    updateStatus("Помилка отримання GPS. Дозвольте доступ у браузері.", "error");
                    console.error("GPS Error:", error);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // Фільтрація та малювання станцій
        function filterAndRenderStations() {
            markersLayer.clearLayers();
            if (userCircle) map.removeLayer(userCircle);

            if (!allStationsData || allStationsData.length === 0) return;

            const radiusValue = document.getElementById('radiusSelect').value;
            const maxRadius = radiusValue === 'all' ? Infinity : parseFloat(radiusValue);

            // Відображення радіуса на карті
            if (userLat && userLng && maxRadius !== Infinity) {
                userCircle = L.circle([userLat, userLng], {
                    color: '#3b82f6',
                    fillColor: '#3b82f6',
                    fillOpacity: 0.1,
                    radius: maxRadius * 1000
                }).addTo(map);
            }

            let renderedCount = 0;
            let bounds = [];

            allStationsData.forEach(station => {
                // Отримання координат з урахуванням різних ключів у JSON
                const lat = parseFloat(station.latitude || station.lat || station.lat0);
                const lng = parseFloat(station.longitude || station.lng || station.lng0);

                if (isNaN(lat) || isNaN(lng)) return;

                // Розрахунок відстані
                let distance = null;
                if (userLat && userLng) {
                    distance = getDistanceKm(userLat, userLng, lat, lng);
                    if (distance > maxRadius) return;
                }

                // Вилучення назви та кількості велосипедів
                const name = (station.sna || station.snaen || station.StationName?.Zh_tw || 'Станція')
                    .replace('YouBike2.0_', '').replace('YouBike1.0_', '');
                
                const bikes = parseInt(station.available_rent_bikes || station.sbi || station.servnake || 0, 10);
                const emptyDocks = parseInt(station.available_return_bikes || station.bemp || 0, 10);

                bounds.push([lat, lng]);
                renderedCount++;

                // Стиль маркера в залежності від наявності велосипедів
                const badgeBg = bikes > 0 ? 'bg-emerald-600' : 'bg-rose-600';

                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="${badgeBg} text-white font-bold text-xs rounded-full h-7 w-7 flex items-center justify-center border-2 border-white shadow-md">${bikes}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([lat, lng], { icon: customIcon });

                const distHtml = distance !== null 
                    ? `<p class="text-blue-600 font-semibold mt-1">📍 Відстань: ${(distance * 1000).toFixed(0)} м</p>` 
                    : '';

                marker.bindPopup(`
                    <div class="p-1 max-w-[200px]">
                        <h3 class="font-bold text-sm text-gray-800 leading-tight">${name}</h3>
                        ${distHtml}
                        <div class="mt-2 text-xs space-y-1 bg-gray-50 p-2 rounded border border-gray-100">
                            <p class="text-emerald-700 font-bold flex justify-between">
                                <span>🚲 Доступно:</span>
                                <span>${bikes}</span>
                            </p>
                            <p class="text-blue-600 font-semibold flex justify-between">
                                <span>🅿️ Вільних місць:</span>
                                <span>${emptyDocks}</span>
                            </p>
                            <p class="text-gray-400 flex justify-between text-[10px]">
                                <span>Всього стойок:</span>
                                <span>${bikes + emptyDocks}</span>
                            </p>
                        </div>
                    </div>
                `);

                markersLayer.addLayer(marker);
            });

            // Оновлення лічильника на смужці
            const statusMsg = document.getElementById('statusMessage');
            document.getElementById('stationCount').textContent = `${renderedCount} відображено`;

            // Якщо GPS не увімкнено, масштабуємо карту за збереженими точками
            if (bounds.length > 0 && !userLat) {
                map.fitBounds(bounds, { padding: [30, 30] });
            }
        }

        // Автозапуск при відкритті
        window.addEventListener('DOMContentLoaded', () => {
            // За замовчуванням Таоюань
            document.getElementById('citySelect').value = 'taoyuan';
            loadCityData();
            
            // Спроба отримати локацію через 1 секунду
            setTimeout(getUserLocation, 1000);
        });
    </script>
</body>
</html>
