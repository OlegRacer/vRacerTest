<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouBike Open Radar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: calc(100vh - 65px); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Панель керування -->
    <header class="bg-white shadow-md p-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🚲</span>
            <h1 class="font-bold text-lg text-gray-800">YouBike 2.0 Direct</h1>
        </div>

        <div class="flex items-center gap-2">
            <select id="citySelect" class="border rounded px-3 py-1.5 bg-white text-sm focus:outline-blue-500 font-medium">
                <option value="taoyuan">Таоюань (Taoyuan)</option>
                <option value="taipei">Тайбей (Taipei)</option>
                <option value="newtaipei">Новий Тайбей (New Taipei)</option>
            </select>

            <button onclick="loadBikeData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded text-sm font-semibold transition shadow-sm">
                Оновити
            </button>
        </div>
    </header>

    <!-- Мапа -->
    <div id="map" class="w-full"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Ініціалізація мапи (координати Таоюаня)
        const map = L.map('map').setView([24.9537, 121.2257], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        // Прямі URL відкритих API без ключів
        const apiEndpoints = {
            taoyuan: "https://data.tycg.gov.tw/api/v1/rest/datastore/3833d826-801e-49f2-a10c-5d8619f4cb1d?format=json&limit=2000",
            taipei: "https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json",
            newtaipei: "https://data.ntpc.gov.tw/api/datasets/01077226-5124-4ed3-8dd6-581023a0731e/json?page=0&size=2000"
        };

        async function loadBikeData() {
            const city = document.getElementById('citySelect').value;
            const url = apiEndpoints[city];

            // Очищення старих маркерів
            markersLayer.clearLayers();

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Помилка мережі");
                
                const json = await response.json();
                
                // Нормалізація даних (оскільки структура JSON у різних міст може трохи відрізнятися)
                let rawList = [];
                if (city === 'taoyuan') {
                    rawList = json.result ? json.result.records : [];
                } else {
                    rawList = Array.isArray(json) ? json : [];
                }

                if (rawList.length === 0) {
                    alert("Не вдалося отримати дані для обраного міста.");
                    return;
                }

                let bounds = [];

                rawList.forEach(station => {
                    // Зчитування координат і кількості байків
                    const lat = parseFloat(station.lat || station.latitude);
                    const lng = parseFloat(station.lng || station.longitude);
                    const name = (station.sna || '').replace('YouBike2.0_', '');
                    const bikes = parseInt(station.sbi || station.available_rent_bikes || 0, 10);
                    const emptyDocks = parseInt(station.bemp || station.available_return_bikes || 0, 10);

                    if (isNaN(lat) || isNaN(lng)) return;

                    bounds.push([lat, lng]);

                    // Зелений маркер якщо є байки, червоний якщо 0
                    const badgeBg = bikes > 0 ? 'bg-emerald-600' : 'bg-rose-600';
                    
                    const customIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="${badgeBg} text-white font-bold text-xs rounded-full h-7 w-7 flex items-center justify-center border-2 border-white shadow-lg">${bikes}</div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    const marker = L.marker([lat, lng], { icon: customIcon });

                    marker.bindPopup(`
                        <div class="p-1">
                            <h3 class="font-bold text-sm text-gray-800">${name}</h3>
                            <div class="mt-2 text-xs space-y-1">
                                <p class="text-emerald-700 font-bold">🚲 Доступно велосипедів: ${bikes}</p>
                                <p class="text-blue-600 font-semibold">🅿️ Вільних місць: ${emptyDocks}</p>
                                <p class="text-gray-400">Всього стойок: ${bikes + emptyDocks}</p>
                            </div>
                        </div>
                    `);

                    markersLayer.addLayer(marker);
                });

                // Автоматично масштабуємо мапу під нові маркери
                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [40, 40] });
                }

            } catch (error) {
                console.error("Помилка завантаження:", error);
                alert("Не вдалося завантажити дані. Перевірте підключення.");
            }
        }

        // Автоматично завантажуємо Таоюань при відкритті сторінки
        window.addEventListener('DOMContentLoaded', loadBikeData);
    </script>
</body>
</html>
