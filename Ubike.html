<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouBike 2.0 Taiwan Radar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: calc(100vh - 65px); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Панель керування -->
    <header class="bg-white shadow-md p-2 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center space-x-1">
            <span class="text-xl">🚲</span>
            <h1 class="font-bold text-sm text-gray-800">YouBike</h1>
        </div>

        <div class="flex items-center gap-1.5 flex-wrap">
            <!-- Вибір регіону -->
            <select id="citySelect" onchange="fetchBikeData()" class="border rounded px-2 py-1 bg-white text-xs font-semibold focus:outline-blue-500">
                <option value="taoyuan">Таоюань</option>
                <option value="taipei">Тайбей</option>
                <option value="newtaipei">Новий Тайбей</option>
            </select>

            <!-- Вибір радіуса -->
            <select id="radiusSelect" onchange="filterAndRenderStations()" class="border rounded px-2 py-1 bg-white text-xs font-semibold focus:outline-blue-500">
                <option value="1">1 км</option>
                <option value="0.5">500 м</option>
                <option value="2">2 км</option>
                <option value="all">Усі</option>
            </select>

            <!-- Кнопка GPS -->
            <button onclick="getUserLocation()" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded text-xs font-bold transition shadow-sm flex items-center gap-1">
                🎯 GPS
            </button>
        </div>
    </header>

    <!-- Мапа -->
    <div id="map" class="w-full"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Ініціалізація мапи (центр Таоюаня за замовчуванням)
        const map = L.map('map').setView([24.9537, 121.2257], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let userMarker = null;
        let userCircle = null;
        let userLat = null;
        let userLng = null;
        let allStationsData = [];

        // Ендпоінти для різних міст
        const apiEndpoints = {
            taoyuan: "https://data.tycg.gov.tw/api/v1/rest/datastore/3833d826-801e-49f2-a10c-5d8619f4cb1d?format=json&limit=2000",
            taipei: "https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json",
            newtaipei: "https://data.ntpc.gov.tw/api/datasets/01077226-5124-4ed3-8dd6-581023a0731e/json?page=0&size=2000"
        };

        // Координати для центрування при виборі міста
        const cityCenters = {
            taoyuan: [24.9537, 121.2257],
            taipei: [25.0330, 121.5654],
            newtaipei: [25.0130, 121.4660]
        };

        // Формула Haversine для відстані в км
        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Завантаження даних обраного міста
        async function fetchBikeData() {
            const city = document.getElementById('citySelect').value;
            const url = apiEndpoints[city];

            // Центруємо мапу на обране місто, якщо GPS ще не використовувався
            if (!userLat && cityCenters[city]) {
                map.setView(cityCenters[city], 13);
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Помилка API");
                const json = await response.json();
                
                // Універсальний парсер для різних форматів JSON у міських адміністраціях
                if (Array.isArray(json)) {
                    allStationsData = json;
                } else if (json.result && Array.isArray(json.result.records)) {
                    allStationsData = json.result.records;
                } else if (Array.isArray(json.data)) {
                    allStationsData = json.data;
                } else {
                    allStationsData = [];
                }

                filterAndRenderStations();
            } catch (error) {
                console.error("Помилка:", error);
                alert("Не вдалося завантажити дані YouBike для цього регіону.");
            }
        }

        // Отримання геолокації користувача
        function getUserLocation() {
            if (!navigator.geolocation) {
                alert("Геолокація не підтримується.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;

                    if (userMarker) map.removeLayer(userMarker);
                    if (userCircle) map.removeLayer(userCircle);

                    userMarker = L.circleMarker([userLat, userLng], {
                        radius: 8,
                        fillColor: "#3b82f6",
                        color: "#ffffff",
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 1
                    }).addTo(map).bindPopup("<b>Ви тут</b>").openPopup();

                    map.setView([userLat, userLng], 15);
                    filterAndRenderStations();
                },
                (error) => {
                    alert("Не вдалося отримати дозвіл на GPS.");
                    console.error(error);
                },
                { enableHighAccuracy: true }
            );
        }

        // Рендеринг станцій з урахуванням радіуса
        function filterAndRenderStations() {
            markersLayer.clearLayers();
            if (userCircle) map.removeLayer(userCircle);

            if (!allStationsData || allStationsData.length === 0) return;

            const radiusValue = document.getElementById('radiusSelect').value;
            const maxRadius = radiusValue === 'all' ? Infinity : parseFloat(radiusValue);

            if (userLat && userLng && maxRadius !== Infinity) {
                userCircle = L.circle([userLat, userLng], {
                    color: '#3b82f6',
                    fillColor: '#3b82f6',
                    fillOpacity: 0.1,
                    radius: maxRadius * 1000
                }).addTo(map);
            }

            let bounds = [];

            allStationsData.forEach(station => {
                const lat = parseFloat(station.latitude || station.lat);
                const lng = parseFloat(station.longitude || station.lng);

                if (isNaN(lat) || isNaN(lng)) return;

                let distance = null;
                if (userLat && userLng) {
                    distance = getDistanceKm(userLat, userLng, lat, lng);
                    if (distance > maxRadius) return;
                }

                const name = (station.sna || station.StationName?.Zh_tw || '').replace('YouBike2.0_', '');
                const bikes = parseInt(station.available_rent_bikes || station.sbi || 0, 10);
                const emptyDocks = parseInt(station.available_return_bikes || station.bemp || 0, 10);

                bounds.push([lat, lng]);

                const badgeBg = bikes > 0 ? 'bg-emerald-600' : 'bg-rose-600';

                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="${badgeBg} text-white font-bold text-xs rounded-full h-7 w-7 flex items-center justify-center border-2 border-white shadow-lg">${bikes}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([lat, lng], { icon: customIcon });
                const distText = distance !== null ? `<p class="text-blue-600 font-medium">📍 Відстань: ${(distance * 1000).toFixed(0)} м</p>` : '';

                marker.bindPopup(`
                    <div class="p-1">
                        <h3 class="font-bold text-sm text-gray-800">${name}</h3>
                        ${distText}
                        <div class="mt-2 text-xs space-y-1">
                            <p class="text-emerald-700 font-bold">🚲 Доступно велосипедів: ${bikes}</p>
                            <p class="text-blue-600 font-semibold">🅿️ Вільних місць: ${emptyDocks}</p>
                            <p class="text-gray-400">Всього стойок: ${bikes + emptyDocks}</p>
                        </div>
                    </div>
                `);

                markersLayer.addLayer(marker);
            });

            if (bounds.length > 0 && !userLat && document.getElementById('citySelect').value === 'taipei') {
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        }

        // Автозапуск при відкритті
        window.addEventListener('DOMContentLoaded', () => {
            // За замовчуванням вибираємо Таоюань у списку
            document.getElementById('citySelect').value = 'taoyuan';
            fetchBikeData();
            setTimeout(getUserLocation, 800);
        });
    </script>
</body>
</html>
