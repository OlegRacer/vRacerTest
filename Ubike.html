<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouBike 2.0 Direct Radar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: calc(100vh - 65px); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Панель керування -->
    <header class="bg-white shadow-md p-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🚲</span>
            <h1 class="font-bold text-lg text-gray-800">YouBike 2.0</h1>
        </div>

        <button onclick="loadBikeData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded text-sm font-semibold transition shadow-sm">
            Оновити
        </button>
    </header>

    <!-- Мапа -->
    <div id="map" class="w-full"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Початкові координати (Тайбей / Північний Тайвань)
        const map = L.map('map').setView([25.0330, 121.5654], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        // Офіційний прямий Azure CDN URL для YouBike 2.0 (працює без CORS-помилок)
        const directApiUrl = "https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json";

        async function loadBikeData() {
            markersLayer.clearLayers();

            try {
                const response = await fetch(directApiUrl);
                if (!response.ok) throw new Error("Помилка завантаження API");
                
                const stations = await response.json();

                if (!Array.isArray(stations) || stations.length === 0) {
                    alert("Дані порожні або недоступні.");
                    return;
                }

                let bounds = [];

                stations.forEach(station => {
                    const lat = parseFloat(station.latitude || station.lat);
                    const lng = parseFloat(station.longitude || station.lng);
                    const name = (station.sna || '').replace('YouBike2.0_', '');
                    const bikes = parseInt(station.available_rent_bikes || station.sbi || 0, 10);
                    const emptyDocks = parseInt(station.available_return_bikes || station.bemp || 0, 10);

                    if (isNaN(lat) || isNaN(lng)) return;

                    bounds.push([lat, lng]);

                    const badgeBg = bikes > 0 ? 'bg-emerald-600' : 'bg-rose-600';
                    
                    const customIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="${badgeBg} text-white font-bold text-xs rounded-full h-7 w-7 flex items-center justify-center border-2 border-white shadow-lg">${bikes}</div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    const marker = L.marker([lat, lng], { icon: customIcon });

                    marker.bindPopup(`
                        <div class="p-1">
                            <h3 class="font-bold text-sm text-gray-800">${name}</h3>
                            <div class="mt-2 text-xs space-y-1">
                                <p class="text-emerald-700 font-bold">🚲 Доступно велосипедів: ${bikes}</p>
                                <p class="text-blue-600 font-semibold">🅿️ Вільних місць: ${emptyDocks}</p>
                                <p class="text-gray-400">Всього стойок: ${bikes + emptyDocks}</p>
                            </div>
                        </div>
                    `);

                    markersLayer.addLayer(marker);
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [40, 40] });
                }

            } catch (error) {
                console.error("Помилка:", error);
                alert("Не вдалося завантажити дані YouBike.");
            }
        }

        window.addEventListener('DOMContentLoaded', loadBikeData);
    </script>
</body>
</html>
