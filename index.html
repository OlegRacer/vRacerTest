/* ═══════════════════════════════════════════════════════════════════════
   МУЗИЧНИЙ МІНІ-ПЛЕЄР (плитка "Музика")
   ───────────────────────────────────────────────────────────────────────
   Окремо від сигнальних тонів (audioCtx/gac() нижче) — це повноцінний
   плеєр локальних MP3/M4A файлів. Файли (Blob) зберігаються в окремій
   IndexedDB-базі vracer-audio (стор tracks), щоб плейлист переживав
   перезавантаження сторінки й закриття Bluefy.
   Один глобальний екземпляр vAudio керує ОДНИМ <audio>-елементом — якщо
   на робочому столі кілька плиток "Музика" (або кілька столів), усі
   показують той самий стан відтворення, як системний мініплеєр.
   Усі блоби кешуються в пам'яті (this._blobCache) одразу після init() —
   навмисно: iOS вимагає, щоб audio.play() викликався СИНХРОННО в
   обробнику жесту користувача, без await між тапом і play(). Якщо
   читати блоб з IndexedDB заново при кожному тапі Play — await зніме
   "довіру" до жесту, і Bluefy/Safari мовчки заблокує відтворення.
   ═══════════════════════════════════════════════════════════════════════ */
class vRacerAudioPlayer{
  constructor(){
    this.DB_NAME='vracer-audio';this.STORE='tracks';
    this.tracks=[];            // [{id,name,title,size}] — без самого Blob
    this._blobCache=new Map(); // id -> Blob (жива копія для миттєвого play())
    this.currentIndex=-1;
    this._objectUrl=null;
    this.ready=false;
    this.audio=new Audio();this.audio.preload='metadata';
    this._wireAudioEvents();
    this._wireMediaSession();
  }
  _idb(){
    return new Promise((resolve,reject)=>{
      let req;
      try{ req=indexedDB.open(this.DB_NAME,1); }catch(e){ reject(e); return; }
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains(this.STORE)){
          db.createObjectStore(this.STORE,{keyPath:'id',autoIncrement:true});
        }
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
  }
  async init(){
    try{
      const db=await this._idb();
      const recs=await new Promise((res,rej)=>{
        const tx=db.transaction(this.STORE,'readonly');
        const rq=tx.objectStore(this.STORE).getAll();
        rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);
      });
      this.tracks=recs.map(r=>({id:r.id,name:r.name,title:r.title,size:(r.blob&&r.blob.size)||0}));
      recs.forEach(r=>this._blobCache.set(r.id,r.blob));
      this.ready=true;
      updateAudioTilesUI();
      try{ if(curTab===4){ const m=document.getElementById('em'); if(m&&m.classList.contains('sh')) bmain(); } }catch(e){}
    }catch(e){
      console.error('[vRacerAudio] IndexedDB недоступна:',e);
      try{sht('Музика: пам\'ять браузера недоступна');}catch(e2){}
    }
  }
  async addFiles(fileList){
    let okCount=0;
    try{
      const db=await this._idb();
      for(const f of Array.from(fileList||[])){
        try{
          const title=f.name.replace(/\.[^.]+$/,'');
          const id=await new Promise((res,rej)=>{
            const tx=db.transaction(this.STORE,'readwrite');
            const rq=tx.objectStore(this.STORE).add({name:f.name,title,blob:f});
            rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
          });
          this.tracks.push({id,name:f.name,title,size:f.size});
          this._blobCache.set(id,f);okCount++;
        }catch(errOne){ console.error('[vRacerAudio] Не вдалось зберегти файл',f&&f.name,errOne); }
      }
    }catch(e){ console.error('[vRacerAudio] IndexedDB недоступна при завантаженні:',e); }
    updateAudioTilesUI();
    return okCount;
  }
  async deleteTrack(id){
    try{
      const db=await this._idb();
      await new Promise((res,rej)=>{
        const tx=db.transaction(this.STORE,'readwrite');
        tx.objectStore(this.STORE).delete(id);
        tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
      });
    }catch(e){ console.error('[vRacerAudio] Помилка видалення треку:',e); return false; }
    const idx=this.tracks.findIndex(t=>t.id===id);
    if(idx>-1){
      if(this.currentIndex===idx){ this.stop(); this.currentIndex=-1; }
      else if(this.currentIndex>idx) this.currentIndex--;
      this.tracks.splice(idx,1);
    }
    this._blobCache.delete(id);
    updateAudioTilesUI();
    return true;
  }
  async clearAll(){
    try{
      const db=await this._idb();
      await new Promise((res,rej)=>{
        const tx=db.transaction(this.STORE,'readwrite');
        tx.objectStore(this.STORE).clear();
        tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
      });
    }catch(e){ console.error('[vRacerAudio] Помилка очищення бази:',e); return false; }
    this.stop();this.tracks=[];this.currentIndex=-1;this._blobCache.clear();
    updateAudioTilesUI();
    return true;
  }
  play(index){
    if(typeof index==='number' && index!==this.currentIndex){ this._loadAndPlay(index); return; }
    if(this.currentIndex<0){ if(this.tracks.length) this._loadAndPlay(0); return; }
    const p=this.audio.play(); if(p&&p.catch) p.catch(()=>{});
  }
  _loadAndPlay(index){
    if(index<0||index>=this.tracks.length) return;
    const track=this.tracks[index];
    const blob=this._blobCache.get(track.id);
    if(!blob){ console.error('[vRacerAudio] Немає блоба для треку в пам\'яті:',track.name); return; }
    if(this._objectUrl) URL.revokeObjectURL(this._objectUrl);
    this._objectUrl=URL.createObjectURL(blob);
    this.currentIndex=index;
    this.audio.src=this._objectUrl;
    const p=this.audio.play();
    if(p&&p.catch) p.catch(err=>console.warn('[vRacerAudio] play() заблоковано (потрібен жест користувача):',err));
    this._updateMediaSessionMetadata();
    updateAudioTilesUI();
  }
  pause(){ this.audio.pause(); }
  toggle(){ if(this.audio.paused) this.play(); else this.pause(); }
  stop(){
    this.audio.pause();
    try{ this.audio.removeAttribute('src'); this.audio.load(); }catch(e){}
    if(this._objectUrl){ URL.revokeObjectURL(this._objectUrl); this._objectUrl=null; }
  }
  next(){ if(!this.tracks.length) return; this._loadAndPlay((this.currentIndex+1+this.tracks.length)%this.tracks.length); }
  prev(){
    if(!this.tracks.length) return;
    // Стандартна поведінка музичних плеєрів: якщо трек уже грає понад 5с —
    // "попередній" повертає ЦЕЙ САМИЙ трек на початок, а не стрибає на
    // справді попередній у списку (те, чого користувач найчастіше й хоче —
    // почати поточну пісню заново, а не втратити прогрес випадковим тапом).
    if(this.currentIndex>=0 && this.audio.currentTime>5){
      this.seek(0);
      return;
    }
    this._loadAndPlay((this.currentIndex-1+this.tracks.length)%this.tracks.length);
  }
  seek(t){ if(isFinite(t) && this.audio.duration) this.audio.currentTime=Math.max(0,Math.min(t,this.audio.duration)); }
  _wireAudioEvents(){
    this.audio.addEventListener('timeupdate',()=>{ updateAudioTilesUI(); this._updatePositionState(); });
    this.audio.addEventListener('loadedmetadata',()=>{ updateAudioTilesUI(); this._updatePositionState(); });
    this.audio.addEventListener('play',()=>{ updateAudioTilesUI(); if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing'; });
    this.audio.addEventListener('pause',()=>{ updateAudioTilesUI(); if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused'; });
    this.audio.addEventListener('ended',()=>{ this.next(); });
    this.audio.addEventListener('error',()=>{ if(this.audio.error) console.error('[vRacerAudio] Помилка відтворення:',this.audio.error); });
  }
  _wireMediaSession(){
    if(!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.setActionHandler('play',()=>this.play());
      navigator.mediaSession.setActionHandler('pause',()=>this.pause());
      navigator.mediaSession.setActionHandler('previoustrack',()=>this.prev());
      navigator.mediaSession.setActionHandler('nexttrack',()=>this.next());
      navigator.mediaSession.setActionHandler('seekto',details=>{
        if(details.fastSeek && 'fastSeek' in this.audio){ try{this.audio.fastSeek(details.seekTime);return;}catch(e){} }
        this.seek(details.seekTime);
      });
    }catch(e){ console.warn('[vRacerAudio] Не всі дії MediaSession підтримуються:',e); }
  }
  _updateMediaSessionMetadata(){
    if(!('mediaSession' in navigator)) return;
    const t=this.tracks[this.currentIndex];if(!t) return;
    try{
      navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:'vRacer Dash',album:'vRacer Dash'});
    }catch(e){}
  }
  _updatePositionState(){
    if(!('mediaSession' in navigator) || !('setPositionState' in navigator.mediaSession)) return;
    const d=this.audio.duration;
    if(!isFinite(d)||d<=0) return;
    try{ navigator.mediaSession.setPositionState({duration:d,playbackRate:this.audio.playbackRate||1,position:Math.min(this.audio.currentTime,d)}); }catch(e){}
  }
}
const vAudio=new vRacerAudioPlayer();
try{ vAudio.init(); }catch(e){ console.error('[vRacerAudio] init() впав:',e); }

function fmtAudioTime(s){
  if(!isFinite(s)||s<0) s=0;
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return m+':'+String(sec).padStart(2,'0');
}
// Оновлює ВСІ плитки "Музика", що зараз є в DOM (їх може бути кілька, якщо
// додано на кілька робочих столів) — простіше й надійніше, ніж тримати
// список підписників, який довелось би чистити при видаленні плитки.
function updateAudioTilesUI(){
  const nodes=document.querySelectorAll('.audio-tile-inner');
  if(!nodes.length) return;
  const hasTrack=vAudio.currentIndex>-1 && vAudio.tracks[vAudio.currentIndex];
  const cur=hasTrack?vAudio.tracks[vAudio.currentIndex]:null;
  const dur=vAudio.audio.duration;
  const pct=(hasTrack && isFinite(dur) && dur>0)?Math.min(100,(vAudio.audio.currentTime/dur)*100):0;
  const playing=!vAudio.audio.paused && !vAudio.audio.ended && hasTrack;
  nodes.forEach(el=>{
    el.classList.toggle('empty', vAudio.tracks.length===0);
    const titleEl=el.querySelector('.at-title');
    const artistEl=el.querySelector('.at-artist');
    if(titleEl) titleEl.textContent=cur?cur.title:'Немає треків';
    if(artistEl) artistEl.textContent=vAudio.tracks.length?('Трек '+(vAudio.currentIndex+1)+' з '+vAudio.tracks.length):'Налаштування → Музика';
    const fill=el.querySelector('.at-progress-fill');if(fill) fill.style.width=pct+'%';
    const handle=el.querySelector('.at-progress-handle');if(handle) handle.style.left=pct+'%';
    const curT=el.querySelector('.at-time-cur');if(curT) curT.textContent=fmtAudioTime(hasTrack?vAudio.audio.currentTime:0);
    const durT=el.querySelector('.at-time-dur');if(durT) durT.textContent=fmtAudioTime(hasTrack&&isFinite(dur)?dur:0);
    const playBtn=el.querySelector('.at-play');
    if(playBtn){
      playBtn.innerHTML = playing
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="7,4 20,12 7,20"/></svg>';
      playBtn.disabled=vAudio.tracks.length===0;
    }
    const prevBtn=el.querySelector('.at-prev');if(prevBtn) prevBtn.disabled=vAudio.tracks.length<2;
    const nextBtn=el.querySelector('.at-next');if(nextBtn) nextBtn.disabled=vAudio.tracks.length<2;
  });
  const amod=document.getElementById('amod');
  if(amod && amod.classList.contains('sh')) updateTrackListHighlightOnly();
}
// РАНІШЕ тут викликався повний renderTrackListModalBody() — тобто ввесь
// innerHTML списку перебудовувався на КОЖЕН timeupdate (десятки разів на
// секунду під час відтворення), що скидало прокрутку щоразу — саме тому
// список неможливо було прогорнути вниз (виглядало як "примусове

// Тепер лише міняємо клас/текст уже існуючих рядків, DOM не перебудовується

// ── Плитка "Секундомір" (17.08.2026) ──────────────────────────────────
// Стан навмисно живе ОКРЕМО від DOM (об'єкт swState, ключ — tile.id), бо
// render() повністю перебудовує innerHTML сітки плиток при БУДЬ-ЯКІЙ зміні
// розкладу (додавання/видалення іншої плитки, зміна розміру тощо) — якби
// час рахувався виходячи з якогось DOM-вузла чи локальної змінної
// всередині mkStopwatchTile(), кожен такий re-render скидав би його.
// Тикер (swTickInterval) — ОДИН спільний на всі екземпляри секундоміра
// (якщо їх кілька), і оновлює DOM через getElementById('swtime-'+id) —
// це навмисно (не через збережене посилання на елемент), бо посилання,
// збережене в момент mkStopwatchTile(), стає "мертвим" одразу після
// наступного render() (вузол замінюється новим). Тикер живе, лише поки
// хоч один секундомір активний — вимикається сам, коли останній стає на
// паузу/скидається (щоб не гріти CPU/батарею фоновим інтервалом даремно).
const swState={}; // {id:{running:bool, elapsedMs:number, startEpoch:number|null}}
let swTickInterval=null;
function swGetState(id){
  if(!swState[id]) swState[id]={running:false, elapsedMs:0, startEpoch:null};
  return swState[id];
}
function swElapsedMs(id){
  const s=swGetState(id);
  return s.elapsedMs + ((s.running && s.startEpoch) ? (Date.now()-s.startEpoch) : 0);
}
function swFormat(ms){
  const totalCs=Math.floor(ms/10); // сотні секунди
  const cs=totalCs%100;
  const totalSec=Math.floor(totalCs/100);
  const s=totalSec%60;
  const totalMin=Math.floor(totalSec/60);
  const m=totalMin%60;
  const h=Math.floor(totalMin/60);
  const pad=function(n){ return (n<10?'0':'')+n; };
  return (h>0?(h+':'+pad(m)):pad(m))+':'+pad(s)+'.'+pad(cs);
}
function swEnsureTicker(){
  if(swTickInterval) return;
  swTickInterval=setInterval(function(){
    let anyRunning=false;
    Object.keys(swState).forEach(function(id){
      const s=swState[id];
      if(!s.running) return;
      anyRunning=true;
      const timeEl=document.getElementById('swtime-'+id);
      if(timeEl) timeEl.textContent=swFormat(swElapsedMs(id));
    });
    if(!anyRunning){ clearInterval(swTickInterval); swTickInterval=null; }
  },100); // 10 разів/сек — досить плавно для сотих секунди, не надто часто
}
// SVG-іконки для кнопок секундоміра (17.08.2026) — той самий стиль, що й
// у музичного плеєра (play=трикутник, pause=два прямокутники), тому
// "▶"/"⏸" тут — не текстові емодзі, а чисті SVG, як у mkAudioTile/
// updateAudioTilesUI (щоб рендерились однаково на всіх пристроях/шрифтах,
// а не залежали від того, яку емодзі-палітру дає конкретна ОС).
const SW_ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="7,4 20,12 7,20"/></svg>';
const SW_ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>';
const SW_ICON_STOP='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
function swRefreshButtons(id){
  const btn=document.getElementById('swbtn-'+id);
  if(!btn) return;

      '</button>'+
      '<button class="at-btn at-next" type="button" aria-label="Наступний">'+
        '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="13,6 13,18 21.5,12"/><polygon points="3.5,6 3.5,18 12,12"/></svg>'+
      '</button>'+

  wrap.querySelector('.at-prev').addEventListener('click',e=>{ e.stopPropagation(); vAudio.prev(); });
  wrap.querySelector('.at-next').addEventListener('click',e=>{ e.stopPropagation(); vAudio.next(); });
  wrap.querySelector('.at-play').addEventListener('click',e=>{ e.stopPropagation(); vAudio.toggle(); });
  const prog=wrap.querySelector('.at-progress');
  let draggingAt=false;
  function seekFromClientX(clientX){
    const rect=prog.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
    const d=vAudio.audio.duration;
    if(isFinite(d) && d>0) vAudio.seek(pct*d);
  }
  prog.addEventListener('pointerdown',e=>{
    e.stopPropagation();draggingAt=true;
    try{ prog.setPointerCapture(e.pointerId); }catch(err){}
    seekFromClientX(e.clientX);
  });
  prog.addEventListener('pointermove',e=>{ if(draggingAt){ e.stopPropagation(); seekFromClientX(e.clientX); } });
  const stopAtDrag=e=>{ if(e) e.stopPropagation(); draggingAt=false; };
  prog.addEventListener('pointerup',stopAtDrag);
  prog.addEventListener('pointercancel',stopAtDrag);

  // ── Довге натискання по плитці (окрім кнопок/прогрес-бару) → перелік
  // треків, тап на трек у переліку одразу його вмикає. Той самий жест
  // (pointerdown+таймер+скасування на pointerup/leave/cancel), що вже
  // використовується для Trip/Маршрут — див. TRIP_LONG_PRESS_MS вище.
  const AUDIO_LONG_PRESS_MS=500;
  let atPressTimer=null, atLongFired=false;
  wrap.addEventListener('pointerdown',e=>{
    if(e.target.closest('.at-btn') || e.target.closest('.at-progress')) return; // не заважаємо власним контролам
    if(document.body.classList.contains('rain-mode-active')) return; // під час дощу довгий тап НЕ відкриває перелік треків (випадковий дотик краплею не мав би розгортати список на весь екран)
    atLongFired=false;
    atPressTimer=setTimeout(()=>{
      atLongFired=true;
      if(navigator.vibrate) try{navigator.vibrate(30);}catch(err){}
      openTrackListModal();
    },AUDIO_LONG_PRESS_MS);
  });
  const cancelAtPress=()=>{ if(atPressTimer){clearTimeout(atPressTimer);atPressTimer=null;} };
  wrap.addEventListener('pointerup',cancelAtPress);
  wrap.addEventListener('pointerleave',cancelAtPress);
  wrap.addEventListener('pointercancel',cancelAtPress);
  // Клік (не довгий) по вільному місцю плитки, коли трек ще жодного разу
  // не обирали — теж зручно відкрити перелік, а не показувати порожню плитку.
  wrap.addEventListener('click',e=>{
    if(atLongFired){ atLongFired=false; return; } // сам long-press вже все зробив
    if(e.target.closest('.at-btn') || e.target.closest('.at-progress')) return;
    if(vAudio.currentIndex<0 && vAudio.tracks.length) openTrackListModal();
  });

  return wrap;
}

// Примітка: тут раніше було дві спроби зробити звук чутним і в PiP-режимі:
// 1) тихий зациклений <audio> "keep-alive" — iOS сприйняв це як конкуруюче
//    джерело відтворення і СТАВИВ МУЗИКУ НА ПАУЗУ.
// 2) динамічне додавання аудіо-треку в pipStream на час біпу — WebKit не
//    підхоплює треки, додані "на льоту" в уже призначений srcObject, тому
//    просто мовчав без жодної помилки.
// Обидві прибрано. Звук працює надійно, лише коли додаток на передньому
// плані (сторінка видима) — це підтверджена межа веб-сторінки в Bluefy без
// нативного контролю над AVAudioSession. У PiP/фоні звуку немає, лишається
// тільки візуальне попередження (плитка/бейдж).

let alrtSnd=false,alrtInt=null;
async function beepAlert(){
  // AL.Sound_enabled — загальний "мьют" (кнопка в топбарі), AL.Sound_temp_enabled —
  // окремий вибір у Налаштуваннях, чи взагалі потрібен звук саме на температуру.
  if(AL.Sound_enabled===false || AL.Sound_temp_enabled===false) return; // лишається тільки візуальне попередження
  try{
    const ac=gac();
    if(ac.state==='suspended') await ac.resume(); // ЧЕКАЄМО завершення — раніше графік нот
    const t=ac.currentTime;                        // планувався ДО того, як контекст реально прокинувся
    // ГУЧНІСТЬ +20% (було 0.75) — просили голосніше через приглушення
    // музики. 0.75*1.2=0.9, Web Audio без проблем тримає до 1.0 без клипінгу.
    [[2600,0,.12],[1800,.16,.12],[2600,.32,.12]].forEach(([f,st,d])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.frequency.value=f;o.type='square';
      g.gain.setValueAtTime(0,t+st);
      g.gain.linearRampToValueAtTime(0.9,t+st+.01);
      g.gain.linearRampToValueAtTime(0.9,t+st+d-.02);
      g.gain.linearRampToValueAtTime(0,t+st+d);
      o.start(t+st);o.stop(t+st+d);
    });
  }catch(e){}
}
function startAlert(){if(alrtSnd)return;alrtSnd=true;beepAlert();alrtInt=setInterval(beepAlert,1000);}
function stopAlert(){if(!alrtSnd)return;alrtSnd=false;clearInterval(alrtInt);alrtInt=null;}

let spdBeepDone=false;
// Дебаунс: 200м-тригер (проксиміті) і "перевищення ліміту" (ca()) — це ДВА
// незалежні джерела, і якщо обоє істинні в один і той самий тік — раніше
// обидва викликали beepSpeed() практично одночасно, звучало як подвійний
// біп. Тепер обидва йдуть через це — другий виклик у межах 1.2с ігнорується.
let _lastBeepAt=0;
function beepSpeedOnce(){
  const now=Date.now();
  if(now-_lastBeepAt<1200) return;
  _lastBeepAt=now;
  beepSpeed();
}
async function beepSpeed(){
  // Той самий принцип, що й у beepAlert(): загальний мьют + окремий
  // вибір, чи потрібен звук саме на радар камер.
  if(AL.Sound_enabled===false || AL.Sound_cam_enabled===false) return; // лишається тільки візуальне попередження
  try{
    const ac=gac();
    if(ac.state==='suspended') await ac.resume(); // те саме виправлення гонки, що й у beepAlert
    const t=ac.currentTime;
    // Один сигнал на перетин ліміту, але довший і гучніший (0.4→0.85→1.0
    // гучність — останнє підняття +20% за проханням, 0.85*1.2=1.02, кепаємо
    // рівно на 1.0, щоб не ризикувати клипінгом; ноти 0.15с→0.28с, 4 ноти
    // замість 2 пар) — щоб було чутно під шоломом і крізь музику.
    [[880,0,.28],[1109,.3,.28],[880,.6,.28],[1109,.9,.28]].forEach(([f,st,d])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(0,t+st);
      g.gain.linearRampToValueAtTime(1.0,t+st+.02);
      g.gain.linearRampToValueAtTime(1.0,t+st+d-.03);
      g.gain.linearRampToValueAtTime(0,t+st+d);
      o.start(t+st);o.stop(t+st+d);
    });
  }catch(e){}
}

const alertState={};
// T_Eng і GPS тепер живуть тільки у відео-плитці (не в `lay`), але пороги/звук
// для них мають працювати завжди — тому їх стан рахуємо окремо від flat-тайлів.
const videoAlertState={T_Eng:'',GPS:''};
function getAlertState(k,v){
  if(v==='--'||isNaN(parseFloat(v)))return'';
  const fv=parseFloat(v);
  if(k==='T_Eng'){
    if(fv>=AL.T_crit)return'alrt';
    if(fv>=AL.T_warn)return'warn';
    if(fv<AL.T_cold)return'cold';
  }else if(k==='Volt'){
    if(fv<=AL.Volt_crit)return'alrt';
    if(fv<=AL.Volt_warn)return'warn';
  }else if(k==='GPS'){
    if(AL.Spd_enabled===false || !_nearestCam) return''; // без камери поруч нема з чим порівнювати ліміт
    const excess=fv-_nearestCam.limit;
    if(excess>9)return'alrt';   // >9 км/год понад ліміт камери — червоний
    if(excess>0)return'warn';   // до 9 км/год понад ліміт — жовтий
  }
  return'';
}

function ca(){
  let needAlert=false;
  const spd=parseFloat(V.GPS);
  const camLimit=_nearestCam ? _nearestCam.limit : null;
  lay.forEach(tile=>{
    const st=getAlertState(tile.k,V[tile.k]);
    alertState[tile.id]=st;
    if(st==='alrt'&&tile.k==='T_Eng')needAlert=true; // Volt/GPS більше НЕ вмикають звук-сирену — лише візуальний стан/пульсація
  });
  // T_Eng/GPS — рахуємо завжди, незалежно від того, чи вони є окремим тайлом
  // у `lay` (зараз їх там немає, вони показуються тільки у відео-плитці).
  videoAlertState.T_Eng=getAlertState('T_Eng',V.T_Eng);
  videoAlertState.GPS=getAlertState('GPS',V.GPS);
  if(videoAlertState.T_Eng==='alrt')needAlert=true;
  document.querySelectorAll('.tile[data-id]').forEach(el=>{
    el.classList.remove('cold','warn','alrt');
    const s=alertState[el.dataset.id];
    if(s)el.classList.add(s);
  });
  if(needAlert)startAlert();else stopAlert();
  // Один короткий біп на перетин ЧЕРВОНОЇ зони найближчої камери (danger,
  // перевищення понад 9 км/год — той самий поріг, що й для .c-sign
  // .danger/badge.classList.toggle('danger', excess>9) вище). Жовта зона
  // (warn, перевищення 0-9 км/год) — тепер СВІДОМО без звуку, лише
  // візуально (жовтий знак): дрібне перевищення не мало б сигналити так
  // само тривожно, як реальне значне перевищення. Без камери поруч —
  // нема з чим звіряти, тож біп/гістерезис просто не рахуються, а
  // прапорець скидається, щоб наступна камера завжди дала свіжий біп.
  if(camLimit!=null && AL.Spd_enabled!==false && !isNaN(spd)){
    const dangerLim=camLimit+9; // поріг "червоної" зони, узгоджений з badge.danger
    const overLim=spd>dangerLim;
    // Гістерезис 5 км/год: дозвіл на НАСТУПНИЙ біп повертається тільки коли
    // швидкість впаде ПОМІТНО нижче порогу danger, а не одразу біля нього.
    const resetLim=dangerLim-5;
    if(overLim&&!spdBeepDone){spdBeepDone=true;beepSpeedOnce();}
    else if(spd<resetLim)spdBeepDone=false;
  } else {
    spdBeepDone=false;
  }
}

function haversineM(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function parseCameraCSV(text){
  // Прибираємо BOM (типовий для файлів держреєстрів, збережених Excel) —
  // інакше перший символ заголовка стає "\uFEFFCityName" і зіставлення
  // назви колонки не спрацьовує.
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];

  // Шукаємо потрібні колонки ЗА НАЗВОЮ заголовка, а не за фіксованою
  // позицією — офіційні держреєстри (напр. тайванський NPA) мають багато
  // інших колонок (місто/адреса/відділок), а lat/lon/limit можуть стояти
  // в будь-якому порядку (у NPA це навіть Longitude ПЕРЕД Latitude).
  // Якщо заголовок не розпізнано — відкат на старий простий формат
  // "lat,lon,limit" першими трьома колонками (без заголовка).
  let latIdx=0, lonIdx=1, limitIdx=2, startLine=0;
  const headerCols = lines[0].split(',').map(s=>s.trim().toLowerCase());
  const findCol = (...names) => headerCols.findIndex(c => names.some(n=>c.includes(n)));
  const hLat = findCol('latitude','lat','緯度');
  const hLon = findCol('longitude','lon','lng','經度');
  const hLimit = findCol('limit','speed','速限','ліміт','лимит');
  const hAddr = findCol('address','地址','адрес'); // не обов'язкова — якщо нема, тип завжди 'speed'
  const hMobile = findCol('mobile','мобільна','мобильная','пересувна'); // не обов'язкова — якщо нема, mobile:false для всіх
  if(hLat>-1 && hLon>-1 && hLimit>-1){
    latIdx=hLat; lonIdx=hLon; limitIdx=hLimit;
    startLine=1; // подальші "нечислові" рядки (напр. другий заголовок-переклад) самі відсіються нижче
  }

  const cams=[];
  for(let i=startLine; i<lines.length; i++){
    const parts=lines[i].split(',').map(s=>s.trim());
    if(parts.length<=Math.max(latIdx,lonIdx,limitIdx)) continue;
    const lat=parseFloat(parts[latIdx]), lon=parseFloat(parts[lonIdx]), limit=parseFloat(parts[limitIdx]);
    if(isNaN(lat)||isNaN(lon)||isNaN(limit)) continue; // пропускаємо заголовок/биті рядки, не падаємо
    // Тип камери за ключовими словами в адресі (тайванський реєстр NPA):
    // "兼闖紅燈" — камера ЛІМІТУ, що також фіксує проїзд на червоне;
    // "科技執法" — стаціонарний технологічний контроль (напр. тунель Сюешань).
    // В обох випадках ліміт у даних реальний (не 0), тому число не втрачаємо —
    // просто інша іконка/колір значка при показі.
    let type='speed';
    if(hAddr>-1){
      const addr=parts[hAddr]||'';
      if(addr.includes('闖紅燈')) type='redlight';
      else if(addr.includes('科技執法')) type='tech';
    }
    let mobile=false;
    if(hMobile>-1){
      const mv=(parts[hMobile]||'').trim().toLowerCase();
      mobile = (mv==='1' || mv==='true' || mv==='так' || mv==='yes');
    }
    cams.push({lat,lon,limit,type,mobile});
  }
  return cams;
}

// ВАЖЛИВО: завантаження файлу ДОДАЄ нові камери до існуючої бази, а не
// перезаписує її (раніше було CAMERAS_DB=cams — тепер користувач сам
// коригує напрями/дублікати вручну через редактор на карті, тож повний
// перезапис знищував би вже зроблену роботу). Дублікатом вважається будь-
// яка точка з файлу, що потрапляє в CAM_DELETE_RADIUS_M (та сама похибка
// тапу, що й видалення камери на карті) від уже наявної — така просто
// пропускається, а не додається другий раз.
function loadCameraCSVFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const cams=parseCameraCSV(reader.result);
    if(!cams.length){ sht('Не знайдено жодної коректної камери у файлі (потрібні колонки lat,lon,limit)'); return; }
    let added=0, skipped=0;
    cams.forEach(function(c){
      const isDup = CAMERAS_DB.some(function(existing){
        return haversineM(existing.lat, existing.lon, c.lat, c.lon) <= CAM_DELETE_RADIUS_M;
      });
      if(isDup){ skipped++; return; }
      CAMERAS_DB.push(c);
      added++;
    });
    ls('camdb',CAMERAS_DB);
    camDbMeta={count:CAMERAS_DB.length, updatedAt:Date.now()}; ls('camdbmeta',camDbMeta);
    sht('Додано '+added+' нових камер'+(skipped?(', пропущено '+skipped+' дублікатів'):'')+' (всього '+CAMERAS_DB.length+')');
    renderCamDbStatus();
  };
  reader.onerror=()=>sht('Не вдалось прочитати файл');
  reader.readAsText(file);
}

// Автозавантаження бази з файлу в тому самому репозиторії на GitHub (щоб не
// тягнути CSV вручну щоразу на новому пристрої/після скидання кешу). Файл
// має лежати поруч з index.html і зватись NPA_TD1.csv. СПРАЦЬОВУЄ ЛИШЕ якщо
// в localStorage ще НЕМАЄ бази — ручне завантаження (Налаштування →
// СИГНАЛИ) завжди має пріоритет і не переписується автозавантаженням.
async function autoLoadBundledCameraCSV(){
  if(CAMERAS_DB.length) return; // вже є база (ручна чи попереднє автозавантаження) — не чіпаємо
  try{
    const res = await fetch('NPA_TD1.csv');
    if(!res.ok) return; // файла нема в репозиторії — це нормально, просто мовчки нічого не робимо
    const text = await res.text();
    const cams = parseCameraCSV(text);
    if(!cams.length) return;
    CAMERAS_DB=cams; ls('camdb',CAMERAS_DB);
    camDbMeta={count:cams.length, updatedAt:Date.now()}; ls('camdbmeta',camDbMeta);
    renderCamDbStatus();
    console.log('Автозавантажено камер з NPA_TD1.csv:', cams.length);
  }catch(e){
    console.warn('Автозавантаження бази камер не вдалось (файла нема поруч чи мережева помилка):', e);
  }
}
try{ autoLoadBundledCameraCSV(); }catch(e){ console.error('autoLoadBundledCameraCSV init failed:',e); }

}

function genPendingCamId(){ return 'pc_'+Date.now()+'_'+Math.floor(Math.random()*1000); }

function addPendingCamMark(lat, lon, limit, source){
  const entry={ id:genPendingCamId(), lat:lat, lon:lon, limit:(limit!=null && !isNaN(limit) ? limit : null), type:'speed', mobile:false, createdAt:Date.now(), source:(source||'dashboard') };
  PENDING_CAMS.push(entry);
  ls('pendingcams', PENDING_CAMS);
  sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9 4L7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg> Мітку камери додано ('+PENDING_CAMS.length+' очікує'+(PENDING_CAMS.length===1?'':'ють')+' у редакторі)');
  updateCamMarkFabBadge();
  renderPendingCamsEditor();
  return entry;
}

// Кнопка на приладовій панелі — тільки GPS, без діалогів (щоб можна було
// тицьнути одним рухом, не відриваючись від дороги). Якщо watchPosition
// (startGPS) ще не встиг дати перший фікс — пробуємо одноразовий запит.
function quickAddCamFromDashboard(){
  if(_lastLat!=null && _lastLon!=null){
    addPendingCamMark(_lastLat, _lastLon, null, 'dashboard');
    return;
  }
  if(!navigator.geolocation){ sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Геолокація недоступна'); return; }
  sht('📍 Визначаю GPS…');
  navigator.geolocation.getCurrentPosition(function(pos){
    addPendingCamMark(pos.coords.latitude, pos.coords.longitude, null, 'dashboard');
  }, function(){ sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Не вдалось отримати GPS'); }, {enableHighAccuracy:true, timeout:8000});
}

// Кнопка на карті — ПЕРЕОСМИСЛЕНА (раніше тут одразу відкривався попап
// швидкого GPS-додавання; тепер тільки на приладовій панелі лишилась
// швидка мітка через quickAddCamFromDashboard/addPendingCamMark). На
// великій карті 📷 тепер вмикає/вимикає ПОВНОЦІННИЙ РЕДАКТОР камер —
// див. розділ "🚩+📷 РЕДАКТОР КАМЕР НА КАРТІ" нижче.

function updateCamMarkFabBadge(){
  const el=document.getElementById('camMarkFab');
  if(!el) return;
  const n=PENDING_CAMS.length;
  el.setAttribute('data-count', n);
  el.classList.toggle('has-pending', n>0);
}

// Перетягування 📷+ FAB — на відміну від wireCalibDrag (яка працює лише в
// режимі калібрування карти для налагодження координат), тут перетягування
// доступне ЗАВЖДИ і позиція одразу зберігається в localStorage — це не
// налагоджувальний інструмент, а звичайна вподобана користувачем позиція
// кнопки на екрані.
function makeCamMarkFabDraggable(el){
  let dragging=false, moved=false, startX=0, startY=0, origRight=0, origBottom=0;
  el.addEventListener('pointerdown', function(e){
    dragging=true; moved=false;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const rect=el.getBoundingClientRect();
    origRight = window.innerWidth - rect.right;
    origBottom = window.innerHeight - rect.bottom;
    startX=e.clientX; startY=e.clientY;
  });
  el.addEventListener('pointermove', function(e){
    if(!dragging) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dx)>6 || Math.abs(dy)>6) moved=true; // поріг — щоб звичайний тап не сприймався за мікро-драг
    if(!moved) return;
    e.preventDefault();
    const w=el.offsetWidth, h=el.offsetHeight;
    let newRight = origRight - dx;
    let newBottom = origBottom - dy;
    newRight = Math.max(4, Math.min(newRight, window.innerWidth - w - 4));   // не даємо втекти за межі екрана
    newBottom = Math.max(4, Math.min(newBottom, window.innerHeight - h - 4));
    el.style.right = newRight+'px';
    el.style.bottom = newBottom+'px';
  });
  function stop(e){
    if(!dragging) return;
    dragging=false;
    if(moved){
      ls('cammarkfabpos', { right: parseFloat(el.style.right), bottom: parseFloat(el.style.bottom) }); // переживає перезапуск застосунку
    }
  }
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
  // capture:true — перехоплюємо клік РАНІШЕ за звичайну обробку, щоб
  // погасити його, якщо це щойно був драг, а не тап.
  el.addEventListener('click', function(e){
    if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; return; }
    quickAddCamFromDashboard();
  }, true);
}

function ensureCamMarkFab(){
  let el=document.getElementById('camMarkFab');
  if(el) return el;
  el=document.createElement('button');
  el.type='button'; el.id='camMarkFab'; el.innerHTML=CAM_RADAR_GUN_SVG;
  el.title='Додати мітку камери (GPS) — тримай і тягни, щоб перемістити';
  const savedPos=lg('cammarkfabpos');
  if(savedPos && savedPos.right!=null && savedPos.bottom!=null){
    el.style.right=savedPos.right+'px';
    el.style.bottom=savedPos.bottom+'px';
  }
  makeCamMarkFabDraggable(el);
  document.body.appendChild(el);
  updateCamMarkFabBadge();
  return el;
}
try{ ensureCamMarkFab(); }catch(e){ console.error('ensureCamMarkFab init failed:', e); }

function deletePendingCam(id){
  PENDING_CAMS=PENDING_CAMS.filter(function(p){ return p.id!==id; });
  ls('pendingcams', PENDING_CAMS);
  updateCamMarkFabBadge();
  renderPendingCamsEditor();
}

// "Об'єднати" — за принципом офлайн-карти (INSERT OR REPLACE, домержовуємо
// нове до старого, нічого не видаляючи): валідні мітки (з заповненим
// лімітом) переносяться в CAMERAS_DB, camDbMeta.count зростає, а самі
// мітки прибираються зі списку "нових". Мітки БЕЗ ліміту не чіпаємо —
// нехай лишаються в редакторі, доки не допишеш число.
function mergePendingCamsIntoDB(){
  const ready=PENDING_CAMS.filter(function(p){ return p.limit!=null && !isNaN(p.limit); });
  if(!ready.length){ sht('Нема жодної мітки із заповненим лімітом — спершу впиши ліміт у полі нижче.'); return; }
  ready.forEach(function(p){ CAMERAS_DB.push({lat:p.lat, lon:p.lon, limit:p.limit, type:(p.type||'speed'), mobile:!!p.mobile}); });
  ls('camdb', CAMERAS_DB);
  camDbMeta = { count:CAMERAS_DB.length, updatedAt:Date.now() };
  ls('camdbmeta', camDbMeta);
  const readyIds=ready.map(function(p){ return p.id; });
  PENDING_CAMS=PENDING_CAMS.filter(function(p){ return readyIds.indexOf(p.id)===-1; });
  ls('pendingcams', PENDING_CAMS);
  sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg> Додано '+ready.length+' камер у базу (тепер '+CAMERAS_DB.length+' всього)');
  updateCamMarkFabBadge();
  renderCamDbStatus();
  renderPendingCamsEditor();
}

// Уніфікований помічник "поділитись файлом" (Web Share → <a download> →
// буфер обміну) — той самий трирівневий підхід, що вже використовується
// для експорту офлайн-карти й налаштувань, винесений в один хелпер, щоб
// не дублювати втретє.
async function shareOrDownloadFile(text, fname, mimeType){
  try{
    const file=new File([text], fname, {type:mimeType});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
      sht('Збережено: '+fname);
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
    console.warn('[export] navigator.share не спрацював, пробую запасний варіант:', e);
  }
  try{
    const blob=new Blob([text],{type:mimeType});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    sht('Спробував зберегти "'+fname+'"');
  }catch(e){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ sht('Файл не вдався — скопійовано в буфер обміну натомість'); });
    } else {
      sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Не вдалось зберегти файл');
    }
  }
}

// Експорт ПОВНОЇ поточної CAMERAS_DB (стара база + все влите з редактора)
// назад у CSV — заголовок англійською зі словами, які впізнає parseCameraCSV
// (Latitude/Longitude/Limit/Address), тож файл можна імпортувати назад чи
// покласти замість NPA_TD1.csv поруч з index.html без жодних правок коду.
function exportCameraCSV(){
  if(!CAMERAS_DB.length){ sht('База камер порожня — нема що експортувати'); return; }
  const rows=['Latitude,Longitude,Limit,Address,Mobile'];
  CAMERAS_DB.forEach(function(c){
    const addrHint = c.type==='redlight' ? '闖紅燈' : (c.type==='tech' ? '科技執法' : '');
    rows.push(c.lat+','+c.lon+','+c.limit+','+addrHint+','+(c.mobile?'1':'0'));
  });
  const fname='cameras-export-'+new Date().toISOString().slice(0,10)+'.csv';
  shareOrDownloadFile(rows.join('\n'), fname, 'text/csv');
}

// Список "нових" міток у Налаштування → Сигнали → Радар камер: кожна —

      + '<div style="flex:1;min-width:140px;font-size:12px;color:var(--muted);">'
      +   (p.source==='map'?'🗺️':'📍')+' '+coordStr
      +   '<div style="font-size:10px;">'+new Date(p.createdAt).toLocaleString()+'</div>'
      + '</div>'
      + '<input type="number" data-pcid="'+p.id+'" class="pcam-limit-input" placeholder="ліміт" value="'+(p.limit!=null?p.limit:'')+'" style="width:70px;padding:6px;border-radius:6px;border:1px solid var(--line);background:#111;color:#fff;font-size:13px;">'
      + '<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap;">'
      +   '<input type="checkbox" data-pcid-mobile="'+p.id+'" class="pcam-mobile-cb" '+(p.mobile?'checked':'')+'> 🔄 мобільна'
      + '</label>'
      + '<button class="ab" style="background:#222;color:#ff8080;padding:6px 10px;" onclick="deletePendingCam(\''+p.id+'\')"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg></button>'
      + '</div>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.pcam-limit-input').forEach(function(inp){
    inp.addEventListener('change', function(){
      const id=inp.getAttribute('data-pcid');
      const val=parseFloat(inp.value);

      if(rec){ rec.limit=(isNaN(val)?null:val); ls('pendingcams', PENDING_CAMS); }
    });
  });
  el.querySelectorAll('.pcam-mobile-cb').forEach(function(cb){
    cb.addEventListener('change', function(){
      const id=cb.getAttribute('data-pcid-mobile');
      const rec=PENDING_CAMS.find(function(p){ return p.id===id; });
      if(rec){ rec.mobile=cb.checked; ls('pendingcams', PENDING_CAMS); }
    });
  });
}

// Парсить GPX-waypoints у прості {lat,lon,label}. kind точки НЕ вгадується
// звідси — його задає викликач (loadPoiFuelFile/loadPoiShopFile нижче)
// залежно від того, яку кнопку/файл обрав користувач.
function parsePoiGPX(text){
  let doc;
  try{ doc=new DOMParser().parseFromString(text, 'application/xml'); }catch(e){ return []; }
  if(!doc || doc.getElementsByTagName('parsererror').length) return [];
  const wpts=Array.from(doc.getElementsByTagName('wpt'));
  const list=[];
  wpts.forEach(function(w){
    const lat=parseFloat(w.getAttribute('lat'));
    const lon=parseFloat(w.getAttribute('lon'));
    if(isNaN(lat) || isNaN(lon)) return;
    const nameEl=w.getElementsByTagName('name')[0];
    const label = nameEl ? nameEl.textContent : '';
    list.push({ lat:lat, lon:lon, label:label });
  });
  return list;
}

function loadPoiFuelFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    const list=parsePoiGPX(reader.result);
    if(!list.length){ sht('Не знайдено жодної точки у GPX (потрібні теги <wpt lat lon><name>)'); return; }
    POI_FUEL=list; ls('poifuel', POI_FUEL);
    poiFuelMeta={count:list.length, updatedAt:Date.now(), fileName:file.name}; ls('poifuelmeta', poiFuelMeta);
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v16M4 21h8M4 10h8M14 9l2.5 2v6a1.3 1.3 0 0 0 2.6 0V9.8a1.8 1.8 0 0 0-.53-1.28L16 6"/></svg> База АЗС оновлена: '+list.length+' точок');
    renderPoiDbStatus();
  };
  reader.onerror=function(){ sht('Не вдалось прочитати файл'); };
  reader.readAsText(file);
}
function loadPoiShopFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    const list=parsePoiGPX(reader.result);
    if(!list.length){ sht('Не знайдено жодної точки у GPX (потрібні теги <wpt lat lon><name>)'); return; }
    POI_SHOP=list; ls('poishop', POI_SHOP);
    poiShopMeta={count:list.length, updatedAt:Date.now(), fileName:file.name}; ls('poishopmeta', poiShopMeta);
    sht('🏪 База крамниць оновлена: '+list.length+' точок');
    renderPoiDbStatus();
  };
  reader.onerror=function(){ sht('Не вдалось прочитати файл'); };
  reader.readAsText(file);
}

// Автозавантаження Azc.gpx / 7_11.gpx поруч з index.html (за аналогією з
// NPA_TD1.csv для камер) — імена файлів навмисно ті самі, що користувач і
// так уже використовує для власних експортів з Overpass Turbo. СПРАЦЬОВУЄ
// ЛИШЕ якщо відповідної бази ще немає (ручне завантаження в Налаштуваннях
// завжди має пріоритет і не переписується).
async function autoLoadBundledPoiGPX(){
  if(!POI_FUEL.length){
    try{
      const res=await fetch('Azc.gpx');
      if(res.ok){
        const list=parsePoiGPX(await res.text());
        if(list.length){
          POI_FUEL=list; ls('poifuel', POI_FUEL);
          poiFuelMeta={count:list.length, updatedAt:Date.now(), fileName:'Azc.gpx'}; ls('poifuelmeta', poiFuelMeta);
          console.log('Автозавантажено АЗС з Azc.gpx:', list.length);
        }
      }
    }catch(e){ console.warn('Автозавантаження Azc.gpx не вдалось:', e); }
  }
  if(!POI_SHOP.length){
    try{
      const res=await fetch('7_11.gpx');
      if(res.ok){
        const list=parsePoiGPX(await res.text());
        if(list.length){
          POI_SHOP=list; ls('poishop', POI_SHOP);
          poiShopMeta={count:list.length, updatedAt:Date.now(), fileName:'7_11.gpx'}; ls('poishopmeta', poiShopMeta);
          console.log('Автозавантажено крамниці з 7_11.gpx:', list.length);
        }
      }
    }catch(e){ console.warn('Автозавантаження 7_11.gpx не вдалось:', e); }
  }
  renderPoiDbStatus();
}
try{ autoLoadBundledPoiGPX(); }catch(e){ console.error('autoLoadBundledPoiGPX init failed:', e); }

function filterPoiDbNear(lat, lon, radiusM){

/* ═══════════════════════════════════════════════════════════════════════
   🏪 БРЕНД-БАЗИ МАГАЗИНІВ (GPX / CSV) — 11.08.2026, GPX додано 14.08.2026
   Основний формат файлу тепер GPX (Overpass turbo export, <wpt lat lon>
   з <name> і <desc> "key=value" по рядку — типовий дамп OSM-тегів).
   CSV (заголовок brand,name,lat,lon,hours,toilet) і "гнучка вставка з
   буфера" й далі підтримуються — формат розпізнається АВТОМАТИЧНО за
   вмістом (див. looksLikeGpx нижче), окремої кнопки/перемикача формату
   нема, і файлом, і вставкою можна дати або GPX, або CSV, або "просто
   координати" з нотаток.
   Один файл — одна мережа (користувач завантажує по кожній мережі
   окремо), але парсер не обмежує — можна кілька брендів в одному файлі,
   теж зіллється. МЕРЖИТЬСЯ (не перезаписує!) у POI_BRANDS_DB — дублікати
   (той самий brand+координати з точністю ~1м) пропускаються.
   ═══════════════════════════════════════════════════════════════════════ */

// Текст схожий на GPX (а не на CSV/вставку з нотаток)? Перевіряємо самий
// початок файлу — досить дешево і достатньо надійно, щоб не плутати з
// CSV-заголовком (який теж може містити слово "lat"/"lon", але не "<gpx").
function looksLikeGpx(text){
  const head=text.slice(0,400);
  return /<gpx[\s>]/i.test(head);
}

// <desc> у GPX з Overpass turbo — це НЕ один текст, а дамп тегів OSM,
// по рядку "key=value" (напр. "brand=7-Eleven\nopening_hours=24/7\n...").
// Розбираємо в map: перше зустрінуте значення для ключа виграє (щоб,
// напр., "brand:en=..." не переписало вже знайдений "brand=...", якщо
// колись трапиться інший порядок рядків — порядок тегів у OSM/Overpass
// не гарантований).
function parseGpxDesc(desc){
  const map={};
  if(!desc) return map;
  desc.split(/\r?\n/).forEach(function(line){
    const i=line.indexOf('=');
    if(i===-1) return;
    const k=line.slice(0,i).trim().toLowerCase();
    const v=line.slice(i+1).trim();
    if(k && !(k in map)) map[k]=v;
  });
  return map;
}

// Парсер GPX (Overpass turbo export). <wpt lat lon> — точка, <name> —
// назва (не завжди мережа, буває "alt_name"/оригінальна вивіска), <desc>
// — дамп тегів, з нього беремо brand/opening_hours/toilet(s). Бренд із
// самого OSM-тега `brand` НЕ ЗАВЖДИ точно збігається з нашими шістьма
// ключами в POI_BRAND_KEY (регістр/мова) — тому UI (селектор мережі)
// і далі дозволяє ПРИМУСОВО проставити бренд усьому файлу (форсування
// робиться зовні, у loadPoiBrandsFile/addPastedPoiData, як і для CSV).
function parseGpxPoiText(text){
  const out=[];
  let doc;
  try{ doc=new DOMParser().parseFromString(text, 'application/xml'); }
  catch(e){ return out; }
  if(!doc || doc.getElementsByTagName('parsererror').length) return out;
  const wpts=doc.getElementsByTagName('wpt');
  for(let i=0;i<wpts.length;i++){
    const w=wpts[i];
    const lat=parseFloat(w.getAttribute('lat')), lon=parseFloat(w.getAttribute('lon'));
    if(isNaN(lat) || isNaN(lon)) continue;
    const nameEl=w.getElementsByTagName('name')[0];
    const descEl=w.getElementsByTagName('desc')[0];
    const dm=parseGpxDesc(descEl ? descEl.textContent : '');
    let toilet=(dm['toilet'] || dm['toilets'] || '').trim().toLowerCase();
    if(toilet==='customers') toilet='yes';
    if(toilet!=='yes' && toilet!=='no') toilet='';
    const nm=(nameEl && nameEl.textContent ? nameEl.textContent.trim() : '') || (dm['name']||'').trim();
    // Бренд: спершу `brand`, якщо порожньо — `brand:en` (частіше англійською,
    // ближче до наших ключів), тоді нормалізуємо аліасом (див.
    // normalizePoiBrandName вище — реальний OSM-тег часто не збігається
    // з канонічною назвою напряму, напр. FamilyMart тегується як "全家").
    let brand=(dm['brand']||'').trim();
    if(!brand) brand=(dm['brand:en']||'').trim();
    brand=normalizePoiBrandName(brand);
    // amenity=toilets — окремий однозначний сигнал (публічний туалет як
    // самостійна точка з Overpass, зазвичай БЕЗ тега brand узагалі) —
    // саме це найчастіше й було причиною "туалети не додаються": рядок
    // із порожнім brand відкидався (mergePoiRows/filter), якщо мережа в
    // селекторі не була примусово обрана. Перевіряємо ПІСЛЯ звичайного
    // brand, бо amenity важливіший для цієї категорії, навіть якщо десь
    // випадково поруч є теги іншого магазину.
    if((dm['amenity']||'').trim().toLowerCase()==='toilets') brand='Туалети';
    out.push({
      brand:brand,
      name:nm,
      lat:lat, lon:lon,
      hours:(dm['opening_hours']||dm['hours']||'').trim(),
      toilet:toilet
    });
  }
  return out;
}

// Простий CSV-парсер із підтримкою лапок (щоб не зламатись, якщо десь у
// назві магазину трапиться кома в лапках, як у вихідних OSM-виписках).
function parseCsvLine(line){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out;
}

// 17.08.2026: колонка `status` — необов'язкова. 'new' (за замовчуванням,
// якщо колонки нема взагалі — для сумісності зі старими файлами) означає
// "додати або замінити" (upsert), 'close' — "видалити цю точку з бази".
// Розпізнавання значення гнучке: 'close'/'closed'/'delete'/'remove' → close,
// будь-що інше (в т.ч. порожньо чи 'new'/'open') → new. Див. normalizePoiStatus.
function normalizePoiStatus(raw){
  const v=(raw||'').trim().toLowerCase();
  if(v==='close' || v==='closed' || v==='delete' || v==='remove') return 'close';
  return 'new';
}

function parsePoiBrandsCSV(text){
  const lines=text.split(/\r?\n/).filter(function(l){ return l.trim()!==''; });
  if(!lines.length) return [];
  // Заголовок гнучкий — шукаємо позиції потрібних колонок за назвою,
  // а не за фіксованим порядком (про всяк випадок, якщо порядок буде інший).
  const head=parseCsvLine(lines[0]).map(function(h){ return h.trim().toLowerCase(); });
  const idx=function(names){ for(let i=0;i<names.length;i++){ const p=head.indexOf(names[i]); if(p!==-1) return p; } return -1; };
  const iStatus=idx(['status']), iBrand=idx(['brand']), iName=idx(['name']), iLat=idx(['lat','@lat']), iLon=idx(['lon','lng','@lon']), iHours=idx(['hours','opening_hours']), iToilet=idx(['toilet','toilets']);
  if(iLat===-1 || iLon===-1) return []; // без координат сенсу нема
  const out=[];
  let malformed=0;
  for(let li=1; li<lines.length; li++){
    const c=parseCsvLine(lines[li]);
    // 17.08.2026: якщо в рядку МЕНШЕ колонок, ніж у заголовку — значення
    // "з'їжджають" на позиції один в одного (напр. текст hours потрапляє
    // в колонку lon, парситься як число ("24/7"→24) і рядок ВИГЛЯДАЄ
    // валідним, хоча координати насправді сміття). Раніше єдиним запобіжником
    // був isNaN(lat)||isNaN(lon), який таке НЕ ловить. Пропускаємо такі рядки
    // одразу, а не намагаємось "дотягнути" — джерело даних явно пошкоджене
    // (типово: у файл випадково потрапив фрагмент чужого тексту/промпту).
    if(c.length < head.length){ malformed++; POI_CORRUPTED_LINES.push(lines[li]); continue; }
    const lat=parseFloat(c[iLat]), lon=parseFloat(c[iLon]);
    if(isNaN(lat) || isNaN(lon)) continue;
    // Додаткова перевірка діапазону — lat/lon поза фізично можливими межами
    // теж симптом того самого "з'їзду" колонок (напр. lat=121 — це явно
    // довгота, що потрапила не в ту клітинку).
    if(lat<-90 || lat>90 || lon<-180 || lon>180){ malformed++; POI_CORRUPTED_LINES.push(lines[li]); continue; }
    let toilet=(iToilet!==-1 ? (c[iToilet]||'').trim().toLowerCase() : '');
    if(toilet==='customers') toilet='yes'; // той самий принцип, що узгодили для 7-Eleven
    if(toilet!=='yes' && toilet!=='no') toilet='';
    out.push({
      status: iStatus!==-1 ? normalizePoiStatus(c[iStatus]) : 'new',
      brand: iBrand!==-1 ? normalizePoiBrandName(c[iBrand]||'') : '', // 14.08.2026: та сама нормалізація аліасів, що й для GPX
      name: iName!==-1 ? (c[iName]||'').trim() : '',
      lat: lat, lon: lon,
      hours: iHours!==-1 ? (c[iHours]||'').trim() : '',
      toilet: toilet
    });
  }
  if(malformed>0){
    ls('poicorruptedlines', POI_CORRUPTED_LINES); // 20.08.2026: персистуємо одразу — щоб не загубити при закритті вкладки до наступного відкриття Налаштувань
    try{ sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Пропущено '+malformed+' пошкоджених рядків — переглянути можна в Налаштуваннях → 🩹 Пошкоджені рядки'); }catch(e){}
  }
  return out;
}

// 20.08.2026 (Фіча Б): рендер підменю "🩹 Пошкоджені рядки" в Налаштуваннях.
function renderPoiCorruptedLines(){
  const el=document.getElementById('poiCorruptedList');
  const btn=document.getElementById('poiCorruptedBtn');
  if(btn) btn.textContent='🩹 Пошкоджені рядки ('+POI_CORRUPTED_LINES.length+')';
  if(!el) return;
  if(!POI_CORRUPTED_LINES.length){ el.innerHTML='<div style="font-size:12px;color:var(--muted);padding:6px 2px;">Пошкоджених рядків нема.</div>'; return; }
  el.innerHTML=POI_CORRUPTED_LINES.map(function(line,i){
    return '<div style="display:flex;align-items:center;gap:6px;padding:4px 2px;border-bottom:1px solid var(--line);">'
      +'<code style="flex:1;font-size:11px;color:#ff8080;word-break:break-all;">'+escapePoiText(line)+'</code>'
      +'<button class="ab" style="padding:4px 8px;font-size:11px;background:#222;color:#fff;flex-shrink:0;" onclick="copyPoiCorruptedLine('+i+')">📋 В поле</button>'
      +'</div>';
  }).join('');
}
// Копіює рядок у textarea вставки (poiPasteArea) — ГОТОВИЙ для ручного
// виправлення (напр. дописати координати) і повторного "➕ Додати".
// Замінює вміст textarea (не дописує), щоб не плутати з тим, що там уже

// Просте показати/сховати підменю (той самий патерн displayблоку, що й
// інші панелі Налаштувань) — не окрема модалка, щоб не громадити UI.

  el.style.display = show ? 'block' : 'none';

// Бренд, обраний у випадаючому списку над полем вставки/файлу (Налаштування).
// '' означає "авто" — брати бренд з колонки CSV самого файлу (як для файлу
// "всі мережі по черзі", де кожен рядок вже має свій brand). Якщо обрано
// конкретний бренд — він ПРИМУСОВО проставляється для КОЖНОГО рядка з
// цього імпорту, незалежно від того, що (чи нічого) написано в колонці
// brand — саме це вирішує "туалети без назви, тільки координати".
function getSelectedPoiBrand(){
  const sel=document.getElementById('poiBrandSelect');
  return sel ? sel.value : '';
}

// Спільна логіка додавання рядків у POI_BRANDS_DB (дедуп за brand+координати
// з точністю ~1м) — використовується і файлом, і вставкою з буфера.
// 15.08.2026: спільна функція персистування бази — localStorage + перелік
// по брендах для статусу (poiBrandsMeta). Використовується і після
// масового імпорту (mergePoiRows), і після редагування/видалення однієї
// точки з "✏️ Редактора" (showEditPoiForm) — щоб не дублювати той самий
// код у трьох місцях.
function persistPoiBrandsDB(){
  ls('poibrandsdb', POI_BRANDS_DB);
  const byBrand={};
  POI_BRANDS_DB.forEach(function(r){ const b=r.brand||'?'; byBrand[b]=(byBrand[b]||0)+1; });
  poiBrandsMeta={count:POI_BRANDS_DB.length, updatedAt:Date.now(), brands:byBrand};
  ls('poibrandsmeta', poiBrandsMeta);
}

// 17.08.2026: пошук наявної точки для upsert/close за рядком імпорту.
// Спроба 1 — той самий критерій, що й стара дедуплікація (бренд +
// координати з точністю ~1м). Спроба 2 (фолбек, тільки якщо є назва) —
// бренд + точна назва (без урахування регістру) — на випадок, якщо в
// CSV координати "close"-рядка трохи відрізняються від тих, що вже в базі
// (уточнені пізніше, ручне перетягування мітки тощо).
function findPoiRowIndex(r){
  let idx=POI_BRANDS_DB.findIndex(function(existing){
    return existing.brand===r.brand && Math.abs(existing.lat-r.lat)<0.00001 && Math.abs(existing.lon-r.lon)<0.00001;
  });
  if(idx!==-1) return idx;
  if(r.name){
    // 20.08.2026: КРИТИЧНИЙ БАГ — цей фолбек раніше збігав ЛИШЕ за
    // brand+name, БЕЗ жодної перевірки відстані. Для мережевих брендів
    // (7-Eleven, Family Mart, OK Mart...) <name> у джерелі майже завжди
    // буквально ОДНАКОВИЙ ("7-Eleven") для КОЖНОЇ точки по всій країні —
    // тож перший доданий "7-Eleven" ставав "збігом" для ВСІХ наступних, і
    // замість додавання нових точок вони просто ЗАТИРАЛИ координати одна
    // одної. Симптом: "додано 5, оновлено 2810" замість тисяч окремих
    // точок. Тепер додатково перевіряємо, що збіг за іменем — це та сама
    // ФІЗИЧНА точка (у межах ~300м, з поправкою на довготу за широтою), а
    // не просто той самий бренд десь в іншому місті. 300м — щоб і далі
    // ловити випадок "координати трохи уточнили в новому імпорті", заради
    // якого цей фолбек і існує, але не ловити весь Тайвань як одну точку.
    const latTol=0.0027, lonTol=0.0027/Math.max(0.2, Math.cos(r.lat*Math.PI/180));
    idx=POI_BRANDS_DB.findIndex(function(existing){
      return existing.brand===r.brand
        && (existing.name||'').trim().toLowerCase()===r.name.trim().toLowerCase()
        && Math.abs(existing.lat-r.lat)<latTol && Math.abs(existing.lon-r.lon)<lonTol;
    });
  }
  return idx;
}

// 17.08.2026: тепер розуміє r.status ('new'/'close', за замовчуванням 'new'
// якщо рядок прийшов зі старого джерела без цієї колонки — GPX, "вставка з
// буфера" без заголовка, форма "✏️ Редактора"). 'new' — upsert (є збіг за
// findPoiRowIndex → оновлює name/hours/toilet/координати на місці, нема →
// додає новий рядок). 'close' — видаляє знайдений збіг із бази; якщо збігу
// нема — рахується в notFound (нічого видаляти, мовчки пропускаємо).
function mergePoiRows(rows){
  let added=0, updated=0, closed=0, notFound=0, skipped=0, unmatched=0; // unmatched: точка збережена в базі, АЛЕ бренд не розпізнано (порожній або невідомий рядок) — на звичайній карті НІКОЛИ не з'явиться, тільки як "❓" у режимі редактора (togglePoiEditor), де можна дописати правильний бренд
  rows.forEach(function(r){
    // 20.08.2026: раніше рядки з ПОРОЖНІМ r.brand відкидались тут одразу
    // (skipped++), НАВІТЬ маючи валідні координати — назавжди губились
    // без жодного сліду. Тепер зберігаємо їх теж (brand='' чи будь-який
    // нерозпізнаний рядок) — щоб показати "❓"-маркером у "✏️ Редакторі" й
    // дати користувачу самому дописати правильний бренд, замість мовчазної
    // втрати точки, для якої вже є валідні координати.
    if(isNaN(r.lat) || isNaN(r.lon)){ skipped++; return; }
    const status=r.status || 'new';
    const idx=findPoiRowIndex(r);
    if(status==='close'){
      if(idx!==-1){ POI_BRANDS_DB.splice(idx,1); closed++; }
      else notFound++;
      return;
    }
    if(idx!==-1){
      const existing=POI_BRANDS_DB[idx];
      existing.name=r.name || existing.name;
      existing.hours=r.hours || existing.hours;
      existing.toilet=r.toilet!=='' ? r.toilet : existing.toilet;
      existing.lat=r.lat; existing.lon=r.lon;
      updated++;
    } else {
      delete r.status; // не тягнемо службове поле в постійне сховище точки
      POI_BRANDS_DB.push(r); added++;
    }
    if(!POI_BRAND_KEY.hasOwnProperty(r.brand)) unmatched++;
  });
  persistPoiBrandsDB();
  return {added:added, updated:updated, closed:closed, notFound:notFound, skipped:skipped, unmatched:unmatched};
}

function loadPoiBrandsFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    // 20.08.2026: раніше читали readAsText(file) — це ЗАВЖДИ декодує як
    // UTF-8. Джерела POI-даних Тайваню часто в Big5 (типово при експорті
    // з Excel на системі з Traditional Chinese) — ASCII-текст (напр.
    // "7-Eleven") лишається читабельним, а весь китайський (напр. офіційна
    // назва оператора "統一超商") перетворюється на кашу з випадкових
    // символів (у т.ч. кириличних на вигляд) і НІКОЛИ не збігається з
    // жодним відомим брендом — такі точки мовчки зникають з карти,
    // рахуючись лише в "усього N точок" зі сміттєвою назвою бренду.
    //
    // ВИПРАВЛЕНО (той самий день): перша версія цього фіксу пробувала
    // строгий UTF-8 (fatal:true) і одразу падала на Big5 при БУДЬ-якій
    // невдачі — але GPX (Overpass turbo) files ЗАВЖДИ чистий UTF-8, і
    // якщо строгий режим чомусь спрацьовував хибно, Big5-перекодування
    // ЛАМАЛО валідний XML (DOMParser більше не міг його розпарсити) —
    // симптом "GPX: 0 точок знайдено". Тепер спершу декодуємо М'ЯКО
    // (без fatal — ніколи не кидає, просто підставляє символ-заглушку на
    // невалідних байтах) і перевіряємо СТРУКТУРУ: якщо це GPX (<gpx...>
    // на початку) — ДОВІРЯЄМО м'якому UTF-8 напряму, Big5 сюди взагалі
    // не застосовуємо (GPX з Overpass не буває в Big5). Big5-детекцію
    // (строгий UTF-8 → фолбек) робимо ЛИШЕ для НЕ-GPX (CSV) тексту, де
    // це й було реальною проблемою.
    const buf=reader.result;
    const lenientText=new TextDecoder('utf-8').decode(buf);
    let text;
    if(looksLikeGpx(lenientText)){
      text=lenientText;
    } else {
      try{
        text=new TextDecoder('utf-8', {fatal:true}).decode(buf);
      }catch(e){
        try{ text=new TextDecoder('big5').decode(buf); sht('ℹ️ Файл прочитано як Big5 (не валідний UTF-8)'); }
        catch(e2){ text=lenientText; } // остання спроба — м'який UTF-8, як було раніше
      }
    }
    let rows=parseFlexiblePoiText(text); // той самий гнучкий парсер, що й для вставки з буфера — файл БЕЗ заголовка теж підхопить
    const forced=getSelectedPoiBrand();
    if(forced) rows=rows.map(function(r){ r.brand=forced; return r; });
    else rows=rows.filter(function(r){ return r.brand; }); // без бренду в файлі і без вибору в списку — рядок марний
    if(!rows.length){ sht('Не знайшов жодного валідного рядка — потрібні хоча б координати (GPX <wpt> або CSV lat/lon), і обраний бренд у списку вище (якщо у файлі немає власного brand)'); return; }
    const res=mergePoiRows(rows);
    let msg='🏪 '+poiMergeResultSummary(res)+' (всього '+POI_BRANDS_DB.length+')';
    if(res.unmatched) msg+=' <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> '+res.unmatched+' з нерозпізнаним брендом — на звичайній карті не покажуться, шукай їх "❓" у режимі \'<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> Редактор\' і допиши правильну мережу';
    sht(msg);
    try{ renderPoiBrandsStatus(); }catch(e){}
    try{ renderPoiCorruptedLines(); }catch(e){}
    // 20.08.2026: КРИТИЧНИЙ БАГ — цього виклику тут не було взагалі. База
    // оновлювалась коректно (localStorage, лічильники в статусі), а карта
    // просто НІКОЛИ не отримувала команду перемалюватись після імпорту.
    // Точки з'являлись лише якщо користувач ВИПАДКОВО щось інше згодом
    // тригерило перемальовку (напр. тумблер фільтра) — доти виглядало як
    // "імпорт каже ОК, а на карті нічого нема".
    refreshBrandMarkersEverywhere();
  };
  reader.onerror=function(){ sht('Не вдалось прочитати файл'); };
  reader.readAsArrayBuffer(file);
}

// 17.08.2026: спільне форматування результату mergePoiRows для тосту —
// показує лише ненульові лічильники, щоб не захаращувати повідомлення для
// звичайного (без status) імпорту.
function poiMergeResultSummary(res){
  const parts=[];
  if(res.added) parts.push('додано '+res.added);
  if(res.updated) parts.push('оновлено '+res.updated);
  if(res.closed) parts.push('видалено (closed) '+res.closed);
  if(res.notFound) parts.push('не знайдено для закриття '+res.notFound);
  if(res.skipped) parts.push('пропущено '+res.skipped+' без бренду/координат');
  return parts.length ? parts.join(', ') : 'нічого не змінилось';
}

// Рядок схожий на заголовок CSV (а не на дані)? — містить одне зі слів
// brand/name/lat/lon/hours/toilet і НЕ починається одразу з цифри/мінуса.
function looksLikePoiHeader(line){
  const l=line.toLowerCase();
  return /\b(status|brand|name|lat|lon|lng|hours|toilet)\b/.test(l) && !/^-?\d/.test(line.trim());
}

// Гнучкий розбір вставленого з буфера тексту (з нотаток на телефоні) —
// БЕЗ заголовка, довільна кількість колонок після lat,lon: розпізнає
// "yes"/"no"/"customers" як туалет, решту токенів — як графік роботи.
// Приклади рядків, які тут спрацюють:
//   24.1234,121.5678
//   24.1234,121.5678,yes
//   24.1234  121.5678  24/7  yes   (можна й пробілами/табами замість ком)
function parseFlexiblePoiText(text){
  // 17.08.2026: BOM (U+FEFF) на початку файлу — типовий "подарунок" від
  // Excel/Windows при збереженні CSV. У браузері FileReader.readAsText
  // ЗАЗВИЧАЙ сам його прибирає, але покладатись на це не варто (WebKit/
  // Bluefy вже не раз поводились нестандартно в цьому проєкті — див.
  // доповнення 15.08.2026 п.9). Якщо BOM лишається — перша клітинка
  // заголовка стає "\uFEFFstatus" замість "status", looksLikePoiHeader ще
  // спрацює (BOM — не словесний символ, \b перед "s" все одно є), а от
  // ТОЧНИЙ пошук колонки в parsePoiBrandsCSV (head.indexOf('status')) —
  // НІ, бо рядки не рівні побайтово. Наслідок: перша колонка (найчастіше
  // саме status або brand) мовчки не розпізнається, і весь імпорт
  // з'їжджає на одну позицію. Прибираємо BOM тут — це ЄДИНА точка входу
  // і для файлу, і для вставки з буфера, тож фікс покриває обидва шляхи.
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  if(looksLikeGpx(text)) return parseGpxPoiText(text); // 14.08.2026: GPX (Overpass turbo) — перевіряємо ДО розбиття на рядки, бо XML сам по собі багаторядковий
  const lines=text.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  if(!lines.length) return [];
  if(looksLikePoiHeader(lines[0])) return parsePoiBrandsCSV(lines.join('\n'));
  const out=[];
  lines.forEach(function(line){
    let parts=parseCsvLine(line).map(function(p){ return p.trim(); }).filter(function(p){ return p!==''; });
    if(parts.length<2) parts=line.split(/\t+/).map(function(p){ return p.trim(); }).filter(Boolean);
    if(parts.length<2) parts=line.split(/\s+/).map(function(p){ return p.trim(); }).filter(Boolean);
    if(parts.length<2) return;
    const lat=parseFloat(parts[0]), lon=parseFloat(parts[1]);
    if(isNaN(lat) || isNaN(lon)) return;
    let hours='', toilet='';
    for(let i=2;i<parts.length;i++){
      const tok=parts[i].toLowerCase();
      if(tok==='yes' || tok==='no' || tok==='customers') toilet = (tok==='customers') ? 'yes' : tok;
      else if(parts[i]) hours = hours ? (hours+' '+parts[i]) : parts[i];
    }
    out.push({brand:'', name:'', lat:lat, lon:lon, hours:hours, toilet:toilet});
  });
  return out;
}

// Експорт усієї єдиної бази (магазини + заправки + туалети) одним CSV —
// той самий формат, що й на вході (brand,name,lat,lon,hours,toilet), щоб
// можна було зробити бек-ап собі й пізніше залити той самий файл назад.
// 14.08.2026: замінено з <a download> (на iOS — часто зберігається як
// безіменний "байт"-файл без .csv, або в PWA/WKWebView взагалі не працює)
// на нативний діалог "Поділитися" (Web Share API з файлами) — саме так
// на iOS з'являється системний шер-шіт із пунктом "Зберегти у Файли", і
// зберігається РІВНО ОДИН файл із людською назвою й розширенням .csv.
// Передаємо масив ІЗ ОДНИМ File — саме це гарантує "один файл", а не
// кілька/фрагменти. Якщо навколишнє середовище (десктоп-браузер, старий
// Android) не підтримує navigator.share із файлами — тихо відкочуємось
// на стару поведінку через <a download>, щоб нічого не зламати там, де
// це й так працювало.
function exportPoiBrandsDB(){
  if(!POI_BRANDS_DB.length){ sht('База порожня — нічого експортувати'); return; }
  const esc=function(v){
    v=(v==null?'':String(v));
    return /[",\n]/.test(v) ? ('"'+v.replace(/"/g,'""')+'"') : v;
  };
  const lines=['brand,name,lat,lon,hours,toilet'];
  POI_BRANDS_DB.forEach(function(r){
    lines.push([esc(r.brand), esc(r.name), r.lat, r.lon, esc(r.hours), esc(r.toilet)].join(','));
  });
  const csvText=lines.join('\n');
  const stamp=new Date().toISOString().slice(0,10);
  const fileName='poi_brands_'+stamp+'.csv';
  const blob=new Blob([csvText], {type:'text/csv;charset=utf-8'});

  function fallbackDownload(){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    sht('📤 Завантажено '+POI_BRANDS_DB.length+' точок у '+fileName);
  }

  let file=null;
  try{ file=new File([blob], fileName, {type:'text/csv'}); }catch(e){ file=null; } // File може бути недоступний у деяких WebView

  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    // 25.08.2026: прибрано title з navigator.share — той самий фікс "лише
    // один файл", що й у tripExportGPX/exportMbtiles/exportSettings/
    // exportCurrentRouteGpx (title поруч із files деякі цілі "Поділитися"
    // на iOS трактують як окремий текстовий об'єкт, звідси зайвий файл).
    navigator.share({files:[file]})
      .then(function(){ sht('📤 '+POI_BRANDS_DB.length+' точок передано в "Поділитися"'); })
      .catch(function(e){
        if(e && e.name==='AbortError') return; // користувач сам закрив шер-шіт — не помилка
        console.warn('[poi export] navigator.share не вдався, фолбек на завантаження:', e);
        fallbackDownload();
      });
  } else {
    fallbackDownload();
  }
}
