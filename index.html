/* ═══════════════════════════════════════════════════════════════════════
   🕒 ПАРСЕР opening_hours (спрощений підмножина OSM-синтаксису)
   Підтримує: "24/7", "HH:MM-HH:MM", кілька правил через ";", дні тижня
   (Mo-Su, списки/діапазони), "off" (зачинено цей день), "PH" ігнорується
   (не маємо календаря свят — просто прибираємо токен і рахуємо решту
   правила як звичайне). Повертає 'open' | 'closed' | 'unknown'.
   Свідомо КОНСЕРВАТИВНО: якщо не змогли впевнено розпарсити — 'unknown',
   а не 'closed' (щоб випадково не сховати реально відкритий магазин).
   ═══════════════════════════════════════════════════════════════════════ */
const OH_DAY_NAMES=['Su','Mo','Tu','We','Th','Fr','Sa']; // JS getDay(): 0=Su
function ohParseDayToken(tok){
  // "Mo-Fr" → [1,2,3,4,5]; "Sa" → [6]; "Mo,We" обробляється окремо (split по комі раніше)
  const m=tok.match(/^(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))?$/);
  if(!m) return null;
  const a=OH_DAY_NAMES.indexOf(m[1]);
  if(!m[2]) return [a];
  const b=OH_DAY_NAMES.indexOf(m[2]);
  const out=[]; let i=a;
  while(true){ out.push(i); if(i===b) break; i=(i+1)%7; if(out.length>7) break; }
  return out;
}
function ohParseTimeRange(tok){
  // "07:00-19:00" → {from:420,to:1140}; "00:00-24:00" → {from:0,to:1440}
  const m=tok.match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  const from=parseInt(m[1],10)*60+parseInt(m[2],10);
  let to=parseInt(m[3],10)*60+parseInt(m[4],10);
  if(to<=from) to+=1440; // через північ
  return {from:from, to:to};
}
function isOpenNow(hoursStr, now){
  if(!hoursStr || !hoursStr.trim()) return 'unknown';
  let s=hoursStr.trim().replace(/^"+|"+$/g,''); // прибрати зовнішні лапки з CSV
  if(/24\/7/i.test(s)) return 'open';
  now = now || new Date();
  const nowDay=now.getDay();
  const nowMin=now.getHours()*60+now.getMinutes();
  const rules=s.split(';').map(function(r){ return r.trim(); }).filter(Boolean);
  if(!rules.length) return 'unknown';
  let matchedAnyDayRule=false;
  let openNowByRule=false;
  for(let ri=0; ri<rules.length; ri++){
    let rule=rules[ri];
    rule=rule.replace(/\bPH\b,?/gi,'').trim(); // прибрати "PH" — немає календаря свят
    if(!rule) continue;
    const parts=rule.split(/\s+/).filter(Boolean);
    if(!parts.length) continue;
    // Перша частина, якщо схожа на день/список днів — day-spec, інакше вважаємо Mo-Su
    let dayPart=null, restIdx=0;
    if(/^[A-Za-z,\-]+$/.test(parts[0]) && OH_DAY_NAMES.some(function(d){ return parts[0].indexOf(d)!==-1; })){
      dayPart=parts[0]; restIdx=1;
    }
    let days;
    if(dayPart){
      days=[];
      dayPart.split(',').forEach(function(tok){ const d=ohParseDayToken(tok); if(d) days=days.concat(d); });
      if(!days.length) days=null; // не розпізнали — не довіряємо цьому правилу
    } else {
      days=[0,1,2,3,4,5,6]; // немає day-spec → щодня
    }
    if(!days || days.indexOf(nowDay)===-1) continue; // це правило не про сьогодні
    matchedAnyDayRule=true;
    const timePart=parts.slice(restIdx).join(' ');
    if(/^off$/i.test(timePart) || timePart===''){
      // "off" явно, або день вказаний без часу — вважаємо зачинено саме сьогодні за цим правилом
      continue;
    }
    const timeTokens=timePart.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
    for(let ti=0; ti<timeTokens.length; ti++){
      const tr=ohParseTimeRange(timeTokens[ti]);
      if(!tr) continue;
      if(nowMin>=tr.from && nowMin<tr.to){ openNowByRule=true; break; }
    }
    if(openNowByRule) break;
  }
  if(!matchedAnyDayRule) return 'unknown'; // жодне правило не стосувалось сьогодні — не довіряємо
  return openNowByRule ? 'open' : 'closed';
}


// ── ОЗВУЧКА ПОВОРОТІВ (Web Speech API) ──
// РАНІШЕ прибирали через мовчазні збої в Bluefy/WKWebView — з'ясувалось,
// що причина НЕ в Bluefy як такому, а в тому, що speechSynthesis.speak()
// у WebKit, так само як AudioContext вище, вимагає РЕАЛЬНОГО фізичного
// тапу користувача перед першим використанням — інакше він просто "мовчки"
// нічого не каже, без жодної помилки в консолі. Тому розблоковуємо голос
// у ТОМУ Ж обробнику, де вже гарантовано є user-gesture — кнопка "Звук"
// (toggleSoundBtn нижче), а не десь посеред поїздки з GPS-колбека.
function speak(text){
  if(AL.Sound_enabled===false) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel(); // не даємо фразам накопичуватись у черзі, якщо не встигла договорити
    const u=new SpeechSynthesisUtterance(text);
    u.lang='uk-UA'; u.rate=1.0; u.pitch=1.0; u.volume=1.0; // volume=1.0 — це стеля Web Speech API, вище підняти неможливо (просили голосніше — підняли тони-біпи нижче, тут запасу нема)
    window.speechSynthesis.speak(u);
  }catch(e){ console.warn('[nav] speechSynthesis помилка:', e); }
}
function unlockSpeechOnGesture(){
  if(!('speechSynthesis' in window)) return;
  try{
    // Раніше цей виклик був беззвучним (u.volume=0) — лише щоб розблокувати
    // API. Проблема: тост "Звук увімкнено" нічого не доводить — якщо
    // TTS насправді не працює, дізнаєшся про це тільки в дорозі на першому
    // повороті. Тепер вимовляємо це вголос — один тап одразу підтверджує,
    // що голос реально чутний.
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance('Звук увімкнено');
    u.lang='uk-UA'; u.rate=1.0; u.pitch=1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// Викликається на кожен GPS-тік (watchPosition). Шукає найближчу камеру,
// оновлює значок(и) у GPS-плитці (може бути кілька, якщо тайл додано
// повторно — тому querySelectorAll, не єдиний ID) і голосові тригери.
// Звіряє поточний GPS-курс (heading, град. від півночі за годинниковою) з
// напрямом камери (cam.dir, той самий формат). Допуск ±90° (спершу було
// ±45° — виявилось занадто суворо на практиці, розширили). Камера, яка
// дивиться в інший бік, нас "не бачить", попереджати про неї не треба.
// Два fail-safe випадки, коли ми НЕ ризикуємо мовчати (краще хибне
// попередження, ніж пропущене реальне): камера без dir (обидва напрямки,
// або стара запис без цього поля) — завжди true; і heading null/NaN (GPS
// не дає курсу — стоїмо на місці чи старий телефон) — теж завжди true.
function headingMatchesCamDir(heading, camDir){
  if(camDir==null) return true;
  if(heading==null || isNaN(heading)) return true;
  let diff = Math.abs(heading - camDir) % 360;
  if(diff>180) diff = 360-diff;
  return diff <= 90;
}

// Значок "тех.контроль" (科技執法) у радар-бейджі — раніше емодзі 📷/📡, але
// емодзі рендериться по-різному в різних браузерах/шрифтах (Bluefy теж не
// виняток) і не завжди читається як "радар" на маленькому колі. Тепер —
// та сама inline-SVG іконка "ручний радар" (CAM_RADAR_GUN_SVG, оголошена
// вище біля CAMERAS_DB), що й на кнопці швидкого додавання камери.

function updateCameraRadar(lat1, lon1){
  let targetCam=null, minD=Infinity;
  for(const cam of CAMERAS_DB){
    // Грубий гео-гейт (~1км) ПЕРЕД точним гаверсинусом — та сама оптимізація, що в специфікації
    if(Math.abs(cam.lat-lat1)>0.01 || Math.abs(cam.lon-lon1)>0.01) continue;
    if(!headingMatchesCamDir(_lastHeading, cam.dir)) continue; // напрям не збігається — ця камера нас не фіксує, пропускаємо
    const d=haversineM(lat1,lon1,cam.lat,cam.lon);
    if(d<minD){ minD=d; targetCam=cam; }
  }

  const badges=document.querySelectorAll('.cam-radar-badge');
  if(targetCam && minD<=500){
    const camId=targetCam.lat+'_'+targetCam.lon;
    if(camId!==_camLastId){ _camLastId=camId; _camPrevD=Infinity; _camPassed=false; _camSaid500=false; _camSaid200=false; } // нова камера в зоні — скидаємо трек
    const dR=Math.round(minD);
    // Дистанція зросла (з запасом 3м проти GPS-шуму) ПІСЛЯ того, як була
    // справді близько (<=60м) — отже камеру щойно проїхали.
    if(!_camPassed && _camPrevD<=60 && dR>_camPrevD+3){ _camPassed=true; }
    _camPrevD=dR;

    if(_camPassed){
      // Проїхали — ховаємо попередження, навіть якщо формально ще в 500м радіусі
      _nearestCam=null;
      _camDist=null;
      badges.forEach(badge=>{ badge.style.display='none'; });
    } else if(dR>220){
      // ── М'ЯКА ЗОНА 220-500м: раннє попередження, без увімкнення
      // повноекранного tile-alert/сирени за перевищення (_nearestCam
      // лишається null — та система і далі прив'язана лише до 220м).
      // Бейдж показує ліміт+дистанцію нейтральним кольором.
      _nearestCam=null;
      _camDist=null;
      badges.forEach(badge=>{
        badge.style.display='flex';
        badge.classList.remove('near','warn','danger');
        badge.classList.toggle('mobile', !!targetCam.mobile);
        const limUi=badge.querySelector('.c-sign'), dstUi=badge.querySelector('.c-dist');
        if(limUi){
          limUi.classList.remove('cam-type-redlight','cam-type-tech');
          limUi.textContent=targetCam.limit;
        }
        if(dstUi) dstUi.textContent=dR+'м';
      });
      if(dR<=500 && dR>450 && !_camSaid500){
        _camSaid500=true; // прапорець ставимо завжди, незалежно від тоглу нижче — щоб дебаунс на цю камеру не "накопичувався" й не спрацював пізніше несподівано
        // Писк на самому наближенні прибрано — звук тепер лишається лише
        // для реального перевищення ліміту (danger, >9 км/год понад ліміт,
        // див. ca()). Голосове попередження про зону — вимикається окремим
        // тоглом (AL.Cam500_voice_enabled, Налаштування → Сигнали), бейдж і
        // 200м-попередження цим тоглом НЕ зачіпаються.
        if(AL.Cam500_voice_enabled!==false) speak('Зона 500 метрів');
      }
    } else {
    _nearestCam=targetCam;
    _camDist=dR;
    const spd=parseFloat(V.GPS);
    const excess=!isNaN(spd) ? spd-targetCam.limit : 0;
    badges.forEach(badge=>{
      badge.style.display='flex';
      badge.classList.toggle('mobile', !!targetCam.mobile);
      const limUi=badge.querySelector('.c-sign'), dstUi=badge.querySelector('.c-dist');
      if(limUi){
        limUi.classList.remove('cam-type-redlight','cam-type-tech');
        if(targetCam.type==='redlight'){ limUi.textContent='🚦'; limUi.classList.add('cam-type-redlight'); }
        else if(targetCam.type==='tech'){ limUi.innerHTML=CAM_RADAR_GUN_SVG; limUi.classList.add('cam-type-tech'); }
        else { limUi.textContent=targetCam.limit; }
      }
      if(dstUi) dstUi.textContent=dR+'м';
      badge.classList.toggle('near', dR<=100);
      // Жовтий — перевищення до 9 км/год; червоний — понад 9 км/год.
      // Для 'redlight' ліміт у даних реальний (комбо-камера), тому попередження лишаємо для всіх типів.
      badge.classList.toggle('warn', excess>0 && excess<=9);
      badge.classList.toggle('danger', excess>9);
    });
    if(dR<=200 && dR>150 && !_camSaid200){
      _camSaid200=true;
      speak('200 метрів камера');
      // Писк на наближенні прибрано (як і на 500м вище) — звук лишається
      // тільки для реального перевищення ліміту (danger, див. ca()).
      // Голосове попередження про 200м лишається як було.
    }
    }
  } else {
    _nearestCam=null;
    _camDist=null;
    badges.forEach(badge=>{ badge.style.display='none'; });
    _camSaid200=false;
    _camSaid500=false;
    _camPassed=false; _camPrevD=Infinity; _camLastId=null;
  }
}

function renderCamDbStatus(){
  const el=document.getElementById('camDbStatus');
  if(!el) return;
  if(camDbMeta && camDbMeta.count){
    const ageDays = (Date.now()-camDbMeta.updatedAt)/86400000; // 86 400 000 мс = 1 доба
    if(ageDays > 7){
      el.innerHTML='⚠ <b>База застаріла</b> ('+Math.floor(ageDays)+' дн.): '+camDbMeta.count+' камер, оновлено '+new Date(camDbMeta.updatedAt).toLocaleString()+' — рекомендуємо перезавантажити CSV';
      el.style.color='var(--amber)';
    } else {
      el.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg> <b>Радар активний</b>: '+camDbMeta.count+' камер (оновлено '+new Date(camDbMeta.updatedAt).toLocaleString()+')';
      el.style.color='var(--cyan)';
    }
  } else {
    el.innerHTML='⚠ <b>Радар НЕ працює</b> — база порожня, завантаж CSV-файл';
    el.style.color='var(--amber)';
  }
}

// Одноразова перевірка при старті додатку: якщо база камер старша 7 днів —
// показуємо ненав'язливий toast (не блокуємо роботу, просто нагадуємо).
function checkCamDbFreshness(){
  if(!camDbMeta || !camDbMeta.updatedAt) return;
  const ageDays = (Date.now()-camDbMeta.updatedAt)/86400000;
  if(ageDays > 7){
    sht('⚠ База камер старша '+Math.floor(ageDays)+' дн. — рекомендуємо оновити CSV у Налаштуваннях');
  }
}



let gpsId=null;
let _lastLat=null, _lastLon=null, _lastAlt=null, _lastSpeedMps=null, _lastHeading=null; // для Trip Mode (розділ 10.1) і радара камер (heading — напрям для фільтра камер за dir)
function startGPS(){
  if(!navigator.geolocation||gpsId)return;
  navigator.geolocation.getCurrentPosition(()=>{
    gpsId=navigator.geolocation.watchPosition(pos=>{
      V.GPS=pos.coords.speed!=null?Math.round(pos.coords.speed*3.6):0;
      V.Alt=pos.coords.altitude!=null?Math.round(pos.coords.altitude):'--';
      _lastLat=pos.coords.latitude; _lastLon=pos.coords.longitude;
      _lastAlt=pos.coords.altitude; _lastSpeedMps=pos.coords.speed; _lastHeading=pos.coords.heading;
      updateCameraRadar(pos.coords.latitude, pos.coords.longitude);
      // 15.08.2026: processNavHudStep ПЕРЕД updateAllMapTiles (раніше було
      // навпаки) — updateAllMapTiles тепер "прилипає" маркер до лінії
      // маршруту (route-snapping), а для цього navProgressIndex/navOffRoute
      // мають бути вже свіжими НА ЦЕЙ тік, а не з попереднього.
      if(typeof processNavHudStep==='function') processNavHudStep(pos.coords.latitude, pos.coords.longitude);
      if(typeof updateAllMapTiles==='function') updateAllMapTiles(pos.coords.latitude, pos.coords.longitude, pos.coords.heading);
      ud();ca();
    },()=>{V.GPS='0';V.Alt='--';ud();},{enableHighAccuracy:true,maximumAge:1000});
  },()=>{V.GPS='0';V.Alt='--';ud();},{enableHighAccuracy:false,timeout:5000});
}
document.addEventListener('touchstart',()=>startGPS(),{once:true});
document.addEventListener('click',()=>startGPS(),{once:true});
try{ startGPS(); }catch(e){ console.error('startGPS init failed:',e); }

// ── "Записувати поїздку у фоні" (Налаштування → ПАДІННЯ) ──
// Якщо вимкнено (дефолт) — при згортанні застосунку/блокуванні телефону
// реально ГЛУШИМО GPS-приймач (clearWatch), а не просто чекаємо, поки iOS
// сам притримає таймер. Саме постійно активний GPS — головний пожирач
// батареї тут, не наш JS-код як такий. Для щоденних поїздок це економить
// заряд; для довгих подорожей, де важливий безперервний трек навіть коли
// не дивишся в екран, можна увімкнути назад.
function pauseTripBackgroundIfNeeded(){
  if(AL.Trip_bg_record) return; // юзер хоче писати у фоні — нічого не чіпаємо
  if(gpsId!=null){ try{ navigator.geolocation.clearWatch(gpsId); }catch(e){} gpsId=null; }
  if(tripTimerId){ clearInterval(tripTimerId); tripTimerId=null; }
}
function resumeTripFromBackground(){
  startGPS(); // сам перевіряє, чи вже запущено — безпечно викликати повторно
  if(tripRecording && !tripTimerId){ tripTimerId=setInterval(tripPushPoint,1000); }
}

/* ── TRIP MODE / GPX-ЛОГ МАРШРУТУ (розділ 10.1 бази знань) ──
   Лог у пам'яті (масив об'єктів), одна точка ЩОСЕКУНДИ: GPS (lat/lon/alt/
   швидкість) + вся поточна ECU-телеметрія. СТІЙКИЙ до реконекту BLE — масив
   НЕ очищується при Disconnect/Connect (це окрема глобальна змінна,
   незалежна від стану з'єднання), очищується тільки явним стартом НОВОЇ
   поїздки. Поки BLE відключений — telemetry-поля просто йдуть як є в V
   (найчастіше '--'/0), а GPS продовжує писати без дірок (це окремий
   геолокейшн-потік, не залежить від BLE).
   Формат експорту — стандартний GPX з КАСТОМНИМ <extensions> у кожній
   точці: звичайні сайти (Google Мої Карти, Strava, gpxstudio.org) читають
   тільки стандартні lat/lon/ele/time і ІГНОРУЮТЬ невідомий extensions-блок
   (не зламаються, просто покажуть маршрут/висоту) — а майбутній власний
   переглядач (TripViewer) розпарсить його і покаже графіки телеметрії
   поруч із мапою. */
let tripLog = [];
let tripRecording = false;
let tripTimerId = null;
// Після (пере)підключення перший пакет (чи кілька) інколи буває "сирим"/
// перехідним (BLE ще стабілізується) і може дати випадковий сплеск (напр.
// TPS=100%, хоча газу не було). Тому одразу після кожного initSession()
// на короткий час призупиняємо запис у трип-лог — досить, щоб прийшло
// кілька справжніх пакетів і значення встигли "влягтись". Перше підключення
// (свіжий старт) — 7с; будь-яке ПЕРЕпідключення (фон/швидкий тап/автоцикл) —
// 10с, бо саме там найчастіше трапляється "залипання" зі сплесками.
let _dataSettleUntil = 0;
function armDataSettleGuard(ms=7000){ _dataSettleUntil = Date.now() + ms; }

// Після кожного успішного (пере)підключення — авто-старт запису поїздки
// через 7с (даємо потоку даних стабілізуватись, перш ніж почати логувати;
// заодно не треба щоразу тицяти "Trip" вручну). Якщо запис уже йде — нічого
// не робимо. Якщо BLE відвалиться раніше, ніж спрацює таймер — скасовуємо.
let _autoTripTimer = null;
function scheduleAutoTripStart(ms=7000){
  if(_autoTripTimer) clearTimeout(_autoTripTimer);
  _autoTripTimer = setTimeout(()=>{
    _autoTripTimer = null;
    if(!tripRecording && bConn) tripStart();
  }, ms);
}
function cancelAutoTripStart(){
  if(_autoTripTimer){ clearTimeout(_autoTripTimer); _autoTripTimer=null; }
}

function tripNumOrEmpty(v){
  return (typeof v === 'number' && !isNaN(v)) ? v : '';
}

function tripPushPoint(){
  if(!tripRecording) return;
  if(Date.now() < _dataSettleUntil) return; // ще в "заспокійливому" вікні після (пере)підключення — не пишемо
  // Двигун вимкнений (RPM=0) — параметри, які мають сенс лише при
  // працюючому двигуні (T двигуна, TPS, MAP, Inj Rate), у цей момент часто
  // "стрибають" на випадкове значення (перехідний процес при вимкненні,
  // а не реальне показання) — не пишемо їх, щоб не засмічувати графік
  // фальшивим піком. GPS/нахил/G-сила/напруга/T повітря лишаються — вони
  // не залежать від того, чи крутиться двигун.
  const engineOff = !V.RPM || V.RPM===0;
  tripLog.push({
    t: Date.now(),
    lat: _lastLat, lon: _lastLon, alt: _lastAlt, spd: _lastSpeedMps,
    // V.Volt, V.Gforce і V.Inj_Rate на живому дашборді — РЯДКИ (formatted через
    // .toFixed() для гарного відображення на тайлі), а не числа, як решта полів.
    // tripNumOrEmpty() очікує typeof==='number', тож ці поля мовчки писались
    // би у GPX як ПОРОЖНІ — тому явно парсимо в число тут.
    rpm: V.RPM,
    tps: engineOff ? null : V.TPS,
    volt: parseFloat(V.Volt),
    tEng: engineOff ? null : V.T_Eng,
    tAir: V.T_Air,
    map: engineOff ? null : V.MAP,
    inj: engineOff ? null : parseFloat(V.Inj_Rate),
    lean: V.LeanSigned, g: parseFloat(V.Gforce),
    // Позначка тригера падіння — заповнюється в logFallEvent(), тут забираємо
    // і одразу очищаємо, щоб позначилась рівно на тій точці, де спрацювало.
    fall: _fallLogTag
  });
  _fallLogTag = '';
  const btn=document.getElementById('tripBtn');
  if(btn) btn.textContent = '⏹ Стоп ('+tripLog.length+')';
}

function tripStart(){
  tripLog = [];
  tripRecording = true;
  if(tripTimerId) clearInterval(tripTimerId);
  tripTimerId = setInterval(tripPushPoint, 1000);
  tripPushPoint(); // перша точка одразу, не чекаючи першої секунди
  const btn=document.getElementById('tripBtn');
  if(btn){ btn.textContent='⏹ Стоп (0)'; btn.classList.add('rec'); }
  sht('Запис поїздки почато');
}

let lastTripLog=[]; // копія останньої завершеної поїздки — живе тут навіть після того, як tripStart() обнулить tripLog для нової поїздки
function tripStop(){
  tripRecording = false;
  if(tripTimerId){ clearInterval(tripTimerId); tripTimerId=null; }
  const btn=document.getElementById('tripBtn');
  if(btn){ btn.textContent='Лог'; btn.classList.remove('rec'); }
  if(tripLog.length > 1){
    lastTripLog = tripLog.slice();
    openTripView(); // одразу перегляд із оперативної пам'яті — без експорту/імпорту GPX-файлу
  } else {
    sht('Запис зупинено (замало точок для перегляду)');
  }
}

async function tripExportGPX(log){
  log = log || tripLog;
  if(!log.length) return;
  const pts = log.map(p=>{
    if(p.lat==null || p.lon==null) return ''; // GPX вимагає координати — без них точку не пишемо
    const timeIso = new Date(p.t).toISOString();
    const eleTag = (p.alt!=null) ? `<ele>${p.alt.toFixed(1)}</ele>` : '';
    const spdAttr = (p.spd!=null) ? p.spd.toFixed(2) : '';
    return `      <trkpt lat="${p.lat}" lon="${p.lon}">${eleTag}<time>${timeIso}</time>`+
      `<extensions><vRacer:tele xmlns:vRacer="https://vracer.github.io/vRace2" `+
      `rpm="${tripNumOrEmpty(p.rpm)}" tps="${tripNumOrEmpty(p.tps)}" volt="${tripNumOrEmpty(p.volt)}" `+
      `tEng="${tripNumOrEmpty(p.tEng)}" tAir="${tripNumOrEmpty(p.tAir)}" map="${tripNumOrEmpty(p.map)}" `+
      `inj="${tripNumOrEmpty(p.inj)}" lean="${tripNumOrEmpty(p.lean)}" g="${tripNumOrEmpty(p.g)}" `+
      `fall="${p.fall||''}" spdMps="${spdAttr}"/></extensions></trkpt>`;
  }).filter(Boolean).join('\n');

  const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n`+
    `<gpx version="1.1" creator="vRacer BLE Dashboard" xmlns="http://www.topografix.com/GPX/1/1">\n`+
    `  <trk>\n`+
    `    <name>vRacer Trip ${new Date(log[0].t).toLocaleString()}</name>\n`+
    `    <trkseg>\n${pts}\n    </trkseg>\n`+
    `  </trk>\n`+
    `</gpx>`;

  const startD = new Date(log[0].t);
  const pad2 = n => String(n).padStart(2,'0');
  const stamp = startD.getFullYear()+'-'+pad2(startD.getMonth()+1)+'-'+pad2(startD.getDate())+
    '_'+pad2(startD.getHours())+'-'+pad2(startD.getMinutes())+'-'+pad2(startD.getSeconds());
  const filename = 'vracer-trip-' + stamp + '.gpx';
  const blob = new Blob([gpx], {type:'application/gpx+xml'});

  // КРИТИЧНО: на iOS Safari/WebKit (а отже й у Bluefy) атрибут download у
  // <a> НЕ зберігає файл — посилання просто намагається відкрити сирий XML
  // у вкладці (звідси "щось качається, але результату нема"). Web Share
  // API з File відкриває системне меню "Поділитися", де є "Зберегти у
  // Файли" — це надійний спосіб саме для iOS. Android/десктоп теж підтримує
  // Web Share, тож перевіряємо його першим для всіх; якщо недоступний —
  // фолбек на старий download-підхід (працює на Android/десктопі).
  try{
    const file = new File([blob], filename, {type:'application/gpx+xml'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      // ВАЖЛИВО: не передаємо title/text разом з files — на iOS деякі цілі
      // "Поділитися" (в т.ч. "Зберегти у Файли") трактують title як окремий
      // текстовий об'єкт для шерингу і створюють поруч із .gpx ще й крихітний
      // .txt-файл з цим текстом. Без title лишається рівно один файл.
      await navigator.share({files:[file]});
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // користувач сам закрив меню "Поділитися" — це не помилка
    // інакше падаємо у фолбек нижче
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

/* ══════════════════════════════════════════════════════════════════════
   ПЕРЕГЛЯД ПОЇЗДКИ З ОПЕРАТИВНОЇ ПАМ'ЯТІ (без експорту/імпорту GPX)
   ══════════════════════════════════════════════════════════════════════
   tripLog вже має практично ту саму структуру полів, що й точки, які
   TripViewer.html дістає з розпарсеного GPX — тому переносимо сюди ту саму
   ідею (карта + маркери падінь/максимумів + підсумкова статистика), тільки
   напряму з масиву в пам'яті, без проміжного файлу. Бонус: карта тут
   використовує наш ЖЕ HybridTileLayer, тобто працює офлайн, чого немає в
   окремому TripViewer.html. */
function haversineDist(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
// Ті самі кольори, що й у P (для візуальної узгодженості з тайлами дашборду).
const TRIP_PARAMS=[
  {key:'spd',  label:'Швидкість',   unit:'км/год', color:P.GPS.c,      dec:0, get:p=>p.spd!=null?p.spd*3.6:null},
  {key:'rpm',  label:'RPM',         unit:'',       color:P.RPM.c,      dec:0, get:p=>p.rpm},
  {key:'tps',  label:'TPS',         unit:'%',      color:P.TPS.c,      dec:0, get:p=>p.tps},
  {key:'volt', label:'Напруга',     unit:'В',      color:P.Volt.c,     dec:1, get:p=>p.volt},
  {key:'tEng', label:'T Двигуна',   unit:'°C',     color:P.T_Eng.c,    dec:0, get:p=>p.tEng},
  {key:'tAir', label:'T Повітря',   unit:'°C',     color:P.T_Air.c,    dec:0, get:p=>p.tAir},
  {key:'map',  label:'MAP',         unit:'',       color:P.MAP.c,      dec:0, get:p=>p.map},
  {key:'inj',  label:'Inj Rate',    unit:'',       color:P.Inj_Rate.c, dec:0, get:p=>p.inj},
  {key:'lean', label:'Кут нахилу',  unit:'°',      color:P.Lean.c,     dec:0, get:p=>{
    if(p.lean==null) return null;

    return a>=90 ? null : a; // 90°+ — той самий фільтр помилки сенсора, що й у TripViewer/плитці карти
  }},
  {key:'g',    label:'G-сила',      unit:'g',      color:P.Gforce.c,   dec:2, get:p=>p.g},
  {key:'alt',  label:'Висота',      unit:'м',      color:P.Alt.c,      dec:0, get:p=>p.alt},
];
const TRIP_MAP_SKIP=new Set(['volt','inj','map']); // ті самі, що не показуємо на карті для маршруту (нецікаво дивитись)

// ── Порядок плиток-графіків поїздки, який обирає користувач (той самий
// підхід, що й у TripViewer.html) — зберігається окремо від розкладки
// дашборду, переживає перезапуск. ──
function loadTripParamOrder(){
  const allKeys=TRIP_PARAMS.map(p=>p.key);
  const saved=lg('tripParamOrder');
  if(!Array.isArray(saved)) return allKeys.slice();
  const cleaned=saved.filter(k=>allKeys.includes(k));
  allKeys.forEach(k=>{ if(!cleaned.includes(k)) cleaned.push(k); });
  return cleaned;
}
let tripParamOrder=loadTripParamOrder();
function saveTripParamOrder(){ ls('tripParamOrder', tripParamOrder); }
function orderedTripParams(){ return tripParamOrder.map(k=>TRIP_PARAMS.find(p=>p.key===k)).filter(Boolean); }
function moveTripParam(key,delta){
  const i=tripParamOrder.indexOf(key), j=i+delta;
  if(i<0||j<0||j>=tripParamOrder.length) return;
  [tripParamOrder[i],tripParamOrder[j]]=[tripParamOrder[j],tripParamOrder[i]];

  renderTripOrderList();
  if(tripViewCurrentLog){ buildTripTiles(tripViewCurrentLog); seekTripTo(tripScrubIndex); } // якщо поїздка вже відкрита — перебудувати одразу
}

// Читає GPX, який пише наш власний tripExportGPX() (з розширенням
// <vRacer:tele .../>) — назад у той самий формат точок, що й tripLog.
function parseVracerGPX(text){
  const xml=new DOMParser().parseFromString(text,'application/xml');
  const attrNum=(el,name)=>{
    if(!el) return null;
    const v=el.getAttribute(name);
    if(v===null||v==='') return null;
    const n=parseFloat(v);
    return isNaN(n)?null:n;
  };
  return Array.from(xml.querySelectorAll('trkpt')).map(pt=>{
    const lat=parseFloat(pt.getAttribute('lat')), lon=parseFloat(pt.getAttribute('lon'));
    const eleEl=pt.querySelector('ele'), timeEl=pt.querySelector('time');
    const extEl=pt.querySelector('extensions');
    const teleEl=extEl?extEl.firstElementChild:null;
    return {
      t: timeEl ? new Date(timeEl.textContent).getTime() : Date.now(),
      lat, lon,
      alt: eleEl ? parseFloat(eleEl.textContent) : null,
      spd: attrNum(teleEl,'spdMps'),
      rpm: attrNum(teleEl,'rpm'), tps: attrNum(teleEl,'tps'), volt: attrNum(teleEl,'volt'),
      tEng: attrNum(teleEl,'tEng'), tAir: attrNum(teleEl,'tAir'), map: attrNum(teleEl,'map'),
      inj: attrNum(teleEl,'inj'), lean: attrNum(teleEl,'lean'), g: attrNum(teleEl,'g'),
      fall: (teleEl && teleEl.getAttribute('fall')) || ''
    };
  }).filter(p=>!isNaN(p.lat) && !isNaN(p.lon));
}

      </select>

  `;
  wireTripScrubTrack();

  const geoPts=log.filter(p=>p.lat!=null && p.lon!=null);

  for(let i=1;i<geoPts.length;i++) distM+=haversineDist(geoPts[i-1].lat,geoPts[i-1].lon,geoPts[i].lat,geoPts[i].lon);
  const fallEvents=[];

  const fmtDur=s=>{ s=Math.round(Math.max(0,s)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
    const pad=n=>String(n).padStart(2,'0');
    return h>0 ? h+':'+pad(m)+':'+pad(sec) : pad(m)+':'+pad(sec); };

  // ── Список тригерів падіння — клікабельний, як у TripViewer ──
  const fallBox=document.getElementById('tripFallList');
  if(fallEvents.length){
    fallBox.innerHTML='<div style="padding:8px 10px 0;font-size:12px;color:var(--red);font-weight:700;">⚠ Тригери падіння ('+fallEvents.length+')</div>'+
      fallEvents.map(ev=>`<div class="tripFallRow" data-idx="${ev.index}" style="display:flex;align-items:center;gap:8px;padding:7px 10px;margin:4px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;">
        <span><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg></span><span style="flex:1;font-size:13px;">${FALL_TYPE_LABEL[ev.type]||ev.type}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);">${fmtDur(ev.elapsed)}</span>
      </div>`).join('');
    fallBox.querySelectorAll('.tripFallRow').forEach(row=>row.addEventListener('click',()=>seekTripTo(parseInt(row.dataset.idx))));
  } else fallBox.innerHTML='';

  // ── Підсумкова статистика ──
  let statsHtml=statBox('Дистанція',(distM/1000).toFixed(1),'км')+
    statBox('Тривалість',fmtDur(durSec),'')+
    statBox('Тригери падіння',fallEvents.length,'',fallEvents.length>0?'var(--red)':'#4ade80');
  orderedTripParams().forEach(tp=>{
    let mx=-Infinity;
    log.forEach(p=>{ const v=tp.get(p); if(v!=null && v>mx) mx=v; });
    if(mx===-Infinity) return;
    statsHtml+=statBox('Макс. '+tp.label, mx.toFixed(tp.dec), tp.unit, tp.color);
  });
  document.getElementById('tripViewStats').innerHTML=statsHtml;

  // ── Карта (наш HybridTileLayer — на відміну від окремого TripViewer, працює й офлайн) ──
  const mapEl=document.getElementById('tripViewMap');
  if(tripViewMapObj){ try{ tripViewMapObj.remove(); }catch(e){} tripViewMapObj=null; }
  tripMarker=null;
  if(!geoPts.length || typeof L==='undefined' || !HybridTileLayer){
    mapEl.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px;">'+
      (geoPts.length?'Карта недоступна':'У цій поїздці немає GPS-координат')+'</div>';
  } else {
    mapEl.innerHTML='';
    const map=L.map(mapEl,{zoomControl:false,attributionControl:false});
    tripViewMapObj=map;
    new HybridTileLayer({maxZoom:19,minZoom:2}).addTo(map);
    const latlngs=geoPts.map(p=>[p.lat,p.lon]);
    const line=L.polyline(latlngs,{color:'#37e0e6',weight:5,opacity:0.9}).addTo(map);
    map.fitBounds(line.getBounds(),{padding:[20,20]});
    // Скрабер-маркер — рухається слайдером/відтворенням/кліком по графіку.
    tripMarker=L.circleMarker(latlngs[0],{radius:7,color:'#000',weight:2,fillColor:'#ffd23f',fillOpacity:1}).addTo(map);

    log.forEach((p,i)=>{
      if(!p.fall || p.lat==null) return;
      L.circleMarker([p.lat,p.lon],{radius:9,color:'#fff',weight:2,fillColor:'#ff4d4d',fillOpacity:0.9})
        .addTo(map).bindTooltip('⚠ '+(FALL_TYPE_LABEL[p.fall]||p.fall)).on('click',()=>seekTripTo(i));
    });
    TRIP_PARAMS.forEach(tp=>{
      if(TRIP_MAP_SKIP.has(tp.key)) return;
      let bestIdx=-1,bestVal=-Infinity;
      log.forEach((p,i)=>{ if(p.lat==null) return; const v=tp.get(p); if(v!=null && v>bestVal){ bestVal=v; bestIdx=i; } });
      if(bestIdx<0) return;
      const p=log[bestIdx];
      L.circleMarker([p.lat,p.lon],{radius:8,color:'#fff',weight:2,fillColor:tp.color,fillOpacity:0.9})
        .addTo(map).bindTooltip('Макс. '+tp.label+': '+bestVal.toFixed(tp.dec)+' '+tp.unit).on('click',()=>seekTripTo(bestIdx));
    });
  }

  buildTripTiles(log);
  seekTripTo(0);
}

// ── Плитки-графіки (Chart.js), той самий підхід, що й у TripViewer ──
function buildTripTiles(log){
  const wrap=document.getElementById('tripTiles');
  wrap.innerHTML='';
  const labels=log.map((_,i)=>i);
  orderedTripParams().forEach(tp=>{
    const data=log.map(tp.get);
    const hasData=data.some(v=>v!=null);
    const tile=document.createElement('div');
    tile.style.cssText='background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;';
    tile.innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div style="font-size:12px;display:flex;align-items:center;gap:6px;">
          <span style="width:9px;height:9px;border-radius:50%;background:${tp.color};display:inline-block;"></span>${tp.label}
        </div>
        <div><span id="tripVal-${tp.key}" style="font-family:'JetBrains Mono',monospace;font-weight:700;color:${tp.color};">—</span>
          <span style="font-size:11px;color:var(--muted);">${tp.unit}</span></div>
      </div>
      <div id="tripChartWrap-${tp.key}" style="position:relative;height:52px;">
        <canvas id="tripChart-${tp.key}"></canvas>
        <div id="tripLine-${tp.key}" style="position:absolute;top:0;bottom:0;width:2px;background:${tp.color};left:0;pointer-events:none;"></div>
      </div>`;
    wrap.appendChild(tile);
    if(!hasData){
      document.getElementById('tripChartWrap-'+tp.key).innerHTML='<div style="color:var(--muted);font-size:11px;padding-top:14px;text-align:center;">немає даних у поїздці</div>';
      return;
    }
    try{
      const ctx=document.getElementById('tripChart-'+tp.key).getContext('2d');
      tripCharts[tp.key]=new Chart(ctx,{
        type:'line',
        data:{labels, datasets:[{data, borderColor:tp.color, borderWidth:1.4, pointRadius:0, tension:0.15, spanGaps:true}]},
        options:{responsive:true, maintainAspectRatio:false, animation:false, interaction:{intersect:false},
          scales:{x:{display:false}, y:{display:false}}, plugins:{legend:{display:false}, tooltip:{enabled:false}}}
      });
    }catch(e){
      console.error('Графік '+tp.key+' не намалювався:', e);
      document.getElementById('tripChartWrap-'+tp.key).innerHTML='<div style="color:var(--muted);font-size:11px;padding-top:14px;text-align:center;">графік недоступний</div>';
    }
    const wrapEl=document.getElementById('tripChartWrap-'+tp.key);
    wrapEl.style.cursor='pointer';
    wrapEl.addEventListener('click', e=>{
      const rect=wrapEl.getBoundingClientRect();
      const frac=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
      seekTripTo(Math.round(frac*(log.length-1)));
    });
  });
}

// ── Скраб: пересуває маркер на карті + значення й лінію на всіх графіках ──
// ── Тап/перетягування будь-де по шкалі — власна реалізація замість
// нативного <input type="range">, бо на iOS Safari тап по доріжці range-
// повзунка НІЧОГО не робить (на відміну від десктопу) — працює лише
// перетягування самого повзунка. Тут і тап, і перетягування працюють
// однаково, в будь-якій точці шкали. ──
// ── Підстраховка для жесту "потягнути вниз" (оновлення сторінки) ──
// overscroll-behavior:contain (CSS вище) мав би це вже зупиняти, але про
// всяк випадок (Bluefy — не завжди повний Safari) — додаємо й ручний
// блок: якщо скрол уже в самому верху і палець тягне ще нижче, гасимо
// сам жест, поки перегляд поїздки відкритий. На головному екрані (коли
// закрив перегляд) це нікого не чіпає — слухач висить лише на цьому
// конкретному контейнері.
function blockPullToRefresh(el){
  let startY=0;
  el.addEventListener('touchstart', e=>{ startY=e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchmove', e=>{
    const dy=e.touches[0].clientY-startY;
    if(el.scrollTop<=0 && dy>0) e.preventDefault(); // тягнемо вниз, а скролити вже нема куди — це і є той самий жест
  }, {passive:false});
}
try{ blockPullToRefresh(document.getElementById('tripViewBody')); }catch(e){}

function wireTripScrubTrack(){
  const track=document.getElementById('tripScrubTrack');
  if(!track) return;
  let dragging=false;
  const seekFromClientX=cx=>{
    const log=tripViewCurrentLog;
    if(!log || !log.length) return;
    const rect=track.getBoundingClientRect();
    const frac=Math.max(0,Math.min(1,(cx-rect.left)/rect.width));
    seekTripTo(Math.round(frac*(log.length-1)));
  };
  track.addEventListener('pointerdown', e=>{
    dragging=true;
    try{ track.setPointerCapture(e.pointerId); }catch(err){}
    seekFromClientX(e.clientX);
  });
  track.addEventListener('pointermove', e=>{ if(dragging) seekFromClientX(e.clientX); });
  const stopDrag=()=>{ dragging=false; };
  track.addEventListener('pointerup', stopDrag);
  track.addEventListener('pointercancel', stopDrag);
}
function seekTripTo(index){
  const log=tripViewCurrentLog;
  if(!log || !log.length) return;
  tripScrubIndex=Math.max(0, Math.min(log.length-1, index));
  const p=log[tripScrubIndex];
  if(tripMarker && p.lat!=null) tripMarker.setLatLng([p.lat,p.lon]);
  const frac=log.length>1 ? tripScrubIndex/(log.length-1) : 0;
  TRIP_PARAMS.forEach(tp=>{
    const val=tp.get(p);
    const valEl=document.getElementById('tripVal-'+tp.key);
    if(valEl) valEl.textContent=(val==null)?'—':val.toFixed(tp.dec);
    const lineEl=document.getElementById('tripLine-'+tp.key);
    if(lineEl) lineEl.style.left=(frac*100)+'%';
  });
  const fillEl=document.getElementById('tripScrubFill');
  const thumbEl=document.getElementById('tripScrubThumb');
  if(fillEl) fillEl.style.width=(frac*100)+'%';
  if(thumbEl) thumbEl.style.left=(frac*100)+'%';
  const t0=log[0].t, t1=log[log.length-1].t;
  const elapsed=(p.t!=null && t0!=null)?(p.t-t0)/1000:tripScrubIndex;
  const total=(t1!=null && t0!=null)?(t1-t0)/1000:log.length-1;
  const fmtDur=s=>{ s=Math.round(Math.max(0,s)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
    const pad=n=>String(n).padStart(2,'0');
    return h>0 ? h+':'+pad(m)+':'+pad(sec) : pad(m)+':'+pad(sec); };
  const timeEl=document.getElementById('tripScrubTime');
  if(timeEl) timeEl.textContent=fmtDur(elapsed)+' / '+fmtDur(total);
}

// ── Відтворення поїздки в часі (1 точка логу = 1 реальна секунда × швидкість) ──
function toggleTripPlay(){
  const btn=document.getElementById('tripPlayBtn');
  const log=tripViewCurrentLog;
  if(tripPlaying){
    tripPlaying=false; clearInterval(tripPlayTimer); tripPlayTimer=null;
    if(btn) btn.textContent='▶';
    return;
  }
  if(!log || !log.length) return;
  if(tripScrubIndex>=log.length-1) tripScrubIndex=0;
  tripPlaying=true; if(btn) btn.textContent='⏸';
  const speedSel=document.getElementById('tripSpeedSel');
  const speed=speedSel?(parseInt(speedSel.value)||10):10;
  tripPlayTimer=setInterval(()=>{
    if(tripScrubIndex>=log.length-1){ toggleTripPlay(); return; }
    seekTripTo(tripScrubIndex+1);
  }, 1000/speed);
}

}

/* ── СЕНСОРИ ТЕЛЕФОНУ: G-СИЛА ТА КУТ НАХИЛУ ──
   Це фундамент під майбутню детекцію падіння (окрема задача) — зараз лише
   рахуємо і показуємо два числа. G-сила: довжина вектора прискорення
   (з гравітацією) поділена на 9.81 — на місці ≈1G, зростає при
   розгоні/гальмуванні/в поворотах. Кут нахилу: кут між ПОТОЧНИМ вектором
   гравітації і вектором, зафіксованим під час калібрування (коли мотоцикл
   стоїть вертикально) — так має сенс НЕЗАЛЕЖНО від того, під яким кутом і
   як саме закріплений телефон на кермі. Знак (ліво/право) свідомо НЕ
   рахуємо — для тесту порогів (напр. 80°) достатньо модуля кута. */
/* ── КУТ НАХИЛУ: deviceorientation (beta/gamma), БЕЗ КАЛІБРУВАННЯ ──
   Замінено на набагато простіший і перевірений робочий підхід: замість
   інтеграції сирого гіроскопа (rotationRate) і власного комплементарного
   фільтра з ручним калібруванням двох векторів — беремо ГОТОВІ, вже
   об'єднані ОС кути orientation.beta/gamma. Це кути АБСОЛЮТНОГО нахилу
   відносно гравітації (і частково магнітометра), тому вони НЕ дрейфують і
   НЕ "просочують" yaw (обертання навколо вертикалі) в roll так, як це
   робив сирий rotationRate.gamma — саме це давало фальшиві ~50° при
   простому оберті на місці зі старим підходом. Ніякого калібрування
   більше не потрібно.
   Портрет: roll = gamma. Альбомний режим: roll = ±beta, залежно від того,
   в який бік повернутий телефон (window.orientation). Знак у плитці не
   показуємо (просимо тільки модуль) — але зберігаємо кут ЗІ ЗНАКОМ у
   V.LeanSigned для майбутнього Trip Log/GPX (розділ 10.1 бази знань).
   Просте експоненційне згладжування (0.85/0.15) — не комплементарний
   фільтр, бо джерело вже абсолютне й не потребує гіроскопа для корекції
   дрейфу. */
let _leanFilt = 0;              // згладжений кут (зі знаком, як віддає ОС)
let motionPermGranted = false;
let _motionListenerActive = false;
let _lastMotionTs = 0;
// ПОВЕРНУТО до чистого авто-визначення орієнтації (без ручного
// перемикача/локу). Причина: датчик кута нахилу МУСИТЬ читати ту вісь
// (beta чи gamma), що відповідає ФАКТИЧНІЙ фізичній орієнтації телефону —
// ручний "лок" примушував це число завжди бути одним і тим самим,
// незалежно від того, як телефон РЕАЛЬНО повернутий, тож кут рахувався
// неправильно щоразу, коли фактична орієнтація не збігалася з обраною.
// Заблокувати саму системну оболонку iOS з веб-сторінки все одно
// неможливо (platform limitation), тож сенс "локу" сторінки без цього
// був сумнівний — а шкода для сенсора реальна.
function computeIsLandscape(){
  return window.innerWidth > window.innerHeight;
}
let _isLandscape = computeIsLandscape();
window.addEventListener('resize', ()=>{ _isLandscape = computeIsLandscape(); });

function needsMotionPermission(){
  return typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';
}
function needsOrientationPermission(){
  return typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
}

async function requestMotionPermission(){
  // На iOS/Bluefy Motion (G-сила) і Orientation (кут нахилу) — ДВІ окремі
  // дозвільні API, хоч і активуються одним тапом користувача.
  let motionOk = true, orientOk = true;
  if(needsMotionPermission()){
    try{ motionOk = (await DeviceMotionEvent.requestPermission()) === 'granted'; }
    catch(e){ motionOk = false; }
  }
  if(needsOrientationPermission()){
    try{ orientOk = (await DeviceOrientationEvent.requestPermission()) === 'granted'; }
    catch(e){ orientOk = false; }
  }
  if(!motionOk && !orientOk){ sht('Доступ до датчиків відхилено'); return false; }
  motionPermGranted = true;
  startMotionSensors();
  return true;
}

function startMotionSensors(){
  if(_motionListenerActive) return;
  _motionListenerActive=true;
  window.addEventListener('devicemotion', onMotion);          // G-сила
  window.addEventListener('deviceorientation', onOrientation); // Кут нахилу
}

let _gforceRaw = 1; // сира магнітуда (≈1 у стані спокою через гравітацію) — саме її використовує детекція падіння (пороги нижче каліброві на ЦЕ число, не міняти)
function onMotion(e){
  const g=e.accelerationIncludingGravity;
  if(!g || g.x===null || g.x===undefined) return;
  const now=Date.now();
  const mag=Math.sqrt(g.x*g.x+g.y*g.y+g.z*g.z);
  if(now-_lastMotionTs>=150){
    _lastMotionTs=now;
    _gforceRaw = mag/9.81;
    // Чисто візуальна корекція для спостерігача: у стані спокою фізично
    // завжди ≈1G (гравітація), але людині зрозуміліше бачити "0" у спокої
    // й відхилення від нуля при прискоренні/гальмуванні — тому в ПЛИТЦІ
    // показуємо (сира магнітуда − 1), а не саму магнітуду. Детекція
    // падіння нижче так само рахує від СИРОЇ величини (_gforceRaw), її
    // пороги не міняються.
    V.Gforce = (_gforceRaw - 1).toFixed(2);
  }
}

let _leanZeroOffset = 0; // "нуль" кута — точка відліку, яку встановлює тап по плитці (скидання)
let _lastRawRoll = 0;    // останнє СИРЕ (нефільтроване) значення — потрібне, щоб скидання ловило поточну позицію, а не застарілу

function onOrientation(e){
  if(e.beta===null || e.beta===undefined || e.gamma===null || e.gamma===undefined) return;
  let targetRoll;
  if(_isLandscape){
    const orientationAngle = window.orientation || (screen.orientation && screen.orientation.angle) || 0;
    // Знак підтверджено робочим у версії Gemini (тестовий кутомір) — наша
    // попередня спроба "виправити" його (інвертувавши) була помилковою.
    targetRoll = orientationAngle < 0 ? e.beta : -e.beta;
  } else {
    targetRoll = e.gamma;
  }
  _lastRawRoll = targetRoll;
  // КРИТИЧНО: у альбомній орієнтації "рівний" телефон (лежить майже плоско,
  // як і кріплення на мотоциклі) від природи дає beta близько ±90° — це
  // особливість системи кутів deviceorientation, не "залипання" датчика.
  // Через це клемп ±90 нижче постійно впирався в межу. Віднімаємо
  // _leanZeroOffset (встановлюється тапом по плитці — розділ нижче), щоб
  // рахувати кут ВІДНОСНО реального нуля, а не сирого нуля датчика.
  const adjustedRoll = targetRoll - _leanZeroOffset;
  _leanFilt = (0.85*_leanFilt) + (0.15*adjustedRoll);
  const clamped = Math.max(-90, Math.min(90, _leanFilt));
  V.LeanSigned = Math.round(clamped); // зі знаком — для майбутнього Trip Log
  V.Lean = Math.abs(Math.round(clamped)); // без знаку — це і показує плитка
  ud(); ca();
}

// Тап по плитці кута нахилу: перший раз — вмикає дозволи на датчики. Якщо
// дозвіл уже є — це СКИДАННЯ (розділ вище): запам'ятовує поточну сиру
// позицію як нуль. Тримай мотоцикл вертикально й тапни, якщо кут "застряг"
// або показує щось відмінне від 0 у спокої.
async function onLeanTileTap(){
  if(!motionPermGranted){
    const ok = await requestMotionPermission();
    if(ok) sht('Датчики увімкнено — кут нахилу активний');
    return;
  }
  _leanZeroOffset = _lastRawRoll;
  _leanFilt = 0;
  V.LeanSigned = 0; V.Lean = 0; ud(); ca();
  sht('Кут нахилу скинуто на 0');
}

// Android/десктоп не потребують явного дозволу — стартуємо одразу.
// iOS (Bluefy) вимагає тап користувача — тап по плитці кута нахилу.
try{
  if(!needsMotionPermission() && !needsOrientationPermission()){
    motionPermGranted=true;
    startMotionSensors();
  }
}catch(e){ console.error('motion auto-start failed:',e); }

/* ── ДЕТЕКТОР ПАДІННЯ (поки тільки СПОСТЕРЕЖЕННЯ, без сирени/SMS) ──
   Це навмисно найпростіший можливий крок: просто показуємо toast + пишемо
   в консоль, коли тригер спрацював, щоб ти міг покататись і подивитись, чи
   нема хибних спрацювань на реальних вибоїнах/гальмуванні/поворотах,
   ПЕРЕД тим як додавати сирену/countdown/відправку SMS. Керується тим самим
   вимикачем AL.Fall_enabled з Налаштування → СИГНАЛИ.
   Два незалежні тригери:
   1. tipover — МОДУЛЬ кута нахилу (Math.abs, бо кут тепер зі знаком
      ліво/право) тримається >80° довше 3с. НЕ залежить від BLE/RPM
      навмисно — BLE-модуль може не пережити реальний удар.
   2. gspike — ДВОЕТАПНА перевірка. Одинокий сплеск G — поганий індикатор:
      кочка на дорозі дає такий самий різкий стрибок (заміряно >4G на
      реальних кочках), як і справжній удар. Різниця з'являється ПІСЛЯ
      сплеску: кочка — кут одразу повертається до норми; падіння — кут
      лишається аномальним ще через кілька секунд. Тому сплеск лише
      "кандидат", підтверджуємо через FALL_CONFIRM_WINDOW_MS. */
let _leanOverSince = null;
let _lastTipoverLogTs = 0;
let _lastGSpikeLogTs = 0;
let _pendingGSpike = null; // {ts, g} — кандидат на удар, чекає підтвердження
const FALL_LEAN_HOLD_MS = 3000;
const FALL_CONFIRM_WINDOW_MS = 2500; // скільки чекати після сплеску, щоб перевірити кут
const FALL_CONFIRM_LEAN_DEG = 45;    // кут, який має ЛИШИТИСЬ, щоб зарахувати як падіння (не кочку)
const FALL_LOG_COOLDOWN_MS = 8000; // не спамити toast на кожен цикл, поки умова тримається
// Позначка для GPX-лога поїздки — заповнюється тут, зчитується і одразу
// скидається в tripPushPoint(), щоб зберегти момент спрацювання тригера
// (для підбору порогу G-сили після поїздки, дивлячись у TripViewer).
let _fallLogTag = '';

// GPS-фільтр: тригер зараховуємо лише якщо швидкість вже впала нижче порогу
// (мопед реально зупинився/ковзає, а не просто наїхав на кочку на ходу).
// Якщо GPS-фіксу немає (V.GPS === '--' чи NaN), фільтр ПРОПУСКАЄМО (не блокуємо
// детекцію) — інакше без GPS функція взагалі не спрацює.
function fallSpeedGateOk(){
  const spd = parseFloat(V.GPS);
  if(isNaN(spd)) return true;
  return spd < (AL.Fall_speed_kmh||3);
}

function logFallEvent(type, detail){
  const ts = new Date().toLocaleTimeString('uk-UA', {hour12:false});
  console.log(`[ПАДІННЯ-ТЕСТ] ${ts} ${type}: ${detail}`);
  sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Тест падіння: ' + detail);
  _fallLogTag = type;
}

setInterval(()=>{
  // ТИМЧАСОВО без вимоги bConn — користувач тестує детекцію окремо від
  // мопеда (вдома, без Bluetooth). Коли тестування завершиться, варто
  // повернути гейт на bConn, інакше кожен різкий рух телефону поза поїздкою
  // (кинув на диван, впустив) даватиме хибний toast.
  if(!AL.Fall_enabled) { _leanOverSince = null; _pendingGSpike = null; return; }

  const leanAbs = typeof V.Lean === 'number' ? Math.abs(V.Lean) : null;
  const leanDeg = AL.Fall_lean_deg||50;

  // Тригер 1: тривалий кут нахилу (незалежно від сторони)
  if(leanAbs !== null){
    if(leanAbs > leanDeg){
      if(_leanOverSince === null) _leanOverSince = Date.now();
      else if(Date.now() - _leanOverSince > FALL_LEAN_HOLD_MS && Date.now() - _lastTipoverLogTs > FALL_LOG_COOLDOWN_MS && fallSpeedGateOk()){
        logFallEvent('tipover', `кут ${V.Lean}° тримається понад 3с`);
        _lastTipoverLogTs = Date.now();
      }
    } else {
      _leanOverSince = null;
    }
  }

  // Тригер 2: сплеск G-сили — ЛИШЕ кандидат, чекаємо підтвердження кутом
  // Використовуємо СИРУ магнітуду (_gforceRaw), не V.Gforce — останній
  // тепер зсунутий на -1 чисто для відображення в плитці (розділ вище).
  const g = _gforceRaw;
  if(_pendingGSpike === null && !isNaN(g) && g > (AL.Fall_gforce||2.2)){
    _pendingGSpike = { ts: Date.now(), g };
  }
  if(_pendingGSpike !== null){
    const elapsed = Date.now() - _pendingGSpike.ts;
    if(elapsed >= FALL_CONFIRM_WINDOW_MS){
      if(leanAbs !== null && leanAbs > FALL_CONFIRM_LEAN_DEG && Date.now() - _lastGSpikeLogTs > FALL_LOG_COOLDOWN_MS && fallSpeedGateOk()){
        logFallEvent('gspike-confirmed', `сплеск ${_pendingGSpike.g}G, кут через 2.5с все ще ${V.Lean}°`);
        _lastGSpikeLogTs = Date.now();
      }
      // Інакше — це була кочка (кут повернувся до норми): просто ігноруємо, без toast.
      _pendingGSpike = null;
    }
  }
}, 300);

/* ══════════════════════════════════════════════════════════════════════
   BLE ПІДКЛЮЧЕННЯ/ПЕРЕПІДКЛЮЧЕННЯ — єдина точка входу requestConnect()
   ══════════════════════════════════════════════════════════════════════
   РЕФАКТОРИНГ: раніше було 4 окремі місця з майже однаковим кодом
   підключення (initialConnect/quickReconnect/foregroundReconnectNow/
   onUnexpectedDisconnect-цикл) — звідси й race condition між ними. Тепер
   УСІ спроби підключення (клік, visibilitychange, автоцикл, перший вибір
   пристрою) йдуть через requestConnect(reason), захищений м'ютексом
   isConnecting. Паралельний виклик або ігнорується, або (якщо це прямий
   клік користувача) форсує "жорсткий" скид застряглої спроби. */
let bDev=null,bChr=null,bConn=false,userDisconnected=false;
let isConnecting=false;           // м'ютекс: лише ОДНА спроба підключення одночасно
let _connectingSince=0; // 25.08.2026: коли isConnecting стало true — для самозахисту в циклі ретраю нижче (якщо застрягло, а не просто триває)
let currentConnectAbort=null;     // AbortController поточної спроби (для форс-скасування)
let pauseTimestamp=null;          // коли додаток пішов у фон — для детекції "сну" iOS
const SLEEP_THRESHOLD_MS=5000;    // довше цього у фоні → BLE-стек вважаємо гарантовано "зомбі"
const CONNECT_TIMEOUT_MS=4000;

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
// Той самий sleep, але його можна "розбудити" достроково (kickReconnectNow) —
// потрібно для швидкого тапу під час автоперепідключення: замість очікування
// повної паузи (1.5с/5с) одразу пробуємо підключитись ще раз.
let _reconnectKick=null;
function interruptibleSleep(ms){
  return new Promise(resolve=>{
    const t=setTimeout(()=>{ _reconnectKick=null; resolve(); }, ms);
    _reconnectKick=()=>{ clearTimeout(t); resolve(); };
  });
}
function kickReconnectNow(){
  if(_reconnectKick){ const k=_reconnectKick; _reconnectKick=null; k(); }
}

// КРИТИЧНО: bDev.gatt.connect() інколи "зависає" назавжди — не резолвиться
// і не падає з помилкою (типово, коли пристрій поза зоною досяжності саме
// в момент виклику, або BLE-стек iOS у "зомбі"-стані після сну). Web
// Bluetooth не підтримує справжнє скасування такого виклику на рівні ОС —
// AbortSignal тут не зупиняє сам gatt.connect(), а лише дозволяє нам
// ІГНОРУВАТИ його результат, якщо тим часом уже стартувала нова, свіжіша
// спроба (signal.aborted). Тобто застрягла обіцянка може колись сама
// резолвитись у фоні — але ми просто не діємо на її основі.
function withAbortTimeout(promise, ms, signal){
  return new Promise((resolve,reject)=>{
    const t=setTimeout(()=>reject(new Error('timeout')), ms);
    const onAbort=()=>{ clearTimeout(t); reject(new Error('aborted')); };
    if(signal){ if(signal.aborted){ onAbort(); return; } signal.addEventListener('abort', onAbort, {once:true}); }
    promise.then(
      v=>{ clearTimeout(t); if(!signal||!signal.aborted) resolve(v); },
      e=>{ clearTimeout(t); if(!signal||!signal.aborted) reject(e); }
    );
  });
}

// ── Примусове "жорстке" очищення стану ──
// Викликається (а) при поверненні з довгого сну у фоні (детекція нижче) і
// (б) коли юзер тисне Connect ПОКИ вже триває застрягла спроба (User Intent
// Override) — в обох випадках старі GATT-посилання й прапорці вважаються
// недійсними, незалежно від того, що там усередині насправді думає iOS.
function forceHardResetState(){
  isConnecting=false;
  if(currentConnectAbort){ try{ currentConnectAbort.abort(); }catch(e){} currentConnectAbort=null; }
  bConn=false;
  if(_watchdogInt){ clearInterval(_watchdogInt); _watchdogInt=null; }
  stopAlert();
  cancelAutoTripStart();
  if(bChr){ try{ bChr.removeEventListener('characteristicvaluechanged', onData); }catch(e){} }
  bChr=null;
  if(bDev && bDev.gatt && bDev.gatt.connected){ try{ bDev.gatt.disconnect(); }catch(e){} }
  Object.keys(V).forEach(k=>V[k]=(k==='RPM'?0:'--')); ud();
}

]);

const CHUNK = 20;
// 25.08.2026: КРИТИЧНИЙ фікс "вічно рожевого/бурштинового 'підключається'".
// bChr.writeValue() інколи зависає НАЗАВЖДИ на iOS — той самий відомий
// ризик, що вже описаний вище для bDev.gatt.connect() (звідси й
// withAbortTimeout там), просто раніше НІХТО не захищав ще й запис команд.
// Якщо один-єдиний запис із 9 команд initSession() зависав без відповіді —
// весь await initSession() чекав НАЗАВЖДИ, залишаючи кнопку на "🔄
// Ініціалізація ECU…" вічно (try{}catch(e){} тут ловить лише РЕАЛЬНІ
// помилки, не вічне очікування, яке ніколи не resolve/reject). Тепер кожен
// запис має власний таймаут — якщо не відповів за 3с, sendCmd просто йде
// далі (як і раніше, мовчки ковтає помилку — не міняємо контракт "sendCmd
// ніколи не кидає виняток" для інших викликів деінде в коді), але сама
// послідовність initSession() гарантовано завершується за СКІНЧЕННИЙ час,
// а не висить вічно.
function writeWithTimeout(cmd, ms){
  return new Promise((resolve, reject)=>{
    let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; reject(new Error('write-timeout')); } }, ms);
    bChr.writeValue(cmd).then(
      v=>{ if(!done){ done=true; clearTimeout(t); resolve(v); } },
      e=>{ if(!done){ done=true; clearTimeout(t); reject(e); } }
    );
  });
}
async function sendCmd(cmd){
  if(!bChr||!bConn){ console.log('[ble] sendCmd пропущено: bChr='+(!!bChr)+' bConn='+bConn); return false; }
  try{
    if(cmd.length <= CHUNK){
      await writeWithTimeout(cmd, 3000);
    } else {
      for(let i=0;i<cmd.length;i+=CHUNK){
        const chunk = cmd.slice(i, i+CHUNK);
        await writeWithTimeout(chunk, 3000);
        await sleep(3);
      }
    }
    return true;
  }catch(e){
    console.warn('[ble] sendCmd: запис не відповів вчасно (мабуть, зависла BLE-транзакція) —', e && e.message);
    return false;
  }
}

async function initSession(){

  // помилку — requestConnect() підхопить це у своєму catch і чесно піде на
  // повторну спробу (вже перевірений scheduleBackgroundRetryLoop), замість
  // фальшивого "успіху".
  console.log('[ble] крок 5/5: initSession() старт (9 команд, ~4.6с)');
  let failures=0;
  if(!(await sendCmd(CMD_ATSECU))) failures++;   await sleep(103);
  if(!(await sendCmd(CMD_PING)))    failures++;   await sleep(13);
  if(!(await sendCmd(CMD_PING)))    failures++;   await sleep(13);
  if(!(await sendCmd(CMD_PING)))    failures++;   await sleep(13);
  if(!(await sendCmd(CMD_PING)))    failures++;   await sleep(13);
  if(!(await sendCmd(CMD_ZERO)))    failures++;   await sleep(115);
  if(!(await sendCmd(CMD_FIRMWARE)))failures++;   await sleep(75);
  if(!(await sendCmd(CMD_UNK50)))   failures++;   await sleep(3800);
  if(!(await sendCmd(CMD_SUBSCRIBE)))failures++;  await sleep(500);
  console.log('[ble] крок 5/5: initSession() завершено, невдалих команд: '+failures+'/9');
  if(failures>=5){
    throw new Error('initSession: забагато невдалих записів ('+failures+'/9) — з\'єднання, найімовірніше, мертве');

function parse20Byte(pkt){
  if(pkt.length !== 20) return false;
  if(pkt[0] === 0xfc) return false;
  const teng = pkt[6] - 28;
  const rpm  = (pkt[2]<<8)|pkt[3];
  const volt = pkt[5] / 10.0;
  const ap   = pkt[11];
  // T_Air: НОВА гіпотеза (заміна pkt[10]/2). Підтверджено сьогодні на
  // працюючому двигуні, потребує ще перевірки в різних умовах.
  const tair = pkt[0] - 28;
  const tpsRaw = pkt[4];
  let matched = false;
  if(teng > -10 && teng < 150){ V.T_Eng = Math.round(teng); matched = true; }
  if(rpm===0 || (rpm > 200 && rpm < 15000)){ V.RPM = rpm; matched = true; } // 25.08.2026: rpm===0 додано окремо — раніше "по-справжньому заглушений двигун" (RPM=0) НІКОЛИ не проходив у V.RPM (умова вимагала >200), тож на екрані назавжди зависала ОСТАННЯ реальна ненульова цифра оборотів навіть після зупинки двигуна — виглядало, ніби застосунок "не розуміє", що двигун вимкнено. Зона 1-200 і далі відсіюється як можливий шум/глітч.
  if(volt > 9.5 && volt < 16){ V.Volt = volt.toFixed(1); matched = true; }
  if(ap >= 0 && ap <= 150){ V.MAP = ap; matched = true; }
  if(tair > -20 && tair < 80){ V.T_Air = Math.round(tair*10)/10; matched = true; }
  if(tpsRaw >= 0 && tpsRaw <= 255){
    if(tpsCalibrating){
      // Під час калібрування анти-глітч фільтр НЕ застосовуємо взагалі —
      // саме він і був причиною стрибків (див. коментар біля оголошення
      // tpsCalibrating вище). Натомість усереднюємо останні кілька байтів
      // для стабільного, надійного значення на екрані калібрування.
      _tpsRawLast = tpsRaw;
      _tpsCalBuffer.push(tpsRaw);
      if(_tpsCalBuffer.length > TPS_CAL_BUFFER_SIZE) _tpsCalBuffer.shift();
      matched = true;
    } else {
      // Захист від глітчів "сирого" пакета одразу після (пере)підключення:
      // на холостому ході (низький RPM) TPS фізично не може стрибати до
      // максимуму. У реальному лозі саме так виглядав баг — RPM холостий,
      // а raw TPS ~235-239 (майже максимум байта/калібрування). Якщо бачимо
      // цю комбінацію — ігноруємо цей конкретний TPS-байт, лишаємо попереднє
      // (справжнє) значення замість запису фантомного 100%.
      const rpmNow = (rpm===0 || (rpm>200 && rpm<15000)) ? rpm : (typeof V.RPM==='number'?V.RPM:null); // 25.08.2026: та сама поправка, що й вище — rpm===0 (двигун дійсно заглушений) тепер теж рахується "свіжим", а не відкидається на користь застарілого V.RPM
      const isIdle = rpmNow !== null && rpmNow < 2000;
      const rawNearMax = (TC.min!==null && TC.max!==null && TC.max!==TC.min)
        ? (tpsRaw >= TC.max-5) : (tpsRaw >= 230);
      if(isIdle && rawNearMax){
        // глітч — пропускаємо, V.TPS лишається як був
      } else {
        _tpsRawLast = tpsRaw;
        if(TC.min !== null && TC.max !== null && TC.max !== TC.min){
          let pct = (tpsRaw - TC.min) / (TC.max - TC.min) * 100;
          V.TPS = Math.round(Math.max(0, Math.min(100, pct))*10)/10;
        } else { V.TPS = tpsRaw; }
        matched = true;
      }
    }
  }
  return matched;
}

// ── ПАРАЛЕЛЬНИЙ 19-БАЙТНИЙ ПАКЕТ ──
// Inj_Rate: byte[7] цього пакета (НЕ 20-байтного!) × 0.39 + зсув.
// Початкове калібрування (raw=11→4.69, raw=12→5.08) виявилось зміщеним
// рівно на один крок: живе порівняння з офіційним додатком підтвердило,
// що raw=12 відповідає 4.69 (а не 5.08, як давала стара формула).
// Тобто крок 0.39мс/біт лишається правильним, а точку відліку зсунуто на
// один крок назад: 0.40 − 0.39 = 0.01. Перевірка: raw=12×0.39+0.01=4.69 ✓.
// Попередні кандидати з 20-байтного пакета (pkt[9], pkt[1], pkt[11]) були
// або спростовані, або занадто шумні.
function parse19Byte(pkt){
  if(pkt.length !== 19) return false;
  const injRaw = pkt[7];
  if(injRaw >= 0 && injRaw <= 255){
    V.Inj_Rate = (injRaw*0.39+0.01).toFixed(2);
    return true;
  }
  return false;
}

function onData(e){
  _lastPacketTs=Date.now();
  const b=new Uint8Array(e.target.value.buffer);
  // 25.08.2026: раніше тут просто викликали parse19Byte/parse20Byte, не
  // дивлячись на результат — _lastPacketTs (загальний watchdog) оновлювався
  // на БУДЬ-ЯКИЙ пакет незалежно від типу. Але це два РІЗНІ потоки: 19-байтний
  // несе лише Inj_Rate, 20-байтний — усе інше (RPM, T_Eng, Volt, MAP, T_Air,
  // TPS). Якщо 20-байтні пакети зникають, а 19-байтні й далі йдуть —
  // з'єднання виглядає живим (індикатор зелений), а RPM/T_Eng просто
  // зависають назавжди без жодного тригера на перепідключення — саме той
  // "обрив, але показує що з'єднання є" з опису користувача. Тепер окремо
  // рахуємо свіжість САМЕ 20-байтних (двигунних) даних.
  if(b.length===19) parse19Byte(b);
  else if(parse20Byte(b)) _lastEnginePacketTs=Date.now();
  ud();ca();
}

let _lastPacketTs=0;
let _lastEnginePacketTs=0; // 25.08.2026: окремо від _lastPacketTs — свіжість САМЕ 20-байтних (RPM/T_Eng/...) пакетів
const WATCHDOG_MS=4000;
const ENGINE_WATCHDOG_MS=7000; // трохи більший запас, ніж загальний — щоб поодинокий пропущений/відфільтрований 20-байтний пакет не спричиняв зайве перепідключення
let _watchdogInt=null;
function armWatchdog(){
  _lastPacketTs=Date.now();
  _lastEnginePacketTs=Date.now(); // старт "з чистого аркуша" при кожному (пере)підключенні — не вимагаємо миттєво першого пакета
  if(_watchdogInt) clearInterval(_watchdogInt);
  _watchdogInt=setInterval(()=>{
    if(userDisconnected || isConnecting) return; // 25.08.2026: свідомо без логу — це щосекунди, спамило б консоль; якщо підозра саме на цю гілку, дивись isConnecting/userDisconnected окремо
    if(!bConn) {
      clearInterval(_watchdogInt);
      _watchdogInt = null;
      return;
    }
    const now=Date.now();
    // 25.08.2026: ДВІ незалежні умови "мертвого" з'єднання — (а) взагалі
    // немає жодних пакетів (як і раніше), (б) є пакети, але немає ВАЛІДНИХ
    // 20-байтних (двигунних) — саме сценарій "з'єднання зелене, а
    // температури/обертів немає".
    if(now-_lastPacketTs>WATCHDOG_MS || now-_lastEnginePacketTs>ENGINE_WATCHDOG_MS){
      if(bDev && bDev.gatt && bDev.gatt.connected){
        try{ bDev.gatt.disconnect(); }catch(e){} // подія gattserverdisconnected сама підхопить scheduleBackgroundRetryLoop()
      } else {
        // 25.08.2026: КРИТИЧНИЙ фікс — bDev.gatt.connected вже false (напр.
        // сам iOS/Bluefy щойно показав системний попап "bLink3_151A
        // вимкнено" при реальному обриві живлення ECU), але подія
        // 'gattserverdisconnected' з якоїсь причини НЕ дійшла до нашого
        // listener'а — для апаратних обривів живлення периферії (на
        // відміну від явного виклику .disconnect()) це, вочевидь, не
        // завжди надійно спрацьовує в Bluefy. Стара умова вище просто
        // нічого не робила в цьому випадку (bDev.gatt.connected===false
        // проваблював if), тож bConn лишався true НАЗАВЖДИ — застосунок
        // "зависав" на зеленому "підключено" без жодної спроби
        // перепідключення, і після повторного увімкнення двигуна вже не
        // міг сам відновитись (думав, що й так підключений). Тепер у
        // цьому випадку самі напряму викликаємо той самий відновлювальний
        // шлях (onUnexpectedDisconnect), не покладаючись на подію, яка,
        // можливо, ніколи не прийде.
        onUnexpectedDisconnect();
      }
    }
  },1000);
}

/* ── WAKE LOCK + FULLSCREEN при підключенні ──
   Wake Lock API підтримується в iOS Safari 16.4+ (працює, ПОКИ вкладка видима).
   Важливо: коли вкладка йде у фон (наприклад, ти перемкнувся на Google Maps,
   а наш дашборд лишився тільки як плаваюче PiP-вікно), iOS сам автоматично
   знімає wake lock — це обмеження самої специфікації, обійти його неможливо.
   Тобто це вбереже екран від сну, ПОКИ ти дивишся саме на наш дашборд,
   але не гарантує цього під час навігації в іншому додатку з активним PiP. */
let _wakeLock=null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release',()=>{_wakeLock=null;});
    }
  }catch(e){}
}
/* ── ПРЯМА СПРОБА ПЕРЕПІДКЛЮЧЕННЯ ПРИ ПОВЕРНЕННІ НА ПЕРЕДНІЙ ПЛАН ──
   ДЕТЕКЦІЯ СНУ iOS: якщо додаток пробув у фоні понад SLEEP_THRESHOLD_MS —
   BLE-стек вважаємо гарантовано "зомбі" (gatt.connect()/getPrimaryService()
   могли зависнути без помилки й без проміса) і робимо forceHardResetState()
   ПЕРЕД новою спробою, а не сподіваємось, що стара якось сама розрулиться. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){
    pauseTimestamp=Date.now();
    pauseTripBackgroundIfNeeded();
    return;
  }
  // visible:
  resumeTripFromBackground();
  if(_wakeLock===null && bConn) requestWakeLock();
  // Аудіо-контекст теж може "заснути" разом з рештою сторінки у фоні —
  // відновлюємо його одразу, як тільки додаток знову видимий.
  if(audioCtx && audioCtx.state==='suspended'){ try{ audioCtx.resume(); }catch(e){} }
  // ПОВНОЕКРАННИЙ РЕЖИМ КАРТИ ПІСЛЯ СТРИБКА МІЖ ЗАСТОСУНКАМИ: поки Bluefy
  // був у фоні, реальні розміри viewport могли змінитись (напр. Safari/
  // Bluefy повертає власний хром на екран, поки згорнуто, а розкривається
  // назад уже з іншою висотою) — Leaflet цього не бачить сам (не отримує
  // resize, поки прихований) і кешує СТАРИЙ розмір контейнера, через що
  // після повернення карта може малюватись з сірими краями чи неправильним
  // центруванням, аж поки не смикнеш її вручну. invalidateSize() примусово
  // звіряє реальний розмір заново — робимо це для КОЖНОЇ активної плитки
  // карти (не тільки fullscreen), одним тіком після повернення видимості.
  Object.values(mapInstances).forEach(function(st){
    try{ st.map.invalidateSize(false); }catch(e){}
  });
  const hiddenForMs = pauseTimestamp ? (Date.now()-pauseTimestamp) : 0;
  pauseTimestamp=null;
  if(!userDisconnected && bDev && !bConn){
    if(hiddenForMs>SLEEP_THRESHOLD_MS){
      console.warn('[ble] застосунок був у фоні '+Math.round(hiddenForMs/1000)+'с — forceHardResetState() перед перепідключенням (BLE-стек iOS вважаємо зомбі)');
      forceHardResetState();
    }
    requestConnect('foreground');
  } else if(bConn){
    // З'єднання формально НЕ розривалось (bConn лишався true), поки додаток
    // був у фоні — але iOS міг тримати/затримувати BLE-нотифікації весь цей
    // час, і перший пакет, що прилетить одразу після повернення, теж буває
    // "сирим" (те саме залипання TPS=100%). Тому ставимо ту саму 10с-гвардію.
    armDataSettleGuard(10000);
  }
});

const btn=document.getElementById('cb');

// ══════════════════════════════════════════════════════════════════════
// requestConnect(reason) — ЄДИНА точка входу для БУДЬ-ЯКОЇ спроби
// підключення: 'initial' (перший вибір пристрою), 'user-click' (тап по
// кнопці), 'foreground' (повернення з фону), 'background-retry' (фоновий
// цикл ретраїв). Захищено м'ютексом isConnecting.
// ══════════════════════════════════════════════════════════════════════
async function requestConnect(reason){
  console.log('[ble] requestConnect('+reason+') — старт. bDev='+(bDev?('є, name='+bDev.name):'немає')+', isConnecting='+isConnecting+', bConn='+bConn);
  const bs=document.getElementById('bs');
  if(isConnecting){
    if(reason==='user-click'){
      // USER INTENT OVERRIDE: явний тап користувача важливіший за застряглу
      // фонову спробу — скасовуємо її (наскільки це взагалі можливо для
      // Web Bluetooth, див. коментар біля withAbortTimeout) і стартуємо
      // чисто з нуля.
      console.warn('[ble] requestConnect(user-click) під час isConnecting — forceHardResetState() і новий чистий конект');
      forceHardResetState();
    } else {
      console.log('[ble] requestConnect('+reason+') проігноровано — вже триває інша спроба');
      return;
    }
  }
  if(userDisconnected && reason==='background-retry') return; // явне відключення користувачем має пріоритет

  userDisconnected=false;
  isConnecting=true;
  _connectingSince=Date.now();
  const myAbort=new AbortController();
  currentConnectAbort=myAbort;
  btn.textContent='⏳ Підключення…'; btn.className='pill go';
  bs.textContent='Перепідключення…'; bs.className='pill err';

  try{
    if(!bDev){
      console.log('[ble] bDev відсутній — відкриваю системний пікер вибору пристрою');
      // Запит дозволу на гіроскоп/акселерометр — САМЕ ТУТ, на самому початку
      // тап-обробника Connect, поки жест користувача ще "свіжий" (iOS дозволяє
      // requestPermission() лише в межах прямого user-gesture).
      try{ await requestMotionPermission(); }catch(e){}
      bDev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'bLink'}],optionalServices:[SVC]});
      bDev.addEventListener('gattserverdisconnected', onUnexpectedDisconnect);
      console.log('[ble] пристрій обрано:', bDev.name);
    }
    console.log('[ble] крок 1/5: bDev.gatt.connect() — поточний gatt.connected='+(bDev.gatt&&bDev.gatt.connected));
    const srv=await withAbortTimeout(bDev.gatt.connect(), CONNECT_TIMEOUT_MS, myAbort.signal);
    console.log('[ble] крок 1/5: gatt.connect() ОК');
    if(myAbort.signal.aborted) throw new Error('aborted');
    // 25.08.2026: КРИТИЧНИЙ фікс "вічно висить на Підключається". Раніше
    // ЛИШЕ gatt.connect() мав захист по часу (CONNECT_TIMEOUT_MS) — три
    // наступні кроки (getPrimaryService/getCharacteristic/startNotifications)
    // не мали ЖОДНОГО таймауту, хоча це той самий крихкий BLE-стек iOS, що
    // й у gatt.connect() (звідси коментар про нього вище). Якщо будь-який
    // з них зависав без відповіді — весь процес підключення завмирав
    // НАЗАВЖДИ на кроці "Підключається", без переходу навіть до
    // "Ініціалізація ECU" — саме той симптом, з яким зіткнулись. Тепер
    // КОЖЕН крок має власний таймаут (4с) і виводить у тост, ЩО САМЕ не
