<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bluefy Strict Fullscreen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Блокуємо скролл повністю на рівні корневих елементів */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh; /* Використовуємо dynamic viewport */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    header {
      background: #1e1e1e;
      padding: 15px;
      text-align: center;
      border-bottom: 2px solid #00e676;
    }

    main {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      outline: none;
    }

    footer {
      background: #1e1e1e;
      padding: 15px;
      text-align: center;
      border-top: 2px solid #2196f3;
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <h3>Bluefy Fullscreen Test</h3>
    </header>

    <main>
      <p>Статус: <b id="status">Звичайний</b></p>
      <input type="text" id="input" placeholder="Натисни для клавіатури..." autocomplete="off">
    </main>

    <footer>
      <p>Низ екрана (Footer)</p>
    </footer>
  </div>

  <script>
    const input = document.getElementById('input');
    const status = document.getElementById('status');
    const app = document.getElementById('app');

    // Хак: Блокування автоматичного авто-скролу iOS WKWebView
    function preventIOSScroll() {
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
    }

    // Слухаємо VisualViewport
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        // Підганяємо висоту контейнера точно під реальний видимий розмір
        app.style.height = `${window.visualViewport.height}px`;
        preventIOSScroll();
      });

      window.visualViewport.addEventListener('scroll', preventIOSScroll);
    }

    // Подія фокусу
    input.addEventListener('focus', () => {
      status.textContent = "Клавіатура відкрита";
      
      // Серія примусових скидань скролу під час анімації виходу клавіатури
      let attempts = 0;
      const interval = setInterval(() => {
        preventIOSScroll();
        attempts++;
        if (attempts > 10) clearInterval(interval);
      }, 30);
    });

    input.addEventListener('blur', () => {
      status.textContent = "Звичайний";
      app.style.height = '100dvh';
      preventIOSScroll();
    });
  </script>
</body>
</html>
