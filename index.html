      const p=touchXY(e.touches[0]);
      // 25.08.2026: EMA-згладжування — див. великий коментар при оголошенні
      // smoothX/smoothY вище. Порівнюємо поріг і рахуємо дельту зі
      // ЗГЛАДЖЕНОЮ позицією, а не миттєвою "трясучою" p.x/p.y напряму.
      smoothX += (p.x-smoothX)*VIBRATION_SMOOTH_ALPHA;
      smoothY += (p.y-smoothY)*VIBRATION_SMOOTH_ALPHA;
      if(mode==='pending1'){
        // 25.08.2026: КРИТИЧНИЙ фікс "паразитного зсуву". Раніше тут був
        // просто `return;` без оновлення lastX/lastY — вони лишались
        // "заморожені" на позиції з самого touchstart (початок очікування
        // другого пальця). Поки рука природно трохи дрейфує, готуючись
        // поставити другий палець (300-500мс — цілком нормально), палець
        // №1 фізично зміщується на кілька-десять px. Коли режим зрештою
        // перемикався на 'pan' (по таймеру ЧИ щойно прийшов 2й палець і
        // щось пішло не так із self-heal), ПЕРШИЙ розрахунок dx/dy брав
        // різницю між ПОТОЧНОЮ позицією і ЗАСТАРІЛОЮ lastX/lastY —
        // тобто ввесь накопичений дрейф застосовувався ОДНИМ стрибком
        // саме в момент постановки другого пальця. Це і є "паразитний
        // зсув" — карта різко "смикалась" убік рівно тоді, коли мало б
        // початись чисте pinch-масштабування. Тепер lastX/lastY стежать
        // за пальцем НА ВСІХ етапах (навіть поки що не рухаючи карту) —
        // тому коли режим нарешті стає 'pan', перший dx/dy — це лише
        // ОСТАННІЙ малий крок, а не вся накопичена відстань.
        lastX=smoothX; lastY=smoothY;
        return; // ще чекаємо — не рухаємо карту, поки не спливла затримка (чи не прийшов 2й палець)
      }
      if(!dragConfirmed){
        if(Math.abs(smoothX-startX)<DRAG_THRESHOLD && Math.abs(smoothY-startY)<DRAG_THRESHOLD) return;
        dragConfirmed=true;
        st.navFollowPaused=true; // те саме, що раніше ставив 'dragstart' Leaflet — користувач сам відсунув карту
      }
      e.preventDefault();
      const dx=smoothX-lastX, dy=smoothY-lastY;
      const rot=rotateByHeading(dx,dy, st.heading||0);
      st.map.panBy([-rot.x,-rot.y], {animate:false, duration:0});
      lastX=smoothX; lastY=smoothY;
    } else if(mode==='pinch' && e.touches.length===2){
      e.preventDefault();
      const d=touchDist(e.touches[0],e.touches[1]);
      smoothPinchDist += (d-smoothPinchDist)*VIBRATION_SMOOTH_ALPHA; // 25.08.2026: те саме EMA — без цього вібрація змушувала масштаб дрібно "дихати"
      if(pinchStartDist>0){
        const newZoom=pinchStartZoom+Math.log2(smoothPinchDist/pinchStartDist);
        // 25.08.2026: ЯК У GOOGLE MAPS — якір рахуємо ЗАНОВО щокадру з
        // ПОТОЧНОЇ середини пальців, а не один раз на старті жесту. Раніше
        // фіксований якір ігнорував природний дрейф середини пальців під
        // час реального pinch (руки рідко тримають ідеально нерухомий
        // центр), тож карта "зісковзувала" вбік від пальців — це й
        // відчувалось як "починається рух карти" при постановці двох
        // пальців. Передаємо в setZoomAround одразу L.Point (контейнерні
        // пікселі), А НЕ latlng — так Leaflet НЕ робить зворотну
        // конвертацію container→latlng→container щокадру (це й спричиняло
        // колишнє "смикання", через яке якір раніше зафіксували один раз);
        // Point лишає лише ОДНЕ перетворення за кадр, тому дрейфу похибки
        // округлення тут більше немає, і карта водночас точно стежить за
        // пальцями.
        const mid=touchMid(e.touches[0],e.touches[1]);
        const cp=viewportPointToContainerPoint(mid.x,mid.y);
        st.map.setZoomAround(cp, newZoom, {animate:false});
      }
    }
  }, {passive:false});

  el.addEventListener('touchend', function(e){
    clearPanPending();
    if(e.touches.length===0){
      // 25.08.2026: власний синтез 'click' замість вбудованого Leaflet
      // Tap.js (див. коментар при L.map({tap:false,...}) вище). Чистий тап
      // = за весь жест НЕ було підтвердженого панорамування (dragConfirmed)
      // І не було pinch (gestureHadMultiTouch) — обидва прапорці вже точно
      // відстежуються нашим власним станом, тому це надійніше, ніж
      // покладатись на паралельну внутрішню евристику іншої бібліотеки.
      const wasTap = !dragConfirmed && !gestureHadMultiTouch;
      const tgt = e.changedTouches && e.changedTouches.length ? e.changedTouches[0].target : null;
      // КРИТИЧНО, два окремі виключення:
      // 1) Якщо палець відпустили НАД маркером/попапом/контролом Leaflet
      //    (камера, POI, кластер) — Leaflet сам вішає власний 'click' на
      //    конкретну DOM-іконку, і той спрацьовує від НАТИВНОГО click.
      // 2) Якщо відпустили НАД будь-якою з наших ВЛАСНИХ HTML-кнопок
      //    поверх карти (navCenterBtnEl/navSoundBtnEl/miniRerouteEl/...) —
      //    вони теж лежать усередині viewport (того самого el, на якому
      //    висить цей обробник), але це звичайні <div>/<button> ПОЗА
      //    Leaflet-контейнером (.leaflet-container), не частина карти.
      // В обох випадках — preventDefault() тут ЗЛАМАВ би нативний click,
      // потрібний власному onclick-обробнику маркера чи кнопки. Тому
      // синтетичний клік по карті шлемо ЛИШЕ якщо тап був усередині
      // .leaflet-container І не по маркеру/попапу/контролу.
      const insideLeafletMap = tgt && tgt.closest && tgt.closest('.leaflet-container');
      const isMarkerOrControl = tgt && tgt.closest && tgt.closest('.leaflet-marker-icon,.leaflet-interactive,.leaflet-popup,.leaflet-popup-pane,.leaflet-control');
      if(wasTap && insideLeafletMap && !isMarkerOrControl){
        // КРИТИЧНО: preventDefault() саме тут — інакше браузер сам згенерує
        // СПРАВЖНІЙ нативний 'click' одразу після touchend (стандартна
        // поведінка тач-інтерфейсів), і разом із нашим синтетичним 'click'
        // нижче один тап порахувався б ДВІЧІ (щойно tap:false вимкнув лише
        // Leaflet-івський синтез, але не нативний браузерний). preventDefault
        // на touchend — це офіційний спосіб скасувати той наступний
        // нативний click, тому listener нижче обов'язково {passive:false}.
        e.preventDefault();
        const t=e.changedTouches[0];
        const p=touchXY(t);
        const cp=viewportPointToContainerPoint(p.x,p.y);
        const latlng=st.map.containerPointToLatLng(cp);
        st.map.fire('click', {latlng:latlng, layerPoint:st.map.latLngToLayerPoint(latlng), containerPoint:cp, originalEvent:e});
      }
      mode=null; dragConfirmed=false; gestureHadMultiTouch=false;
    }
    else if(e.touches.length===1 && mode==='pinch'){
      // з двох пальців лишився один — продовжуємо панорамуванням із нової точки (без затримки — жест уже "в русі")
      mode='pan'; dragConfirmed=true;
      const p=touchXY(e.touches[0]);
      lastX=p.x; lastY=p.y;
    }
  }, {passive:false});
  el.addEventListener('touchcancel', function(){ clearPanPending(); mode=null; dragConfirmed=false; }, {passive:true});
}

function initLeafletMap(tileId, container, badge, viewport){
  if(mapInstances[tileId]) return; // вже ініціалізовано (напр. повторний render())
  if(typeof L==='undefined'){ container.textContent='Leaflet не завантажився (немає інтернету при першому запуску)'; return; }
  if(!HybridTileLayer){ container.textContent='Карта тимчасово недоступна (не вдалось ініціалізувати тайл-шар)'; return; }
  const startLat = _lastLat!=null ? _lastLat : 50.4501, startLon = _lastLon!=null ? _lastLon : 30.5234; // фолбек — Київ, якщо GPS ще не встиг спрацювати
  container.style.width='100%';container.style.height='100%'; // тимчасово, sizeRotatedMapContainer нижче виставить реальний квадрат
  const map = L.map(container, {
    zoomControl:false, attributionControl:false, doubleClickZoom:false, tap:false,
    zoom: MapCfg.std, center:[startLat,startLon]
  });
  // 21.08.2026: вимикаємо ВБУДОВАНЕ перетягування/pinch-zoom Leaflet —
  // воно оперує в екранних координатах контейнера, а контейнер (сам
  // `container`, тобто st.wrapEl) фізично повернутий через CSS (обертання
  // за курсом). Тому дотик "вгору" на екрані Leaflet сприймав як рух
  // "вгору" у СВОЇЙ (неповернутій) системі координат — різні напрями,
  // звідси "незручні жести". Замість цього — власний обробник нижче
  // (wireCustomMapGestures), який контробертає дотики так, щоб керування
  // завжди відчувалось природним, незалежно від візуального повороту.
  // 25.08.2026: `tap:false` у опціях L.map вище з тієї ж причини — власний
  // 'click' СИНТЕЗУЄМО САМІ в touchend нижче (wireCustomMapGestures), а
  // не покладаємось на вбудований Leaflet Tap.js. Причина: Tap.js слухає
  // ті самі touchstart/touchend НЕЗАЛЕЖНО від нашого обробника, і має
  // власну внутрішню логіку розпізнавання/затримки — саме це, ймовірно,
  // й спричиняло нестабільний подвійний тап (перший тап іноді "з'їдався"
  // внутрішньою логікою Tap.js ще до того, як наш лічильник tapBuf його
  // побачив). Тепер джерело 'click' — рівно ОДНЕ, повністю під нашим
  // контролем, синхронізоване з тим самим станом (dragConfirmed/pinch),
  // що вже й керує панорамуванням/зумом.
  map.dragging.disable();
  map.touchZoom.disable();
  L.DomEvent.disableScrollPropagation(viewport); // щоб жест на карті не скролив саму сторінку в Bluefy
  new HybridTileLayer({maxZoom:19, minZoom:2, onTileSource:src=>reportTileSource(st,src)}).addTo(map);
  const marker = L.circleMarker([startLat,startLon], {radius:7,color:'#fff',weight:2,fillColor:'#ff4d4d',fillOpacity:0.95}).addTo(map);

  // ── НАВІГАЦІЯ: HUD-картка (стрілка+відстань), банер відхилення від
  // маршруту, і кнопки (звук/центр/маршрут) — усі приховані (display:none),
  // показуються лише в повноекранному режимі.
  // ВАЖЛИВО: чіпляємо їх до `viewport` (.map-tile-viewport), а НЕ до
  // `container`/`wrap` (це САМ Leaflet-контейнер, .map-tile-inner) — той
  // розтягується у квадрат і обертається разом із курсом (sizeRotated-
  // MapContainer/applyMapTransform вище). Раніше елементи чіплялись саме
  // туди — тому "крутились і губились за текстурами" замість того, щоб
  // стабільно лежати поверх видимого, нерухомого вікна перегляду.
  const navHudEl=document.createElement('div');
  navHudEl.className='map-nav-hud map-nav-hud-left';
  navHudEl.id='navhud_'+tileId;
  navHudEl.innerHTML=
    '<div class="nav-hud-arrow-wrap"><svg viewBox="0 0 24 22" width="42" height="38" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+
    '<path id="navHudArrowPath_'+tileId+'" d="M 12 20 L 12 4 M 7 9 L 12 4 L 17 9"/></svg></div>'+
    '<div class="nav-hud-dist" id="navHudDist_'+tileId+'">---</div>';
  viewport.appendChild(navHudEl);
  wireCalibDrag(navHudEl);

  // Права картка — швидкість і температура двигуна. Дані РЕАЛЬНІ (не
  // заглушка): data-lid="GPS"/"T_Eng" підхоплюються тим самим генеричним
  // механізмом, що вже оновлює всі плитки дашборду (ud() вище проходить
  // по всіх [data-lid] і підставляє V[k] — нічого додатково писати не треба).
  const navHudRightEl=document.createElement('div');
  navHudRightEl.className='map-nav-hud map-nav-hud-right';
  navHudRightEl.id='navhudr_'+tileId;
  navHudRightEl.innerHTML=
    '<div class="nav-hud-tblock"><div class="nav-hud-tlabel">км/год</div><div class="nav-hud-tval spd" data-lid="GPS">--</div></div>'+
    '<div class="nav-hud-tblock"><div class="nav-hud-tlabel">двигун</div><div class="nav-hud-tval tmp"><span data-lid="T_Eng">--</span>°C</div></div>';
  viewport.appendChild(navHudRightEl);
  wireCalibDrag(navHudRightEl);

  const navOffEl=document.createElement('div');
  navOffEl.className='nav-hud-offroute';
  navOffEl.id='navHudOff_'+tileId;
  navOffEl.innerHTML='<span><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Відхилення від маршруту</span><button type="button" class="nav-reroute-btn" id="navRerouteBtn_'+tileId+'">🔁</button>';
  viewport.appendChild(navOffEl);
  // Ручний перерахунок — авто-перерахунок стається лише ОДИН раз, у момент
  // коли відхилення щойно виявлено; якщо потім проїхати ще далі, намальована
  // лінія лишається "старою" (до вже застарілої точки). Ця кнопка дозволяє
  // попросити свіжий перерахунок від ПОТОЧНОЇ позиції в будь-який момент,
  // не чекаючи знову втратити й повернутись на маршрут.
  navOffEl.querySelector('.nav-reroute-btn').addEventListener('click', e=>{
    e.stopPropagation();
    if(_lastLat==null || _lastLon==null || !mapRouteLatLngs) return;
    const rejoin=findMaxCutRejoinPoint([_lastLat,_lastLon], navProgressIndex);
    recalculateNavReroute([_lastLat,_lastLon], mapRouteLatLngs[rejoin.index]);
    rerouteAcknowledged=true;
    showOffRouteIndicators(false); // тапнули — ховаємо, з'явиться знову лише при новому відхиленні
    sht(rejoin.cutM>50 ? '🔁 Перераховую… зрізка ~'+Math.round(rejoin.cutM)+'м маршруту' : '🔁 Перераховую маршрут…');
  });

  // Міні-індикатор повороту — та сама інформація, що й у fullscreen HUD,
  // але маленька, для звичайної (не fullscreen) плитки на дашборді.
  // Ховається сама в enterMapFullscreen (там уже є велика картка).
  const turnMiniEl=document.createElement('div');
  turnMiniEl.className='map-tile-turn-mini';
  turnMiniEl.id='turnMini_'+tileId;
  turnMiniEl.innerHTML=
    '<div class="map-tile-turn-mini-arrow"><svg viewBox="0 0 24 22"><path id="turnMiniArrowPath_'+tileId+'" d="M 12 20 L 12 4 M 7 9 L 12 4 L 17 9"/></svg></div>'+
    '<div class="map-tile-turn-mini-dist" id="turnMiniDist_'+tileId+'">--</div>';
  viewport.appendChild(turnMiniEl);

  // Міні-бейдж "Відхилення" — та сама роль, що й navOffEl у fullscreen,
  // але для звичайної маленької плитки. Візуально "приклеєний" впритул під
  // показник повороту (той не ховається під час відхилення — просто
  // додається знизу, як друга секція тієї самої картки). ВЕСЬ бейдж —
  // єдина велика зона дотику для перерахунку (раніше було лише крихітне
  // кружечко 22×22px усередині — важко влучити на ходу).
  const miniOffEl=document.createElement('div');
  miniOffEl.className='map-tile-offroute-mini';
  miniOffEl.id='miniOff_'+tileId;
  miniOffEl.innerHTML='Відхилення';
  viewport.appendChild(miniOffEl);
  miniOffEl.addEventListener('click', e=>{
    e.stopPropagation();
    if(_lastLat==null || _lastLon==null || !mapRouteLatLngs) return;
    const rejoin=findMaxCutRejoinPoint([_lastLat,_lastLon], navProgressIndex);
    recalculateNavReroute([_lastLat,_lastLon], mapRouteLatLngs[rejoin.index]);
    rerouteAcknowledged=true;
    showOffRouteIndicators(false); // тапнули — ховаємо, з'явиться знову лише при новому відхиленні
    sht(rejoin.cutM>50 ? '🔁 Перераховую… зрізка ~'+Math.round(rejoin.cutM)+'м маршруту' : '🔁 Перераховую маршрут…');
  });

  // Зелена кнопка "Перебудувати" — 25.08.2026: пара до miniOffEl, дзеркально
  // праворуч. На відміну від miniOffEl (з'являється лише під час реального
  // відхилення), доступна ЗАВЖДИ поки є маршрут — див. updateMiniTurnIndicators
  // нижче (показується/ховається РАЗОМ із turnMiniEl). Той самий ручний
  // перерахунок від поточної позиції, що й на банері/бейджі зліва.
  const miniRerouteEl=document.createElement('div');
  miniRerouteEl.className='map-tile-reroute-mini';
  miniRerouteEl.id='miniReroute_'+tileId;
  miniRerouteEl.innerHTML='🔁 Перебудувати';
  viewport.appendChild(miniRerouteEl);
  miniRerouteEl.addEventListener('click', e=>{
    e.stopPropagation();
    if(_lastLat==null || _lastLon==null || !mapRouteLatLngs) return;
    const rejoin=findMaxCutRejoinPoint([_lastLat,_lastLon], navProgressIndex);
    recalculateNavReroute([_lastLat,_lastLon], mapRouteLatLngs[rejoin.index]);
    rerouteAcknowledged=true;
    showOffRouteIndicators(false); // якщо саме зараз було відхилення — банер більше не потрібен, ми вже перерахували
    sht(rejoin.cutM>50 ? '🔁 Перераховую… зрізка ~'+Math.round(rejoin.cutM)+'м маршруту' : '🔁 Перераховую маршрут…');
  });

  const navSoundBtnEl=document.createElement('button');
  navSoundBtnEl.type='button';
  navSoundBtnEl.className='map-nav-fab map-nav-sound-btn'+(AL.Sound_enabled!==false?' on':'');
  navSoundBtnEl.id='navSoundBtn_'+tileId;
  navSoundBtnEl.textContent=(AL.Sound_enabled!==false)?'🔊':'🔇';
  navSoundBtnEl.addEventListener('click',e=>{ e.stopPropagation(); toggleSoundBtn(); });
  viewport.appendChild(navSoundBtnEl);
  wireCalibDrag(navSoundBtnEl);

  const navCenterBtnEl=document.createElement('button');
  navCenterBtnEl.type='button';
  navCenterBtnEl.className='map-nav-fab map-nav-center-btn';
  navCenterBtnEl.id='navCenterBtn_'+tileId;
  navCenterBtnEl.textContent='🎯';
  navCenterBtnEl.addEventListener('click',e=>{ e.stopPropagation(); forceRecenterMap(st); });
  viewport.appendChild(navCenterBtnEl);
  wireCalibDrag(navCenterBtnEl);

  const navRouteBtnEl=document.createElement('button');
  navRouteBtnEl.type='button';
  navRouteBtnEl.className='map-nav-fab map-nav-route-btn';
  navRouteBtnEl.id='navRouteBtn_'+tileId;
  navRouteBtnEl.textContent='🗺️';
  navRouteBtnEl.addEventListener('click',e=>{ e.stopPropagation(); openRouteImportDialog(); });
  viewport.appendChild(navRouteBtnEl);
  wireCalibDrag(navRouteBtnEl);

  // ── 🔍 Пошук місць (TomTom Fuzzy Search) — 18.08.2026. Раніше тут була
  // ⛽-кнопка старої офлайн-POI-системи (togglePoiSearch, Overpass) —
  // повністю замінена: тепер шукає через TomTom Search API навколо живої
  // GPS-позиції (не центру карти), показує ВСІ знайдені точки маркерами +
  // картки знизу (як у Google Maps). Тап по картці — центрує й одразу
  // будує маршрут (Старт з GPS, якщо ще не заданий) — саме так, як просив
  // користувач ("як гугл"). Результати ТИМЧАСОВІ — зникають при новому
  // пошуку чи закритті панелі, у POI_BRANDS_DB НЕ зберігаються.
  const navPoiBtnEl=document.createElement('button');
  navPoiBtnEl.type='button';
  navPoiBtnEl.className='map-nav-fab map-nav-poi-btn';
  navPoiBtnEl.id='navPoiBtn_'+tileId;
  navPoiBtnEl.textContent='🔍';
  navPoiBtnEl.addEventListener('click',e=>{ e.stopPropagation(); togglePlaceSearch(st); });
  viewport.appendChild(navPoiBtnEl);
  wireCalibDrag(navPoiBtnEl);

  const placeSearchBarEl=document.createElement('div');
  placeSearchBarEl.className='place-search-bar';
  placeSearchBarEl.id='placeSearchBar_'+tileId;
  const placeSearchInput=document.createElement('input');
  placeSearchInput.type='text';
  placeSearchInput.placeholder='Наприклад, IKEA…';
  placeSearchInput.autocomplete='off';
  placeSearchInput.addEventListener('click', e=>{ e.stopPropagation(); });
  placeSearchInput.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); runPlaceSearch(st); }
  });
  const placeSearchGoBtn=document.createElement('button');
  placeSearchGoBtn.type='button'; placeSearchGoBtn.textContent='🔍';
  placeSearchGoBtn.addEventListener('click', e=>{ e.stopPropagation(); runPlaceSearch(st); });
  const placeSearchCloseBtn=document.createElement('button');
  placeSearchCloseBtn.type='button'; placeSearchCloseBtn.textContent='✕';
  placeSearchCloseBtn.addEventListener('click', e=>{ e.stopPropagation(); togglePlaceSearch(st); });
  placeSearchBarEl.appendChild(placeSearchInput);
  placeSearchBarEl.appendChild(placeSearchGoBtn);
  placeSearchBarEl.appendChild(placeSearchCloseBtn);
  viewport.appendChild(placeSearchBarEl);

  const placeSearchCardsEl=document.createElement('div');
  placeSearchCardsEl.className='place-search-cards';
  placeSearchCardsEl.id='placeSearchCards_'+tileId;
  placeSearchCardsEl.addEventListener('click', e=>{ e.stopPropagation(); });
  viewport.appendChild(placeSearchCardsEl);

  // ── Режим "точки маршруту" (Старт/Проміжна/Фініш) — тап по кнопці 🚩
  // вмикає/вимикає режим; поки він активний, звичайний тап по карті (map.on
  // 'click' нижче) відкриває контекстне меню замість лічильника подвійного/
  // потрійного тапу. Побудова маршруту (TomTom → ORS) стартує автоматично,
  // щойно є і Старт, і Фініш (setPlanPoint нижче).
  const navPlanBtnEl=document.createElement('button');
  navPlanBtnEl.type='button';
  navPlanBtnEl.className='map-nav-fab map-nav-plan-btn';
  navPlanBtnEl.id='navPlanBtn_'+tileId;
  navPlanBtnEl.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>';
  navPlanBtnEl.addEventListener('click',e=>{ e.stopPropagation(); toggleRoutePlanMode(st); });
  viewport.appendChild(navPlanBtnEl);
  wireCalibDrag(navPlanBtnEl);

  // ── 📷+ Швидка мітка камери просто з карти — на відміну від FAB на
  // приладовій панелі (тільки GPS), тут одразу відкривається попап з полем
  // ліміту, бо ти й так вже в контексті карти.
  const navCamMarkBtnEl=document.createElement('button');
  navCamMarkBtnEl.type='button';
  navCamMarkBtnEl.className='map-nav-fab map-nav-cammark-btn';
  navCamMarkBtnEl.id='navCamMarkBtn_'+tileId;
  navCamMarkBtnEl.innerHTML=CAM_RADAR_GUN_SVG;
  navCamMarkBtnEl.addEventListener('click',e=>{ e.stopPropagation(); toggleCamEditorView(st); });
  viewport.appendChild(navCamMarkBtnEl);
  wireCalibDrag(navCamMarkBtnEl);

  // ── ✏️ Панель адреси "Редактора" точок — з'являється на висоті кнопки
  // центрування 🎯 (див. CSS .poi-editor-bar), ПОКИ
  // poiEditorActive===true (вмикається кнопкою "✏️ Редактор" у сітці меню
  // "Маршрут", togglePoiEditor()). Поле адреси + "OK" (геокодинг через
  // Nominatim, підтримує й китайську адресу так само, як англійську —
  // текст іде в fetch як є, кодування UTF-8 у URL спрацьовує без окремого
  // "режиму мови") + "✕" — 15.08.2026: ЗМІНЕНО функцію: раніше вимикав
  // весь редактор, тепер просто ОЧИЩАЄ поле вводу (щоб вимкнути редактор
  // повністю — повертатись у сітку меню "Маршрут" і тапати "✏️ Редактор"
  // ще раз). Видимість бару керується updatePoiEditorBarVisibility(st) —
  // ОКРЕМО від fullscreen-показу інших FAB, бо бар має бути прихованим
  // навіть у fullscreen, поки редактор не увімкнено.
  const poiEditorBarEl=document.createElement('div');
  poiEditorBarEl.className='poi-editor-bar';
  poiEditorBarEl.id='poiEditorBar_'+tileId;
  const poiEditorAddrInput=document.createElement('input');
  poiEditorAddrInput.type='text';
  poiEditorAddrInput.placeholder='Адреса (можна й китайською)…';
  poiEditorAddrInput.autocomplete='off';
  poiEditorAddrInput.addEventListener('click', e=>{ e.stopPropagation(); });
  poiEditorAddrInput.addEventListener('keydown', e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); poiEditorGeocode(st, poiEditorAddrInput.value); }
  });
  const poiEditorOkBtn=document.createElement('button');
  poiEditorOkBtn.type='button'; poiEditorOkBtn.textContent='OK';
  poiEditorOkBtn.addEventListener('click', e=>{ e.stopPropagation(); poiEditorGeocode(st, poiEditorAddrInput.value); });
  const poiEditorClearBtn=document.createElement('button');
  poiEditorClearBtn.type='button'; poiEditorClearBtn.textContent='✕';
  poiEditorClearBtn.addEventListener('click', e=>{ e.stopPropagation(); poiEditorAddrInput.value=''; poiEditorAddrInput.focus(); });
  poiEditorBarEl.appendChild(poiEditorAddrInput);
  poiEditorBarEl.appendChild(poiEditorOkBtn);
  poiEditorBarEl.appendChild(poiEditorClearBtn);
  viewport.appendChild(poiEditorBarEl);
  wirePoiEditorInputKbSafeZone(poiEditorAddrInput, poiEditorBarEl); // 15.08.2026: на фокус — переносить бар у безпечну зону вгорі (щоб не ховався за клавіатурою), на blur — назад

  const st = { map, marker, badge, wrapEl:container, viewportEl:viewport, heading:null, lastDblTap:0, zoomedIn:false, routeLine:null,
    tileId, navHudEl, navHudRightEl, navOffEl, turnMiniEl, miniOffEl, miniRerouteEl, navSoundBtnEl, navCenterBtnEl, navRouteBtnEl, navPoiBtnEl, navPlanBtnEl, navCamMarkBtnEl, navHudActive:false, navReroute:null,
    navFollowPaused:false, poiMarkers:[], poiSearching:false, planMarkers:[], planAltLines:[], camMarkers:[], camEditorMode:false, awaitingCamDirTap:null, camDirPreviewMarker:null,
    poiEditorBarEl, poiEditorAddrInput, poiEditorTempMarker:null, poiEditorCandidateMarkers:[],
    placeSearchBarEl, placeSearchInput, placeSearchCardsEl, placeSearchActive:false, placeSearchMarkers:[], placeSearchResults:[], placeSearchActiveIdx:-1 };
  mapInstances[tileId] = st;
  sizeRotatedMapContainer(st); // ставить реальні width/height квадрата + transform
  applyMapTheme(st);
  wireCustomMapGestures(st); // 21.08.2026: власний обробник pan/pinch-zoom з контробертанням (див. функцію нижче)

  // 25.08.2026: якщо "📡 Камери" вже увімкнено (напр. лишилось з минулої
  // сесії — POI_TOGGLES.cams persist через localStorage), ЦЯ, щойно
  // створена плитка про це не знає — camEditorMode вище стартує з false
  // завжди. togglePoiCams() малює камери лише на ІСНУЮЧИХ на момент кліку
  // плитках (Object.values(mapInstances)), тож будь-яка плитка, СТВОРЕНА
  // вже ПІСЛЯ того кліку (типовий випадок — нова мала плитка карти після
  // перезавантаження сторінки), камер просто ніколи не бачила. Симптом:
  // "на малій карті камер не видно, хоча перемикач увімкнено".
  if(POI_TOGGLES.cams){
    st.camEditorMode = true;
    drawCamEditMarkers(st);
  }

  // 20.08.2026: ResizeObserver замість покладання на таймінг setTimeout(0)
  // у mkMapTile — раніше після зміни розміру плитки (напр. 2×1 → 2×3 через
  // selsz()) траплялось, що видима карта лишалась "закешованою" під СТАРИЙ,
  // менший розмір (простір у сітці вже 2×3, а контент карти — ще як 2×1),
  // якщо браузер не встигав порахувати layout до моменту setTimeout(0).
  // ResizeObserver спрацьовує САМЕ тоді, коли реальний розмір `viewport`
  // фактично змінився — незалежно від того, що це викликало (зміна
  // розміру плитки, поворот екрана, зміна розкладки сітки), і незалежно
  // від того, чи встиг попередній ручний виклик спіймати правильний момент.
  // 20.08.2026: guard на активний фокус поля — той самий захист, що вже
  // є для resizeAllMapTiles (не чіпати sql.js/invalidateSize, поки
  // відкрита клавіатура), інакше ResizeObserver реагує на зміну висоти
  // viewport від появи клавіатури так само, як і на реальну зміну
  // розміру плитки — і повертає саме той resize-during-keyboard, який ми
  // щойно прибрали окремим фіксом.
  const ro=new ResizeObserver(()=>{
    const ae=document.activeElement;
    if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT')){
      _mapResizePendingOnBlur=true;
      return;
    }
    // 20.08.2026: тут БУЛА пропущена st.map.invalidateSize() — контейнер
    // (wrap-квадрат) коректно перераховувався й центрувався через
    // sizeRotatedMapContainer(), а сам Leaflet (тайли/позиція) про зміну
    // розміру не дізнавався взагалі й лишався у старому стані. Симптом:
    // "плитка розтягується до низу, а карта лишається у старій позиції".
    try{ st.map.invalidateSize(); }catch(e){}
    sizeRotatedMapContainer(st);
  });
  ro.observe(viewport);
  st.resizeObserver=ro;

  // Ручне панорамування ставить автослідкування на паузу — і на маленькій
  // плитці, і у fullscreen (раніше працювало лише у fullscreen; тепер
  // логіка центрування ОДНАКОВА в обох випадках). Відновлюється тапом на
  // бейдж ONLINE/OFFLINE (тепер це і є кнопка центру, див. нижче) або
  // кнопкою "🎯 Центр" у fullscreen.
  // 'zoomstart' навмисно НЕ слухаємо: подвійний тап (наш власний зум-тогл
  // нижче) теж викликає zoomstart програмно, і легко хибно спрацював би
  // на паузу без жодного реального ручного панорамування.
  // 21.08.2026: цей обробник тепер МЕРТВИЙ — map.dragging.disable() вище
  // означає, що Leaflet більше ніколи сам не згенерує 'dragstart'.
  // navFollowPaused=true тепер ставить wireCustomMapGestures() напряму.
  // Лишаю про всяк випадок (напр. якщо колись dragging знову увімкнуть).
  map.on('dragstart', ()=>{ st.navFollowPaused=true; });

  // Бейдж ONLINE/OFFLINE — тепер одночасно й кнопка центрування (як
  // "🎯 Центр" у fullscreen, тільки для маленької плитки, де окремої
  // кнопки нема через брак місця). Працює завжди, незалежно від офлайн/
  // онлайн стану тайлів — той напис лишається видимим, просто тепер ще й
  // клікабельний.
  badge.style.cursor='pointer';
  badge.addEventListener('click', e=>{
    e.stopPropagation();
    if(_lastLat==null || _lastLon==null){ sht('Немає GPS-сигналу ще'); return; }
    forceRecenterMap(st);
    sht('🎯 Центрую');
  });

  // ── Тапи по карті: 2 = зум-тогл (або вихід з повноекранного огляду
  // маршруту, якщо ми зараз у ньому), 3 = увійти в повноекранний огляд
  // маршруту. Стандартний Leaflet dblclick вимкнено (doubleClickZoom:false)
  // — на тач-пристроях 'dblclick' часто не спрацьовує надійно, тому рахуємо
  // тапи самі. Рішення (2 чи 3) приймаємо з невеликою затримкою після
  // ОСТАННЬОГО тапу в серії — інакше не встигнемо відрізнити "два" від
  // "ще не дотапнутого треба" вчасно.
  map.on('click', e=>{
    if(st.awaitingCamDirTap){
      // Крок 2 додавання/редагування напряму камери (startCamDirectionPick) —
      // цей тап НЕ рахується ні за маршрут, ні за звичайне меню камери,
      // він рахує напрям: bearing від збереженої точки камери до цього тапу.
      const {point, callback}=st.awaitingCamDirTap;
      const dirDeg=Math.round(calculateBearing([point.lat,point.lng],[e.latlng.lat,e.latlng.lng]));
      st.map.closePopup();
      clearCamDirPreview(st);
      st.awaitingCamDirTap=null;
      callback(dirDeg);
      return;
    }
    // 14.08.2026: "✏️ Редактор" точок магазинів — перевіряємо ПЕРЕД
    // routePlanMode, повністю незалежно від нього (не той самий прапорець,
    // на відміну від camEditorMode). Тап по порожній карті ставить/пересуває
    // ОДНУ незбережену тимчасову мітку; тап по вже поставленій мітці НЕ
    // доходить сюди (Leaflet marker click не бульбашить у map click) — його
    // ловить окремий обробник у placePoiEditorTempMarker, який відкриває
    // showAddPoiForm.
    if(poiEditorActive){
      if(st.poiEditorTempMarker) st.poiEditorTempMarker.setLatLng(e.latlng);
      else placePoiEditorTempMarker(st, e.latlng);
      return;
    }
    if(routePlanMode){
      if(st.camEditorMode) showCameraEditMenu(st, e.latlng);
      else showPointContextMenu(st, e.latlng);
      return;
    }
    const now=Date.now();
    st.tapBuf=(st.tapBuf||[]).filter(t=>now-t<700);
    st.tapBuf.push(now);
    clearTimeout(st.tapTimer);
    st.tapTimer=setTimeout(()=>{
      const n=st.tapBuf.length; st.tapBuf=[];
      if(n>=3) enterMapFullscreen(st);
      else if(n===2) handleDoubleTapMap(st);
    }, 400); // 25.08.2026: збільшено з 300 до 400мс — саме тому подвійний тап іноді "не спрацьовував", а потрійний ідеально: для потрійного людина природно тапає швидко (всі тапи встигають в 300мс-вікно одне за одним), а для звичайного подвійного тапу пауза між двома тапами часто трохи довша за 300мс — таймер після ПЕРШОГО тапу встигав спрацювати (n=1, жодна гілка не підходить, нічого не відбувається) ДО того, як прийшов другий клік, і другий тап так само лишався сам по собі "n=1" — обидва тапи мовчки пропадали
  });

  applyMapRoute(st); // якщо маршрут вже був імпортований раніше — намалювати одразу
  refreshMapBadges();
}

// Подвійний тап: у звичайному режимі — тогл зуму (як "Фото" на iOS);
// якщо зараз у повноекранному огляді маршруту — повертає плитку в
// попередній стан (той самий подвійний тап, просто інше значення в цьому
// контексті, як і просив користувач).
function handleDoubleTapMap(st){
  if(st.routeViewMode){ exitMapFullscreen(st); return; }
  st.zoomedIn = !st.zoomedIn;
  const targetZoom = st.zoomedIn ? MapCfg.detail : MapCfg.std;
  st.map.flyTo(st.marker.getLatLng(), targetZoom, {animate:true, duration:0.4});
}

// ── Тройний тап → повноекранний "огляд маршруту" ──
// Розгортає плитку на весь екран дашборду (position:fixed, поверх усього
// іншого — сітку взагалі не чіпаємо, її просто ховає під собою) і вимикає
// автоматичне зміщення камери на 20-30% вперед та обертання за курсом —
// щоб можна було вільно покрутити/поскролити карту й побачити весь
// маршрут одним поглядом, без того, як його раз по раз повертає GPS.
function enterMapFullscreen(st){
  if(st.routeViewMode) return; // вже в цьому режимі
  const tileEl=st.viewportEl.closest('.tile');
  if(!tileEl) return;
  st.routeViewMode=true;
  st.navFollowPaused=false;
  tileEl.classList.add('map-fullscreen');
  // 20.08.2026: КОРІНЬ БАГА "карта у fullscreen підрізана знизу" — тут.
  // applyBottomRowAutoHeight() виставляє тайлу-карті inline
  // style.height="XXXpx" (щоб вирівняти по нижньому краю в звичайній
  // сітці) — це значення ЛИШАЄТЬСЯ висіти на елементі й після переходу в
  // fullscreen. Коли на елементі ОДНОЧАСНО є top:0, bottom:0 (з CSS
  // .map-fullscreen) І явний inline height (з сітки) — система
  // "надлишково визначена" (over-constrained), і за специфікацією CSS
  // браузер у такому разі ІГНОРУЄ bottom, рахуючи висоту від top+height
  // замість розтягування до низу екрана. Прибираємо inline height ПЕРЕД
  // тим, як застосовується fullscreen-режим — тоді top/right/bottom/left
  // з CSS нічим не перекриті.
  tileEl.style.height='';
  st.turnMiniEl.style.display='none'; // велика HUD-картка бере на себе цю роль у fullscreen
  if(st.miniOffEl) st.miniOffEl.style.display='none'; // те саме для міні-бейджа відхилення
  if(st.miniRerouteEl) st.miniRerouteEl.style.display='none'; // і для зеленої кнопки "Перебудувати" (25.08.2026)
  // 17.08.2026: planRouteHud ховається при виході з fullscreen (exitMapFullscreen)
  // — тут повертаємо її назад, якщо є побудований(і) маршрут(и), інакше
  // чіпи вибору альтернативних маршрутів були б недоступні до наступного
  // buildPlanRoute()/activatePlanRoute().
  if(typeof planRoutes!=='undefined' && planRoutes.length) updatePlanHud();

  // Якщо є завантажений маршрут — це тепер повноцінна навігація
  // "поворот-за-поворотом": heading-up ОБЕРТАННЯ НЕ скидаємо (лишається,
  // як у звичайному режимі), генеруємо маневри заново з поточного
  // mapRouteLatLngs і показуємо HUD. Якщо маршруту нема — стара поведінка:
  // просто більший вид карти, north-up, вільне панорамування ("Огляд").
  const hasRoute = mapRouteLatLngs && mapRouteLatLngs.length>1;
  st.navHudActive = hasRoute;
  if(hasRoute){
    // Маневри вже згенеровані при завантаженні/імпорті маршруту (щоб
    // озвучка працювала і в маленькій плитці) — тут лише підстраховка на
    // випадок, якщо маршрут якось опинився завантаженим без цього кроку.

// ── Формула "точка попереду" (прямий геодезичний розрахунок, а не піксельний
// panBy) — рахуємо реальну точку на distMeters метрів вперед по курсу від
// поточної позиції, і саме ЇЇ ставимо в центр карти. Маркер лишається на
// СПРАВЖНІХ координатах — тому він автоматично опиняється ближче до низу
// екрана (позаду від центру-вперед), точно як синя стрілка в Google Maps.
// Це набагато надійніше за піксельний panBy() у поєднанні з CSS-обертанням:
// не треба узгоджувати знаки/тригонометрію повороту з піксельним зсувом. ──
function destPoint(lat,lon,bearingDeg,distMeters){
  const R=6371000, brng=bearingDeg*Math.PI/180;
  const lat1=lat*Math.PI/180, lon1=lon*Math.PI/180;
  const lat2=Math.asin(Math.sin(lat1)*Math.cos(distMeters/R)+Math.cos(lat1)*Math.sin(distMeters/R)*Math.cos(brng));
  const lon2=lon1+Math.atan2(Math.sin(brng)*Math.sin(distMeters/R)*Math.cos(lat1), Math.cos(distMeters/R)-Math.sin(lat1)*Math.sin(lat2));
  return [lat2*180/Math.PI, lon2*180/Math.PI];
}

// ── Плавний рух по карті під час навігації (15.08.2026) ──
// РАНІШЕ кожен GPS-тік миттєво "телепортував" маркер+камеру в нову сиру
// GPS-точку (setView({animate:false})) — на рідких/нерівних тіках
// (watchPosition ~раз/с) це виглядало як стрибки, і, головне, дистанція
// до маневру рахувалась від "застарілої" позиції аж до наступного тіку —
// на швидкості це легко "з'їдало" 20-30м між тіками, звідси й скарга
// "оголошує за 34м замість очікуваних ~4". Підхід тепер (як у Google
// Maps — "рух по карті не зовсім реальний"):
// 1) Поки триває навігація маршрутом — точка для показу й розрахунків
//    береться НЕ з сирого GPS, а СПРОЄКТОВАНА на лінію маршруту/лінію
//    повернення (route-snapping, getNavDisplayPosition) — прибирає
//    GPS-джиттер (±5-15м), АЛЕ тільки якщо реально близько (NAV_SNAP_MAX_M) —
//    інакше довіряємо сирому GPS (бо "притягувати" до маршруту, коли ми
//    вже далеко з'їхали, було б оманливо).
// 2) Кожен новий GPS-тік НЕ застосовується миттєво — стає ЦІЛЛЮ, а
//    поточна ВІДОБРАЖУВАНА позиція плавно "доганяє" її через
//    requestAnimationFrame протягом NAV_ANIM_MS. Курс (обертання карти)
//    інтерполюється так само, з переходом через 359°→0° по короткій дузі.
const NAV_ANIM_MS = 900;  // трохи менше типового інтервалу watchPosition (~1с) — встигає "дотягнутись" до цілі ще до наступного тіку
const NAV_SNAP_MAX_M = 25; // далі цього — довіряємо сирому GPS, а не "притягуємо" до маршруту
let navAnimPos = null;      // {lat,lon} — поточна ВІДОБРАЖУВАНА (анімована) позиція
let navAnimHeading = null;  // поточний ВІДОБРАЖУВАНИЙ (анімований) курс
let navAnimTarget = null;   // ціль поточної анімації (див. startNavAnim)
let navAnimRafId = null;

function shortestAngleDeltaDeg(from, to){
  let d=(to-from)%360;
  if(d>180) d-=360; if(d<-180) d+=360;
  return d;
}

// Обирає позицію ДЛЯ ВІДОБРАЖЕННЯ (не для детекції відхилення — та й
// далі рахується від сирого GPS у processNavHudStep, це окремо і
// навмисно). Немає маршруту чи він прихований — сирий GPS як і раніше.
function getNavDisplayPosition(rawLat, rawLon){
  if(!mapRouteLatLngs || mapRouteLatLngs.length<2 || !routeVisible) return {lat:rawLat, lon:rawLon};
  const userCoords=[rawLat, rawLon];
  if(navOffRoute){
    if(rerouteCoords && rerouteCoords.length>=2 && !rerouteIsStraightLine){
      const {dist, point}=findClosestSegmentIn(userCoords, rerouteCoords, rerouteProgressIndex);
      if(dist<=NAV_SNAP_MAX_M) return {lat:point[0], lon:point[1]};
    }
    return {lat:rawLat, lon:rawLon}; // пряма лінія-компас чи ще нема лінії повернення — прилипати нема до чого
  }
  const {dist, point}=findClosestRouteSegment(userCoords);
  if(dist<=NAV_SNAP_MAX_M) return {lat:point[0], lon:point[1]};
  return {lat:rawLat, lon:rawLon};
}

function navAnimStep(){
  if(!navAnimTarget){ navAnimRafId=null; return; }
  const t=Math.min(1, (performance.now()-navAnimTarget.t0)/NAV_ANIM_MS);
  const lat=navAnimTarget.fromLat + (navAnimTarget.lat-navAnimTarget.fromLat)*t;
  const lon=navAnimTarget.fromLon + (navAnimTarget.lon-navAnimTarget.fromLon)*t;
  let heading=null;
  if(navAnimTarget.heading!=null){
    const base=(navAnimTarget.fromHeading!=null) ? navAnimTarget.fromHeading : navAnimTarget.heading;
    heading=(base + shortestAngleDeltaDeg(base, navAnimTarget.heading)*t + 360)%360;
  }
  navAnimPos={lat,lon};
  navAnimHeading=heading;
  applyNavAnimFrame(lat, lon, heading);
  if(t<1) navAnimRafId=requestAnimationFrame(navAnimStep);
  else navAnimRafId=null;
}
function startNavAnim(targetLat, targetLon, targetHeading){
  const fromLat=navAnimPos ? navAnimPos.lat : targetLat;
  const fromLon=navAnimPos ? navAnimPos.lon : targetLon;
  const fromHeading=navAnimHeading;
  navAnimTarget={lat:targetLat, lon:targetLon, heading:targetHeading, fromLat, fromLon, fromHeading, t0:performance.now()};
  if(navAnimRafId==null) navAnimRafId=requestAnimationFrame(navAnimStep);
}

// Викликається одразу після кожного нового пакета координат (гачок у
// startGPS()/watchPosition, розділ вище). heading — pos.coords.heading
// (компасний курс руху, у градусах від півночі за годинниковою стрілкою;
// null/NaN, якщо пристрій стоїть на місці — GPS тоді курс не визначає).
// 15.08.2026: більше НЕ застосовує позицію напряму — рахує "прилиплу"
// (route-snapped) цільову точку й запускає до неї плавну анімацію
// (startNavAnim); фактичне малювання на карті — у applyNavAnimFrame нижче,
// яка викликається щокадру з navAnimStep, а не раз на GPS-тік.
function updateAllMapTiles(lat, lon, heading){
  const disp=getNavDisplayPosition(lat, lon);
  startNavAnim(disp.lat, disp.lon, heading);
}
function applyNavAnimFrame(lat, lon, heading){
  Object.keys(mapInstances).forEach(id=>{
    const st = mapInstances[id];
    if(!st) return;
    st.marker.setLatLng([lat,lon]);
    // 21.08.2026: fullscreen (routeViewMode) — ЗАВЖДИ статична, north-up,
    // незалежно від того, активна навігація (navHudActive) чи ні. Раніше
    // тут була умова `&& !st.navHudActive` — тобто під час активної
    // навігації в fullscreen камера й обертання ВСЕ ОДНО працювали як у
    // звичайному режимі (той самий "режим водіння", що на маленькій
    // плитці). За рішенням користувача це прибрано: fullscreen — це
    // завжди огляд БЕЗ авто-обертання, маркер просто рухається по
    // нерухомій карті. Обертання-під-курс лишається ЛИШЕ на маленькій
    // плитці (де воно корисне для швидкого розуміння напрямку на ходу).
    if(st.routeViewMode){
      return;
    }
    if(st.navFollowPaused){
      // Користувач сам відсунув карту рукою (dragstart вище) — і на
      // маленькій плитці, і у fullscreen однаково; не смикаємо вид назад
      // щотіку, чекаємо тапу на бейдж ONLINE/OFFLINE (тепер кнопка центру)
      // чи "🎯 Центр" у fullscreen (forceRecenterMap скидає цей прапорець).
      return;
    }
    setMapHeading(st, heading); // обертає карту так, щоб курс завжди дивився вгору; якщо курс невідомий — лишає попередній поворот
    const h = st.viewportEl ? st.viewportEl.clientHeight : 0;
    if(h){
      const zoom = st.map.getZoom();
      // Метрів на піксель у Web Mercator на цій широті/зумі (стандартна формула).
      const metersPerPixel = 156543.03392 * Math.cos(lat*Math.PI/180) / Math.pow(2, zoom);
      const aheadMeters = h * 0.30 * metersPerPixel; // 30% висоти видимої плитки — та сама пропорція, що просив користувач раніше
      const bearing = (st.heading!=null) ? st.heading : 0;
      const center = destPoint(lat, lon, bearing, aheadMeters);
      st.map.setView(center, zoom, {animate:false}); // animate:false навмисно — плавність уже дає сам rAF-цикл (navAnimStep), Leaflet-анімація поверх неї лише завадила б
    } else {
      st.map.panTo([lat,lon], {animate:false});
    }
  });
}

// ── Імпорт маршруту (GPX/GeoJSON) — та сама ідея, що й лінія треку в
// TripViewer.html: яскрава полілінія поверх карти. ──
function parseGpxToLatLngs(text){
  const xml=new DOMParser().parseFromString(text,'application/xml');
  return Array.from(xml.querySelectorAll('trkpt')).map(pt=>[
    parseFloat(pt.getAttribute('lat')), parseFloat(pt.getAttribute('lon'))
  ]).filter(p=>!isNaN(p[0])&&!isNaN(p[1]));
}
function parseGeoJsonToLatLngs(text){
  const gj=JSON.parse(text);
  const coordsList=[];
  const grab=g=>{
    if(!g) return;
    if(g.type==='LineString') coordsList.push(g.coordinates);
    else if(g.type==='MultiLineString') g.coordinates.forEach(c=>coordsList.push(c));
    else if(g.type==='Feature') grab(g.geometry);
    else if(g.type==='FeatureCollection') g.features.forEach(f=>grab(f.geometry));
  };
  grab(gj);
  // GeoJSON зберігає [lon,lat] — Leaflet хоче [lat,lon]
  return coordsList.flat().map(c=>[c[1],c[0]]);
}
let mapRouteLatLngs=null;

/* ── Планування маршруту (Старт/Проміжні/Фініш + побудова через TomTom/ORS) ──
   Окремий шар поверх mapRouteLatLngs: коли маршрут побудовано з точок,
   він так само лягає в mapRouteLatLngs і працює з усією навігацією
   (озвучка поворотів, офф-роут), що й імпортований GPX. */
let routePlanMode=false;      // 🚩-кнопка: чи відкриває тап по карті контекстне меню точки
let poiEditorActive=false;    // 14.08.2026: "✏️ Редактор" точок магазинів — окремий від routePlanMode прапорець (не конфліктує, перевіряється першим у map.on('click', ...))
// ── Режим 249cc (модуль 1): білі/зелені номери скутерів у Тайвані — заборона
// виїзду на автомагістралі/платні дороги. Зберігається в MapCfg.scooter249
// (той самий localStorage-ключ 'mapcfg', що й routeVisible/масштаби), не
// окремий ключ — щоб не плодити зайві записи в localStorage без потреби.
let isScooterMode249 = MapCfg.scooter249===true;
let ttOptionsPanelOpen = false; // 25.08.2026: стан підменю "⚙️ TomTom" (лише UI, не персистить)
let planStartPoint=null;      // [lat,lon] | null
let planWaypoints=[];         // [[lat,lon], ...]
let planEndPoint=null;        // [lat,lon] | null
let planRoutes=[];            // [{points:[[lat,lon],...], distanceM:number}, ...]
let planActiveRouteIndex=0;
let planBuilding=false;
let routeVisible=MapCfg.routeVisible!==false; // тогл кнопки "Маршрут" у топбарі — вимикає лінію, НЕ видаляючи самі дані; збережений стан з Налаштувань
function applyMapRoute(st){
  syncNavHudForRoute(st); // ПЕРЕД early-return нижче — має спрацювати і коли маршрут щойно ОЧИЩЕНО (mapRouteLatLngs порожній), не тільки коли він є
  if(st.routeLine){ st.map.removeLayer(st.routeLine); st.routeLine=null; }
  if(!routeVisible || !mapRouteLatLngs || !mapRouteLatLngs.length) return;
  st.routeLine=L.polyline(mapRouteLatLngs,{color:'#37e0e6',weight:7,opacity:0.9}).addTo(st.map);
  // Лінія додається ПІСЛЯ маркера користувача — у Leaflet шари в тому ж
  // pane малюються в порядку додавання, тож без цього виклику синя лінія
  // маршруту лягала б ПОВЕРХ червоної точки, ховаючи її на перетинах.
  st.marker.bringToFront();
}
// 18.08.2026: обертання карти у повноекранному режимі має вмикатись ЛИШЕ
// коли є активний маршрут (st.navHudActive, дивись гейт у applyNavAnimFrame:
// `if(st.routeViewMode && !st.navHudActive) return;`). РАНІШЕ це рахувалось
// ОДИН РАЗ, тільки в момент входу у fullscreen (enterMapFullscreen) — якщо
// збудувати/активувати/скасувати маршрут, УЖЕ перебуваючи у повноекранному
// "огляді" (кнопка 🚩 планування там теж доступна), стан не оновлювався до
// наступного виходу-входу. Винесено сюди — викликається з applyMapRoute(),
// тобто з КОЖНОЇ зміни маршруту, а не лише зі входу у fullscreen.
function syncNavHudForRoute(st){
  if(!st.routeViewMode) return; // не у fullscreen — нема що синхронізувати (setMapHeading і так завжди активний на маленькій плитці)
  const hasRoute = routeVisible && mapRouteLatLngs && mapRouteLatLngs.length>1;
  const wasActive = st.navHudActive;
  if(hasRoute===wasActive) return; // без змін
  st.navHudActive = hasRoute;
  if(hasRoute){
    if(!routeManeuvers.length) generateRouteManeuvers(mapRouteLatLngs);
    st.navHudEl.style.display='flex';
  } else {
    st.navHudEl.style.display='none';
    st.heading=0; applyMapTransform(st); // маршрут прибрали серед fullscreen-огляду — назад у north-up, як і при вході без маршруту
  }
}
// Кнопка "🎯" у повноекранному режимі — миттєво "прилипнути" назад до GPS
// (та сама логіка "точки попереду", що й у звичайному автостеженні, лише
// з animate:true — для навігації камера й так стежить сама щотіку, це
// радше для швидкого повернення після ручного панорамування).
function forceRecenterMap(st){
  if(_lastLat==null || _lastLon==null) return;
  st.navFollowPaused=false; // повертаємо автостеження — саме для цього й існує ця кнопка
  const h = st.viewportEl ? st.viewportEl.clientHeight : 0;
  const zoom = st.map.getZoom();
  if(h){
    const metersPerPixel = 156543.03392 * Math.cos(_lastLat*Math.PI/180) / Math.pow(2, zoom);
    const aheadMeters = h * 0.30 * metersPerPixel;
    const bearing = (st.heading!=null) ? st.heading : 0;
    const center = destPoint(_lastLat, _lastLon, bearing, aheadMeters);
    st.map.setView(center, zoom, {animate:true});
  } else {
    st.map.panTo([_lastLat,_lastLon], {animate:true});
  }
}

function applyRouteToAllMaps(){ Object.values(mapInstances).forEach(applyMapRoute); }

   НАВІГАЦІЯ "ПОВОРОТ-ЗА-ПОВОРОТОМ" (активується потрійним тапом по плитці

   ═══════════════════════════════════════════════════════════════════════ */
let routeManeuvers = [];   // [{index,coords:[lat,lon],type,text,announcedFar,announcedMid,announcedClose}]
let navProgressIndex = -1; // індекс найближчого відрізка mapRouteLatLngs — -1 = ще не прив'язались
let navOffRoute = false;
let _lastAnnouncedManeuverRef = null; // 15.08.2026: сам об'єкт maneuver, що був "наступним" на попередньому тіку (спільний для routeManeuvers і rerouteManeuvers) — для детекції "щойно проїхали попередній" і компактного ланцюжкового оголошення
// ── ТЕСТ: РУЧНИЙ РЕЖИМ ПЕРЕРАХУНКУ ──
// AUTO_REROUTE_ENABLED=false: при виявленні відхилення бейдж/банер і
// озвучка "Відхилення від маршруту" й далі спрацьовують як завжди, але

const AUTO_REROUTE_ENABLED = false;
let rerouteAcknowledged = false;
// ── ЛІНІЯ ПЕРЕРАХУНКУ (при відхиленні) ──
// Раніше підказки завжди йшли з ОСНОВНОГО маршруту (routeManeuvers), навіть
// коли вже намальована лінія повернення — тому користувач чув "поверніть
// праворуч" для маршруту, яким він фізично вже не їде. Тепер, поки активне

// пряма) — окремий прогрес, окремі прапорці "вже озвучено", незалежні від
// основного маршруту.
let rerouteCoords = null;      // [[lat,lon],...] точки лінії повернення, або null
let rerouteManeuvers = [];
let rerouteProgressIndex = -1;
let rerouteIsStraightLine = false; // true = пряма (жоден рушій не спрацював) — поворотів там немає
const REROUTE_OFF_ROUTE_THRESHOLD_M = 45; // "відхилення від відхилення" — коли й сама лінія повернення застаріла
const NAV_OFF_ROUTE_THRESHOLD_M = 45;
const NAV_PROGRESS_WINDOW_BEHIND = 10;
const NAV_PROGRESS_WINDOW_AHEAD = 150;
const NAV_FULL_RESEARCH_MULTIPLIER = 3;
// ── МАКСИМАЛЬНА ЗРІЗКА (замість "найближча точка") ──
// РАНІШЕ точка повернення на маршрут завжди бралась як "найближчий
// відрізок + 2 точки вперед" (segIndex+2) — тобто фактично лінія
// повернення вела майже туди ж, звідки з'їхали, навіть якщо фізично
// водій уже проїхав significant шматок і зрізав петлю/гачок дороги.
// Тепер шукаємо СЕРЕД УСІХ точок маршруту попереду (до
// REROUTE_MAX_LOOKAHEAD_M метрів шляху вперед від поточного прогресу) ті,
// що знаходяться в межах REROUTE_JOIN_RADIUS_M від поточної GPS-позиції
// (тобто фізично досяжні просто зараз) — і серед НИХ обираємо
// НАЙВІДДАЛЕНІШУ за прогресом. Це і є "максимальна зрізка": скільки
// маршруту реально можна пропустити, а не яка точка найближче по прямій.
const REROUTE_JOIN_RADIUS_M = 200;      // допуск "фізично тут" — GPS-похибка + ширина дороги
const REROUTE_MAX_LOOKAHEAD_M = 20000;  // як далеко ВПЕРЕД по маршруту шукаємо кандидатів на зрізку (з запасом на довгі об'їзди)

// Кумулятивна відстань (м) уздовж масиву координат маршруту, від точки 0
// до точки i. Рахується один раз і кешується за посиланням на сам масив
// (маршрут не змінюється щотіку GPS) — щоб findMaxCutRejoinPoint нижче не
// перераховував суму відстаней заново на кожен виклик.
let _routeCumDistCache = null; // {ref, dist:number[]}
function getRouteCumDist(coords){
  if(_routeCumDistCache && _routeCumDistCache.ref===coords) return _routeCumDistCache.dist;
  const dist=[0];
  for(let i=1;i<coords.length;i++){
    dist.push(dist[i-1] + haversineM(coords[i-1][0], coords[i-1][1], coords[i][0], coords[i][1]));
  }
  _routeCumDistCache = { ref:coords, dist:dist };
  return dist;
}

// Повертає {index, joinDistM, cutM}: index — точка маршруту, куди варто
// повертатись; joinDistM — наскільки вона далеко по прямій від поточної
// GPS-позиції зараз; cutM — скільки метрів ОСНОВНОГО маршруту це зрізає
// (від точки, де водій з'їхав, до точки повернення). Спершу шукаємо
// НАЙДАЛЬШУ (по прогресу) точку маршруту ВПЕРЕДУ, досяжну по прямій в
// межах REROUTE_JOIN_RADIUS_M — це і є "нормальний варіант повернення".
// Лише якщо в усьому вікні зазирання (REROUTE_MAX_LOOKAHEAD_M) такої
// точки взагалі нема (нормальних варіантів попереду немає) — крайній
// випадок: ведемо назад точно до точки відхилення (fromProgressIndex),
// без жодної зрізки.
function findMaxCutRejoinPoint(userCoords, fromProgressIndex){
  const coords=mapRouteLatLngs;
  const cum=getRouteCumDist(coords);
  const n=coords.length;
  const startI=Math.max(0, fromProgressIndex);
  const fromDist=cum[Math.min(startI, cum.length-1)];
  let bestIndex=-1, bestJoinDist=0;
  for(let i=startI;i<n;i++){
    if(cum[i]-fromDist > REROUTE_MAX_LOOKAHEAD_M) break; // достатньо зазирнули вперед — далі сенсу нема
    const d=haversineM(userCoords[0], userCoords[1], coords[i][0], coords[i][1]);
    if(d<=REROUTE_JOIN_RADIUS_M && i>bestIndex){ bestIndex=i; bestJoinDist=d; } // серед досяжних — беремо НАЙДАЛЬШУ за прогресом
  }
  if(bestIndex>=0) return { index:bestIndex, joinDistM:bestJoinDist, cutM:cum[bestIndex]-fromDist };
  // Крайній випадок: серед точок ВПЕРЕДУ (в межах REROUTE_MAX_LOOKAHEAD_M)
  // немає ЖОДНОЇ точки маршруту, досяжної в радіусі REROUTE_JOIN_RADIUS_M —
  // тобто нормальних варіантів повернення на маршрут попереду нема. Раніше
  // тут шукали найближчу точку по ВСЬОМУ маршруту (forceFull) — це могло
  // повести назад чи різко вперед на геометрично близьку, але зовсім іншу
  // за прогресом ділянку (петля/перехрестя власного треку). Тепер чесно
  // ведемо ТОЧНО до точки відхилення (fromProgressIndex) — звідки водій
  // з'їхав із маршруту — без зрізки (cutM:0).
  const devIndex=Math.min(startI, n-1);
  const joinDistM=haversineM(userCoords[0], userCoords[1], coords[devIndex][0], coords[devIndex][1]);
  return { index:devIndex, joinDistM:joinDistM, cutM:0 };
}

const NAV_ARROW_PATHS = {
  STRAIGHT: "M 12 20 L 12 4 M 7 9 L 12 4 L 17 9",
  RIGHT:    "M 6 19 L 6 9 C 6 6 8 4 11 4 L 17 4 M 13 8 L 18 4 L 13 0",
  LEFT:     "M 18 19 L 18 9 C 18 6 16 4 13 4 L 7 4 M 11 8 L 6 4 L 11 0",
  UTURN:    "M 7 19 L 7 9 C 7 4 17 4 17 9 L 17 19 M 12 14 L 17 19 L 22 14",
  // 15.08.2026: "тримайтесь лівіше/правіше" — легкий діагональний вигин
  // (кут 15-35°), не повний поворот. Пряма діагональна лінія зі стрілкою
  // на кінці, у тому самому стилі (stroke, viewBox 0 0 24 22), що й решта.
  SLIGHT_RIGHT: "M 8 20 L 15 5 M 10 9 L 15 5 L 17 11",
  SLIGHT_LEFT:  "M 16 20 L 9 5 M 14 9 L 9 5 L 7 11"
