<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>vRacer Dash Pro</title>
<style>
:root{
  --bg:#000000;--panel:#0d0d0f;--line:rgba(255,255,255,0.07);
  --text:#f2f2f0;--muted:#666;
  --cyan:#37e0e6;--amber:#ffb74d;--red:#ff4d4d;
  --green:#4ade80;--blue:#3b82f6;--yellow:#ffd23f;
  --th:48px;
  /* Насиченість (альфа фону) плиток попередження — зафіксована на 70%
     (раніше можна було міняти в Налаштування → ВИГЛЯД, цю вкладку та
     її повзунки прибрано, значення просто закодоване тут). */
  --sat-cold:0.70;--sat-warn:0.70;--sat-alrt:0.70;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;}
html,body{margin:0;padding:0;
  width:100lvw !important; /* lvw = максимальна ширина viewport (без урахування зникаючих скролбарів/панелей) */
  min-height:100.1vh !important; /* +0.1% — навмисний "запас" для мікроскролу нижче, без цього scrollTo(0,1) буде нікуди скролити */
  overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:#000000 !important;color:#f2f2f0 !important;
  font-family:'Rajdhani','Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;}
/* Кнопка "Блок" (createScrollHack) — заморожує сторінку РІВНО на тій
   позиції скролу (scrollY=1), куди її вже завела tryHideChrome, щоб
   випадковий свайп/rubber-band не відкотив назад і не показав хром Bluefy
   знову. touch-action:none гасить панорамування САМЕ на рівні body — дочірні
   елементи (карта тощо) керують своїм touch-action самі, тут не чіпаємо. */
body.no-scroll{overflow:hidden;touch-action:none;overscroll-behavior:none;}
/* ── АНТИ-ДОЩ ──
   .rain-blocker — суцільний напівпрозорий шар на весь екран, що глушить
   геть усі тач/клік-події (краплі на екрані більше нічого не натискають).
   z-index:99998 — свідомо ВИЩЕ за все інше в застосунку (макс. до цього
   був 9999 у консолі) — коли дощ увімкнено, він має перекривати буквально
   все, включно з консоллю/налаштуваннями, якщо ті випадково відкриті.
   Кнопка "Дощ" тепер живе як звичайний .pill у топбарі (просили "у стилі
   нашого додатку" замість окремої плаваючої зеленої кнопки) — .pill.rain-active
   візуально повторює .pill.rec (пульсуюча червона підсвітка, як у "Лог"
   під час запису), розмір/шрифт лишаються як в усіх інших кнопок топбару
   для візуальної консистентності. */
.rain-blocker{
  position:fixed; left:0; right:0; bottom:0; top:0;
  background:transparent; /* раніше rgba(0,0,0,0.4) — просили прибрати затемнення, лишаємо тільки блокування дотиків */
  z-index:99998;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.pill.rain-active{color:#ff4d4d;border-color:rgba(255,77,77,0.5);background:rgba(255,77,77,0.08);animation:recPulse 1.2s ease-in-out infinite;}

/* Дощовий режим — ВАЖЛИВО, друга спроба (перша через z-index на .tb
   ЗЛАМАЛАСЬ, особливо в альбомній орієнтації): зміна z-index/pointer-events
   на .tb (ПРЯМОМУ БАТЬКОВІ кнопки "Дощ", яку саме в цей момент утримує
   палець користувача) під час активного дотику провокує WebKit
   перестворити композитний шар для .tb просто посеред жесту — і iOS
   (Bluefy) після цього губить touchend/видає непередбачений touchcancel.
   Наслідок: другий/наступний утримувальний тап для ВИМКНЕННЯ дощу
   інколи просто не долічував до 1.5с, бо жест обривався сам. Тепер
   .tb взагалі НЕ чіпаємо — ані z-index, ані pointer-events на самому
   контейнері. Замість цього:
   1) .rain-blocker просто НЕ накриває смугу топбару — top підганяється
      під фактичну висоту .tb (getBoundingClientRect().bottom) в JS при
      кожній активації, тож топбар і так завжди "над" блокером, без
      жодних стилів на ньому самому;
   2) кнопки, які МАЮТЬ лишатись заблокованими (Лог, Звук, Консоль,
      Заблокувати скрол, Налаштувати) — гасимо pointer-events САМЕ НА
      НИХ, а не на спільному батькові: вони не мають стосунку до
      поточного дотику на "Дощ", тож зміна їхніх стилів нічого не рве.
   "Дощ", "З'єднання", "Екрани", "PiP" — не займаємо стилями взагалі, як
   і .tb; вони просто фізично лишаються поза зоною блокера. */
body.rain-mode-active .tb button:not(#cb):not(#wsBtnTop):not(#pipBtnTop):not(#rainBtnTop){pointer-events:none;}
/* Плеєр (плитка "Музика") лишається активним і під час дощу — прев/некст/
   плей/перемотування мають працювати. Той самий прийом, що й з топбаром:
   .tile.audio-tile не є position:fixed нащадком body, тож саме її, а не
   ВЕСЬ .tile (щоб не підняти заразом і кнопку ✕ видалити — .rm), піднімаємо
   над .rain-blocker через z-index. #grid/#gi/.tile мають z-index:auto,
   тобто НЕ створюють власного stacking context — тож z-index тут коректно
   конкурує з .rain-blocker (сидить прямо в body) на верхньому рівні.
   Довгий тап (відкриття переліку треків) під час дощу свідомо
   вимикається окремо в JS (mkAudioTile) — випадковий довгий дотик краплею
   не мав би розгортати на весь екран список треків посеред їзди. */
body.rain-mode-active .audio-tile-inner{position:relative; z-index:99999;}

/* TOPBAR */
.tb{position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;gap:5px;
  padding:max(5px,env(safe-area-inset-top)) 8px 5px;
  background:#000000;border-bottom:1px solid var(--line);
  height:var(--th);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tb::-webkit-scrollbar{display:none;}
.pill{border:1px solid var(--line);border-radius:6px;padding:5px 9px;
  font-size:12px;color:var(--muted);background:#0d0d0f;white-space:nowrap;cursor:pointer;
  flex-shrink:0;}
.pill.on{color:#9be8ff;border-color:#2b6f7a;}
.pill.ok{color:#4ade80;border-color:rgba(74,222,128,0.4);}
.pill.ok.engine-off{color:#8fae94;border-color:rgba(143,174,148,0.35);} /* 25.08.2026: двигун вимкнено, зв'язок і далі живий — приглушений зелений, не тривожний колір */
.pill.err{color:#ff8080;border-color:rgba(255,77,77,0.3);}
.pill.go{color:var(--amber);border-color:rgba(255,183,77,0.3);}
.pill.sim{color:#c084fc;border-color:rgba(192,132,252,0.4);background:rgba(192,132,252,0.06);}
.pill.rec{color:#ff4d4d;border-color:rgba(255,77,77,0.5);background:rgba(255,77,77,0.08);animation:recPulse 1.2s ease-in-out infinite;}
.pill.locked{color:var(--amber);border-color:rgba(255,183,77,0.5);background:rgba(255,183,77,0.08);}
@keyframes recPulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
@keyframes connSpin{to{transform:rotate(360deg);}} /* 25.08.2026: обертання іконки "🔄 Ініціалізація" (CONN_SPINNER_SVG) — код замість емодзі */
/* #bs (статус поряд з "З'єднання") — ЗАВЖДИ прихований. Раніше показувався
   під час помилки (клас .err), але це проста <div>, не кнопка — тап по ній
   нічого не робив. Тепер стан помилки/перепідключення показує сама кнопка
   "З'єднання" (#cb, textContent → "<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Помилка" тощо) — той самий елемент,
   той самий тап = повторна спроба, а не окрема неклікабельна пігулка поруч. */
#bs{display:none;}
/* Більша зона дотику для Connect (важко влучити в рукавичках), без зміни
   візуального розміру: невидимий ::before розширює лише хіт-тест на +15px
   з кожного боку, не займаючи місця в розкладці (position:absolute). */
#cb{position:relative;}
#cb::before{content:'';position:absolute;top:-15px;left:-10px;right:-6px;bottom:-15px;}
/* Те саме для "Маршрут" — між сусідніми кнопками менше вільного місця
   збоку, тож розширення по горизонталі скромніше, а по вертикалі (вгору/
   вниз від рядка кнопок) — таке саме щедре. Довгий тап на цій самій кнопці
   (імпорт маршруту) і так спрацьовує через власний таймер у JS, більший
   хіт-тест йому не заважає. */
#routeBtnTop{position:relative;}
#routeBtnTop::before{content:'';position:absolute;top:-15px;left:-6px;right:-6px;bottom:-15px;}
#eb{margin-left:auto;flex-shrink:0;border:1px solid var(--line);border-radius:6px;
  padding:5px 11px;font-size:12px;color:#f2f2f0;background:#0d0d0f;cursor:pointer;}
#eb.a{color:#000;background:var(--cyan);border-color:var(--cyan);font-weight:700;}
html.ar-landscape{--th:36px;}
html.ar-landscape .pill{font-size:11px;padding:3px 7px;}
.pill.on{border-color:var(--cyan);color:var(--cyan);}
html.ar-landscape #eb{font-size:11px;padding:3px 9px;}

/* GRID */
#grid{position:fixed;inset:0;background:#000000 !important;
  padding-top:calc(env(safe-area-inset-top) + var(--th) + 2px);
  padding-bottom:env(safe-area-inset-bottom,6px);overflow:hidden;}
#gi{display:grid;gap:5px;padding:5px;height:100%;align-content:start;
  grid-auto-flow:dense;
  grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(130px,170px);}
/* Сітку зроблено удвічі дрібнішою (12 колонок замість 6) — щоб влазило
   більше параметрів одночасно. Відео (span 8) і великі гейдж-тайли s22
   (span 4) навмисно збільшені вдвічі відносно нових колонок, щоб
   зберегти той самий візуальний розмір, що й раніше. Звичайні s21/s1
   тайли НЕ мають такого подвоєння — вони навмисно стають вдвічі
   вужчими, щоб у тому самому місці вміщалось удвічі більше параметрів.
   КЛАС (не @media) — керується вручну через ar-landscape, щоб не
   реагувати на фактичний фізичний поворот телефону. */
html.ar-landscape #gi{grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(100px,150px);}

/* TILES */
.tile{position:relative;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px;overflow:hidden;-webkit-touch-callout:none;will-change:auto;
  transition:background .4s,border-color .4s;}

.tile.s1{grid-column:span 1;grid-row:span 1;}
.tile.s22{grid-column:span 2;grid-row:span 2;}
.tile.s21{grid-column:span 2;grid-row:span 1;}
.tile.s41{grid-column:span 2;grid-row:span 1;} /* портрет: fallback, поводиться як s21 */
.tile.s23{grid-column:span 2;grid-row:span 3;} /* 2 в ширину × 3 у висоту — для великої плитки карти */

/* ВІДЕО-ПЛИТКА: нормальний вигляд за замовчуванням в обох орієнтаціях.
   При активації реального PiP (клас .pip-active) форма ВІДЕО НЕ змінюється —
   PiP-вікно зберігає ті самі пропорції, що й картка на екрані (більше не
   "пігулка" 7:1). Змінюється лише вміст, що малюється на канвасі (великі
   цифри без підписів) — див. drawPipFrame() / drawTileLikeColumn(). */
.video-tile {
  grid-column: 1 / -1;
  grid-row: span 1;
  position: relative;
  background: #0d0d0f;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  width: 100%;
  height: 100%;
}
html.ar-landscape .video-tile{grid-column:span 8;grid-row:span 2;}
html.ar-landscape .tile.s22{grid-column:span 4;grid-row:span 2;}
html.ar-landscape .tile.s41{grid-column:span 4;grid-row:span 1;}
html.ar-landscape .tile.s23{grid-column:span 4;grid-row:span 3;}
/* PiP більше не змінює форму відео — воно завжди залишається такого ж
   розміру/пропорцій, як звичайна картка (width:100%/height:100% з базового
   правила #pip-video нижче по коду вже це забезпечує). */

/* Alert States */
.tile.cold{background:rgba(59,130,246,var(--sat-cold))!important;border-color:var(--cyan)!important;box-shadow:0 0 18px rgba(59,130,246,0.6)!important;}
.tile.cold .tl{color:#000!important;}
.tile.cold .tun{background:#000!important;}
.tile.warn{background:rgba(255,211,63,var(--sat-warn))!important;border-color:var(--amber)!important;box-shadow:0 0 18px rgba(255,211,63,0.6)!important;}
.tile.alrt{background:rgba(255,77,77,var(--sat-alrt))!important;border-color:var(--red)!important;
  animation:palrt 0.6s ease-in-out infinite;}
@keyframes palrt{0%,100%{background:rgba(255,77,77,var(--sat-alrt));box-shadow:0 0 22px rgba(255,77,77,0.75);}50%{background:rgba(255,77,77,calc(var(--sat-alrt) * 0.556));box-shadow:0 0 8px rgba(255,77,77,0.4);}}
.tile.ed{animation:jig .4s ease-in-out infinite;}
.tile.alrt.ed{animation:jig .4s;}
@keyframes jig{0%,100%{transform:rotate(0)}25%{transform:rotate(-.7deg)}75%{transform:rotate(.7deg)}}
.tile.ds{animation:none!important;box-shadow:0 0 0 2px var(--cyan),0 0 16px rgba(55,224,230,0.25)!important;transform:scale(1.03);z-index:20;}
.tile.dov{box-shadow:inset 0 0 0 2px var(--amber);}
.rm{position:absolute;top:22px;right:4px;width:18px;height:18px;
  border-radius:50%;background:#ff4d4d;color:#fff;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;
  z-index:5;display:none;cursor:pointer;}
.tile.ed .rm{display:flex;}
/* Ручку "потягнути висоту" (#rh) прибрано повністю разом із tile.customH —
   висота нижнього ряду плиток тепер завжди рахується автоматично на
   кожному render() (applyBottomRowAutoHeight): фіксовані 124px в
   альбомній орієнтації, розрахований залишок екрана в портретній. */
.add{border-style:dashed;border-color:rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.01);color:var(--muted);font-size:26px;
  cursor:pointer;animation:none!important;}

/* TILE CONTENT */
.tl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--pc,var(--muted));margin-bottom:1px;text-align:center;
  white-space:normal;word-break:break-word;line-height:1.2;font-weight:700;}
.tv{font-family:'JetBrains Mono','Courier New',monospace;font-weight:700;
  line-height:1;color:#fff;letter-spacing:1px;font-size:clamp(22px,6.5vw,39px);}
.tu{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1px;}
.tun{width:50%;height:1px;background:var(--pc,var(--cyan));opacity:0.45;margin:3px 0;}
.s22 .tv{font-size:clamp(35px,8.5vw,60px);}
.s21 .tv{font-size:clamp(24px,6.5vw,43px);}
html.ar-landscape .tl{font-size:11px;}
html.ar-landscape .tv{font-size:clamp(20px,5vw,35px);}
html.ar-landscape .s22 .tv{font-size:clamp(28px,6.5vw,47px);}
html.ar-landscape .s41 .tv{font-size:clamp(24px,6vw,42px);}
/* s21/s1 стали вдвічі вужчими (розділ вище) — шрифт зменшено відповідно,
   інакше цифри/довгі підписи (напр. "CYL1_AP") не влазять і переносяться. */
html.ar-landscape .s21 .tv{font-size:clamp(15px,4vw,26px);}
html.ar-landscape .s1 .tv{font-size:clamp(14px,4vw,24px);}
html.ar-landscape .tile.s1 .tl,html.ar-landscape .tile.s21 .tl{font-size:9px;}

/* GAUGE */
.gw{position:relative;width:100%;height:100%;min-height:50px;
  display:flex;align-items:center;justify-content:center;}
.gsvg{position:absolute;inset:0;width:100%;height:100%;}
.gc{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;}
.gbg{fill:none;stroke:rgba(255,255,255,0.05);stroke-width:5;}
.gfg{fill:none;stroke:var(--pc,var(--cyan));stroke-width:5;stroke-linecap:round;}

/* ── ПЛИТКА "КАРТА" (Leaflet, 2x2) ──
   Карта живе ВСЕРЕДИНІ звичайної плитки (той самий .tile/.s22, ніяка сітка
   не змінюється) — просто замість mkF()/mkG() рендериться Leaflet-контейнер
   на всю площу плитки, без підпису/риски (карта сама по собі зрозуміла). */
.tile.map-tile{padding:0;overflow:hidden;}
/* ── Обертання карти "вперед = вгору" (як навігація в Google Maps) ──
   Leaflet сам по собі не вміє обертати карту (немає плагіна) — тому карту
   обертаємо звичайним CSS transform:rotate(). Але звичайний прямокутний
   контейнер при повороті показував би порожні трикутники по кутах —
   тому реальний Leaflet-контейнер (.map-tile-inner) робимо КВАДРАТНИМ,
   зі стороною = діагоналі видимої плитки (див. sizeRotatedMapContainer у
   JS), і ховаємо все зайве зовнішнім .map-tile-viewport{overflow:hidden}. */
.map-tile-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;overscroll-behavior:none;border-radius:inherit;}
.map-tile-inner{position:absolute;top:50%;left:50%;touch-action:none;}
.map-tile-viewport .leaflet-control-container{display:none;} /* прибираємо зайві системні контроли Leaflet — це маленька плитка, не повноекранна карта */
/* У режимі редагування карта має бути СТАТИЧНОЮ (не ловити власні жести),
   інакше тач по ній конфліктує з логікою "два прицільні тапи" на переставляння. */
.tile.ed .map-tile-viewport{pointer-events:none;}
/* Тройний тап по карті → повноекранний огляд маршруту. Сітку не чіпаємо —
   position:fixed просто виводить плитку з потоку і кладе її понад усім
   іншим; решта дашборду лишається як є під нею, просто не видно.
   20.08.2026: раніше тут ще стояли width:100vw!important;height:100vh!
   important; — саме ВОНИ й були причиною "ширина стрибає у вузьке" при
   появі/закритті клавіатури. Прибрали їх на користь inset:0 — але це
   виявилось НАДТО оптимістично: `inset` — відносно новий CSS-шорткат
   (повна підтримка в Safari/iOS лише з 14.5, 2021), і схоже, конкретний
   WKWebView (Bluefy) не застосовує його як очікувалось — плитка "не
   ставала справжнім fullscreen" (топбар і плитки внизу лишались видимі,
   карта займала лише свій природний розмір замість усього екрана).
   Повертаємось до ЯВНИХ top/right/bottom/left:0 — це найстаріший,
   максимально сумісний спосіб розтягнути fixed-елемент на весь екран,
   без залежності від підтримки inset. */
.tile.map-fullscreen{position:fixed!important;top:0!important;right:0!important;bottom:0!important;left:0!important;
  z-index:5000;border-radius:0!important;overscroll-behavior:none;touch-action:none;}
/* Темна тема карти — просто інвертуємо кольори звичайних (світлих) OSM-тайлів,
   без окремого набору "нічних" тайлів. */
.map-tile-viewport.map-theme-dark{filter:invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);}
/* Перемикач-тогл (iOS-стиль) — використовується для теми карти. */
.tsw{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;}
.tsw input{opacity:0;width:0;height:0;position:absolute;}
.tsw .sldr{position:absolute;inset:0;background:#333;border-radius:26px;transition:background .2s;cursor:pointer;}
.tsw .sldr:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .2s;}
.tsw input:checked + .sldr{background:var(--cyan);}
.tsw input:checked + .sldr:before{transform:translateX(20px);}
.map-tile-badge{position:absolute;top:6px;right:8px;z-index:500;font-size:9px;letter-spacing:1px;
  color:#fff;background:rgba(0,0,0,0.55);padding:2px 6px;border-radius:6px;pointer-events:auto;cursor:pointer;text-transform:uppercase;
  transition:background 0.15s ease,transform 0.15s ease;}
.map-tile-badge::before{content:'';position:absolute;top:-26px;left:-26px;right:-26px;bottom:-26px;}
.map-tile-badge:active{background:rgba(55,224,230,0.9);color:#000;transform:scale(1.15);}
.map-tile-offline{color:#4ade80;}
.map-tile-online{color:#ffd23f;}

/* ── НАВІГАЦІЯ (поворот-за-поворотом) — HUD поверх повноекранної карти.
   Мінімальний функціональний стиль — окремий дизайн-прохід по всій програмі
   заплановано пізніше, зараз важлива лише робота логіки.
   ВСІ КООРДИНАТИ НИЖЧЕ — ТОЧНО ЗІБРАНІ ІНСТРУМЕНТОМ КАЛІБРУВАННЯ
   (Налаштування → Карта → 🔧), вручну, окремо для портрету й альбому —
   не формули з safe-area, а фактичні пікселі, підтверджені на реальному
   пристрої. Портрет — базові значення нижче; альбом — html.ar-landscape
   override.
   position:FIXED (не absolute) — усі ці елементи існують ЛИШЕ у fullscreen-
   режимі (у звичайній плитці display:none), тож нема причини прив'язувати
   їх до .map-tile-viewport/.container: пряма прив'язка до РЕАЛЬНИХ країв
   екрана прибирає будь-яку залежність від того, як браузер порахував
   ширину проміжного контейнера. ── */
.map-nav-hud{
  display:none; position:fixed;
  z-index:5500; background:rgba(0,0,0,0.72); border:1px solid var(--line);
  border-radius:14px; align-items:center; pointer-events:none;
  max-width:46%; box-sizing:border-box; overflow:hidden;
}
.map-nav-hud-left{ left:6px; top:60px; padding:10px 16px; gap:12px; }
.map-nav-hud-right{ right:6px; top:64px; padding:10px 16px; gap:14px; }
.nav-hud-arrow-wrap svg{display:block;}
.nav-hud-dist{font-size:20px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace;min-width:64px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-hud-tblock{display:flex;flex-direction:column;align-items:center;line-height:1.1;}
.nav-hud-tlabel{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
.nav-hud-tval{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.nav-hud-tval.spd{color:#ffd23f;}
.nav-hud-tval.tmp{color:#ff7043;}
/* Ландшафтна орієнтація — ОКРЕМА "сітка" відступів від портретної, теж
   зібрана калібрувальним інструментом (750×369, а не масштабована
   портретна). */
html.ar-landscape .map-nav-hud{ max-width:38%; padding-top:6px; padding-bottom:6px; }
html.ar-landscape .map-nav-hud-left{ left:6px; top:47px; padding-left:12px; padding-right:12px; gap:8px; }
/* 15.08.2026: раніше тут теж діяли зменшені padding/gap і max-width:38%
   (успадковані з .map-nav-hud вище) — сама коробка візуально стискалась,
   навіть коли шрифт цифр уже зрівняли з портретним. За проханням —
   картка швидкості/температури в альбомній орієнтації тепер ідентична
   портретній за розміром (padding/gap/max-width як у базовому правилі
   .map-nav-hud-right вище), міняється лише позиція (top/right). */
html.ar-landscape .map-nav-hud-right{ right:6px; top:48px; padding:10px 16px; gap:14px; max-width:46%; }
html.ar-landscape .nav-hud-dist{ font-size:16px; min-width:46px; }
/* 15.08.2026: раніше тут було "font-size:17px" — цифри швидкості/температури
   (.nav-hud-tval) в альбомній орієнтації штучно зменшувались відносно
   портретної (22px). За проханням — розмір лишається ОДНАКОВИМ в обох
   орієнтаціях, тому окремого правила для .nav-hud-tval тут більше нема
   (успадковує базові 22px із портретного правила вище). */
html.ar-landscape .nav-hud-arrow-wrap svg{ width:30px; height:28px; }
.nav-hud-offroute{
  display:none; position:fixed;
  top:calc(env(safe-area-inset-top) + var(--th) + 68px);
  left:50%; transform:translateX(-50%);
  z-index:5500; background:rgba(255,77,77,0.92); color:#fff; font-size:12px; font-weight:700;
  padding:5px 8px 5px 12px; border-radius:10px; pointer-events:none; white-space:nowrap;
  align-items:center; gap:8px;
}
.nav-reroute-btn{
  pointer-events:auto; border:none; background:rgba(255,255,255,0.25); color:#fff;
  width:26px; height:26px; border-radius:50%; font-size:14px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.nav-reroute-btn:active{background:rgba(255,255,255,0.4);}
.map-nav-fab{
  display:none; position:fixed; right:6px; z-index:5500;
  width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
  background:rgba(0,0,0,0.72); color:#fff; font-size:19px; align-items:center; justify-content:center;
  cursor:pointer;
}
.map-nav-cammark-btn svg{width:23px;height:23px;}
.map-nav-fab.on{border-color:var(--cyan);}
.map-nav-sound-btn{bottom:244px; display:none!important;} /* 25.08.2026: прибрано з великої карти за проханням — дублювало topbar-кнопку "Звук", а місце тепер займає пошук (map-nav-poi-btn) */
.map-nav-center-btn{bottom:182px;}
.map-nav-route-btn{bottom:120px;}
.map-nav-poi-btn{bottom:244px;} /* 25.08.2026: перенесено на місце колишньої кнопки звуку (яку прибрано з великої карти) — раніше 58px, ділила ряд з прапорцем */
.map-nav-plan-btn{bottom:58px;} /* 13.08.2026: прапорець переїхав на місце заправки (right:56px → базовий right:6px від .map-nav-fab) */
.map-nav-cammark-btn{bottom:58px; right:106px; display:none!important;} /* 11.08.2026: функцію перенесено в сітку меню "Маршрут" — кнопку саму на карті ховаємо */
html.ar-landscape .map-nav-sound-btn{bottom:207px;}
html.ar-landscape .map-nav-center-btn{bottom:151px;}
html.ar-landscape .map-nav-route-btn{bottom:95px;}
/* 15.08.2026: за проханням зсунуто в альбомній орієнтації — прапорець
   став єдиним у нижньому ряду (займає колишнє місце "Маршрут"), решта
   три кнопки піднялись на один крок кожна (той самий крок 56px, що й
   був між ними), звук — ще на крок вище над своєю старою позицією.
   Тепер це ОДНА колонка (right:6px, як база), а не два стовпчики
   пліч-о-пліч, як було раніше (прапорець сидів окремо на right:56px). */
html.ar-landscape .map-nav-poi-btn{bottom:207px; right:6px;} /* 25.08.2026: на місце колишнього звуку — тепер сама в колонці, а не в парі з прапорцем на 39px */
html.ar-landscape .map-nav-plan-btn{bottom:39px; right:6px;}
html.ar-landscape .map-nav-cammark-btn{bottom:39px; right:156px;}
/* 15.08.2026: панель адреси "Редактора" точок — на висоті кнопки
   "Маршрут" (.map-nav-route-btn: bottom:120px портрет / ТЕПЕР 95px
   альбом — рухається РАЗОМ із самою кнопкою "Маршрут" при перестановці
   вище). Ховається за замовчуванням — display:flex вмикається JS-ом
   лише коли й fullscreen-режим карти активний, І "Редактор" увімкнено
   (обидві умови разом, див. updatePoiEditorBarVisibility). */
.poi-editor-bar{
  display:none; position:fixed; left:8px; right:56px; z-index:5500;
  bottom:120px; background:rgba(0,0,0,0.82); border:1px solid var(--line); border-radius:10px;
  padding:6px; align-items:center; gap:6px;
}
.poi-editor-bar input{flex:1; min-width:0; padding:8px; border-radius:8px; border:1px solid #444; background:#111; color:#fff; font-size:16px;}
.poi-editor-bar button{flex-shrink:0; padding:8px 10px; border-radius:8px; border:1px solid #555; background:#222; color:#fff; font-weight:700; font-size:13px;}
/* 15.08.2026: безпечна зона під час набору тексту (замість розрахунку
   висоти клавіатури через visualViewport, який давав хибні числа у
   власній WKWebView-обгортці цього застосунку) — top замість bottom,
   прив'язано до реальної висоти верхньої панелі (.tb, var(--th)) +
   виїмка на нотчі, а не до хардкодженого числа — ніякої математики про
   клавіатуру, просто відоме заздалегідь безпечне місце під топбаром. */
.poi-editor-bar.kb-top{ top:calc(var(--th) + env(safe-area-inset-top) + 8px); bottom:auto!important; }
html.ar-landscape .poi-editor-bar{bottom:95px; left:8px; right:auto; width:280px;} /* 15.08.2026: у портреті left/right:8px/56px природно звужує бар до вузького екрана, а в альбомному (широкому) екрані те саме правило розтягувало його на майже всю ширину — забагато; фіксована ширина замість "від краю до краю" */

/* ── 🔍 Пошук місць (TomTom Fuzzy Search) — 18.08.2026 ────────────────────
   Поле вводу — ЗГОРИ (одразу під топбаром), а не знизу, як .poi-editor-bar
   — навмисно: знизу буде картки результатів, і знизу ж клавіатура, тож
   зверху єдине вільне й стабільне місце (жодного "kb-top" фокус-хаку тут
   взагалі не треба — воно й так завжди в безпечній зоні). */
.place-search-bar{
  display:none; position:fixed; left:8px; right:56px; top:calc(var(--th) + 8px);
  z-index:5500; background:rgba(0,0,0,0.85); border:1px solid var(--line); border-radius:10px;
  padding:6px; align-items:center; gap:6px;
}
.place-search-bar input{flex:1; min-width:0; padding:8px; border-radius:8px; border:1px solid #444; background:#111; color:#fff; font-size:16px;}
.place-search-bar button{flex-shrink:0; padding:8px 10px; border-radius:8px; border:1px solid #555; background:#222; color:#fff; font-weight:700; font-size:13px;}
html.ar-landscape .place-search-bar{left:8px; right:auto; width:280px;}

/* Картки результатів — знизу, горизонтальний скрол, як у Google Maps. */
.place-search-cards{
  display:none; position:fixed; left:0; right:0; bottom:16px; z-index:5400;
  gap:8px; padding:0 8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.psc-card{
  flex-shrink:0; width:190px; background:rgba(10,10,10,0.92); border:1px solid var(--line);
  border-radius:10px; padding:8px 10px; color:#fff; cursor:pointer;
}
.psc-card.active{border-color:var(--cyan); background:rgba(55,224,230,0.12);}
.psc-name{font-weight:700; font-size:13px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.psc-addr{font-size:11px; color:#aaa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.psc-dist{font-size:11px; color:var(--cyan); margin-top:3px; font-weight:600;}
.poi-popup-name{font-weight:600;margin-bottom:2px;}
.poi-popup-type{color:var(--muted);font-size:12px;}

/* ── 📷+ Плаваюча кнопка швидкого додавання камери на приладовій панелі —
   ЗАВЖДИ на видноті (position:fixed поверх усього, крім модалок з
   z-index:9999). Ховається лише під час fullscreen карти, де є своя
   аналогічна кнопка з можливістю одразу вписати ліміт. */
#camMarkFab{
  position:fixed; right:14px; bottom:90px; z-index:4200;
  width:52px; height:52px; border-radius:50%;
  background:rgba(20,20,20,0.88); color:#fff; border:2px solid var(--line);
  font-size:22px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer; touch-action:none;
}
#camMarkFab svg{width:28px;height:28px;}
#camMarkFab.has-pending{border-color:var(--amber);}
#camMarkFab::after{
  content:attr(data-count); position:absolute; top:-4px; right:-4px;
  background:var(--red); color:#fff; font-size:11px; font-weight:700;
  border-radius:10px; padding:1px 5px; min-width:16px; text-align:center;
  display:none;
}
#camMarkFab.has-pending::after{display:block;}

/* ── HUD планування маршруту (дистанція + чіпи альтернатив) ── Один
   спільний елемент на весь застосунок (не прив'язаний до конкретної
   плитки карти) — з'являється знизу-по-центру екрана одразу після
   успішної побудови маршруту через <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>. */
#planRouteHud{
  display:none; position:fixed; left:50%; bottom:14px; z-index:5600;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.82); color:#fff; border:1px solid var(--line); border-radius:12px;
  padding:8px 10px; font-size:13px; max-width:92vw;
  align-items:center; gap:8px; flex-wrap:wrap;
}
#planRouteHud .prh-dist{font-weight:700; white-space:nowrap;}
#planRouteHud .prh-chip{
  background:rgba(255,255,255,0.12); border:1px solid var(--line); border-radius:8px;
  padding:4px 8px; cursor:pointer; white-space:nowrap;
}
#planRouteHud .prh-chip.active{background:var(--cyan); color:#000; border-color:var(--cyan);}
#planRouteHud .prh-close{margin-left:2px; cursor:pointer; opacity:0.75; padding:2px 4px;}
.plan-point-popup .leaflet-popup-content{margin:10px 12px;}


/* Міні-індикатор повороту — на МАЛЕНЬКІЙ (не fullscreen) плитці карти,
   зверху зліва (там, де раніше сидів бейдж ONLINE/OFFLINE — його
   перенесено праворуч, див. .map-tile-badge вище). Ховається у fullscreen
   (там уже є велика HUD-картка) і коли немає найближчого маневру.
   Збільшено — на маленькій плитці попередня версія губилась на ходу. */
.map-tile-turn-mini{
  display:none; position:absolute; top:6px; left:8px; z-index:500;
  background:rgba(0,0,0,0.82); border-radius:12px; padding:7px 12px;
  align-items:center; gap:9px; pointer-events:none;
  box-shadow:0 3px 10px rgba(0,0,0,0.5);
}
.map-tile-turn-mini-arrow{width:28px;height:28px;flex-shrink:0;}
.map-tile-turn-mini-arrow svg{width:100%;height:100%;display:block;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.map-tile-turn-mini-dist{font-size:19px;font-weight:800;color:#fff;font-family:'JetBrains Mono',monospace;white-space:nowrap;}

/* Міні-бейдж "Відхилення від маршруту" — та сама роль, що й navOffEl/
   .nav-reroute-btn у fullscreen, тільки для маленької плитки. "Приклеєний"
   впритул під показник повороту (той не ховається під час відхилення —
   лишається зверху, бейдж просто додається знизу, як друга секція тієї
   самої картки). ВЕСЬ бейдж — одна велика зона дотику (pointer-events:auto
   на самому елементі, не на маленькій кнопці всередині — раніше зона була
   лише 22×22px, важко влучити на ходу). */
.map-tile-offroute-mini{
  display:none; position:absolute; top:50px; left:8px; z-index:500;
  background:rgba(255,77,77,0.92); border-radius:12px; padding:10px 14px;
  align-items:center; font-size:12px; font-weight:700; color:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,0.5); cursor:pointer; pointer-events:auto;
  max-width:200px; line-height:1.3;
}
.map-tile-offroute-mini:active{background:rgba(255,40,40,0.95);}

/* Міні-кнопка "Перебудувати маршрут" — 25.08.2026: за проханням, пара до
   .map-tile-offroute-mini зліва, дзеркально праворуч, той самий top:50px.
   На відміну від .map-tile-offroute-mini (з'являється лише під час
   реального відхилення), ця кнопка доступна ЗАВЖДИ, поки є завантажений
   і видимий маршрут (та сама умова показу, що й у .map-tile-turn-mini) —
   ручний перерахунок від поточної позиції в будь-який момент, не чекаючи
   виявленого відхилення. Колір — зелений (на відміну від червоного
   зліва), щоб дві кнопки не плутались візуально. */
.map-tile-reroute-mini{
  display:none; position:absolute; top:50px; right:8px; z-index:500;
  background:rgba(46,204,113,0.92); border-radius:12px; padding:10px 14px;
  align-items:center; font-size:12px; font-weight:700; color:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,0.5); cursor:pointer; pointer-events:auto;
  max-width:200px; line-height:1.3;
}

/* МУЗИЧНИЙ МІНІ-ПЛЕЄР (плитка "Музика") */
.audio-tile-inner{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px 10px;gap:4px;}
/* flex-shrink:0 на ВСІХ дочірніх елементах плеєра (назва/прогрес/час/
   контроли) — БЕЗ цього, коли їм разом не вистачає висоти (вузька низька
   плитка в альбомній орієнтації), flexbox типово СТИСКАЄ кожен елемент
   пропорційно, щоб влізти в height:100% контейнера. Прогрес-бар при
   цьому стискається менше (в нього явний height), а текст назви — може
   стиснутись у box менший за свій line-height, і тоді сам текст (bez
   власного overflow по вертикалі) виступає за межі своєї стиснутої
   коробки — візуально накладаючись на сусідній елемент (прогрес-бар).
   flex-shrink:0 повністю забороняє це стиснення: кожен елемент завжди
   рендериться в повний природний розмір, а якщо загалом не вистачає
   місця — просто останні елементи (контроли) обріже overflow:hidden
   плитки знизу, а не покалічить/накладе одне на одне все підряд.*/
.at-title,.at-progress,.at-times,.at-controls{flex-shrink:0;}
.at-title{font-weight:700;font-size:clamp(15px,4vw,21px);color:#fff;line-height:1.15;
  text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.at-artist{font-size:11px;color:var(--muted);text-align:center;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.at-progress{position:relative;width:100%;height:20px;display:flex;align-items:center;
  touch-action:none;cursor:pointer;margin-top:2px;}
.at-progress::before{content:'';position:absolute;left:0;right:0;top:50%;height:3px;
  transform:translateY(-50%);background:rgba(255,255,255,0.12);border-radius:2px;}
.at-progress::after{content:'';position:absolute;left:0;right:0;top:-16px;bottom:0;}
.at-progress-fill{position:absolute;left:0;top:50%;height:3px;transform:translateY(-50%);
  background:var(--cyan);border-radius:2px;width:0%;pointer-events:none;}
.at-progress-handle{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
  background:var(--cyan);transform:translate(-50%,-50%);left:0%;
  box-shadow:0 0 6px rgba(55,224,230,0.7);pointer-events:none;}
.at-times{width:100%;display:flex;justify-content:space-between;font-size:10px;
  color:var(--muted);font-family:'JetBrains Mono','Courier New',monospace;margin-top:-2px;}
.at-controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:2px;}
/* Кнопки плеєра — скляні заокруглені квадрати (напівпрозорий темний фон
   + backdrop-blur), іконки чисті SVG-трикутники/паузи замість емодзі
   (емодзі рендерились по-різному на різних пристроях і не давали
   контролювати колір/товщину). Розмір керується font-size (em-одиниці
   нижче) — так усі наявні перевизначення розміру під s21/landscape
   (нижче по файлу) далі працюють без змін. */
.at-btn{border:none;cursor:pointer;padding:0;line-height:1;
  width:1.3em;height:1.3em;border-radius:0.4em;flex-shrink:0;
  background:rgba(24,32,36,0.55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  color:rgba(255,255,255,0.82);
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;transition:transform 0.12s ease,background 0.12s ease,box-shadow 0.12s ease;}
.at-btn svg{width:56%;height:56%;display:block;}
.at-btn.at-play{font-size:2.05rem;width:1.55em;height:1.55em;border-radius:0.48em;
  background:rgba(13,42,44,0.55);color:#2fe6df;
  box-shadow:0 0 12px rgba(47,230,223,0.32), inset 0 0 10px rgba(47,230,223,0.08);}
.at-btn.at-play svg{filter:drop-shadow(0 0 4px #2fe6df) drop-shadow(0 0 9px #17c9c2);}
.at-btn:hover{transform:scale(1.08);}
/* Підсвітка при натисканні — і сама кнопка яскравіє, і з'являється
   неонове світіння (у play/pause — бірюзове, як основний колір кнопки;
   у прев/некст — легше, білясте), щоб дотик відчувався "живим", а не
   просто зменшенням розміру. */
.at-btn:active{transform:scale(0.9);
  background:rgba(70,90,96,0.75);
  box-shadow:0 0 10px rgba(180,230,230,0.4);}
.at-btn.at-play:active{
  background:rgba(20,60,62,0.8);
  box-shadow:0 0 18px rgba(47,230,223,0.6), inset 0 0 14px rgba(47,230,223,0.2);}
.at-btn:active{transform:scale(0.92);}
.at-btn:disabled{opacity:0.3;cursor:default;transform:none!important;}
.audio-tile-inner.empty .at-controls,.audio-tile-inner.empty .at-progress,
.audio-tile-inner.empty .at-times{opacity:0.35;pointer-events:none;}
/* Режим розташування плиток (editMode, клас .ed на .tile): плеєр не має
   реагувати на власні контроли (плей/трек/перемотування/довгий тап на
   перелік) — інакше тап, що мав пересунути/змінити розмір плитки,
   випадково перемикав трек чи паузу. pointer-events:none тут пропускає
   тач/клік НАСКРІЗЬ до батьківської .tile, де й спрацьовує звичайний
   механізм editMode "два прицільні тапи". */
.tile.ed .audio-tile-inner{pointer-events:none;}
/* Плитка "Музика" у компактному розмірі 2×1 (s21, за замовчуванням) —
   кнопки трохи менші, щоб гарантовано лишалось місце під назву треку.
   Не про красу великих іконок — про те, щоб узагалі бачити, що зараз
   грає. */
.tile.s21 .audio-tile-inner{gap:2px;padding:4px 8px;}
.tile.s21 .at-controls{gap:10px;margin-top:0;}
.tile.s21 .at-btn{font-size:1.3rem;}
.tile.s21 .at-btn.at-play{font-size:1.5rem;}
.tile.s21 .at-progress{margin-top:0;}
/* "Трек N з M" — прибрано ЗАВЖДИ (не тільки для s21), незалежно від
   розміру плитки. Раніше правило діяло лише на .tile.s21, але плитка
   музики буває й ширшою (напр. s41) — там рядок так само налазив на
   назву треку. Важливіше бачити ЩО грає, ніж порядковий номер треку. */
.at-artist{display:none;}
/* Landscape-сітка тут вужча по колонках (12 замість 4 — той самий span:2
   дає набагато меншу реальну ширину) і нижча по рядках (100-150px проти
   130-170px у портреті) — того самого стиснення, що вже зроблено вище,
   виявилось замало: назва все одно не влазила. Стискаємо ще агресивніше
   саме тут. */
html.ar-landscape .tile.s21 .audio-tile-inner{gap:1px;padding:3px 6px 23px;
  /* КРИТИЧНО: базовий .audio-tile-inner центрує вміст (justify-content:
     center) — на цій вузькій низькій плитці, якщо весь вміст (назва+
     прогрес+час+контроли) хоч трохи не влазить по висоті, центрування
     ріже його ЗВЕРХУ першим, тобто саме назву (це і трапилось раніше).
     flex-start прибиває вміст до верху — тепер у гіршому разі обріже
     НИЗ (контроли), а назва лишається видною завжди, за будь-якої
     реальної висоти плитки на будь-якому пристрої. */
  justify-content:flex-start;}
/* Попередня спроба (від'ємний margin-top на назві) ховала назву зовсім —
   на цій вузькій низькій плитці .tile має overflow:hidden, і якщо весь
   вміст (назва+прогрес+час+контроли) хоч трохи не влазить по висоті,
   center-вирівнювання обрізає його ЗВЕРХУ першим — тобто саме назву.
   Тому тепер не зсуваємо назву від'ємним відступом, а звільняємо місце
   ЗМЕНШЕННЯМ інших елементів (прогрес-лінія нижча, менший шрифт часу) —
   надійніше, ніж підганяти негативними полями впритул до межі обрізання. */
html.ar-landscape .tile.s21 .at-title{font-size:clamp(11px,3vw,13px);line-height:1.15;}
html.ar-landscape .tile.s21 .at-controls{gap:5px;margin-top:0;}
html.ar-landscape .tile.s21 .at-btn{font-size:0.85rem;}
html.ar-landscape .tile.s21 .at-btn.at-play{font-size:1rem;}
html.ar-landscape .tile.s21 .at-progress{height:10px;margin-top:20px;}
html.ar-landscape .tile.s21 .at-times{font-size:8px;margin-top:-2px;}

/* ПЛИТКА "СЕКУНДОМІР" (17.08.2026) — простіша за музику: тільки цифри +
   дві кнопки (⏹ скидання, ▶/⏸ старт-пауза). Кнопки навмисно перевикористовують
   класи .at-btn/.at-play (стилі музичної плитки) — той самий "скляний
   квадрат" вигляд, без дублювання CSS. */
.sw-tile-inner{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px 10px;gap:10px;}
.sw-time{font-weight:700;font-family:'JetBrains Mono','Courier New',monospace;
  font-size:clamp(20px,7vw,34px);color:#fff;line-height:1;letter-spacing:0.02em;
  text-align:center;flex-shrink:0;}
.sw-controls{display:flex;align-items:center;justify-content:center;gap:18px;flex-shrink:0;}
/* Той самий запобіжник, що й у музичної плитки: в editMode (розкладка
   плиток) кнопки не повинні перехоплювати тап — інакше замість вибору/
   переміщення плитки випадково стартував би/скидався секундомір. */
.tile.ed .sw-tile-inner{pointer-events:none;}
.tile.s21 .sw-tile-inner{gap:4px;padding:4px 8px;}
.tile.s21 .sw-time{font-size:clamp(16px,5vw,22px);}
.tile.s21 .sw-controls{gap:10px;}
.tile.s21 .sw-controls .at-btn{font-size:1.3rem;}
.tile.s21 .sw-controls .at-btn.at-play{font-size:1.5rem;}
html.ar-landscape .tile.s21 .sw-tile-inner{gap:2px;padding:3px 6px 23px;}
html.ar-landscape .tile.s21 .sw-time{font-size:clamp(14px,4vw,18px);}
html.ar-landscape .tile.s21 .sw-controls{gap:6px;}
html.ar-landscape .tile.s21 .sw-controls .at-btn{font-size:0.9rem;}
html.ar-landscape .tile.s21 .sw-controls .at-btn.at-play{font-size:1.05rem;}

@keyframes camDistFlash{0%{opacity:.5;}100%{opacity:1;}}
/* Перевищення ліміту камери (11.08.2026): раніше сам знак-коло змінював
   колір (amber/red) — виявилось погано видно за кермом (маленький знак).
   Тепер сам знак НЕ перефарбовується (лишається білий/чорний, як завжди) —
   основний видимий сигнал перевищення — це колір самої плитки (.tile.warn/
   .tile.alrt, вже існуючий і добре видимий механізм, не чіпати). */
/* Типи камер за адресою з реєстру (闖紅燈=світлофор, 科技執法=тех.контроль).

<script>
// ══════════════════════════════════════════════════════════════════════
// ХАК: приховати системний хром Bluefy (адресний рядок/тулбар) мікро-
// скролом на 1px. #grid сам по собі position:fixed;inset:0 — він НЕ
// прив'язаний до скролу body, тож коли сторінка "проскролюється" на цей
// 1px, візуально на дашборді нічого не зсувається й НЕ РОЗТЯГУЄТЬСЯ —
// просто Bluefy вирішує, що вміст більший за екран, і ховає свій хром, а
// сітка (#gi) автоматично отримує трохи більше видимої висоти. Рядки
// сітки мають свій власний максимум (grid-auto-rows:minmax(130px,170px) +
// align-content:start у CSS #gi) — тобто ця додаткова висота йде на показ
// БІЛЬШЕ рядків плиток чи просто вільний простір знизу, а не на
// розтягування висоти вже існуючих плиток.
//
// v4 (робоча версія, перевірена на пристрої): базу для мікроскролу тепер
// дає сам CSS (html,body { width:100lvw; min-height:100.1vh }) — той самий
// запас 0.1% висоти, що раніше рахувався в JS через window.innerHeight+2px.
// JS-частина відповідає ТІЛЬКИ за сам виклик scrollTo — і саме тому, що
// база вже в CSS, а не рахується щоразу заново, менше шансів розсинхрону
// при швидких змінах орієнтації/розміру. behavior:'instant' — щоб сам
// скрол не було видно (анімований 'smooth' на 1px і так непомітний, але
// 'instant' надійніший на слабших пристроях/при частих викликах).
//
// v5 — ПОВНА ЗАМІНА v4: стара версія лише один раз пробувала сховати хром
// (DOMContentLoaded/load/orientationchange/перший дотик) і НЕ реагувала на
// повернення з фону (перемикання на інший застосунок і назад) — саме тому
// ручну кнопку "Увесь екран" довелось прибрати, бо без ПОВНОГО
// перезавантаження сторінки хак не спрацьовував повторно. v5 додає:
//   1) triggerHack() РЕАГУЄ на visibilitychange/focus/pageshow — тобто
//      щоразу, коли Bluefy повертається з фону (стрибок між застосунками),
//      хак пробує сховати хром ЗАНОВО, а не тільки один раз при завантаженні;
//   2) через `delay` (3с) після спрацювання хак ще й БЛОКУЄ сторінку від
//      скролу (body.no-scroll) — щоб випадковий свайп/rubber-band не
//      відкотив назад і хром не виліз знову;
//   3) кнопка "Блок" у топбарі — ручне перемикання: тап примусово тримає
//      заблоковано (ігноруючи автоматичне розблокування на початку
//      кожного нового triggerHack), повторний тап знімає це і повертає
//      автоматичний режим.
// Функції-фабрики (createButtonController/createScrollHack) — той самий
// код, що й у зовнішньому es-module чернетці, лише прибрано `export`,
// бо тут один інлайновий <script> без модулів.
function createButtonController(buttonElement){
  if(!buttonElement) return null;
  return {
    setLockedState(isLocked){
      if(isLocked){
        buttonElement.textContent='Розблокувати скрол';
        buttonElement.classList.add('locked');
      } else {
        buttonElement.textContent='Заблокувати скрол';
        buttonElement.classList.remove('locked');
      }
    },
    onClick(callback){
      buttonElement.addEventListener('click', callback);
    }
  };
}

// Спільний "лічильник" блокувань скролу — і "Блок" (createScrollHack), і
// анти-дощ (нижче) хочуть додавати/знімати клас body.no-scroll НЕЗАЛЕЖНО
// одне від одного. Якщо кожен просто робив би classList.add/remove сам за
// себе — вимкнення ОДНІЄЇ фічі випадково знімало б блокування ІНШОЇ (напр.
// вимкнув дощ, поки "Блок" був активним вручну — і скрол розблокувався
// б, хоч ти цього не просив). Лічильник вирішує це: клас висить, ПОКИ
// хоч одне джерело тримає лок.
const _scrollLockSources = new Set();
function setBodyScrollLock(source, locked){
  if(locked) _scrollLockSources.add(source); else _scrollLockSources.delete(source);
  document.body.classList.toggle('no-scroll', _scrollLockSources.size>0);
}

// ── Той самий "лічильник джерел" — але для видимості кнопки "📷+"
// (camMarkFab) на дашборді. Кілька незалежних місць хочуть її ховати
// (fullscreen-навігація по карті, режим розташування плиток editMode,
// відкрите меню Налаштувань) — раніше кожне з них напряму писало
// fabEl.style.display, тому закриття ОДНОГО з них (напр. Х у Налаштуваннях)
// могло повернути кнопку видимою, навіть якщо editMode усе ще активний і
// вона там заважає. Лічильник: кнопка схована, ПОКИ хоч одне джерело
// тримає її схованою.
const _camFabHideSources = new Set();
function setCamFabHidden(source, hidden){
  if(hidden) _camFabHideSources.add(source); else _camFabHideSources.delete(source);
  const fabEl=document.getElementById('camMarkFab');
  if(fabEl) fabEl.style.display = _camFabHideSources.size>0 ? 'none' : 'flex';
}

// ── Блокування скролу сторінки, поки відкрита БУДЬ-ЯКА модалка (.mb.sh) ──
// 21.08.2026: за проханням користувача — горизонтальний скрол на
// ГОЛОВНОМУ екрані (коли перемикач "Заблокувати скрол" розблокований)
// свідомо лишається доступним, це вже задокументований "костиль" для
// проблеми ширини — НЕ чіпати. Але коли відкрите Налаштування чи будь-
// яке інше модальне меню (.mb.sh, напр. #em, #pm, #amod), уся сторінка
// НЕ повинна рухатись — усередині меню є власний скрол (.mbody{overflow-
// y:auto}), а фон під ним має лишатись нерухомим. Раніше відкриття цих
// модалок взагалі не викликало setBodyScrollLock — тому й скролилось.
// MutationObserver стежить за class у ВСІХ .mb одразу — це і покриває
// існуючі #em/#pm/#amod, і будь-яку майбутню модалку з тим самим
// патерном, без потреби правити кожне місце відкриття/закриття окремо.
(function(){
  function anyModalOpen(){ return document.querySelector('.mb.sh, .dbgc.sh')!==null; }
  const mo=new MutationObserver(function(){ setBodyScrollLock('modal', anyModalOpen()); });
  document.querySelectorAll('.mb, .dbgc').forEach(function(el){
    mo.observe(el, {attributes:true, attributeFilter:['class']});
  });
})();

// ── "Тихе вікно" навколо resize/orientationchange (поворот екрана АБО
// поява/зникнення системної клавіатури — обидва шлють 'resize') ──
// 20.08.2026: причина вильотів при повороті екрана й появі клавіатури —
// кілька важких операцій (invalidateSize карти + перезапит тайлів,
// примусовий window.scrollTo() з createScrollHack, viewport-meta push із
// forceResetViewportZoom) намагались виконатись ОДНОЧАСНО з природним
// важким reflow, який WebKit і так робить сам під час самого повороту чи
// зміни висоти вьюпорта під клавіатуру. _viewportBusyUntil — позначка
// часу, оновлюється на кожен resize/orientationchange; поки не минула —
// перелічені важкі фонові дії нижче відкладаються (не скасовуються, а
// саме ЧЕКАЮТЬ, поки стане тихо, і тоді виконуються один раз).
let _viewportBusyUntil=0;
const VIEWPORT_BUSY_MS=500;
function markViewportBusy(){ _viewportBusyUntil=Date.now()+VIEWPORT_BUSY_MS; }
function isViewportBusy(){ return Date.now()<_viewportBusyUntil; }
window.addEventListener('resize', markViewportBusy);
window.addEventListener('orientationchange', markViewportBusy);

// ── ПРОТОТИП: свайп-затемнення в зоні нижнього ряду плиток ──
// 21.08.2026: справжньої яскравості екрана з веб-сторінки не змінити —
// імітуємо чорним напівпрозорим шаром (#brightnessOverlay) понад усім.
// 25.08.2026 (зона): звужена до фактичного прямокутника нижнього ряду
// ЗВИЧАЙНИХ плиток (за скріном користувача) — раніше перевірялась лише
// Y-координата (нижні ~150px на всю ширину екрана), через що жест
// хибно спрацьовував і НАД плиткою карти справа (вона займає ту саму
// нижню смугу по висоті). Тепер додатково виключаємо прямокутник плитки
// карти (.tile.map-tile), якщо вона зараз на екрані — читаємо її
// getBoundingClientRect() щоразу наживо (не кешуємо), бо картка
// перебудовується при кожному render() і може змінити позицію/розмір.
// 25.08.2026 (фіксація): за проханням — рівень затемнення ТЕПЕР
// зберігається в localStorage (ключ 'ar_brightnessDarkness') і
// відновлюється одразу при завантаженні сторінки, замість того, щоб
// щоразу скидатись на 0. Зберігаємо не на кожен touchmove (це було б
// занадто часто), а лише на touchend/touchcancel — по завершенню жесту.
(function(){
  const BRIGHTNESS_ZONE_H=150; // px від низу екрана — спрощена "нижня зона"
  const MAX_DARKNESS=0.85; // ніколи не гасимо повністю в чорне — екран лишається читабельним
  let darkness=0; // 0..1 — відновлюється з localStorage нижче при старті
  try{ const saved=lg('brightnessDarkness'); if(typeof saved==='number' && isFinite(saved)) darkness=Math.max(0, Math.min(MAX_DARKNESS, saved)); }catch(e){}
  let active=false, confirmed=false, startX=0, lastX=0, startDarkness=0;
  const overlay=document.getElementById('brightnessOverlay');
  function applyDarkness(){ if(overlay) overlay.style.opacity=darkness.toFixed(2); }
  applyDarkness(); // застосувати відновлене значення одразу, не чекаючи першого жесту
  function saveDarkness(){ try{ ls('brightnessDarkness', darkness); }catch(e){} }
  // 25.08.2026: зона дотику = нижні BRIGHTNESS_ZONE_H px, ЗА ВИНЯТКОМ
  // прямокутника плитки карти (та займає ту саму нижню смугу праворуч,
  // на неї свайп-жест заважав би pinch/пану карти). Немає плитки карти
  // на екрані зараз — уся нижня смуга доступна, як і раніше.
  function inBottomZone(x,y){
    if(y <= (window.innerHeight - BRIGHTNESS_ZONE_H)) return false;
    const mapEl=document.querySelector('.tile.map-tile');
    if(mapEl){
      const r=mapEl.getBoundingClientRect();
      if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return false;
    }
    return true;
  }
  // 21.08.2026: лише на домашньому екрані (дашборд) — НЕ в Налаштуваннях/
  // будь-якій іншій модалці (.mb.sh, .dbgc.sh), і НЕ на fullscreen-карті
  // (.tile.map-fullscreen). Раніше гейт був лише "чи заблокований скрол"
  // (body.no-scroll) — а це тепер ЗАГАЛЬНИЙ прапорець (джерело 'modal'
  // теж його ставить, поки відкрите Налаштування), тож жест міг хибно
  // спрацювати і там. Тепер перевіряємо явно, а не через побічний ефект.
  function onHomeScreen(){
    return document.body.classList.contains('no-scroll')
      && !document.querySelector('.mb.sh, .dbgc.sh')
      && !document.querySelector('.tile.map-fullscreen');
  }

  document.addEventListener('touchstart', function(e){
    if(e.touches.length!==1) return;
    if(!onHomeScreen()) return;
    const t=e.touches[0];
    if(!inBottomZone(t.clientX, t.clientY)) return;
    active=true; confirmed=false; startX=t.clientX; lastX=t.clientX; startDarkness=darkness;
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    if(!active || e.touches.length!==1) return;
    const t=e.touches[0];
    const dx=t.clientX-startX;
    if(!confirmed){
      if(Math.abs(dx)<10) return; // ще не певно, що це свайп, а не звичайний тап — не чіпаємо
      confirmed=true;
    }
    // 21.08.2026: повернуто до першої версії за проханням користувача —
    // ВЛІВО темніше, ВПРАВО світліше (пробували навпаки, не сподобалось).
    darkness=Math.max(0, Math.min(MAX_DARKNESS, startDarkness - dx/300));
    applyDarkness();
    lastX=t.clientX;
  }, {passive:true});

  document.addEventListener('touchend', function(){
    if(active && confirmed) saveDarkness(); // 25.08.2026: фіксуємо результат жесту
    active=false; confirmed=false;
  }, {passive:true});
  document.addEventListener('touchcancel', function(){ active=false; confirmed=false; }, {passive:true});
})();

// 20.08.2026: тут стояла спроба автокорекції горизонтального зсуву при
// клавіатурі через window.visualViewport (scrollTo на detected offsetLeft)
// — ВИМКНЕНО за результатами тесту: не допомогло, і, схоже, почало
// підрізати картинку карти (примусовий scrollTo зайвий раз під час
// активної роботи з fullscreen-картою). Питання зсуву відкладено —
// пріоритетніші задачі важливіші за цей косметичний глюк.

function createScrollHack(options){
  options = options || {};
  const delay = options.delay!=null ? options.delay : 3000;
  const onStateChange = options.onStateChange;

  let scrollTimer=null;
  let isManuallyLocked=false;
  let isLocked=false;
  // 18.08.2026 (виправлення бага): якщо палець ФІЗИЧНО ще на екрані —
  // НЕ смикати window.scrollTo() у цю мить. Це і є найімовірніша причина
  // одразу двох скарг: "подвійний/потрійний тап по карті іноді не
  // спрацьовує" і "кнопка Дощ та інші тач-зони на мить зміщуються".
  // Причина: triggerHack() запускається не лише по таймеру, а й по
  // 'focus'/'visibilitychange' — а ці події МОЖУТЬ спрацювати ПІД ЧАС
  // самого жесту (напр. тап по плитці карти забирає фокус з елемента,
  // який його тримав раніше). Якщо scrollTo() зсуває сторінку рівно між
  // touchstart і touchend ОДНОГО Й ТОГО САМОГО тапу — координати
  // touchstart і touchend опиняються у РІЗНИХ системах відліку, і Leaflet
  // (чи будь-який інший обробник) бачить це як зсув/драг, а не чистий тап
  // — лічильник тапів у st.tapBuf збивається, кнопки під пальцем "їдуть".
  // Рішення: відкладаємо виклик до touchend цього ж жесту.
  let touchActive=false;
  let pendingAfterTouch=false;

  function updateLockState(locked){
    isLocked=locked;
    setBodyScrollLock('scrollhack', locked);
    if(onStateChange) onStateChange(isLocked, isManuallyLocked);
  }

  function triggerHack(){
    // 15.08.2026: не смикати скрол (window.scrollTo), поки в фокусі
    // текстове поле — тобто поки відкрита системна клавіатура. Саме тут,
    // найімовірніше, і крилась причина "ширина застосунку зважується
    // після вводу адреси" в Bluefy: window 'focus'/'orientationchange'
    // природно спрацьовують і під час самого відкриття/закриття
    // клавіатури, а примусовий window.scrollTo({top:1}) у ЦЕЙ момент
    // конфліктував із власним перерахунком вьюпорта WebKit під клавіатуру
    // — і ширина лишалась "поламаною". Проста перевірка activeElement
    // повністю вимикає хак, поки хтось реально друкує.
    const ae=document.activeElement;
    if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT')) return;
    if(touchActive){ pendingAfterTouch=true; return; } // 18.08.2026: див. коментар вище — відкласти до touchend
    if(isViewportBusy()){
      // 20.08.2026: тихе вікно (поворот екрана / клавіатура щойно
      // з'явилась чи зникла) — не смикати scrollTo ЗАРАЗ, конкуруючи з
      // власним reflow WebKit; спробувати ще раз одразу, як стане тихо.
      setTimeout(triggerHack, VIEWPORT_BUSY_MS);
      return;
    }
    if(isManuallyLocked && isLocked) return;
    if(!isManuallyLocked) updateLockState(false);
    if(window.scrollY===0) window.scrollTo({top:1, behavior:'instant'});
    clearTimeout(scrollTimer);
    scrollTimer=setTimeout(function(){
      if(!isManuallyLocked) updateLockState(true);
    }, delay);
  }

  function initListeners(){
    // Перемикання додатків / вкладки — ГОЛОВНЕ нововведення v5, саме
    // цього не було в v4: щоразу як Bluefy повертається з фону (стрибок
    // між застосунками), пробуємо сховати хром ЗАНОВО.
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) triggerHack();
    });
    window.addEventListener('focus', triggerHack);
    window.addEventListener('pageshow', triggerHack);

    window.addEventListener('orientationchange', function(){
      setTimeout(triggerHack, 200);
    });

    // 18.08.2026: capture:true — щоб ловити touchstart/touchend НАВІТЬ
    // якщо якийсь обробник плитки нижче по дереву викличе
    // stopPropagation() (карта, POI-редактор тощо це роблять для своїх
    // тапів). passive:true — самі нічого не відміняємо, лише читаємо.
    window.addEventListener('touchstart', function(){ touchActive=true; }, {passive:true, capture:true});
    window.addEventListener('touchend', function(){
      touchActive=false;
      if(pendingAfterTouch){
        pendingAfterTouch=false;
        // Невелика затримка — дати самому тапу (лічильник кліків карти,
        // click-обробники кнопок тощо) спершу повністю відпрацювати в
        // СТАБІЛЬНІЙ геометрії, і лише ПОТІМ смикати scrollTo.
        setTimeout(triggerHack, 80);
      }
    }, {passive:true, capture:true});
    window.addEventListener('touchcancel', function(){ touchActive=false; pendingAfterTouch=false; }, {passive:true, capture:true});

    function handleFirstTouch(){
      triggerHack();
      window.removeEventListener('touchstart', handleFirstTouch);
    }
    window.addEventListener('touchstart', handleFirstTouch, {passive:true});

    document.addEventListener('DOMContentLoaded', function(){
      setTimeout(triggerHack, 50);
    });
    window.addEventListener('load', function(){
      setTimeout(triggerHack, 100);
      setTimeout(triggerHack, 300);
    });
  }

  initListeners();

  return {
    toggleManualLock(){
      clearTimeout(scrollTimer);
      if(isLocked){ isManuallyLocked=false; updateLockState(false); }
      else { isManuallyLocked=true; updateLockState(true); }
      return isLocked;
    },
    forceRun: triggerHack
  };
}

// Підключення кнопки "Блок" (#scrollLockBtnTop) у топбарі до хаку.
(function initScrollLockUI(){
  const btnEl=document.getElementById('scrollLockBtnTop');
  const ctrl=createButtonController(btnEl);
  const hack=createScrollHack({
    delay:3000,
    onStateChange:function(isLocked, isManuallyLocked){
      if(ctrl) ctrl.setLockedState(isLocked);
    }
  });
  if(ctrl){
    ctrl.onClick(function(){ hack.toggleManualLock(); });
  }
  window._scrollHack = hack; // для діагностики через консоль (forceRun() вручну за потреби)
})();

// ══════════════════════════════════════════════════════════════════════
// АНТИ-ДОЩ: суцільний непрозорий шар на весь екран, що поглинає ВСІ
// тач-події (краплі дощу на екрані інакше самі "тапають" по застосунку).
// Кнопка "Дощ" (#rainBtnTop) — звичайний .pill у топбарі, той самий
// стиль, що й решта кнопок (просили "у стилі нашого додатку" замість
// окремої плаваючої зеленої кнопки знизу екрана). Розблокування —
// утримати її 1.5с (не одинарний тап, щоб випадкова крапля/дотик рукавом
// не вимкнули захист самі). Активний стан (.rain-active) візуально
// повторює .pill.rec (та сама пульсуюча червона підсвітка, що й у "Лог"
// під час запису) — сам напис лишається просто "Дощ", без пояснювального
// тексту; лише під час утримування для вимкнення текст тимчасово міняється
// на "Утримуйте 1.5с…".
// Адаптація коду користувача: прибрано `export` (тут один інлайновий
// <script>), унікальну плаваючу кнопку замінено на топбарну, і
// document.body.classList.add/remove('no-scroll') замінено на спільний
// setBodyScrollLock('rain', ...) — щоб не збивало паралельне блокування
// скролу через кнопку "Блок" (див. коментар над _scrollLockSources).
function initRainProtection(){
  let isRainModeActive=false;
  let holdTimer=null;

  const btn=document.getElementById('rainBtnTop');
  if(!btn) return;

  const blocker=document.createElement('div');
  blocker.className='rain-blocker';
  blocker.style.display='none';
  // ВАЖЛИВО: додаємо блокер усередину #grid, А НЕ в document.body.
  // Причина: #grid має position:fixed — а position:fixed/sticky ЗАВЖДИ
  // створює власний stacking context, НЕЗАЛЕЖНО від z-index (навіть якщо
  // z-index:auto, як тут). Тобто #grid — це "закрита капсула": жоден
  // z-index усередині нього (наприклад, на .audio-tile-inner) не може
  // візуально піднятись вище елемента ЗА МЕЖАМИ #grid (яким і був
  // блокер, коли сидів у body) — z-index там просто ігнорувався. Коли
  // блокер сидить ВСЕРЕДИНІ #grid (як і сама плитка плеєра), порівняння
  // z-index відбувається в ТІЙ САМІЙ капсулі — і тоді воно нарешті працює.
  // position:fixed у самого блокера прив'язує його до viewport незалежно
  // від того, чий він DOM-нащадок (#grid не має transform/filter/
  // perspective, які змінили б це) — тож усе так само покриває весь
  // екран, як і раніше.
  document.getElementById('grid').appendChild(blocker);

  // 1. Поглинаємо всі тачі та кліки на блокувальному шарі (поглинаємо краплі)
  const preventEvent=function(e){ e.preventDefault(); e.stopPropagation(); };
  ['touchstart','touchmove','touchend','click','pointerdown'].forEach(function(evt){
    blocker.addEventListener(evt, preventEvent, {passive:false});
  });

  // ПОПЕРЕДНІ ДВІ версії тут ламались:
  // v1 фізично переносила кнопки (#cb/#wsBtnTop/#pipBtnTop/#rainBtnTop) в
  // document.body через appendChild і повертала insertBefore — крихко
  // (перенесення/повернення могло збитись, кнопка "Дощ" переставала
  // реагувати взагалі), і топбар видимо "смикався".
  // v2 замінила це на CSS: піднімала ВЕСЬ .tb над блокером через z-index
  // і гасила pointer-events на .tb цілком (з винятками для 4 кнопок). Це
  // виглядало чистіше, але зламало саме "Дощ" в альбомній орієнтації:
  // зміна z-index/pointer-events на .tb — ПРЯМОМУ БАТЬКОВІ кнопки, яку
  // САМЕ ЗАРАЗ утримує палець — посеред активного дотику провокує WebKit
  // перестворити композитний шар для .tb, і iOS (Bluefy) після цього
  // губить touchend/видає туchcancel не в той момент. Наслідок: утримання
  // для ВИМКНЕННЯ дощу інколи обривалось саме собою, не долічавши 1.5с.
  // v3 (поточна): .tb взагалі НЕ чіпаємо жодним стилем. Натомість:
  //  1) .rain-blocker просто не накриває смугу топбару — top підганяється
  //     під фактичну висоту .tb (getBoundingClientRect().bottom) нижче,
  //     тож топбар і так завжди "над" блокером без жодних власних стилів;
  //  2) кнопки, які МАЮТЬ лишатись заблокованими (Лог, Звук, Консоль,
  //     Заблокувати скрол, Налаштувати) — гасимо pointer-events САМЕ НА
  //     НИХ (див. CSS) — вони не мають стосунку до поточного дотику на
  //     "Дощ", тож зміна їхніх стилів нічого не рве.
  // Кнопка "Дощ" при цьому взагалі ніким не чіпається — ні вона сама, ні
  // її прямий батько — тож жест утримання більше нічим не переривається.
  function positionBlockerBelowTopbar(){
    const tb=document.querySelector('.tb');
    if(tb) blocker.style.top=Math.ceil(tb.getBoundingClientRect().bottom)+'px';
  }

  // 2. Логіка утримування кнопки (захист від випадкового натискання краплею)
  function startHold(){
    if(!isRainModeActive){ activateRainMode(); return; }
    btn.textContent='Утримуйте 1.5с…';
    holdTimer=setTimeout(function(){ deactivateRainMode(); }, 1500);
  }

  function cancelHold(){
    clearTimeout(holdTimer);
    if(isRainModeActive) btn.textContent='Дощ';
  }

  function activateRainMode(){
    isRainModeActive=true;
    positionBlockerBelowTopbar();
    document.body.classList.add('rain-mode-active');
    blocker.style.display='block';
    setBodyScrollLock('rain', true);
    btn.textContent='Дощ';
    btn.classList.add('rain-active');
  }

  function deactivateRainMode(){
    isRainModeActive=false;
    document.body.classList.remove('rain-mode-active');
    blocker.style.display='none';
    setBodyScrollLock('rain', false);
    btn.textContent='Дощ';
    btn.classList.remove('rain-active');
  }

  btn.addEventListener('touchstart', startHold, {passive:true});
  btn.addEventListener('touchend', cancelHold);
  btn.addEventListener('touchcancel', cancelHold);

  // Якщо телефон повернули (портрет↔альбом) ПОКИ дощовий захист уже
  // активний — висота топбару могла змінитись (інша сітка/шрифти), тож
  // перерахунок top для блокера теж потрібен, інакше межа "де починається
  // блок" з'їде відносно реальної висоти топбару після повороту.
  window.addEventListener('resize', function(){ if(isRainModeActive) positionBlockerBelowTopbar(); });
}
initRainProtection();

// ══════════════════════════════════════════════════════════════════════
// ВЛАСНА КОНСОЛЬ — ставимо це ПЕРШИМ рядком скрипта, щоб перехопити геть
// усі console.log/warn/error, які трапляться далі (включно з усіма нашими
// діагностичними [mbtiles]-логами). Кнопка "Консоль" у топбарі показує
// цю панель — не треба лізти в підменю Bluefy.
// ══════════════════════════════════════════════════════════════════════
const _consoleLog=[];
const _origConsole={log:console.log,warn:console.warn,error:console.error};
function _pushConsoleLine(type,args){
  const line=Array.from(args).map(a=>{
    if(a instanceof Error) return a.message;
    if(typeof a==='object'){ try{ return JSON.stringify(a); }catch(e){ return String(a); } }
    return String(a);
  }).join(' ');
  const t=new Date();
  const stamp=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
  _consoleLog.push({type,line,stamp});
  if(_consoleLog.length>400) _consoleLog.shift(); // не даємо рости безмежно
  const panel=document.getElementById('dbgConsolePanel');
  if(panel && panel.classList.contains('sh')) renderConsolePanel();
}
console.log=function(...args){ _origConsole.log.apply(console,args); _pushConsoleLine('log',args); };
console.warn=function(...args){ _origConsole.warn.apply(console,args); _pushConsoleLine('warn',args); };
console.error=function(...args){ _origConsole.error.apply(console,args); _pushConsoleLine('error',args); };
window.addEventListener('error', e=>{ _pushConsoleLine('error', [(e.message||'Error')+' @ '+(e.filename||'')+':'+(e.lineno||'')]); });
window.addEventListener('unhandledrejection', e=>{ _pushConsoleLine('error', ['Unhandled promise rejection: '+(e.reason&&e.reason.message||e.reason)]); });
function toggleConsolePanel(){
  const p=document.getElementById('dbgConsolePanel');
  if(!p) return;
  p.classList.toggle('sh');
  if(p.classList.contains('sh')) renderConsolePanel();
}
function renderConsolePanel(){
  const body=document.getElementById('dbgc-body');
  if(!body) return;
  body.innerHTML=_consoleLog.map(e=>'<div class="dbgc-line '+e.type+'">['+e.stamp+'] '+
    e.line.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>').join('') || '<div class="dbgc-line log">(поки що порожньо)</div>';
  body.scrollTop=body.scrollHeight;
}
function clearConsoleLog(){ _consoleLog.length=0; renderConsolePanel(); }
async function copyConsoleLog(){
  const text=_consoleLog.map(e=>'['+e.stamp+'] '+e.type.toUpperCase()+': '+e.line).join('\n');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); sht('Скопійовано в буфер'); }
    else throw new Error('no clipboard api');
  }catch(e){ console.warn('Копіювання в буфер не спрацювало:', e); alert(text); }
}
