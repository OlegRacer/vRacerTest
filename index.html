    if(e && e.name==='NotFoundError'){
      // Юзер сам скасував системний пікер вибору пристрою — не запускаємо
      // цикл ретраїв, це не збій зв'язку, а свідома відмова.
      console.log('[ble] користувач сам закрив пікер вибору пристрою — цикл ретраїв НЕ запускаємо');
      btn.innerHTML=CONN_DOT_IDLE_SVG+"З'єднання"; btn.className='pill';
      bs.textContent='bLink3'; bs.className='pill';
      return;
    }
    console.warn('[ble] requestConnect('+reason+') не вдалась:', e && e.message);
    // 25.08.2026: дублюємо причину в тост — щоб було видно ЯКИЙ САМЕ крок
    // не відповів (getPrimaryService/getCharacteristic/startNotifications/
    // initSession), не заглядаючи в консоль розробника, якої на телефоні
    // зазвичай немає під рукою.
    if(e && e.message) sht('⚠️ '+e.message);
    if(bDev && !userDisconnected && reason!=='background-retry'){
      console.log('[ble] запускаю scheduleBackgroundRetryLoop() з catch (reason='+reason+')');
      scheduleBackgroundRetryLoop(); // фоновий цикл з паузами підхопить подальші спроби
    } else if(reason==='background-retry'){
      console.log('[ble] це й так виклик З циклу ретраю (reason=background-retry) — цикл сам продовжить на наступній ітерації, новий не стартуємо');
    } else if(reason!=='background-retry'){
      // РАНІШЕ помилка показувалась в ОКРЕМІЙ сусідній пігулці (bs), а сама
      // кнопка "Connect" тихо скидалась назад до звичайного вигляду — тобто
      // видимої ознаки збою на самій кнопці не було. Тепер кнопка "З'єднання"
      // сама перетворюється на "⚠️ Помилка" (той самий елемент, той самий
      // тап = повторна спроба) — саме так, як просив користувач.
      btn.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Помилка'; btn.className='pill err';
      bs.textContent='Error'; bs.className='pill err';
    }
  }
}

// ── Фоновий цикл ретраїв (з паузами) — старт лише через onUnexpectedDisconnect
// або невдалу requestConnect(); сам цикл лише планує повторні виклики
// requestConnect('background-retry'), жодної власної копії connect-логіки. ──
let _bgRetryRunning=false;
let _bgRetryLastBeat=0; // 25.08.2026: "пульс" циклу — оновлюється на кожній ітерації, щоб відрізнити "цикл справді працює" від "прапорець застряг true з давньої сесії"
let _bgRetryHiddenSince=null; // коли застосунок пішов у фон ПІД ЧАС активного циклу ретраїв
const BG_RETRY_GIVEUP_MS = 10*60*1000; // 10 хв у фоні без з'єднання — цикл сам здається
async function scheduleBackgroundRetryLoop(){
  console.log('[ble] scheduleBackgroundRetryLoop() викликано. _bgRetryRunning='+_bgRetryRunning);
  if(_bgRetryRunning){
    // 25.08.2026: КРИТИЧНИЙ фікс "треба тапати, автопідключення не працює".
    // Цей м'ютекс мав захищати від паралельних циклів — але якщо ПОПЕРЕДНІЙ
    // цикл з якоїсь причини завершився ненормально (не дійшовши до
    // _bgRetryRunning=false в кінці функції), прапорець лишався true
    // НАЗАВЖДИ до перезавантаження сторінки — і КОЖЕН наступний реальний
    // розрив з'єднання просто мовчки не запускав жодної спроби
    // перепідключення (тут return виконувався одразу). Ручний тап при
    // цьому й далі працював, бо onConnectButtonClick() викликає
    // requestConnect() НАПРЯМУ, обходячи цей цикл повністю — тому й
    // складалось враження "само не підключається, а тапом — одразу". Тепер
    // перевіряємо "пульс": якщо цикл не оновлював його останні 30с — він
    // явно мертвий, і ми безпечно стартуємо новий замість того, щоб мовчки
    // здаватись.
    if(Date.now()-_bgRetryLastBeat < 30000) return;
    console.warn('[ble] _bgRetryRunning був застряглий (>30с без "пульсу") — примусово скидаємо і стартуємо цикл заново');
  }
  _bgRetryRunning=true;
  _bgRetryLastBeat=Date.now();
  const bs=document.getElementById('bs');
  let attempt=0;
  _bgRetryHiddenSince = document.visibilityState==='hidden' ? Date.now() : null;
  while(!userDisconnected && !bConn){
    attempt++;
    _bgRetryLastBeat=Date.now();
    const hidden = document.visibilityState==='hidden';
    if(hidden){
      if(_bgRetryHiddenSince===null) _bgRetryHiddenSince=Date.now();
      // 10 хв у фоні без з'єднання — далі пробувати вже немає сенсу (скутер,
      // найімовірніше, просто вимкнений надовго — пішов їсти, закінчив
      // поїздку), самі здаємось. Повернувшись на екран, "foreground"-гілка
      // visibilitychange (окремий код вище) і так одразу сама спробує ще
      // раз — просто не годинами мовчки товчеться в фоні до того моменту.
      if(Date.now()-_bgRetryHiddenSince > BG_RETRY_GIVEUP_MS){
        console.log('[ble] фоновий цикл ретраїв здався після 10хв у фоні без з\'єднання');
        if(bs) bs.textContent='Не підключено';
        btn.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Не підключено'; btn.className='pill err';
        break;
      }
    } else {
      _bgRetryHiddenSince=null;
    }
    // Перші 10 спроб на передньому плані — швидко (кожні 1.5с), далі —
    // рідше (кожні 5с). У ФОНІ — так само, як стандартний фоновий BLE-скан
    // у самому iOS (Core Bluetooth сам глушить частоту сканування, поки
    // застосунок не на екрані) — раз на ~15с, а не кожні 1.5-5с, які мали
    // сенс тільки для швидкого відгуку, поки дивишся на екран.
    const delay = hidden ? 15000 : (attempt<=10?1500:5000);
    console.log('[ble] цикл ретраю: спроба #'+attempt+', сплю '+delay+'мс перед наступною спробою');
    await interruptibleSleep(delay);
    if(userDisconnected||bConn) break;
    if(!isConnecting || (Date.now()-_connectingSince > 25000)){
      if(isConnecting){
        // 25.08.2026: той самий принцип самозахисту, що й для _bgRetryRunning
        // вище — якщо isConnecting тримається true довше за 25с (набагато
        // більше за суму всіх таймаутів одного повного підключення:
        // 4с×3 кроки + ~4.6с initSession ≈ 17с максимум), це означає, що
        // ПОПЕРЕДНЯ спроба десь застрягла (напр. рідкісна гонитва станів
        // між реальним розривом і паралельною спробою підключення), і
        // м'ютекс більше НЕ захищає, а блокує. Без цього цикл ретраю просто
        // крутився б, збільшуючи номер спроби на екрані, ніколи насправді
        // НЕ викликаючи requestConnect() — саме симптом "показує спробу
        // підключення, а насправді нічого не робить".
        console.warn('[ble] isConnecting застряг true понад 25с — примусово скидаю перед новою спробою');
        isConnecting=false;
      }
      console.log('[ble] цикл ретраю: викликаю requestConnect(background-retry), спроба #'+attempt);
      await requestConnect('background-retry');
    } else {
      console.log('[ble] цикл ретраю: ПРОПУСКАЮ спробу #'+attempt+' — isConnecting вже true (можливо, застрягла попередня спроба)');
    }
    if(!bConn && !userDisconnected){
      if(bs) bs.textContent='Перепідключення… (#'+attempt+')';
      btn.textContent='⏳ Перепідключення (#'+attempt+')'; btn.className='pill go';
    }
  }
  console.log('[ble] цикл ретраю завершився. bConn='+bConn+', userDisconnected='+userDisconnected);
  _bgRetryRunning=false;
  _bgRetryHiddenSince=null;
}

// ── ПОВНЕ ВІДКЛЮЧЕННЯ (довге натискання) ──
async function fullDisconnect(){
  userDisconnected=true; // зупиняє будь-який активний цикл перепідключення
  kickReconnectNow(); // якщо цикл спить в очікуванні — будимо його одразу, щоб він побачив userDisconnected і вийшов
  if(typeof stopPipWorkerTimer==='function') stopPipWorkerTimer(); // не лишати вічний фоновий таймер після явного відключення
  try{ await sendCmd(CMD_STOP); }catch(e){}
  forceHardResetState();
  btn.innerHTML=CONN_DOT_IDLE_SVG+"З'єднання"; btn.className='pill';
  document.getElementById('bs').textContent='bLink3';
  document.getElementById('bs').className='pill';
  exitFullscreenSafe();
}

// ── ОБРОБНИК КЛІКУ "Connect" ──
async function onConnectButtonClick(){
  if(bConn){
    // Підключено, але користувач хоче форснути перепідключення (наприклад,
    // дані виглядають застряглими) — розриваємо, подія gattserverdisconnected
    // сама підхопить і почне scheduleBackgroundRetryLoop() (перша спроба швидка).
    try{ bDev.gatt.disconnect(); }catch(e){}
    return;
  }
  // Немає з'єднання (можливо, зараз саме триває isConnecting) — requestConnect
  // сам вирішить: форсує reset і чистий конект (якщо є застрягла спроба),
  // або просто підключиться (до нового пристрою, якщо bDev ще нема, чи до
  // вже відомого напряму, без нового системного пікера).
  await requestConnect(bDev ? 'user-click' : 'initial');
}

// ── РОЗПІЗНАВАННЯ ЖЕСТУ: швидкий тап vs довге натискання ──
const LONG_PRESS_MS=550;
let pressTimer=null, longFired=false;
btn.addEventListener('pointerdown',()=>{

setupBleUI(); // одноразове налаштування при завантаженні (НЕ на кожен клік —
// раніше через це на кожен клік Connect/Disconnect ще й додавався ЗАЙВИЙ

// ── Подія "GATT сам розірвався" (втрата сигналу, вимкнений скутер тощо) ──
// Лише прибирає стан і, якщо це не було свідоме відключення користувачем,
// підхоплює фоновий цикл ретраїв. Жодної власної копії connect-логіки.
function onUnexpectedDisconnect(){
  console.log('[ble] onUnexpectedDisconnect() викликано. userDisconnected='+userDisconnected+', bDev='+(bDev?'є':'немає'));
  // 25.08.2026: КОЖЕН крок в окремому try/catch зі своїм логом. Причина —
  // попередній тест показав, що після першого логу виконання зупинялось
  // БЕЗ жодного запису про помилку (ні ERROR, ні Unhandled promise
  // rejection), хоча window.onerror/unhandledrejection тут підключені.
  // Це означає: або виняток стається десь тут і чомусь не долітає до
  // window.onerror (можлива особливість Bluefy для обробників подій BLE
  // gattserverdisconnected), або якийсь крок "зависає" без помилки. Тепер
  // кожен крок логується ДО і буде видно ПІСЛЯ — якщо один із логів "до"
  // з'явиться, а відповідного "після" не буде, це і вкаже на винуватця.
  try{ bConn=false; stopAlert(); console.log('[ble] onUnexpectedDisconnect: bConn=false, stopAlert() ОК'); }
  catch(e){ console.error('[ble] onUnexpectedDisconnect: ПОМИЛКА в bConn/stopAlert:', e && (e.stack||e.message)); }

  try{ cancelAutoTripStart(); console.log('[ble] onUnexpectedDisconnect: cancelAutoTripStart() ОК'); }
  catch(e){ console.error('[ble] onUnexpectedDisconnect: ПОМИЛКА в cancelAutoTripStart:', e && (e.stack||e.message)); }

  try{
    if(_watchdogInt){ clearInterval(_watchdogInt); _watchdogInt=null; }
    console.log('[ble] onUnexpectedDisconnect: watchdog зупинено ОК');
  }catch(e){ console.error('[ble] onUnexpectedDisconnect: ПОМИЛКА в clearInterval watchdog:', e && (e.stack||e.message)); }

  try{
    Object.keys(V).forEach(k=>V[k]=(k==='RPM'?0:'--'));
    console.log('[ble] onUnexpectedDisconnect: V скинуто, викликаю ud()...');
    ud();
    console.log('[ble] onUnexpectedDisconnect: ud() ОК');
  }catch(e){ console.error('[ble] onUnexpectedDisconnect: ПОМИЛКА в ud():', e && (e.stack||e.message)); }

  try{
    const cbEl=document.getElementById('cb');
    if(cbEl){ cbEl.innerHTML=CONN_SPINNER_SVG+'Розрив з’єднання…'; cbEl.className='pill err'; }
    console.log('[ble] onUnexpectedDisconnect: кнопка оновлена ОК');
  }catch(e){ console.error('[ble] onUnexpectedDisconnect: ПОМИЛКА в оновленні кнопки:', e && (e.stack||e.message)); }

  try{ exitFullscreenSafe(); }catch(e){ console.error('[ble] onUnexpectedDisconnect: ПОМИЛКА в exitFullscreenSafe:', e && (e.stack||e.message)); }

  if(userDisconnected){ console.log('[ble] userDisconnected=true — цикл ретраїв НЕ запускаємо (свідоме відключення)'); return; }
  console.log('[ble] викликаю scheduleBackgroundRetryLoop()');
  try{
    scheduleBackgroundRetryLoop();
  }catch(e){ console.error('[ble] onUnexpectedDisconnect: ПОМИЛКА при виклику scheduleBackgroundRetryLoop (синхронна частина):', e && (e.stack||e.message)); }
}

/* ── РОБОЧІ СТОЛИ ──
   Раніше було лише один масив тайлів (localStorage 'ar_lay2'). Тепер це
   масив столів workspaces:[{id,name,lay:[...]}]. Стара структура автоматично
   мігрує в "Стіл 1" при першому запуску нової версії, щоб ніхто не втратив
   своє поточне розташування. */
let workspaces = lg('workspaces');
if(!workspaces || !Array.isArray(workspaces) || !workspaces.length){
  const oldLay = lg('lay2');
  workspaces = [{id:'w1', name:'Стіл 1', lay: oldLay || dl()}];
}
let activeWsId = lg('activeWs');
if(!activeWsId || !workspaces.find(w=>w.id===activeWsId)) activeWsId = workspaces[0].id;

function activeWs(){ return workspaces.find(w=>w.id===activeWsId) || workspaces[0]; }
// `lay` лишається змінною, яку використовує весь інший код без змін —
// вона просто завжди вказує на масив тайлів АКТИВНОГО столу.
let lay = activeWs().lay;
function saveLay(){ activeWs().lay = lay; ls('workspaces', workspaces); }

// ── Кнопка "Стіл" у топбарі — тап перемикає на НАСТУПНИЙ робочий стіл по
// колу (після останнього — знову перший), без потреби лізти в Налаштування.
function cycleWorkspace(){
  const idx = workspaces.findIndex(w=>w.id===activeWsId);
  const next = workspaces[(idx+1) % workspaces.length];
  activeWsId = next.id;
  ls('activeWs', activeWsId);
  lay = activeWs().lay;
  render();
  sht('Стіл: '+next.name);
}

// В ландшафтній орієнтації кількість колонок підлаштовується під кількість тайлів,

// stretchLastGridRow() (автоматичне розтягування останнього рядка) —
// ВИДАЛЕНО ще раніше. Ідея була підняти нижній рядок плиток на весь
// порожній простір знизу автоматично, але тодішня реалізація: (1) не
// спрацьовувала надійно в Bluefy/WebKit, і (2) конфліктувала з ручним
// інструментом (rh-ручка "потягнути висоту"), який тоді існував — render()
// викликав автоматичний розрахунок щоразу, перебиваючи щойно встановлену
// вручну tile.customH, тож плитка "відстрибувала" назад одразу після
// відпускання пальця. Відтоді ручний інструмент теж прибрано повністю
// (див. applyBottomRowAutoHeight нижче) — тепер конфліктувати нема з чим,

// "⬇️ Заповнити до низу" (кнопка + tile.customH) прибрано повністю —
// автоматичне розтягування нижнього ряду тепер робить applyBottomRowAutoHeight()
// на кожному render(), для обох орієнтацій (портрет і альбом), без жодного
// ручного втручання. Див. коментар над applyBottomRowAutoHeight нижче.

// ── Автоматична висота нижнього ряду плиток ──
// Ручного інструменту (rh-ручка, "Заповнити до низу", tile.customH)
// більше нема НІДЕ — ні в портреті, ні в альбомі. Обидві орієнтації
// тепер повністю автоматичні, рахується на кожному render():
// АЛЬБОМНА орієнтація: висота нижнього ряду фіксується на 124px —
// без вимірювання залишку, просто стала цифра (варіант "А").
// ПОРТРЕТНА орієнтація: сітка тут інша (менше колонок, інші
// grid-auto-rows), тож рахуємо реальний залишок вимірюванням (той самий
// підхід, що раніше був у ручній кнопці fillTilesToBottom) — стала
// цифра тут не підійшла б, бо на різних висотах екрана й кількості
// плиток вона була б то замалою, то не докручувала б до самого низу.
const LANDSCAPE_BOTTOM_ROW_H = 124;
// 20.08.2026: РУЧНИЙ інструмент для великої плитки (s23) — на прохання
// користувача, замість чергової спроби АВТОМАТИЧНО підігнати карту під
// нижній ряд (усі такі спроби за сьогодні лише плодили регресії — див.
// коментарі вище й нижче). MapCfg.landscapeMapH — введене вручну число
// пікселів; 0 (за замовчуванням) = НЕ чіпати s23 взагалі (та сама
// стабільна поведінка, що ми щойно домоглися, ідентична .video-tile).
// Якщо користувач ввів конкретне число — застосовуємо його ЛИШЕ в
// альбомній орієнтації, ЛИШЕ до s23, одним простим inline style.height,
// без жодних вимірювань чи "вирівнювань під щось" — просто те число, яке
// сказали. Ізольовано від applyBottomRowAutoHeight() навмисно: щоб
// баги/зміни в одному місці НІКОЛИ не могли зачепити інше.
function applyManualLandscapeMapHeight(){
  const isLandscape=document.documentElement.classList.contains('ar-landscape');
  const giEl=document.getElementById('gi');
  if(!giEl) return;
  const mapTileEl=giEl.querySelector('.tile.s23');
  if(!mapTileEl) return;
  if(isLandscape && MapCfg.landscapeMapH>0){
    mapTileEl.style.height=MapCfg.landscapeMapH+'px';
  }
  // isLandscape===false АБО landscapeMapH===0 → інлайн-висоту НЕ чіпаємо
  // взагалі (навіть не скидаємо на '') — applyBottomRowAutoHeight() уже
  // зробив це для ВСІХ тайлів на початку своєї роботи, тож s23 і так
  // чистий, коли це налаштування вимкнене.
}
function applyBottomRowAutoHeight(){
  const giEl=document.getElementById('gi');
  if(!giEl) return;
  const tileEls=Array.from(giEl.children).filter(function(el){ return el.classList.contains('tile') && el.dataset.id; });
  if(!tileEls.length) return;
  const isLandscape=document.documentElement.classList.contains('ar-landscape');

  // Скидаємо inline-висоту ПЕРЕД виміром — інакше застаріле значення з
  // минулого render() спотворить розрахунок "де насправді низ". Ручного
  // customH більше не існує ніде — скидаємо завжди, для всіх плиток.
  tileEls.forEach(function(el){ el.style.height=''; });

  const containerBottom=giEl.getBoundingClientRect().bottom;

  // 20.08.2026: ПЕРЕПИСАНО на два проходи. Стара версія шукала "нижній
  // ряд" як тайли з НАЙБІЛЬШИМ природним bottom серед УСІХ тайлів —
  // але карта (s22/s23, кілька грід-рядків) природно вища за звичайні
  // однорядкові тайли внизу, тож САМЕ вона ставала "еталоном maxBottom",
  // і попередня версія розтягувала ЇЇ ще нижче — замість того, щоб
  // однорядкові тайли підтягнути під карту. Візуально: карта "втікає"
  // нижче за сусідні тайли в тому самому ряду.
  //
  // Прохід 1: серед ОДНОРЯДКОВИХ тайлів (без s22/s23) знаходимо
  // справжній нижній ряд і розтягуємо його до низу контейнера — так, як
  // це працювало споконвіку, без multi-row тайлів у розрахунку взагалі.
  const singleRowEls=tileEls.filter(function(el){
    return !el.classList.contains('s22') && !el.classList.contains('s23');
  });
  let singleMaxBottom=-Infinity;
  const singleRects=singleRowEls.map(function(el){
    const r=el.getBoundingClientRect();
    if(r.bottom>singleMaxBottom) singleMaxBottom=r.bottom;
    return r;
  });
  singleRowEls.forEach(function(el,i){
    const r=singleRects[i];
    if(Math.abs(r.bottom-singleMaxBottom)>2) return; // не нижній ряд — не чіпаємо
    if(isLandscape){
      el.style.height=LANDSCAPE_BOTTOM_ROW_H+'px';
    } else {
      const leftover=containerBottom-singleMaxBottom-5;
      if(leftover>2) el.style.height=Math.round(r.height+leftover)+'px';
    }
  });

  // 20.08.2026 (ОСТАТОЧНО, за фактом діагностики): навіть ПОРОЖНЯ
  // заглушка замість карти (без жодного Leaflet) поводилась нестабільно
  // — це довело, що причина НЕ в Leaflet/квадраті-обертанні взагалі, а в
  // тому, що ЦЕЙ прохід ставив inline style.height на s23 так само, як
  // і на заглушку. .video-tile (яке працює бездоганно) — статичний
  // елемент, що взагалі НЕ входить у цю систему тайлів (нема класу
  // .tile), тому JS його ніколи не чіпає — 100% чистий CSS. Щоб s23
  // поводився ІДЕНТИЧНО (як просив користувач, "один в один" з малими
  // плитками) — прибираємо цей прохід ОСТАТОЧНО. s23 тепер так само, як
  // .video-tile: нуль JS-втручання в розмір, лише grid-row:span 3.
  // Якщо колись зʼявиться видимий розрив по нижньому краю — то вже
  // свідомий, узгоджений компроміс, а не баг.
}

function render(){
  applyGridColumns();
  const videoTile = document.getElementById('dash-video-tile');
  gi.innerHTML = '';
  if(videoTile) gi.appendChild(videoTile);

  lay.forEach(tile=>{
    const el=mkTile(tile);
    if(alertState[tile.id])el.classList.add(alertState[tile.id]);
    gi.appendChild(el);
  });
  if(editMode){
    const ab=document.createElement('div');
    ab.className='tile add';ab.textContent='+';
    ab.addEventListener('click',()=>{ptile=null;cpk();});
    gi.appendChild(ab);
  }

  // Прибираємо "осиротілі" інстанси карти — якщо плитки карти більше нема в
  // ПОТОЧНОМУ розкладі (наприклад, перемкнувся на інший робочий стіл без
  // карти), її DOM-вузол щойно стерло через gi.innerHTML='' вище, але сам
  // JS-об'єкт Leaflet-карти в mapInstances так і лишався б жити далі й
  // тихо отримувати оновлення GPS-позиції (а отже — потенційно й далі
  // тягнути/кешувати тайли у фоні), поки не перезавантажиш сторінку.
  const liveIds = new Set(lay.map(t=>t.id));
  Object.keys(mapInstances).forEach(id=>{
    if(!liveIds.has(id)){
      try{ mapInstances[id].map.remove(); }catch(e){}
      delete mapInstances[id];
    }
  });
  // 17.08.2026: той самий принцип для секундомірів — якщо плитку прибрали
  // з розкладу, її запис у swState (і потенційно "вічний" тикер, якщо він
  // саме йшов) більше нікому не потрібен.
  Object.keys(swState).forEach(id=>{
    if(!liveIds.has(id)) delete swState[id];
  });

  try{ updateAudioTilesUI(); }catch(e){}
  try{ applyBottomRowAutoHeight(); }catch(e){}
  try{ applyManualLandscapeMapHeight(); }catch(e){}
}

function mkTile(tile){
  const p=P[tile.k];
  const el=document.createElement('div');
  el.className='tile '+tile.sz+(editMode?' ed':'');
  el.dataset.id=tile.id;el.style.setProperty('--pc',p.c);
  // Висота — повністю автоматична (applyBottomRowAutoHeight у render()),
  // ручного tile.customH більше не існує.

  const rm=document.createElement('div');rm.className='rm';rm.textContent='✕';
  rm.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(dragTile && dragTile.id===tile.id){ dragTile=null; dragEl=null; } // вибрану плитку якраз видаляють — не лишаємо застарілу посилання
    if(tile.k==='MapTile' && mapInstances[tile.id]){
      try{ mapInstances[tile.id].map.remove(); }catch(err){}
      try{ if(mapInstances[tile.id].resizeObserver) mapInstances[tile.id].resizeObserver.disconnect(); }catch(err){}
      delete mapInstances[tile.id];
    }
    lay=lay.filter(t=>t.id!==tile.id);saveLay();render();
  });
  el.appendChild(rm);

  // ── Ручний інструмент "потягнути плитку вниз" (#rh) ──
  // Ручний інструмент зміни висоти (ручка #rh) прибрано повністю — і в
  // портреті, і в альбомі висота нижнього ряду тепер рахується
  // автоматично на кожному render() (applyBottomRowAutoHeight): фіксовані
  // 124px в альбомній орієнтації, розрахований залишок екрана в
  // портретній. tile.customH більше ніде не встановлюється.

  if(tile.k==='MapTile'){
    el.classList.add('map-tile');
    el.appendChild(mkMapTile(tile));
  }else if(tile.k==='AudioTile'){
    el.classList.add('audio-tile');
    el.appendChild(mkAudioTile());
  }else if(tile.k==='StopwatchTile'){
    el.classList.add('stopwatch-tile');
    el.appendChild(mkStopwatchTile(tile));
  }else if(tile.st==='gauge' && tile.sz==='s22'){
    el.appendChild(mkG(tile,p));
  }else{
    el.appendChild(mkF(tile,p));
  }

  if(tile.k==='GPS'){
    const badge=document.createElement('div');
    badge.className='cam-radar-badge';
    badge.innerHTML='<div class="c-sign">--</div><div class="c-dist">--м</div>';
    el.appendChild(badge);
  }

  // ── Переставляння плиток: ДВА ПРИЦІЛЬНІ ТАПИ, без жодного перетягування
  // (свайп/рух пальцем конфліктував зі скролом сторінки й власним жестом
  // Bluefy) ──
  // Тап 1 по плитці A (нічого не вибрано) → вибираємо A (підсвічуємо .ds).
  // Тап 2 по ІНШІЙ плитці B → A і B МІНЯЮТЬСЯ місцями в lay.
  // Тап 2 по ТІЙ САМІЙ плитці A → скасовуємо вибір і відкриваємо звичний
  // пікер параметру/розміру (стара поведінка тапу нікуди не зникла).
  el.addEventListener('click',()=>{
    if(!editMode){
      if(tile.k==='Lean') onLeanTileTap();
      return;
    }
    if(dragTile===null){
      dragTile=tile; dragEl=el;
      el.classList.add('ds');
      return;
    }
    if(dragTile.id===tile.id){
      clearDragVisuals(); dragTile=null; dragEl=null;
      ptile=tile; cpk();
      return;
    }
    const i=lay.findIndex(t=>t.id===dragTile.id);
    const j=lay.findIndex(t=>t.id===tile.id);
    clearDragVisuals(); dragTile=null; dragEl=null;
    if(i>-1 && j>-1 && i!==j){
      [lay[i],lay[j]]=[lay[j],lay[i]];
      saveLay(); render();
    }
  });

  return el;
}

function mkF(tile,p){
  const w=document.createElement('div');
  w.style.cssText='display:flex;flex-direction:column;align-items:center;width:100%;';
  const l=document.createElement('div');l.className='tl';l.textContent=p.n;
  const u=document.createElement('div');u.className='tun';
  const v=document.createElement('div');v.className='tv';v.dataset.lid=tile.k;v.textContent=V[tile.k];
  w.append(l,u,v);
  return w;
}

function mkG(tile,p){
  const w=document.createElement('div');w.className='gw';
  w.innerHTML=`<svg class="gsvg" viewBox="0 0 100 100">
    <path class="gbg" d="M 20 80 A 40 40 0 1 1 80 80"/>
    <path class="gfg" id="gfg_${tile.id}" d="M 20 80 A 40 40 0 1 1 80 80" stroke-dasharray="188.4" stroke-dashoffset="188.4"/>
  </svg>`;
  const gc=document.createElement('div');gc.className='gc';
  const l=document.createElement('div');l.className='tl';l.textContent=p.n;
  const v=document.createElement('div');v.className='tv';v.dataset.lid=tile.k;v.textContent=V[tile.k];
  gc.append(l,v);
  w.appendChild(gc);
  setTimeout(()=>ug(tile.id,tile.k),10);
  return w;
}

function ug(id,k){
  const path=document.getElementById('gfg_'+id);if(!path)return;
  const p=P[k],v=parseFloat(V[k]);
  if(isNaN(v)){path.style.strokeDashoffset=188.4;return;}
  const pct=Math.max(0,Math.min(1,(v-p.mn)/(p.mx-p.mn)));
  path.style.strokeDashoffset=188.4-(188.4*pct);
}

let prevV={};
function ud(){
  document.querySelectorAll('[data-lid]').forEach(el=>{
    const k=el.dataset.lid,v=V[k];
    if(prevV[k]===v)return;
    el.textContent=v;
  });
  lay.forEach(t=>{if(t.st==='gauge'&&t.sz==='s22')ug(t.id,t.k);});
  prevV={...V};
  updateEngineOffIndicator();
}

// 25.08.2026: окремо від BLE-watchdog'ів (ті лише про сам зв'язок) — цей
// індикатор про СТАН ДВИГУНА, коли зв'язок і так справний. Раніше V.RPM
// узагалі не міг стати 0 (баг у parse20Byte, вже виправлено вище) — тому
// на екрані НІЧОГО не змінювалось після вимкнення запалювання, і це
// виглядало так, наче застосунок "не розуміє" розрив/вимкнення. Тепер,
// коли RPM==0 тримається кілька секунд поспіль (не одиничний пакет-глітч),
// кнопка з'єднання явно показує "· двигун вимкнено" — зв'язок і далі
// зелений (він СПРАВДІ живий — ECU живиться від акумулятора напряму й
// продовжує репортити), просто тепер видно, що саме відбувається.
let _engineOffSince=null;
const ENGINE_OFF_UI_DELAY=5000;
function updateEngineOffIndicator(){
  // 25.08.2026: КРИТИЧНИЙ фікс — раніше тут використовувалась зовнішня
  // змінна btn (const btn=document.getElementById('cb'), оголошена вище
  // по коду). У реальних умовах це кидало "Can't find variable: btn" на
  // КОЖНОМУ пакеті з ECU (onData викликається дуже часто) — а оскільки
  // onData() виконує `ud();ca();` послідовно, виняток у ud() (звідси
  // викликається ця функція) блокував ca() від виконання ЩОРАЗУ. Тобто
  // дані від ECU реально надходили, але жодного разу не відображались —
  // саме симптом "з'єднання є, а на екрані нічого не змінюється". Тепер
  // елемент шукається напряму, без залежності від зовнішньої змінної —
  // це прибирає будь-який ризик, пов'язаний з порядком виконання коду.
  const btnEl=document.getElementById('cb');
  if(!btnEl){ return; }
  if(!bConn || !btnEl.classList.contains('ok')){ _engineOffSince=null; return; } // 'ok' — лише коли вже пройшли "🔄 Ініціалізація", не раніше
  const isOff = V.RPM===0;
  if(isOff){
    if(_engineOffSince==null) _engineOffSince=Date.now();
    if(Date.now()-_engineOffSince>ENGINE_OFF_UI_DELAY && !btnEl.classList.contains('engine-off')){
      btnEl.classList.add('engine-off');
      btnEl.innerHTML=CONN_DOT_SVG+(bDev&&bDev.name||'OK')+' · двигун вимкнено';
    }
  } else {
    _engineOffSince=null;
    if(btnEl.classList.contains('engine-off')){
      btnEl.classList.remove('engine-off');
      btnEl.innerHTML=CONN_DOT_SVG+(bDev&&bDev.name||'OK');
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════
   ПЛИТКА "КАРТА" (2×2, Leaflet) — гібридний офлайн/онлайн режим
   ══════════════════════════════════════════════════════════════════════
   ВАЖЛИВО: живі координати беремо з _lastLat/_lastLon (розділ вище,
   watchPosition) — а НЕ з V.GPS. У цьому дашборді V.GPS історично означає
   ШВИДКІСТЬ (км/год) з GPS, а не координати (див. об'єкт P.GPS: u:'km/h').
   Технічне завдання просило "V.GPS" для координат, але такого поля з
   координатами в проєкті немає — це просто неточність у формулюванні,
   а не окрема вимога, тож використано реальне джерело координат. */

// ── IndexedDB: тут лежать ВЕЛИКІ файли (.mbtiles, GPX/GeoJSON маршрут),
// щоб не впертись у ліміт localStorage (~5МБ) і не тягнути їх заново після
// кожного перезапуску застосунку. ──
const MAPDB_NAME='vracer-map', MAPDB_STORE='files', MAPDB_TILES='tiles';
function mapIdb(){
  return new Promise((resolve,reject)=>{
    // v2: додано окремий стор "tiles" — сюди тихо складаються тайли, які
    // карта тягнула онлайн (розділ "Накопичення тайлів" нижче). Стара
    // v1-база (лише "files") при апгрейді не втрачається — IndexedDB сам
    // зберігає вже наявні стори, ми лише додаємо новий.
    const req=indexedDB.open(MAPDB_NAME,2);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(MAPDB_STORE)) db.createObjectStore(MAPDB_STORE);
      if(!db.objectStoreNames.contains(MAPDB_TILES)) db.createObjectStore(MAPDB_TILES);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSet(key,val){
  try{
    const db=await mapIdb();
    return new Promise((res,rej)=>{
      const tx=db.transaction(MAPDB_STORE,'readwrite');
      tx.objectStore(MAPDB_STORE).put(val,key);
      tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);
    });
  }catch(e){ return false; }
}
async function idbGet(key){
  try{
    const db=await mapIdb();
    return new Promise((res,rej)=>{
      const tx=db.transaction(MAPDB_STORE,'readonly');
      const r=tx.objectStore(MAPDB_STORE).get(key);
      r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);
    });
  }catch(e){ return null; }
}
async function idbDel(key){
  try{
    const db=await mapIdb();
    return new Promise((res)=>{
      const tx=db.transaction(MAPDB_STORE,'readwrite');
      tx.objectStore(MAPDB_STORE).delete(key);
      tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);
    });
  }catch(e){ return false; }
}

// ── Накопичення тайлів "з кешу" (розділ, який просив користувач) ──
// Справжній HTTP-кеш браузера з JS не читається, тому робимо власний:
// щоразу, коли карта тягне тайл онлайн (бо в .mbtiles його нема), паралельно
// зберігаємо його байти сюди, в окремий IndexedDB-стор, під ключем "z_x_y".
// Кнопка "Конвертувати в офлайн-карту" пізніше збирає все накопичене в
// справжню MBTiles (SQLite) базу і домержує в уже завантажений офлайн-файл.
function tileCacheKey(z,x,y){ return z+'_'+x+'_'+y; }
async function cacheTileBytes(z,x,y,arrayBuffer){
  try{
    const db=await mapIdb();
    return new Promise((res)=>{
      const tx=db.transaction(MAPDB_TILES,'readwrite');
      tx.objectStore(MAPDB_TILES).put(arrayBuffer, tileCacheKey(z,x,y));
      tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);
    });
  }catch(e){ return false; }
}
async function idbCountTiles(){
  try{
    const db=await mapIdb();
    return new Promise((res)=>{
      const tx=db.transaction(MAPDB_TILES,'readonly');
      const r=tx.objectStore(MAPDB_TILES).count();
      r.onsuccess=()=>res(r.result||0);r.onerror=()=>res(0);
    });
  }catch(e){ return 0; }
}
async function idbGetAllTiles(){
  // Повертає масив {z,x,y,bytes} — для конвертора в MBTiles нижче.
  try{
    const db=await mapIdb();
    return new Promise((res)=>{
      const tx=db.transaction(MAPDB_TILES,'readonly');
      const store=tx.objectStore(MAPDB_TILES);
      const out=[];
      const cursorReq=store.openCursor();
      cursorReq.onsuccess=(e)=>{
        const cur=e.target.result;
        if(cur){
          const [z,x,y]=cur.key.split('_').map(Number);
          out.push({z,x,y,bytes:cur.value});
          cur.continue();
        } else { res(out); }
      };
      cursorReq.onerror=()=>res(out);
    });
  }catch(e){ return []; }
}
async function idbClearTiles(){
  try{
    const db=await mapIdb();
    return new Promise((res)=>{
      const tx=db.transaction(MAPDB_TILES,'readwrite');
      tx.objectStore(MAPDB_TILES).clear();
      tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);
    });
  }catch(e){ return false; }
}


// ── Налаштування карти (зум-рівні) — маленькі, тому в localStorage ──

// "⚙️ TomTom" поруч із перемикачем 249cc) — tt* поля нижче.
const MAP_DA={std:15, detail:18, dark:true, routeVisible:true, cacheZoomMin:17, cacheZoomMax:19, scooter249:false, landscapeMapH:340,
  ttAvoidTollRoads:false, ttAvoidMotorways:false, ttAvoidTunnels:false, ttTravelMode:'car', ttRouteType:'fastest',
  homeLat:null, homeLon:null}; // 25.08.2026: локація "Дім" — Налаштування → Карта, кнопка "🏠 Дім" у меню Маршрут будує маршрут звідси. landscapeMapH: 21.08.2026, підібрано користувачем вручну через "📏 Показати поточну"
let MapCfg = {...MAP_DA, ...(lg('mapcfg')||{})};

// ── MBTiles (SQLite) читання через sql.js ──
let mbSqlDb=null;       // екземпляр SQL.Database поточного завантаженого .mbtiles
let mbFileName=null;    // ім'я файлу — лише для відображення в налаштуваннях
let _sqlJsReady=null;
const SQLJS_CDN='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/';
// ВАЖЛИВО: sql.js складається з JS + окремого .wasm-файлу (~600КБ+), і без
// цього кешування .wasm тягнувся б із CDN ЩОРАЗУ при відкритті застосунку —
// а це означає, що читання ВЖЕ ЗАВАНТАЖЕНОЇ офлайн-карти залежало б від
// інтернету саме в момент старту сторінки. Тобто офлайн-режим ламався б
// рівно тоді, коли він найпотрібніший (немає зв'язку). Тому: перший раз
// тягнемо з CDN і одразу ховаємо байти в IndexedDB, а всі наступні рази —
// піднімаємо звідти, без жодного мережевого запиту.
function ensureSqlJs(){
  if(_sqlJsReady) return _sqlJsReady;
  _sqlJsReady = (async ()=>{
    let wasmBlobUrl=null;
    try{
      const rec=await idbGet('sqlWasmCache');
      if(rec && rec.bytes) wasmBlobUrl=URL.createObjectURL(new Blob([rec.bytes],{type:'application/wasm'}));
    }catch(e){}
    const SQL = await initSqlJs({
      locateFile:f=> (f.endsWith('.wasm') && wasmBlobUrl) ? wasmBlobUrl : (SQLJS_CDN+f)
    });
    if(!wasmBlobUrl){
      // Перший успішний запуск (чи кеш ще порожній) — стягнули з CDN,
      // збережемо байти на майбутнє окремим запитом у фоні (не затримує
      // те, що вже й так завантажилось і працює зараз).
      fetch(SQLJS_CDN+'sql-wasm.wasm').then(r=>r.arrayBuffer()).then(buf=>idbSet('sqlWasmCache',{bytes:buf})).catch(()=>{});
    }
    return SQL;
  })();
  // Якщо ця спроба провалилась (тимчасовий збій мережі) — не лишаємо
  // застосунок навіки "зіпсованим": скидаємо, щоб наступний виклик
  // (наприклад, наступне відкриття застосунку) міг спробувати знову.
  _sqlJsReady.catch(()=>{ _sqlJsReady=null; });
  return _sqlJsReady;
}
async function loadMbtilesFromBytes(bytes,name){
  const SQL=await ensureSqlJs();
  mbResetMbStatement(); // новий mbSqlDb нижче — старий prepared statement/кеш більше не валідні
  mbSqlDb=new SQL.Database(new Uint8Array(bytes));
  mbFileName=name||'офлайн-карта.mbtiles';
}
async function loadSavedMbtilesIfAny(attempt){

    console.log('[mbtiles] автовідновлення: знайдено збережений файл "'+rec.name+'", розмір '+(rec.bytes.byteLength||rec.bytes.length||'?')+' байт — читаю через sql.js…');
    await loadMbtilesFromBytes(rec.bytes, rec.name);

    // Плитка карти на дашборді могла вже намалюватись РАНІШЕ, ніж це

// MBTiles зберігає рядки тайлів у схемі TMS (вісь Y перевернута відносно
// звичної XYZ, якою користується Leaflet/OSM) — переводимо y→tms_y.
//
// 19-20.08.2026: ВИЛЬОТИ ПРИ ZOOM OUT НА ГОЛОВНІЙ КАРТІ — причина була тут.
// `mbSqlDb.exec(...)` щоразу заново ПАРСИТЬ SQL-рядок і виконується
// СИНХРОННО на UI-потоці (sql.js — WASM без воркера). При zoom out Leaflet
// одразу запитує пачку тайлів нового рівня зуму підряд — і серія таких
// синхронних SQL-викликів без жодної паузи блокувала потік настільки, що
// WebView (Bluefy/iOS) вважав вкладку "не відповідає". Виправлено двома
// речами:
// (1) mbStmt — ОДИН підготовлений statement на весь час життя mbSqlDb,
//     перевикористовується (bind/step/reset), а не пересоздається щоразу.
// (2) mbTileCache — in-memory кеш байтів за ключем z_x_y (у т.ч. кешує
//     "відсутність" тайла як null), щоб повторний запит того самого тайла
//     (типово при швидкому zoom in/out туди-сюди) взагалі не чіпав SQLite.
// mbResetMbStatement() ОБОВ'ЯЗКОВО викликати при кожному завантаженні
// НОВОГО .mbtiles (loadMbtilesFromBytes) і при вивантаженні бази — інакше
// prepared statement лишиться прив'язаним до вже неактуального mbSqlDb.
let mbStmt=null;
const mbTileCache=new Map(); // "z_x_y" -> Uint8Array|null
const MB_TILE_CACHE_MAX=800;
function mbResetMbStatement(){
  if(mbStmt){ try{ mbStmt.free(); }catch(e){} mbStmt=null; }
  mbTileCache.clear();
}
function mbGetTileBytes(z,x,y){
  if(!mbSqlDb) return null;
  const key=z+'_'+x+'_'+y;
  if(mbTileCache.has(key)) return mbTileCache.get(key);
  const tmsY = Math.pow(2,z)-1-y;
  let bytes=null;
  try{
    if(!mbStmt) mbStmt=mbSqlDb.prepare('SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=?');
    mbStmt.bind([z,x,tmsY]);
    if(mbStmt.step()) bytes=mbStmt.get()[0]; // Uint8Array
    mbStmt.reset();
  }catch(e){
    // Пошкоджений/неочікуваний стан statement — не валимо рендер карти,
    // просто скидаємо, наступний виклик підготує заново.
    try{ if(mbStmt){ mbStmt.free(); } }catch(e2){}
    mbStmt=null;
  }
  if(mbTileCache.size>=MB_TILE_CACHE_MAX){
    const oldestKey=mbTileCache.keys().next().value;
    mbTileCache.delete(oldestKey);
  }
  mbTileCache.set(key, bytes);
  return bytes;
}

// ── Черга: розтягуємо серію офлайн-читань тайлів на кілька кадрів анімації
// замість виконання всіх в ОДНОМУ кадрі підряд. MB_TILE_BATCH підібрано
// емпірично — досить велике, щоб тайли не "блимали" з затримкою, і досить
// мале, щоб не тримати UI-потік довше одного кадру за раз. ──
const MB_TILE_BATCH=6;
let mbTileQueue=[];
let mbTileQueueScheduled=false;
function mbScheduleTileRead(z,x,y,cb){
  mbTileQueue.push({z:z,x:x,y:y,cb:cb});
  if(!mbTileQueueScheduled){
    mbTileQueueScheduled=true;
    requestAnimationFrame(mbProcessTileQueue);
  }
}
function mbProcessTileQueue(){
  if(isViewportBusy()){
    // 20.08.2026 (варіант 3): поворот екрана / поява-зникнення клавіатури
    // саме зараз — не чіпати sql.js (синхронний WASM) паралельно з
    // важким reflow WebKit, просто перевірити ще раз наступного кадру.
    requestAnimationFrame(mbProcessTileQueue);
    return;
  }
  const batch=mbTileQueue.splice(0, MB_TILE_BATCH);
  batch.forEach(function(job){
    let bytes=null;
    try{ bytes=mbGetTileBytes(job.z,job.x,job.y); }catch(e){}
    job.cb(bytes);
  });
  if(mbTileQueue.length){
    requestAnimationFrame(mbProcessTileQueue);
  } else {
    mbTileQueueScheduled=false;
  }
}

// ── Конвертор: накопичені онлайн-тайли (idbGetAllTiles) → справжня MBTiles
// (SQLite) база. Якщо офлайн-карта вже завантажена — домержовує ПРЯМО в неї
// (INSERT OR REPLACE, тобто новіші/додаткові тайли не стирають те, що вже
// було); якщо нема жодної — створює нову базу з нуля. ──
async function convertCachedTilesToMbtiles(onProgress){
  const SQL=await ensureSqlJs();
  const tiles=await idbGetAllTiles();
  if(!tiles.length) return {ok:false, reason:'empty'};

  let db = mbSqlDb; // домержовуємо в уже завантажену офлайн-карту, якщо вона є
  if(!db){
    db=new SQL.Database();
    db.run(`CREATE TABLE IF NOT EXISTS tiles (zoom_level INTEGER, tile_column INTEGER, tile_row INTEGER, tile_data BLOB);
            CREATE UNIQUE INDEX IF NOT EXISTS tile_index ON tiles (zoom_level, tile_column, tile_row);
            CREATE TABLE IF NOT EXISTS metadata (name TEXT, value TEXT);`);
    db.run(`INSERT INTO metadata (name,value) VALUES ('name','vRacer накопичена карта'), ('format','png')`);
  } else {
    // На випадок, якщо завантажений раніше .mbtiles чомусь без цих таблиць/індексу.
    db.run(`CREATE TABLE IF NOT EXISTS tiles (zoom_level INTEGER, tile_column INTEGER, tile_row INTEGER, tile_data BLOB);
            CREATE UNIQUE INDEX IF NOT EXISTS tile_index ON tiles (zoom_level, tile_column, tile_row);`);
  }

  const stmt=db.prepare('INSERT OR REPLACE INTO tiles (zoom_level,tile_column,tile_row,tile_data) VALUES (?,?,?,?)');
  let i=0;
  for(const t of tiles){
    const tmsY = Math.pow(2,t.z)-1-t.y; // назад у TMS-рядок, той самий формат, що ми читаємо
    stmt.run([t.z, t.x, tmsY, new Uint8Array(t.bytes)]);
    i++;
    if(onProgress && i%200===0) onProgress(i, tiles.length);
  }
  stmt.free();

  const bytes = db.export(); // Uint8Array усього SQLite-файлу — те саме, що читається як завантажений .mbtiles
  mbSqlDb = db;
  mbFileName = mbFileName || 'накопичена-офлайн-карта.mbtiles';
  await idbSet('mbtilesFile', {bytes: bytes.buffer, name: mbFileName});
  return {ok:true, tilesCount:tiles.length};
}

// ── Гібридний тайл-шар: спершу mbtiles (офлайн), інакше — OSM (онлайн) ──
// КРИТИЧНО: якщо Leaflet із CDN не завантажився (немає інтернету саме в
// момент старту сторінки, CDN заблоковано мережею/Bluefy тощо), глобальний
// `L` буде undefined — і виклик L.GridLayer.extend() кидав НЕОБРОБЛЕНИЙ
// виняток прямо на верхньому рівні скрипта. Один необроблений виняток
// зупиняє ВЕСЬ подальший код у тому самому <script> — саме тому вивалювався
// повністю чорний екран із "мертвим" топбаром (кнопки намальовані статичним
// HTML і показувались, а от render() сітки плиток нижче по коду просто
// ніколи не викликався). Тепер це загорнуто: якщо L відсутній — просто не
// створюємо клас (плитка карти потім сама покаже повідомлення про це,
// див. initLeafletMap), а решта дашборду (BLE, тайли, налаштування)
// продовжує працювати як звичайно.
let HybridTileLayer = null;
try{
  if(typeof L !== 'undefined' && L.GridLayer){
    HybridTileLayer = L.GridLayer.extend({
      createTile: function(coords, done){
        const tile = document.createElement('img');
        tile.setAttribute('role','presentation');
        tile.style.width = tile.style.height = '256px';
        const z = coords.z, x = coords.x;
        // Тайли з негативним/переповненим x на межі карти світу — Leaflet сам
        // нормалізує їх під капотом для XYZ-запиту, тут просто підстрахуємось.
        const y = coords.y;
        // 19-20.08.2026: раніше тут був СИНХРОННИЙ виклик mbGetTileBytes()
        // прямо в createTile() — пачка таких викликів підряд (Leaflet
        // запитує багато тайлів одразу при zoom out) блокувала UI-потік і
        // призводила до вильотів на iOS/Bluefy. Тепер читання йде через
        // mbScheduleTileRead() — чергу, розтягнуту на кілька кадрів
        // анімації (createTile підтримує асинхронний done() за задумом
        // Leaflet, так що затримка в межах одного-двох кадрів непомітна).
        mbScheduleTileRead(z,x,y,(bytes)=>{
          if(bytes){
            const blob=new Blob([bytes.buffer?bytes:new Uint8Array(bytes)],{type:'image/png'});
            const url=URL.createObjectURL(blob);
            tile.onload=()=>{URL.revokeObjectURL(url);done(null,tile);if(this.options.onTileSource)this.options.onTileSource('offline');};
            tile.onerror=()=>{URL.revokeObjectURL(url);done(new Error('bad tile'),tile);};
            tile.src=url;
            tile.dataset.src='offline';
          } else {
            // Немає офлайн-тайла (файл не завантажено АБО виїхали за межі
            // завантаженого регіону) — тягнемо "на льоту" з інтернету. Робимо
            // це через fetch() (а не просто tile.src=url), бо для накопичення
            // офлайн-бази (нижче) нам потрібні саме БАЙТИ тайла, а не просто
            // картинка в <img> — так ми і показуємо тайл, і одразу тихо
            // складаємо його байти в IndexedDB для майбутньої конвертації.
            const sub=['a','b','c'][(x+y)%3];
            const url=`https://${sub}.tile.openstreetmap.org/${z}/${x}/${y}.png`;
            tile.dataset.src='online';
            fetch(url).then(r=>{
              if(!r.ok) throw new Error('http '+r.status);
              return r.arrayBuffer();
            }).then(buf=>{
              const blob=new Blob([buf],{type:'image/png'});
              const objUrl=URL.createObjectURL(blob);
              tile.onload=()=>URL.revokeObjectURL(objUrl);
              tile.src=objUrl;
              done(null,tile);
              if(this.options.onTileSource) this.options.onTileSource('online');
              // Кешуємо (для майбутньої конвертації в офлайн-карту) ТІЛЬКИ
              // тайли в межах налаштованого діапазону зумів (за замовчуванням
              // 17-19 — саме той рівень наближення, який реально потрібен на
              // скутері; далекі "оглядові" зуми показуємо, але не зберігаємо,
              // щоб не роздувати базу даними, які практично не використовуються).
              if(z>=MapCfg.cacheZoomMin && z<=MapCfg.cacheZoomMax) cacheTileBytes(z,x,y,buf);
            }).catch(err=>{ done(err,tile); });
          }
        });
        return tile;
      }
    });
  } else {
    console.error('Leaflet не завантажився з CDN (L не визначено) — плитка карти буде недоступна, решта дашборду працює');
  }
}catch(e){ console.error('HybridTileLayer init failed:', e); }

// ── Реєстр активних інстансів карти (зазвичай одна плитка, але про всяк
// випадок — раптом хтось додасть дві) ──
const mapInstances = {}; // {tileId: {map, marker, badge, wrapEl, viewportEl, heading, lastDblTap, zoomedIn, routeLine}}

// ── Індикатор ONLINE/OFFLINE на плитці ──
// refreshMapBadges() — стартова, "оптимістична" оцінка (є завантажений
// .mbtiles чи ні), виставляється одразу при ініціалізації/завантаженні
// файлу, ще ДО того, як хоч один тайл реально прогрузився.
// reportTileSource() — вже СПРАВЖНІЙ, живий факт: кожен тайл у createTile()
// вище повідомляє, звідки він насправді прийшов (offline з .mbtiles чи
// online з мережі), і бейдж перемальовується за більшістю тайлів, що
// прогрузились у межах останніх ~400мс (невеликий дебаунс, бо за раз
// підвантажується десяток тайлів одночасно — рахувати кожен окремо без
// паузи дало б безглузде миготіння).
function refreshMapBadges(){
  Object.values(mapInstances).forEach(st=>{
    if(!st.badge) return;
    st.badge.textContent = mbSqlDb ? 'OFFLINE' : 'ONLINE';
    st.badge.className = 'map-tile-badge ' + (mbSqlDb ? 'map-tile-offline' : 'map-tile-online');
  });
}
function reportTileSource(st, src){
  if(!st) return;
  st.tileSrcCounts = st.tileSrcCounts || {online:0, offline:0};
  st.tileSrcCounts[src]++;
  clearTimeout(st.tileSrcTimer);
  st.tileSrcTimer = setTimeout(()=>{
    const c = st.tileSrcCounts;
    const isOffline = c.offline >= c.online; // рівність (напр. 0:0 не буває тут) — за офлайн, як оптимістичний варіант
    st.tileSrcCounts = {online:0, offline:0};
    if(!st.badge) return;
    st.badge.textContent = isOffline ? 'OFFLINE' : 'ONLINE';
    st.badge.className = 'map-tile-badge ' + (isOffline ? 'map-tile-offline' : 'map-tile-online');
  }, 400);
}

// ── Тема карти (Темна/Світла) — тогл у Налаштування → Карта. "Темна" =
// звичайні світлі OSM-тайли просто інвертуються фільтром (без окремого
// набору нічних тайлів), "Світла" = тайли як є. Фільтр вішаємо саме на
// .map-tile-viewport (не на .map-tile-inner), тому індикатор ONLINE/OFFLINE
// (сусідній елемент, поза viewport) кольори не інвертує і лишається читабельним. ──
function applyMapTheme(st){
  if(!st.viewportEl) return;
  st.viewportEl.classList.toggle('map-theme-dark', !!MapCfg.dark);
}
function applyMapThemeAll(){ Object.values(mapInstances).forEach(applyMapTheme); }

// ── Квадратний контейнер для обертання без порожніх кутів ──
// Сторона квадрата = діагональ видимої плитки (+запас) — тоді хоч як його
// не крутити навколо центру, видима прямокутна область завжди повністю
// вкрита картою.
function sizeRotatedMapContainer(st){
  // 20.08.2026: КОРІНЬ багу "карта то коротка, то протікає" (на відміну
  // від стабільного 2×2, де та сама похибка непомітна через майже-
  // квадратну форму). Раніше clientWidth/clientHeight читались СИНХРОННО
  // в момент виклику — якщо це збігалось із щойно зміненим style.height
  // тайла (напр. від applyBottomRowAutoHeight, чи від ResizeObserver, що
  // спрацював "впритул" до того, як браузер остаточно "усадив" layout),
  // вимір ловив ЗАСТАРІЛИЙ розмір viewport, і квадрат-контейнер
  // рахувався під неправильний прямокутник.
  //
  // 20.08.2026 (друга ітерація — розділення шарів): один requestAnimationFrame
  // виявився недостатньою гарантією "все вже усталося" — сітка (позиція й
  // розмір КОРОБКИ тайла) продовжує керуватись чистим CSS і завжди готова
  // вже в поточному кадрі, як і в усіх звичайних плиток. Але ВМІСТ карти
  // (Leaflet-квадрат) — окремий шар зі своєю математикою — тепер СВІДОМО
  // домальовується ПІЗНІШЕ: спочатку чекаємо кадр (щоб CSS-layout напевно
  // усівся), а ПОТІМ ще невелику паузу (150мс) — щоб пережити й будь-які
  // вторинні перерахунки (напр. каскад від ResizeObserver, що сам себе
  // перетригерює, чи CSS-перехід border-radius/height анімації тайла).
  // Користувачу секунда затримки контенту карти НЕ страшна — головне,
  // щоб коли вона намалювалась, розмір був правильний одразу, без "то
  // коротко, то протікає". Захист від дублювання (_sizeRAFPending) —
  // щоб кілька викликів поспіль не плодили купу паралельних таймерів.
  if(st._sizeRAFPending) return;
  st._sizeRAFPending=true;
  requestAnimationFrame(function(){
    setTimeout(function(){
      st._sizeRAFPending=false;
      const w=st.viewportEl.clientWidth, h=st.viewportEl.clientHeight;
      if(!w||!h) return;
      const diag=Math.ceil(Math.sqrt(w*w+h*h))+24;
      st.wrapEl.style.width=diag+'px';
      st.wrapEl.style.height=diag+'px';
      try{ st.map.invalidateSize(); }catch(e){}
      applyMapTransform(st); // розмір змінився — переприв'язати transform-origin/зсув
    }, 150);
  });
}
function resizeAllMapTiles(){

    // (portrait↔landscape) цей кеш застарілий, доки не викликати
    // invalidateSize() явно; без цього внутрішнє позиціювання Leaflet
    // (а разом з ним — координати наших HUD/кнопок, прив'язаних до
    // viewport) могло "їхати" відносно того, що реально бачить користувач.

    // inline left/top/right/bottom (перетягнуто рукою) від ПОПЕРЕДНЬОЇ
    // орієнтації, ці пікселі більше не мають сенсу в новій. Скидаємо, щоб
    // елемент повернувся до CSS-правила саме для нової орієнтації — і

    if(calibMode){

let _mapResizeT=null;
let _mapResizePendingOnBlur=false;

// (300мс) мали ДВА повністю незалежних таймери — при повороті екрана
// обидва спрацьовували, і resizeAllMapTiles() (а всередині — map.
// invalidateSize() + новий запит пачки тайлів) міг виконатись ДВІЧІ
// підряд за один фізичний поворот. Тепер обидві події ділять ОДИН
// спільний таймер: та подія, що спрацює останньою, повністю скасовує
// таймер попередньої — виклик гарантовано один.
function scheduleMapResize(delay){
  const ae=document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT')){
    // 20.08.2026 (варіант 2, ПІДТВЕРДЖЕНО тестом): поки клавіатура
    // відкрита (є фокус на полі вводу) — НЕ чіпаємо мапу взагалі.
    // map.invalidateSize()+перезапит пачки офлайн-тайлів через sql.js
    // САМЕ в цей момент (resize від появи клавіатури) спричиняв реальний
    // крах WebView. Мапа й так частково прихована клавіатурою — не
    // критично лишити її неоновленою, поки людина друкує. "Борг"
    // запам'ятовуємо і відпрацьовуємо одразу після blur поля (див.
    // document.addEventListener('blur',...) нижче).
    _mapResizePendingOnBlur=true;
    return;
  }

window.addEventListener('resize', ()=>scheduleMapResize(200));
window.addEventListener('orientationchange', ()=>scheduleMapResize(300));

// Позиціонування (центрування) + обертання квадрата — один transform, щоб
// порядок translate→rotate був завжди однаковий.
function applyMapTransform(st){
  const deg = (st.heading!=null) ? -st.heading : 0; // мінус: обертаємо карту НАЗУСТРІЧ курсу, щоб напрям руху завжди дивився вгору
  st.wrapEl.style.transform = `translate(-50%,-50%) rotate(${deg}deg)`;
}
function setMapHeading(st, heading){
  if(heading==null || isNaN(heading)) return; // курс невідомий (стоїмо на місці) — лишаємо попередній поворот як є
  st.heading = heading;
  applyMapTransform(st);
}
