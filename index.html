<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bluefy Fullscreen Keyboard Fix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: #121212;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      /* Використовуємо JS для точного розрахунку height */
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      /* За замовчуванням враховуємо Safe Area */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Клас, який вимикає нижній Safe Area, коли відкрита клавіатура */
    body.keyboard-open #app {
      padding-bottom: 0px !important;
    }

    header {
      background: #1e1e1e;
      padding: 15px;
      text-align: center;
      border-bottom: 2px solid #00e676;
    }

    main {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      outline: none;
    }

    footer {
      background: #1e1e1e;
      padding: 15px;
      text-align: center;
      border-top: 2px solid #2196f3;
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <h3>Bluefy Fullscreen Test</h3>
    </header>

    <main>
      <p>Статус: <b id="status">Звичайний</b></p>
      <input type="text" id="input" placeholder="Натисни для клавіатури...">
    </main>

    <footer>
      <p>Низ екрана (Footer)</p>
    </footer>
  </div>

  <script>
    const input = document.getElementById('input');
    const status = document.getElementById('status');
    const initialHeight = window.innerHeight;

    // Фіксуємо body строго за розміром екрана
    function lockBodyHeight() {
      document.body.style.height = `${window.innerHeight}px`;
    }

    lockBodyHeight();

    // Обробка відкриття клавіатури у Bluefy
    input.addEventListener('focus', () => {
      document.body.classList.add('keyboard-open');
      status.textContent = "Клавіатура відкрита";

      // Скидаємо скролл WKWebView, який ламає Safe Area
      setTimeout(() => {
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
      }, 50);
    });

    input.addEventListener('blur', () => {
      document.body.classList.remove('keyboard-open');
      status.textContent = "Звичайний";
      
      setTimeout(() => {
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
        lockBodyHeight();
      }, 50);
    });

    // Фікс для відстеження зміни розміру вьюпорта Bluefy
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        // Якщо висота вьюпорта зменшилася — клавіатура відкрита
        if (window.visualViewport.height < initialHeight - 100) {
          document.body.classList.add('keyboard-open');
        } else {
          document.body.classList.remove('keyboard-open');
        }
        window.scrollTo(0, 0);
      });
    }
  </script>
</body>
</html>
