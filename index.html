<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bluefy True Fullscreen Fix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      
      /* Заповнюємо відступи під монобров та виріз */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    header {
      background: #1e1e1e;
      padding: 15px;
      text-align: center;
      border-bottom: 2px solid #00e676;
    }

    main {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Оболонка для поля вводу */
    .input-wrapper {
      position: relative;
      width: 100%;
      height: 50px;
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 14px;
    }

    /* Візуальне поле */
    .input-display {
      font-size: 16px;
      color: #fff;
      pointer-events: none;
    }

    .placeholder {
      color: #777;
    }

    /* Невидимий справжній input на весь розмір контейнера */
    .hidden-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      font-size: 16px; /* Запобігає зуму в iOS */
    }

    footer {
      background: #1e1e1e;
      padding: 15px;
      text-align: center;
      border-top: 2px solid #2196f3;
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <h3>Bluefy Fullscreen Test</h3>
    </header>

    <main>
      <p>Статус: <b id="status">Звичайний</b></p>
      
      <div class="input-wrapper">
        <div class="input-display" id="display"><span class="placeholder">Натисни для клавіатури...</span></div>
        <input type="text" class="hidden-input" id="realInput" autocomplete="off">
      </div>
    </main>

    <footer>
      <p>Низ екрана (Footer)</p>
    </footer>
  </div>

  <script>
    const realInput = document.getElementById('realInput');
    const display = document.getElementById('display');
    const status = document.getElementById('status');

    // Синхронізуємо текст з невидимого інпуту у видимий div
    realInput.addEventListener('input', (e) => {
      const val = e.target.value;
      if (val) {
        display.innerHTML = val;
      } else {
        display.innerHTML = '<span class="placeholder">Натисни для клавіатури...</span>';
      }
    });

    // Блокуємо скролл WKWebView під час фокусу
    realInput.addEventListener('focus', () => {
      status.textContent = "Клавіатура відкрита";
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
    });

    realInput.addEventListener('blur', () => {
      status.textContent = "Звичайний";
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
    });

    // Жорстко блокуємо зсув сторінки
    window.addEventListener('scroll', () => {
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
