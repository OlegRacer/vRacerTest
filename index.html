<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fix ContentEditable</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #121212;
      color: #fff;
      position: fixed;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Кастомне поле вводу замість інпуту */
    .custom-input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      background: #222;
      border: 1px solid #555;
      border-radius: 8px;
      color: #fff;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .custom-input:empty:before {
      content: attr(placeholder);
      color: #888;
    }
  </style>
</head>
<body>

  <div id="app">
    <div style="background:#1e1e1e; padding:15px; text-align:center;">
      HEADER (Top Safe Area)
    </div>

    <div style="padding: 20px;">
      <!-- Використовуємо div з contenteditable замість input -->
      <div class="custom-input" contenteditable="true" id="fakeInput" placeholder="Торкніться для вводу..."></div>
    </div>

    <div style="background:#1e1e1e; padding:15px; text-align:center;">
      FOOTER (Bottom Safe Area)
    </div>
  </div>

  <script>
    // Блокуємо будь-які спроби WKWebView зсунути сторінку
    document.addEventListener('scroll', () => {
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
