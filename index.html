const CAM_EDIT_RADIUS_M = 8000;   // ширше за POI_RADIUS_M (3000) — камер на карті значно менше, ніж АЗС/крамниць
const CAM_DELETE_RADIUS_M = 40;   // допустима похибка тапу пальцем відносно реальної точки камери

// Довгий тап по бейджу камери (попап з лімітом/напрямом, що відкривається
// звичайним тапом по маркеру) відкриває те саме меню редагування, що й
// тап по карті в showCameraEditMenu — але БЕЗ пошуку найближчої камери за
// координатами тапу пальцем: попап уже прив'язаний до конкретного маркера,
// тож використовуємо ТОЧНІ координати цієї камери (item.lat/item.lon) —
// findNearestCamera з відстанню ~0 завжди знайде саме її, навіть якщо
// поруч є інші камери в межах CAM_DELETE_RADIUS_M. Так не треба точно
// попадати пальцем туди ж, де стоїть маркер, щоб видалити/змінити напрям.
const CAM_BADGE_LONG_PRESS_MS = 550;
function attachCamBadgeLongPress(st, marker, item){
  let pressTimer=null;
  marker.on('popupopen', function(e){
    const el = e.popup.getElement();
    if(!el) return;
    const start=function(){
      pressTimer=setTimeout(function(){
        if(navigator.vibrate) try{ navigator.vibrate(30); }catch(err){}
        st.map.closePopup();
        showCameraEditMenu(st, {lat:item.lat, lng:item.lon});
      }, CAM_BADGE_LONG_PRESS_MS);
    };
    const cancel=function(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointerleave', cancel);
    el.addEventListener('pointercancel', cancel);
  });
}

// dirDeg — напрям (0-359° від півночі за годинниковою), або null/undefined
// = "обидва напрямки" (без стрілочки). Стрілочка — трикутник над колом,
// повернутий навколо ЦЕНТРУ кола (transform-origin винесено вниз рівно на
// половину висоти кола) — класичний прийом "стрілка годинника".
function camEditIcon(color, dirDeg){
  const arrow = (dirDeg==null) ? '' :
    '<div style="position:absolute;top:-8px;left:50%;width:0;height:0;'+
    'transform:translateX(-50%) rotate('+dirDeg+'deg);transform-origin:50% 21px;'+
    'border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid '+color+';"></div>';
  return L.divIcon({
    className:'cam-edit-div-icon',
    html:'<div style="position:relative;width:26px;height:26px;border-radius:50%;background:'+color+';display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9 4L7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg>'+arrow+'</div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
}

function clearCamEditMarkers(st){
  if(!st.camMarkers) st.camMarkers=[];
  st.camMarkers.forEach(function(m){ try{ st.map.removeLayer(m); }catch(e){} });
  st.camMarkers=[];
}

// Малює І CAMERAS_DB (синій), І PENDING_CAMS (жовтогарячий, ще не влиті —
// щоб було видно різницю просто на карті, а не тільки в редакторі
// Налаштування → Сигнали). Радіус — від поточного центру карти.
function drawCamEditMarkers(st){
  clearCamEditMarkers(st);
  const center=st.map.getCenter();
  let count=0;
  // 25.08.2026: тап по маркеру камери в РЕЖИМІ БУЛАВКИ (routePlanMode, і
  // саме не через кнопку 📷 — див. camAddModeViaBtn вище) відкриває меню
  // Старт/Проміжна/Фініш у координатах камери, так само як тап по
  // магазину/Улюбленому. bindPopup лишаємо як є (від нього залежить
  // довге натискання в attachCamBadgeLongPress через подію 'popupopen') —
  // просто ДОДАЄМО другий click-обробник ПІСЛЯ, який миттєво закриває
  // щойно відкритий попап і замінює його меню булавки, коли це доречно.
  CAMERAS_DB.forEach(function(c){
    if(haversineM(center.lat, center.lng, c.lat, c.lon) > CAM_EDIT_RADIUS_M) return;
    const marker=L.marker([c.lat,c.lon], {icon:camEditIcon(c.mobile?'#f1c40f':'#3498db', c.dir)}).addTo(st.map);
    marker.bindPopup('<div style="color:#111;font-size:13px;font-weight:700;"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9 4L7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg> '+(c.limit!=null?c.limit+' км/год':'без ліміту')+(c.mobile?' (тимчасова)':'')+'<br>'+(c.dir!=null?'напрям: '+Math.round(c.dir)+'°':'обидва напрямки')+'<br><span style="font-weight:400;color:#666;font-size:11px;">довгий тап тут — редагувати</span></div>');
    attachCamBadgeLongPress(st, marker, c);
    marker.on('click', function(){
      if(routePlanMode && !camAddModeViaBtn){ marker.closePopup(); showPointContextMenu(st, marker.getLatLng()); }
    });
    st.camMarkers.push(marker);
    count++;
  });
  PENDING_CAMS.forEach(function(p){
    if(haversineM(center.lat, center.lng, p.lat, p.lon) > CAM_EDIT_RADIUS_M) return;
    const marker=L.marker([p.lat,p.lon], {icon:camEditIcon('#e67e22', p.dir)}).addTo(st.map);
    marker.bindPopup('<div style="color:#111;font-size:13px;font-weight:700;"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9 4L7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg> '+(p.limit!=null?p.limit+' км/год':'без ліміту')+' (нова, ще не влита в базу)<br>'+(p.dir!=null?'напрям: '+Math.round(p.dir)+'°':'обидва напрямки')+'<br><span style="font-weight:400;color:#666;font-size:11px;">довгий тап тут — редагувати</span></div>');
    attachCamBadgeLongPress(st, marker, p);
    marker.on('click', function(){
      if(routePlanMode && !camAddModeViaBtn){ marker.closePopup(); showPointContextMenu(st, marker.getLatLng()); }
    });
    st.camMarkers.push(marker);
    count++;
  });
  return count;
}

// 25.08.2026: відрізняє "камери показані за постійним перемикачем 📡
// (Камери) в меню Маршрут" від "камери показані через саму кнопку 📷 на
// карті", яка ЗАРАДИ тапу по порожній карті (=додати нову камеру) сама
// вмикає routePlanMode як побічний ефект. Потрібно, щоб клік по вже
// існуючому маркеру камери знав, коли routePlanMode активний "по-справжньому"
// (для булавки Старт/Проміжна/Фініш), а коли — лише тому, що зараз триває
// сесія додавання камери через 📷.
let camAddModeViaBtn=false;
// Тап на 📷: якщо камери вже показані на цій плитці — просто прибрати
// (як ⛽). Інакше — намалювати всі поруч. Автоматично вмикає режим
// редагування (routePlanMode), якщо ще не увімкнений — щоб не змушувати
// тицяти ще й 🚩 окремо; якщо камери ховаємо — навпаки, гасимо і
// routePlanMode, якщо саме ВІН тримав його увімкненим.
function toggleCamEditorView(st){
  st.camEditorMode=!st.camEditorMode;
  if(st.navCamMarkBtnEl) st.navCamMarkBtnEl.classList.toggle('on', st.camEditorMode);
  if(st.camEditorMode){
    const n=drawCamEditMarkers(st);
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9 4L7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg> Показано '+n+' камер поруч ('+(CAM_EDIT_RADIUS_M/1000)+' км)');
    if(!routePlanMode){ toggleRoutePlanMode(st); camAddModeViaBtn=true; }
  } else {
    clearCamEditMarkers(st);
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9 4L7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg> Камери приховано');
    if(routePlanMode && camAddModeViaBtn) toggleRoutePlanMode(st);
    camAddModeViaBtn=false;
  }
}

// Найближча камера (з CAMERAS_DB або PENDING_CAMS) до latlng, у межах
// CAM_DELETE_RADIUS_M. Повертає {source:'db'|'pending', index, item} або null.
function findNearestCamera(latlng){
  let best=null, bestDist=CAM_DELETE_RADIUS_M;
  CAMERAS_DB.forEach(function(c, idx){
    const d=haversineM(latlng.lat, latlng.lng, c.lat, c.lon);
    if(d<=bestDist){ bestDist=d; best={source:'db', index:idx, item:c}; }
  });
  PENDING_CAMS.forEach(function(p, idx){
    const d=haversineM(latlng.lat, latlng.lng, p.lat, p.lon);
    if(d<=bestDist){ bestDist=d; best={source:'pending', index:idx, item:p}; }
  });
  return best;
}

function deleteCameraAt(st, found){
  if(found.source==='db'){
    CAMERAS_DB.splice(found.index,1);
    ls('camdb', CAMERAS_DB);
    camDbMeta={ count:CAMERAS_DB.length, updatedAt:Date.now() };
    ls('camdbmeta', camDbMeta);
    try{ renderCamDbStatus(); }catch(e){}
  } else {
    PENDING_CAMS.splice(found.index,1);
    ls('pendingcams', PENDING_CAMS);
    updateCamMarkFabBadge();
    try{ renderPendingCamsEditor(); }catch(e){}
  }
  sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg> Камеру видалено');
  Object.values(mapInstances).forEach(function(s){ if(s.camEditorMode) drawCamEditMarkers(s); });
}

// Прибирає тимчасовий сірий маркер-прев'ю, що показується під час вибору
// напряму (крок між "➕ Додати камеру тут" і формою ліміту).
function clearCamDirPreview(st){
  if(st.camDirPreviewMarker){ try{ st.map.removeLayer(st.camDirPreviewMarker); }catch(e){} st.camDirPreviewMarker=null; }
}

// Крок "куди дивиться камера": ставимо сірий маркер-прев'ю на camPoint і
// чекаємо ЩЕ ОДИН тап по карті — той наступний тап трактується як напрям
// (перевірка st.awaitingCamDirTap стоїть ПЕРШОЮ в map.on('click', ...),
// ще до розвилки routePlanMode/camEditorMode). Кнопка "Обидва напрямки" в
// попапі — альтернативний вихід без другого тапу. onDirChosen(dirDeg|null)
// викликається рівно один раз, після чого стан скидається.
function startCamDirectionPick(st, camPoint, onDirChosen){
  clearCamDirPreview(st);
  st.camDirPreviewMarker = L.marker([camPoint.lat, camPoint.lng], {icon:camEditIcon('#95a5a6', null)}).addTo(st.map);
  st.awaitingCamDirTap = { point:camPoint, callback:onDirChosen };
  sht('🧭 Тапни на карті туди, куди дивиться камера — або "Обидва напрямки" в меню');

  const div=document.createElement('div');
  const counterRotateDeg=(st.heading!=null) ? st.heading : 0;
  div.style.cssText='display:flex;flex-direction:column;gap:6px;min-width:190px;transform:rotate('+counterRotateDeg+'deg);';
  const hint=document.createElement('div');
  hint.textContent='🧭 Тапни в напрямку, куди дивиться камера';
  hint.style.cssText='font-size:12px;color:#111;line-height:1.3;';
  const bothBtn=document.createElement('button');
  bothBtn.type='button'; bothBtn.textContent='↔️ Обидва напрямки';
  bothBtn.style.cssText='padding:8px 10px;border-radius:8px;border:1px solid #ccc;background:#f2f2f2;color:#111;font-size:14px;font-weight:600;';
  bothBtn.addEventListener('click', function(){
    st.map.closePopup();
    clearCamDirPreview(st);
    st.awaitingCamDirTap=null;
    onDirChosen(null);
  });
  div.appendChild(hint); div.appendChild(bothBtn);
  L.popup({closeButton:true, className:'plan-point-popup', autoClose:false, closeOnClick:false}).setLatLng(camPoint).setContent(div).openOn(st.map);
}

// Меню, що з'являється тапом по карті, ПОКИ routePlanMode активний І
// st.camEditorMode===true (розвилка в map.on('click', ...)). Той самий
// контррот-патерн, що й showPointContextMenu/openCamMarkPopupOnMap —
// popup Leaflet живе всередині st.wrapEl, який обертається за курсом
// під час навігації.
function showCameraEditMenu(st, latlng){
  const found=findNearestCamera(latlng);
  const div=document.createElement('div');
  const counterRotateDeg=(st.heading!=null) ? st.heading : 0;
  div.style.cssText='display:flex;flex-direction:column;gap:6px;min-width:190px;transform:rotate('+counterRotateDeg+'deg);';

  function mkActionBtn(label){
    const b=document.createElement('button');
    b.type='button'; b.textContent=label;
    b.style.cssText='padding:8px 10px;border-radius:8px;border:1px solid #ccc;background:#f2f2f2;color:#111;font-size:14px;font-weight:600;text-align:left;';
    return b;
  }

  const addBtn=mkActionBtn('➕ Додати камеру тут');
  addBtn.addEventListener('click', function(){
    st.map.closePopup();
    startCamDirectionPick(st, latlng, function(dirDeg){
      showAddCameraForm(st, latlng, dirDeg);
    });
  });
  div.appendChild(addBtn);

  if(found){
    const dirInfo = found.item.dir!=null ? ' · напрям '+Math.round(found.item.dir)+'°' : ' · обидва напрямки';
    const info=(found.item.limit!=null ? found.item.limit+' км/год' : 'без ліміту')+(found.item.mobile?' · тимчасова':'')+(found.source==='pending'?' · нова, не влита':'')+dirInfo;
    const delBtn=mkActionBtn('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg> Видалити камеру ('+info+')');
    delBtn.style.background='#fde2e2'; delBtn.style.borderColor='#e74c3c';
    delBtn.addEventListener('click', function(){
      st.map.closePopup();
      deleteCameraAt(st, found);
    });
    div.appendChild(delBtn);

    // Напрям можна задати чи змінити й для ВЖЕ ІСНУЮЧОЇ камери (не тільки
    // для нової) — та сама startCamDirectionPick, тільки callback пише
    // напряму в found.item замість створення нового запису.
    const dirBtn=mkActionBtn(found.item.dir!=null ? '🧭 Змінити напрям' : '🧭 Задати напрям');
    dirBtn.addEventListener('click', function(){
      st.map.closePopup();
      startCamDirectionPick(st, {lat:found.item.lat, lng:found.item.lon}, function(dirDeg){
        if(dirDeg==null) delete found.item.dir; else found.item.dir=((dirDeg%360)+360)%360;
        if(found.source==='db'){ ls('camdb', CAMERAS_DB); } else { ls('pendingcams', PENDING_CAMS); }
        sht(dirDeg==null ? '↔️ Напрям знято — обидва напрямки' : '🧭 Напрям встановлено ('+Math.round(dirDeg)+'°)');
        Object.values(mapInstances).forEach(function(s){ if(s.camEditorMode) drawCamEditMarkers(s); });
      });
    });
    div.appendChild(dirBtn);
  } else {
    const hint=document.createElement('div');
    hint.textContent='Поруч (менше '+CAM_DELETE_RADIUS_M+'м) камер нема — видаляти нічого.';
    hint.style.cssText='font-size:11px;color:#666;padding:2px 2px;';
    div.appendChild(hint);
  }

  L.popup({closeButton:true, className:'plan-point-popup'}).setLatLng(latlng).setContent(div).openOn(st.map);
}

// Форма додавання камери — ручний ліміт (число, обов'язково) + галочка
// "тимчасова" (=mobile у схемі даних, як і в PENDING_CAMS/CAMERAS_DB) +
// напрям, який уже визначено попереднім кроком (startCamDirectionPick,
// dirDeg тут — готове число 0-359 або null="обидва напрямки"). Пише
// ОДРАЗУ в CAMERAS_DB (див. коментар у шапці розділу).
function showAddCameraForm(st, latlng, dirDeg){
  clearCamDirPreview(st); // прибираємо сірий маркер-прев'ю з кроку вибору напряму — далі формою керує ця функція
  const div=document.createElement('div');
  const counterRotateDeg=(st.heading!=null) ? st.heading : 0;
  div.style.cssText='display:flex;flex-direction:column;gap:8px;min-width:190px;transform:rotate('+counterRotateDeg+'deg);';

  const label=document.createElement('div');
  label.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9 4L7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg> Нова камера — ліміт (км/год)';
  label.style.cssText='font-size:13px;color:#111;font-weight:700;';

  const dirLabel=document.createElement('div');
  dirLabel.textContent = dirDeg!=null ? ('🧭 Напрям: '+Math.round(dirDeg)+'°') : '↔️ Напрям: обидва';
  dirLabel.style.cssText='font-size:12px;color:#555;';

  const input=document.createElement('input');
  input.type='number'; input.placeholder='напр. 60';
  input.style.cssText='padding:8px;border-radius:8px;border:1px solid #ccc;font-size:14px;color:#111;';

  const chkRow=document.createElement('label');
  chkRow.style.cssText='display:flex;align-items:center;gap:6px;font-size:13px;color:#111;';
  const chk=document.createElement('input'); chk.type='checkbox';
  chkRow.appendChild(chk);
  chkRow.appendChild(document.createTextNode('Тимчасова/пересувна камера'));

  const saveBtn=document.createElement('button');
  saveBtn.type='button'; saveBtn.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 5h8v4H6V5z"/></svg> Зберегти камеру';
  saveBtn.style.cssText='padding:9px 10px;border-radius:8px;border:1px solid #ccc;background:#f2f2f2;color:#111;font-weight:700;font-size:14px;';
  saveBtn.addEventListener('click', function(){
    const val=parseFloat(input.value);
    if(isNaN(val)){ sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Вкажи ліміт швидкості числом'); return; }
    const camObj={ lat:latlng.lat, lon:latlng.lng, limit:val, type:'speed', mobile:chk.checked };
    if(dirDeg!=null) camObj.dir=((dirDeg%360)+360)%360;
    CAMERAS_DB.push(camObj);
    ls('camdb', CAMERAS_DB);
    camDbMeta={ count:CAMERAS_DB.length, updatedAt:Date.now() };
    ls('camdbmeta', camDbMeta);
    try{ renderCamDbStatus(); }catch(e){}
    st.map.closePopup();
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg> Камеру додано ('+val+' км/год)');
    Object.values(mapInstances).forEach(function(s){ if(s.camEditorMode) drawCamEditMarkers(s); });
  });

  div.appendChild(label); div.appendChild(dirLabel); div.appendChild(input); div.appendChild(chkRow); div.appendChild(saveBtn);
  L.popup({closeButton:true, className:'plan-point-popup'}).setLatLng(latlng).setContent(div).openOn(st.map);
}

function planPointIcon(label, color){
  return L.divIcon({
    className:'plan-point-icon',
    html:'<div style="width:26px;height:26px;border-radius:50%;background:'+color+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);">'+label+'</div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
}
function clearPlanMarkers(st){
  if(!st.planMarkers) st.planMarkers=[];
  st.planMarkers.forEach(function(m){ try{ st.map.removeLayer(m); }catch(e){} });
  st.planMarkers=[];
}
// 15.08.2026: тап по вже поставленій точці (S/номер/F) — ТІЛЬКИ поки
// активний 🚩 (routePlanMode), той самий принцип, що й у "✏️ Редакторі"
// магазинів: без активного режиму маркери суто інформаційні. Маленьке
// меню з "🗑 Видалити"; переміщення — просто перетягуванням мітки
// пальцем (draggable, коміт на dragend, без окремої форми — тут нема що
// заповнювати, лише координати).
function showPlanPointEditMenu(st, marker, kind, idx){
  const div=document.createElement('div');
  const counterRotateDeg=(st.heading!=null) ? st.heading : 0;
  div.style.cssText='display:flex;flex-direction:column;gap:6px;min-width:170px;transform:rotate('+counterRotateDeg+'deg);';
  const label=document.createElement('div');
  label.textContent = kind==='start' ? '🟢 Старт' : kind==='finish' ? '🔴 Фініш' : '🟡 Проміжна точка '+(idx+1);
  label.style.cssText='font-size:13px;color:#111;font-weight:700;';
  div.appendChild(label);
  const hint=document.createElement('div');
  hint.textContent='Перетягни мітку пальцем, щоб перемістити';
  hint.style.cssText='font-size:11px;color:#666;';
  div.appendChild(hint);
  // 25.08.2026: примусова ручна позиція — тільки для проміжних точок
  // (kind==='waypoint'). За проханням: "нажав, поставив примусово два" —
  // поле з поточним номером, кнопка "Встановити", яка одразу переставляє
  // точку на вказане місце в planWaypoints (movePlanWaypointToPosition).
  // Наступні НОВІ точки й далі вставляються автоматично за відстанню —
  // це не "закріплює" точку назавжди, лише переставляє зараз.
  if(kind==='waypoint'){
    const posRow=document.createElement('div');
    posRow.style.cssText='display:flex;align-items:center;gap:6px;';
    const posLabel=document.createElement('span');
    posLabel.textContent='Позиція:';
    posLabel.style.cssText='font-size:12px;color:#111;';
    const posInput=document.createElement('input');
    posInput.type='number'; posInput.min='1'; posInput.max=String(planWaypoints.length);
    posInput.value=String(idx+1);
    posInput.style.cssText='width:56px;padding:8px 6px;border-radius:8px;border:1px solid #999;font-size:16px;'; // 16px — інакше WKWebView зумить сторінку при фокусі (правило БЗ п.6.5)
    const posBtn=document.createElement('button');
    posBtn.type='button'; posBtn.textContent='Встановити';
    posBtn.style.cssText='padding:8px 10px;border-radius:8px;border:1px solid #2ecc71;background:#e8fbef;color:#1e8449;font-weight:700;font-size:13px;';
    posBtn.addEventListener('click', function(){
      st.map.closePopup();
      movePlanWaypointToPosition(idx, parseInt(posInput.value,10));
    });
    posRow.appendChild(posLabel); posRow.appendChild(posInput); posRow.appendChild(posBtn);
    div.appendChild(posRow);
  }
  const delBtn=document.createElement('button');
  delBtn.type='button'; delBtn.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg> Видалити';
  delBtn.style.cssText='padding:9px 10px;border-radius:8px;border:1px solid #e74c3c;background:#fde2e2;color:#c0392b;font-weight:700;font-size:14px;';
  delBtn.addEventListener('click', function(){
    st.map.closePopup();
    deletePlanPoint(kind, idx);
  });
  div.appendChild(delBtn);
  L.popup({closeButton:true, className:'plan-point-popup'}).setLatLng(marker.getLatLng()).setContent(div).openOn(st.map);
}
// Видаляє ОДНУ точку плану (не весь маршрут — для повного очищення й
// далі служить окрема кнопка 🗑/clearRoutePlan). Якщо після видалення
// Старт+Фініш все ще обидва на місці — одразу перебудовуємо маршрут з
// рештою точок. Якщо видалили саме Старт чи Фініш — уже збудована лінія
// більше не дійсна, прибираємо її (clearMapRoute), сам план точок
// (planWaypoints тощо) це не чіпає.
async function deletePlanPoint(kind, idx){
  let label;
  if(kind==='start'){ planStartPoint=null; label='Старт'; }
  else if(kind==='finish'){ planEndPoint=null; label='Фініш'; }
  else { planWaypoints.splice(idx,1); label='Проміжна точка'; }
  renderWaypointMarkers();
  if(planStartPoint && planEndPoint){
    buildPlanRoute();
  } else if(mapRouteLatLngs){
    planRoutes=[]; planActiveRouteIndex=0;
    Object.values(mapInstances).forEach(clearPlanAltLines);
    await clearMapRoute();
  }
  sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg> Видалено: '+label);
}
function renderPlanMarkersForInstance(st){
  clearPlanMarkers(st);
  // 15.08.2026: draggable і клік на редагування — лише поки routePlanMode
  // активний (узгоджено з тим, що й тап по ПОРОЖНІЙ карті в цьому режимі
  // теж працює тільки при увімкненому 🚩). dragend одразу коммітить нову
  // позицію в planStartPoint/planWaypoints[idx]/planEndPoint і перебудовує
  // маршрут, якщо обидва кінці на місці.
  function wirePlanMarker(marker, kind, idx){
    marker.on('click', function(){
      if(!routePlanMode) return;
      showPlanPointEditMenu(st, marker, kind, idx);
    });
    marker.on('dragend', function(){
      const ll=marker.getLatLng();
      const pt=[ll.lat, ll.lng];
      if(kind==='start') planStartPoint=pt;
      else if(kind==='finish') planEndPoint=pt;
      else {
        // 25.08.2026: перетягування фізично змінює позицію точки — тож і
        // її місце в послідовності об'їзду перераховуємо заново за
        // відстанню від Старту (той самий принцип, що й при додаванні
        // нової точки), а не просто підмінюємо координати на старому
        // місці в масиві.
        planWaypoints.splice(idx,1);
        insertWaypointByProximity(pt);
      }
      renderWaypointMarkers(); // синхронізує позицію на ІНШИХ плитках карти теж
      if(planStartPoint && planEndPoint) buildPlanRoute();
    });
  }
  if(planStartPoint){
    const m=L.marker(planStartPoint,{icon:planPointIcon('S','#2ecc71'), draggable:!!routePlanMode}).addTo(st.map);
    wirePlanMarker(m,'start');
    st.planMarkers.push(m);
  }
  planWaypoints.forEach(function(wp, idx){
    const m=L.marker(wp,{icon:planPointIcon(String(idx+1),'#f1c40f'), draggable:!!routePlanMode}).addTo(st.map);
    wirePlanMarker(m,'waypoint',idx);
    st.planMarkers.push(m);
  });
  if(planEndPoint){
    const m=L.marker(planEndPoint,{icon:planPointIcon('F','#e74c3c'), draggable:!!routePlanMode}).addTo(st.map);
    wirePlanMarker(m,'finish');
    st.planMarkers.push(m);
  }
}
// function renderWaypointMarkers() з ТЗ — тут перемальовує маркери на УСІХ
// плитках карти одночасно (план маршруту спільний для застосунку, не
// прив'язаний до конкретної плитки, на відміну від POI-маркерів).
function renderWaypointMarkers(){ Object.values(mapInstances).forEach(renderPlanMarkersForInstance); }

// 25.08.2026: нова проміжна точка вставляється НЕ в кінець масиву, а на
// позицію, що відповідає її відстані від Старту (по прямій, haversineM) —
// послідовність об'їзду тепер завжди "від ближчої до Старту — до
// найдальшої", незалежно від порядку, в якому користувач їх ставив на
// ходу. Приклад із запиту: поставили точку — вона №1 (найближча до
// Старту). Поставили ще одну, яка ФІЗИЧНО ближче до Старту за першу —
// нова стає №1, стара автоматично зсувається на №2. Поставили точку між
// якоюсь наявною і Фінішем — вона природно лягає останньою перед Фінішем.
// Якщо Старт ще не заданий (рідкісний порядок дій) — просто додаємо в
// кінець, сортувати нема від чого.
function insertWaypointByProximity(pt){
  if(!planStartPoint){ planWaypoints.push(pt); return planWaypoints.length-1; }
  const d=haversineM(planStartPoint[0], planStartPoint[1], pt[0], pt[1]);
  let i=0;
  while(i<planWaypoints.length && haversineM(planStartPoint[0], planStartPoint[1], planWaypoints[i][0], planWaypoints[i][1])<=d) i++;
  planWaypoints.splice(i, 0, pt);
  return i;
}

// Примусове ручне призначення позиції — викликається з меню редагування
// точки (showPlanPointEditMenu). На відміну від insertWaypointByProximity
// (автоматичне сортування ПРИ ДОДАВАННІ), це ручне "витягни і встав туди,
// куди сказав користувач" для вже існуючої точки — саме той сценарій із
// запиту: "нажав, поставив примусово два". Наступні НОВІ точки й далі
// вставляються автоматично за відстанню (ця дія точку більше не "тримає"
// назавжди на місці — лише зараз переставляє).
function movePlanWaypointToPosition(idx, pos1based){
  const n=planWaypoints.length;
  let newIdx=Math.round(pos1based)-1;
  if(isNaN(newIdx)) return;
  newIdx=Math.max(0, Math.min(n-1, newIdx));
  if(newIdx===idx) return;
  const [pt]=planWaypoints.splice(idx,1);
  planWaypoints.splice(newIdx,0,pt);
  renderWaypointMarkers();
  if(planStartPoint && planEndPoint) buildPlanRoute();
  sht('🟡 Позицію змінено: точка тепер №'+(newIdx+1));
}

function setPlanPoint(kind, latlng){
  const pt=[latlng.lat, latlng.lng];
  let waypointPos=null;
  if(kind==='start') planStartPoint=pt;
  else if(kind==='finish') planEndPoint=pt;
  else waypointPos=insertWaypointByProximity(pt)+1;
  renderWaypointMarkers();
  sht(kind==='start' ? '🟢 Старт встановлено' : kind==='finish' ? '🔴 Фініш встановлено' : '🟡 Проміжна точка додана (позиція '+waypointPos+' з '+planWaypoints.length+')');
  if(planStartPoint && planEndPoint) buildPlanRoute();
}

// Сума довжини ламаної — резерв, якщо API не повернуло готову дистанцію.
function routePointsDistanceM(points){
  let d=0;
  for(let i=1;i<points.length;i++) d+=haversineM(points[i-1][0],points[i-1][1],points[i][0],points[i][1]);
  return d;
}

// ── ORS Directions v2 (POST, geojson) ── points: [[lat,lon],...] у порядку
// Старт→Проміжні→Фініш. wantAlternatives — тільки коли рівно 2 точки
// (обмеження самого ORS). avoidFeatures — опційний масив на майбутнє для
// режиму 249cc (модуль 1, ще не підключений).
async function buildOrsRouteRequest(points, wantAlternatives, avoidFeatures){
  const apiKey=(typeof getOrsApiKey==='function') ? getOrsApiKey() : '';
  if(!apiKey) return null; // немає ключа — це останній рушій у черзі, повертаємо null (тост про це вже показав buildPlanRoute)
  try{
    const url='https://api.openrouteservice.org/v2/directions/driving-car/geojson';
    const body={ coordinates: points.map(function(p){ return [p[1], p[0]]; }) };
    if(wantAlternatives) body.alternative_routes={ target_count:3, share_factor:0.6, weight_factor:1.4 };
    if(avoidFeatures && avoidFeatures.length) body.options={ avoid_features: avoidFeatures };
    const resp=await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':apiKey },
      body:JSON.stringify(body)
    });
    const data=await resp.json();
    if(!data || !data.features || !data.features.length){
      if(data && data.error) console.warn('[route] ORS відхилив запит:', data.error.message || data.error);
      return null;
    }
    return data.features.map(function(f){
      const pts=f.geometry.coordinates.map(function(c){ return [c[1], c[0]]; });
      const summary=f.properties && f.properties.summary;
      const distM=(summary && summary.distance!=null) ? summary.distance : routePointsDistanceM(pts);
      const durationS=(summary && summary.duration!=null) ? summary.duration : null;
      return { points:pts, distanceM:distM, durationS:durationS };
    });
  }catch(e){ console.warn('[route] ORS недоступний:', e); return null; }
}

// ── TomTom Calculate Route (GET) ── 18.08.2026: другий рушій у черзі
// (одразу після Google, перед ORS) — traffic=true враховує ЖИВИЙ трафік,
// тому r.summary.travelTimeInSeconds тут реальний (не "чистий вільний
// шлях", як в ORS). avoidFeatures — власна номенклатура TomTom
// (motorways/tollRoads/ferries), відрізняється від ORS-івської
// (highways/tollways/ferries) — конвертація відбувається в buildPlanRoute
// нижче, тут очікується вже готовий TomTom-список.
let lastTomTomFailReason=null; // 20.08.2026: причина останньої відмови TomTom, щоб показати її у фінальному тості (окремий тост тут одразу перезаписався б ORS-фолбеком)
async function buildTomTomRouteRequest(points, wantAlternatives, avoidFeatures, travelMode, routeType){
  const apiKey=getTomTomApiKey();
  lastTomTomFailReason=null;
  if(!apiKey){ lastTomTomFailReason='немає ключа TomTom'; return null; }
  try{
    const coordsPath=points.map(function(p){ return p[0]+','+p[1]; }).join(':');
    const rt=routeType||'fastest';
    let url='https://api.tomtom.com/routing/1/calculateRoute/'+coordsPath+'/json?key='+encodeURIComponent(apiKey)+'&routeType='+encodeURIComponent(rt)+'&traffic=true';
    // 25.08.2026: travelMode — окремий параметр TomTom (car/motorcycle/...),
    // не плутати з avoid. За замовчуванням не додаємо взагалі (car і так
    // дефолт API) — лише коли явно вибрано щось інше в підменю "⚙️ TomTom".
    if(travelMode && travelMode!=='car') url+='&travelMode='+encodeURIComponent(travelMode);
    if(wantAlternatives) url+='&maxAlternatives=2';
    // 20.08.2026: TomTom (на відміну від ORS) очікує КОЖНЕ значення
    // avoid ОКРЕМИМ параметром (&avoid=motorways&avoid=tollRoads&...),
    // а НЕ одним рядком через кому. Підтверджено реальною відповіддю
    // API: "Invalid avoid value: [motorways,tollRoads,ferries]" — API
    // сприйняв весь склеєний рядок як ОДНЕ (невалідне) значення.
    if(avoidFeatures && avoidFeatures.length){
      avoidFeatures.forEach(function(f){ url+='&avoid='+encodeURIComponent(f); });
    }
    const resp=await fetch(url);
    const data=await resp.json();
    if(!data || !data.routes || !data.routes.length){
      // 20.08.2026: раніше причина відмови йшла ЛИШЕ в console.warn —
      // на мобільному без підключеного дебагера це означало, що людина
      // просто бачила "ORS (резерв)" і жодної підказки, ЧОМУ TomTom не
      // відповів. Тепер причину зберігаємо й показуємо у фінальному тості.
      if(data && data.error){
        console.warn('[route] TomTom відхилив запит:', data.error.description || data.error);
        lastTomTomFailReason=data.error.description || JSON.stringify(data.error);
      } else if(!resp.ok){
        console.warn('[route] TomTom HTTP', resp.status, data);
        lastTomTomFailReason='HTTP '+resp.status+(data&&data.detailedError?': '+data.detailedError.message:'');
      } else {
        lastTomTomFailReason='порожня відповідь';
      }
      return null;
    }
    return data.routes.map(function(r){
      const pts=[];
      r.legs.forEach(function(leg){ leg.points.forEach(function(p){ pts.push([p.latitude, p.longitude]); }); });
      return { points:pts, distanceM:r.summary.lengthInMeters, durationS:r.summary.travelTimeInSeconds };
    });
  }catch(e){
    console.warn('[route] TomTom недоступний:', e);
    lastTomTomFailReason=(e && e.message ? e.message : 'помилка запиту');
    return null;
  }
}

// Якщо різниця довжин двох маршрутів менша за 100м — це дублікат
// (типово трапляється, коли рушій повертає майже однакові альтернативи).
function filterUniqueRoutes(routes){
  const result=[];
  routes.forEach(function(r){
    const dup=result.some(function(kept){ return Math.abs(kept.distanceM - r.distanceM) < 100; });
    if(!dup) result.push(r);
  });
  return result;
}

// 17.08.2026 (оновлено 18.08.2026): durationS — секунди їзди, як їх
// повертає САМ рушій. TomTom (traffic=true) враховує ЖИВИЙ трафік — це
// реальна оцінка з урахуванням заторів. ORS (фолбек, якщо нема ключа
// TomTom чи він недоступний) трафік НЕ враховує — це "чистий" вільний
// шлях, профіль "driving-car" для легкового авто, не скутера/мотоцикла.
// null → рушій нічого не повернув (не мало б статись) — тоді HUD просто
// не показує час.
function formatDurationHM(durationS){
  if(durationS==null || !isFinite(durationS)) return '';
  const totalMin=Math.round(durationS/60);
  const h=Math.floor(totalMin/60), m=totalMin%60;
  if(h>0) return h+' год '+(m<10?'0':'')+m+' хв';
  return m+' хв';
}

// 25.08.2026: збирає avoid-список TomTom з granular-чекбоксів підменю
// "⚙️ TomTom" (окремо від ORS-фолбека нижче — той і далі керується лише
// isScooterMode249, як було раніше, ці нові поля стосуються ЛИШЕ TomTom).
function getTomTomAvoidList(){
  const a=[];
  if(MapCfg.ttAvoidMotorways) a.push('motorways');
  if(MapCfg.ttAvoidTollRoads) a.push('tollRoads');
  if(MapCfg.ttAvoidTunnels) a.push('tunnels');
  return a;
}

async function buildPlanRoute(){
  if(!planStartPoint || !planEndPoint) return;
  if(planBuilding) return; // не дублювати запит, якщо попередній ще в польоті
  planBuilding=true;
  sht('🚗 Будую маршрут…');
  try{
    const points=[planStartPoint].concat(planWaypoints).concat([planEndPoint]);
    const wantAlternatives = planWaypoints.length===0; // обмеження ORS/TomTom — альтернативи тільки для пари Старт-Фініш
    // 18.08.2026: кожен рушій має власну номенклатуру avoid-параметрів —
    // ORS: highways/tollways/ferries, TomTom: motorways/tollRoads/ferries.
    const avoidFeaturesOrs = isScooterMode249 ? ['highways','tollways','ferries'] : null;
    let routes = await buildTomTomRouteRequest(points, wantAlternatives, getTomTomAvoidList(), MapCfg.ttTravelMode, MapCfg.ttRouteType);
    let usedEngine = routes && routes.length ? 'tomtom' : null;
    if(!routes || !routes.length){
      routes = await buildOrsRouteRequest(points, wantAlternatives, avoidFeaturesOrs);
      if(routes && routes.length) usedEngine='ors';
    }
    if(!routes || !routes.length){
      sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Не вдалось побудувати маршрут — ні TomTom, ні ORS не відповіли (перевір ключі в Налаштування → Карта)');
      return;
    }
    routes = filterUniqueRoutes(routes);
    planRoutes = routes;
    planActiveRouteIndex = 0;
    mapRouteLatLngs = planRoutes[0].points;
    routeVisible = true;
    generateRouteManeuvers(mapRouteLatLngs);
    navProgressIndex = -1;
    applyRouteToAllMaps();
    drawPlanAltLines();
    updateRouteBtnUI();
    updatePlanHud();
    if(usedEngine==='tomtom'){
      sht(isScooterMode249 ? '🛵 Маршрут з урахуванням трафіку, без автомагістралей/платних доріг' : '🚦 Маршрут побудовано з урахуванням живого трафіку (TomTom)');
    } else {
      // ORS не враховує трафік — час, показаний у HUD, це "чистий" вільний
      // шлях, а не реальна оцінка з заторами.
      // 20.08.2026: додаємо причину відмови TomTom (lastTomTomFailReason) —
      // щоб не гадати наосліп "чому TomTom не спрацював", а бачити
      // конкретну відповідь API прямо в тості.
      const reasonSuffix = lastTomTomFailReason ? (' — TomTom: '+lastTomTomFailReason) : '';
      sht((isScooterMode249
        ? '<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> ORS (резерв) — без трафіку, без автомагістралей/платних доріг'
        : 'Маршрут побудовано через ORS (резерв, без урахування трафіку)') + reasonSuffix);
    }
  }catch(e){
    console.warn('[route] помилка побудови маршруту:', e);
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Помилка побудови маршруту');
  }finally{
    planBuilding=false;
  }
}

// ── Альтернативні маршрути (сірі лінії) — малюються на КОЖНІЙ плитці
// карти окремо (Leaflet-шари не спільні між інстансами карти). Активний
// маршрут (яскрава лінія) малює вже наявний applyMapRoute/applyRouteToAllMaps
// вище — тут тільки решта варіантів. ──
function clearPlanAltLines(st){
  if(!st.planAltLines) st.planAltLines=[];
  st.planAltLines.forEach(function(o){ try{ st.map.removeLayer(o.layer); }catch(e){} });
  st.planAltLines=[];
}
function drawPlanAltLinesForInstance(st){
  clearPlanAltLines(st);
  planRoutes.forEach(function(r, idx){
    if(idx===planActiveRouteIndex) return;
    const layer=L.polyline(r.points, {color:'#777777', weight:5, opacity:0.6}).addTo(st.map);
    layer.on('click', function(){ activatePlanRoute(idx); });
    st.planAltLines.push({layer:layer, routeIndex:idx});
  });
}
function drawPlanAltLines(){ Object.values(mapInstances).forEach(drawPlanAltLinesForInstance); }

function activatePlanRoute(idx){
  if(idx<0 || idx>=planRoutes.length || idx===planActiveRouteIndex) return;
  planActiveRouteIndex=idx;
  mapRouteLatLngs=planRoutes[idx].points;
  generateRouteManeuvers(mapRouteLatLngs);
  navProgressIndex=-1;
  applyRouteToAllMaps();
  drawPlanAltLines();
  updatePlanHud();
  sht('Маршрут #'+(idx+1)+' активний');
}

// ── HUD дистанції + чіпів альтернатив (module 6) — єдиний елемент на весь
// застосунок, фіксований знизу-по-центру екрана. ──
function ensurePlanHudEl(){
  let el=document.getElementById('planRouteHud');
  if(el) return el;
  el=document.createElement('div');
  el.id='planRouteHud';
  document.body.appendChild(el);
  return el;
}
function updatePlanHud(){
  const el=ensurePlanHudEl();
  if(!planRoutes.length){ el.style.display='none'; return; }
  const active=planRoutes[planActiveRouteIndex];
  const km=(active.distanceM/1000).toFixed(1);
  const dur=formatDurationHM(active.durationS);
  let html='<span class="prh-dist">'+km+' км'+(dur?' · ~'+dur:'')+'</span>';
  if(planRoutes.length>1){
    planRoutes.forEach(function(r, idx){
      const rkm=(r.distanceM/1000).toFixed(1);
      const rdur=formatDurationHM(r.durationS);
      html += '<span class="prh-chip'+(idx===planActiveRouteIndex?' active':'')+'" data-idx="'+idx+'">#'+(idx+1)+' ('+rkm+'км'+(rdur?', ~'+rdur:'')+')</span>';
    });
  }
  html += '<span class="prh-close" title="Прибрати маршрут і точки"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg></span>';
  el.innerHTML=html;
  el.style.display='flex';
  el.querySelectorAll('.prh-chip').forEach(function(chip){
    chip.addEventListener('click', function(){ activatePlanRoute(parseInt(chip.dataset.idx,10)); });
  });
  const closeBtn=el.querySelector('.prh-close');
  if(closeBtn) closeBtn.addEventListener('click', clearRoutePlan);
}

// (той самий підхід, що вже використовується при імпорті точки з Google

function setHomeLocationHere(){

  sht('📡 Визначаю позицію…');

    function(pos){ apply(pos.coords.latitude, pos.coords.longitude); },

    {enableHighAccuracy:true, timeout:8000}
  );
}

// й у setHomeLocationHere — якщо _lastLat ще не встиг оновитись.
function buildRouteToHome(){
  if(MapCfg.homeLat==null || MapCfg.homeLon==null){
    sht('🏠 Спершу встанови Дім у Налаштування → Карта');
    return;
  }
  function apply(lat,lon){
    planStartPoint=[lat,lon];
    planEndPoint=[MapCfg.homeLat, MapCfg.homeLon];
    planWaypoints=[]; // 25.08.2026: "Дім" — завжди прямий маршрут, без проміжних точок з попереднього планування
    renderWaypointMarkers();
    document.getElementById('routeImportModal').classList.remove('sh');

  if(!navigator.geolocation){ sht('❌ Геолокація недоступна'); return; }
  sht('📡 Визначаю позицію…');
  navigator.geolocation.getCurrentPosition(
    function(pos){ apply(pos.coords.latitude, pos.coords.longitude); },
    function(){ sht('❌ Не вдалось визначити місцезнаходження'); },
    {enableHighAccuracy:true, timeout:8000}
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   📍 ІМПОРТ ТОЧКИ З GOOGLE MAPS (модуль 3)
   ───────────────────────────────────────────────────────────────────────
   1) Кнопка "📋 Вставити з буфера" — пробує navigator.clipboard.readText().
      Якщо браузер не дає дозволу (Bluefy/WebView часто НЕ підтримує Clipboard
      API взагалі, або питає дозвіл і користувач відмовляє) — замість тиші
      показуємо текстове поле для ручного вставляння/вводу.
   2) Коротке посилання (goo.gl / maps.app.goo.gl / g.co) саме по собі не
      містить координат — його треба розпакувати. unshorten.me більше не
      безкоштовний без реєстрації (з версії v2 вимагає власний API-токен),
      тож використовуємо два безкоштовних CORS-проксі БЕЗ ключа як дзеркала
      (той самий принцип, що й Overpass для POI): allorigins.win → r.jina.ai.
   3) З отриманого тексту (URL і/або вміст сторінки) регексом дістаємо
      координати — спочатку найточніший формат (!3d!4d — реальне
      положення пінa), і тільки якщо його нема — менш точний @lat,lng
      (центр екрана) чи сирі цифри.
   ═══════════════════════════════════════════════════════════════════════ */

async function processManualGmapsInput(){
  const text=document.getElementById('gmapsManualInput').value;
  await processGmapsText(text);
}

// ══════════════════════════════════════════════════════════════════════
// ФІКС: "маршрут плутає старт і фініш" — реальний приклад посилання, що
// спричиняв баг (старий стиль "Прокласти маршрут"):
//   https://www.google.com/maps?geocode=...&daddr=<ТЕКСТОВА адреса>
//     &saddr=24.8661870,121.2140950&dirflg=df&ftid=...
// Тут РЕАЛЬНИЙ Старт (saddr) — це єдина числова координата в усьому URL,
// бо daddr — текстова адреса, а НЕ координати. Стара логіка нижче
// (extractLatLngFromText → applyGmapsPoints) не знає, ЧИЮ роль грає
// знайдена точка, і за правилом "одна точка = Фініш" підставляла saddr
// (справжній Старт) як Фініш, а натомість Старт брала з поточного живого
// GPS — тобто буквально міняла точки місцями. Функція нижче читає роль
// НАПРЯМУ з імені параметра (saddr=Старт, daddr=Фініш) — тут вгадувати
// нічого не треба, і вона має пріоритет над загальною extractLatLngFromText.
// ══════════════════════════════════════════════════════════════════════
function extractSaddrDaddr(text){
  const result={ start:null, finish:null, finishIsTextOnly:false };
  let decoded=text;
  try{ decoded=decodeURIComponent(text); }catch(e){ /* деякі URL ламають decodeURIComponent (одиночний %) — просто працюємо з оригіналом */ }
  const hay=text+' '+decoded; // перевіряємо і сирий, і розкодований варіант — коми в query бувають і literal, і %2C
  const sm=hay.match(/[?&]saddr=(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  if(sm){
    const lat=parseFloat(sm[1]), lon=parseFloat(sm[2]);
    if(!isNaN(lat) && !isNaN(lon) && lat>=-90 && lat<=90 && lon>=-180 && lon<=180) result.start={lat:lat, lon:lon};
  }
  const dm=hay.match(/[?&]daddr=(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  if(dm){
    const lat=parseFloat(dm[1]), lon=parseFloat(dm[2]);
    if(!isNaN(lat) && !isNaN(lon) && lat>=-90 && lat<=90 && lon>=-180 && lon<=180) result.finish={lat:lat, lon:lon};
  } else if(/[?&]daddr=/.test(hay)){
    result.finishIsTextOnly=true; // параметр є, але це текстова адреса (напр. "320, Taoyuan City...") — координат з неї не дістати без геокодування
  }
  return result;
}

// Дістає координати з тексту (URL Google Maps, HTML сторінки чи сирий
// текст). Пріоритет форматів — від найточнішого до найгрубшого; наступний
// формат пробуємо, ТІЛЬКИ якщо попередній не дав жодної точки.
function extractLatLngFromText(text){
  const points=[];
  function addPoint(latStr, lonStr){
    const lat=parseFloat(latStr), lon=parseFloat(lonStr);
    if(isNaN(lat) || isNaN(lon)) return;
    if(lat<-90 || lat>90 || lon<-180 || lon>180) return;
    // Не дублювати ту саму точку, якщо вона трапилась у тексті кілька разів
    // (напр. і в !3d/!4d, і повторно в іншому місці сторінки).
    const dup=points.some(function(p){ return Math.abs(p.lat-lat)<0.00005 && Math.abs(p.lon-lon)<0.00005; });
    if(!dup) points.push({lat:lat, lon:lon});
  }
  let m;
  // !3d<lat>!4d<lon> — найточніше: реальні координати пінa/місця
  let re=/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/g;
  while((m=re.exec(text))) addPoint(m[1], m[2]);
  // старіший запис !2d<lon>!3d<lat>
  if(!points.length){
    re=/!2d(-?\d{1,3}\.\d+)!3d(-?\d{1,3}\.\d+)/g;
    while((m=re.exec(text))) addPoint(m[2], m[1]);
  }
  // @lat,lon,zoom — координати ЦЕНТРУ ЕКРАНА на момент збереження посилання
  // (менш точно — можуть не збігатись з пінoм, якщо карту посунули)
  if(!points.length){
    re=/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/g;
    while((m=re.exec(text))) addPoint(m[1], m[2]);
  }
  // сирі координати "25.0152, 121.3089" будь-де в тексті — останній фолбек
  if(!points.length){
    re=/(-?\d{1,3}\.\d{4,})\s*,\s*(-?\d{1,3}\.\d{4,})/g;
    while((m=re.exec(text))) addPoint(m[1], m[2]);
  }
  return points;
}

// Розпакування короткого посилання. Якщо в Налаштуваннях заданий токен
// unshorten.me — пробуємо його ПЕРШИМ (10 запитів/год, особистий ліміт).
// Будь-яка відмова (немає токена, вичерпаний ліміт 429, невалідний токен,
// мережева помилка чи просто сервіс ліг) — мовчки падає на безкоштовні
// дзеркала без ключа (allorigins.win → r.jina.ai), як і раніше. Повертає
// {finalUrl, content} або null, якщо взагалі ВСЕ відмовило.
async function unshortenUrl(shortUrl){
  const token=getUnshortenToken();
  if(token){
    try{
      const controller=new AbortController();
      const timer=setTimeout(function(){ controller.abort(); }, 8000);
      const resp=await fetch('https://unshorten.me/api/v2/unshorten?url='+encodeURIComponent(shortUrl), {
        signal:controller.signal,
        headers:{ 'Authorization':'Token '+token }
      });
      clearTimeout(timer);
      if(resp.ok){
        const data=await resp.json();
        if(data && data.success && data.unshortened_url) return { finalUrl:data.unshortened_url, content:'' };
      } else if(resp.status===429){
        console.warn('[gmaps] unshorten.me: ліміт 10/год вичерпано, падаю на безкоштовні дзеркала');
      } else {
        console.warn('[gmaps] unshorten.me відповів помилкою ('+resp.status+'), падаю на безкоштовні дзеркала');
      }
    }catch(e){ console.warn('[gmaps] unshorten.me недоступний, падаю на безкоштовні дзеркала:', e); }
  }
  try{
    const controller=new AbortController();
    const timer=setTimeout(function(){ controller.abort(); }, 9000);
    const resp=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(shortUrl), {signal:controller.signal});
    clearTimeout(timer);
    if(resp.ok){
      const data=await resp.json();
      if(data && data.status && data.status.url) return { finalUrl:data.status.url, content:(data.contents||'') };
    }
  }catch(e){ console.warn('[gmaps] дзеркало allorigins.win недоступне:', e); }
  try{
    const controller=new AbortController();
    const timer=setTimeout(function(){ controller.abort(); }, 9000);
    const resp=await fetch('https://r.jina.ai/'+shortUrl, {signal:controller.signal});
    clearTimeout(timer);
    if(resp.ok){
      const text=await resp.text();
      const m=text.match(/URL Source:\s*(\S+)/i);
      if(m) return { finalUrl:m[1], content:text };
    }
  }catch(e){ console.warn('[gmaps] дзеркало r.jina.ai недоступне:', e); }
  return null;
}

async function processGmapsText(rawText){
  const statusEl=document.getElementById('gmapsStatus');
  const text=(rawText||'').trim();
  if(!text){ statusEl.textContent='Порожній текст.'; return; }

  // saddr/daddr перевіряємо ПЕРШИМИ — роль точки там однозначно видно з
  // імені параметра, вгадувати не треба (див. коментар над extractSaddrDaddr).
  let sd=extractSaddrDaddr(text);

  let points=extractLatLngFromText(text);
  const isShort=/goo\.gl|maps\.app\.goo\.gl|g\.co\/kgs/i.test(text);

  if(!points.length && !sd.start && !sd.finish && isShort){
    statusEl.textContent='🔗 Коротке посилання — розпаковую…';
    const urlMatch=text.match(/https?:\/\/\S+/);
    if(!urlMatch){ statusEl.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Не знайдено URL у тексті.'; return; }
    const resolved=await unshortenUrl(urlMatch[0]);
    if(resolved){
      sd=extractSaddrDaddr(resolved.finalUrl);
      points=extractLatLngFromText(resolved.finalUrl);
      if(!points.length && resolved.content){
        if(!sd.start && !sd.finish) sd=extractSaddrDaddr(resolved.content);
        points=extractLatLngFromText(resolved.content);
      }
    }
    if(!points.length && !sd.start && !sd.finish){
      statusEl.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Не вдалось розпакувати посилання (обидва дзеркала не відповіли або координат нема). Спробуй скопіювати повне посилання прямо з адресного рядка браузера замість короткого.';
      return;
    }
  }

  // saddr/daddr знайдено — це НАДІЙНІШЕ за загальну extractLatLngFromText
  // (роль точки тут відома напевно, а не вгадується з кількості знайдених
  // координат), тож має пріоритет і повністю замінює звичайну гілку нижче.
  if(sd.start || sd.finish){
    applyGmapsSaddrDaddr(sd);
    statusEl.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg> Розпізнано й застосовано';
    document.getElementById('gmapsManualInput').value='';
    refreshRouteMenuButtons();
    return;
  }

  if(!points.length){
    statusEl.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Координат не знайдено. Переконайся, що це посилання/текст із конкретною точкою Google Maps.';
    return;
  }

  applyGmapsPoints(points);
  statusEl.innerHTML='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg> Розпізнано й застосовано';
  document.getElementById('gmapsManualInput').value='';
  refreshRouteMenuButtons();
}

// 1 точка → вона Фініш, Старт — з поточного GPS. 2+ точки → перша Старт,
// остання Фініш, усе між ними — проміжні (як і при ручному тапі по карті).
function applyGmapsPoints(points){
  if(points.length>=2){
    planStartPoint=[points[0].lat, points[0].lon];
    planEndPoint=[points[points.length-1].lat, points[points.length-1].lon];
    planWaypoints=points.slice(1,-1).map(function(p){ return [p.lat, p.lon]; });
    renderWaypointMarkers();
    sht('🟢🔴 Старт і Фініш встановлено з Google Maps ('+points.length+' точок)');
    buildPlanRoute();
    return;
  }
  planEndPoint=[points[0].lat, points[0].lon];
  renderWaypointMarkers();
  if(!navigator.geolocation){
    sht('🔴 Фініш встановлено. GPS недоступний — постав Старт вручну через <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>');
    return;
  }
  sht('🔴 Фініш встановлено з Google Maps. Визначаю Старт з GPS…');
  navigator.geolocation.getCurrentPosition(function(pos){
    planStartPoint=[pos.coords.latitude, pos.coords.longitude];
    renderWaypointMarkers();
    buildPlanRoute();
  }, function(err){
    console.warn('[gmaps] геолокація недоступна:', err);
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Не вдалось визначити GPS для Старту — постав його вручну через <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>');
  }, {enableHighAccuracy:true, timeout:8000});
}

// Роль точки тут ВЖЕ ОДНОЗНАЧНО відома з імені параметра (saddr/daddr,
// див. extractSaddrDaddr) — на відміну від applyGmapsPoints вище, де роль
// доводиться вгадувати з КІЛЬКОСТІ знайдених точок (і саме це вгадування
// й спричиняло баг "плутає старт і фініш" для посилань старого стилю
// "Прокласти маршрут", де daddr — текстова адреса без координат).
function applyGmapsSaddrDaddr(sd){
  if(sd.start) planStartPoint=[sd.start.lat, sd.start.lon];
  if(sd.finish) planEndPoint=[sd.finish.lat, sd.finish.lon];
  planWaypoints=[]; // цей стиль посилань проміжних точок не містить
  renderWaypointMarkers();

  if(sd.start && sd.finish){
    sht('🟢🔴 Старт і Фініш встановлено з Google Maps');
    buildPlanRoute();
    return;
  }
  if(sd.start && !sd.finish){
    if(sd.finishIsTextOnly){
      sht('🟢 Старт встановлено з Google Maps. Фініш у посиланні — текстова адреса (без координат) — постав його вручну через <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>, або скопіюй посилання САМЕ на кінцеву точку.');
    } else {
      sht('🟢 Старт встановлено з Google Maps. Постав Фініш вручну через <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>.');
    }
    return;
  }
  // Лишився тільки Фініш (saddr нема чи він текстовий) — симетрично до
  // старого поведінки з одинокою точкою: Старт беремо з живого GPS.
  if(!navigator.geolocation){
    sht('🔴 Фініш встановлено. GPS недоступний — постав Старт вручну через <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>');
    return;
  }
  sht('🔴 Фініш встановлено з Google Maps. Визначаю Старт з GPS…');
  navigator.geolocation.getCurrentPosition(function(pos){
    planStartPoint=[pos.coords.latitude, pos.coords.longitude];
    renderWaypointMarkers();
    buildPlanRoute();
  }, function(err){
    console.warn('[gmaps] геолокація недоступна:', err);
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Не вдалось визначити GPS для Старту — постав його вручну через <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>');
  }, {enableHighAccuracy:true, timeout:8000});
}



/* ═══════════════════════════════════════════════════════════════════════
   🔧 КАЛІБРУВАННЯ HUD (тимчасовий тест-інструмент)
   ───────────────────────────────────────────────────────────────────────
   Вмикається чекбоксом у Налаштування → Карта. Поки увімкнено — картка
   повороту (ліва/права) і три кнопки (звук/центр/маршрут) у fullscreen-
   режимі карти стають перетяжними, і панель calibPanel (зверху лівого
   нижнього кута) показує живі координати кожного елемента відносно країв
   екрана — окремо для портретної й альбомної орієнтації (перевіряй
   computeIsLandscape() у підписі панелі). Мета: підібрати руками точні
   пікселі, а тоді "зафіксувати" їх постійно в CSS (.map-nav-hud-left/
   -right, .map-nav-fab та їхні html.ar-landscape варіанти) — після чого
   цей інструмент можна прибрати.
   ═══════════════════════════════════════════════════════════════════════ */
let calibMode = false;
function setCalibModeUI(on){
  const panel=document.getElementById('calibPanel');
  if(panel) panel.style.display = on ? 'block' : 'none';
  document.querySelectorAll('.map-nav-hud-left,.map-nav-hud-right').forEach(el=>{
    el.style.pointerEvents = on ? 'auto' : '';
    el.style.cursor = on ? 'move' : '';
  });
  document.querySelectorAll('.map-nav-sound-btn,.map-nav-center-btn,.map-nav-route-btn,.map-nav-poi-btn,.map-nav-plan-btn,.map-nav-cammark-btn').forEach(el=>{
    el.style.cursor = on ? 'move' : '';
  });
  if(on) updateCalibReadout();
}
// Прив'язується один раз при створенні кожного з 5 елементів (initLeafletMap
// нижче). Коли calibMode вимкнено — pointerdown одразу виходить, і звичайний
// click (тогл звуку/центрування/відкриття маршруту) працює як завжди.
function wireCalibDrag(el){
  let dragging=false, startX=0, startY=0, origLeft=0, origTop=0;
  el.addEventListener('pointerdown', e=>{
    if(!calibMode) return;
    e.preventDefault(); e.stopPropagation();
    dragging=true;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const rect=el.getBoundingClientRect();
    origLeft=rect.left; origTop=rect.top;
    startX=e.clientX; startY=e.clientY;
    // На час перетягування переходимо на явні left/top у px (лише inline-
    // стиль цього елемента в пам'яті браузера — жоден файл не змінюється).
    el.style.left=origLeft+'px'; el.style.top=origTop+'px';
    el.style.right='auto'; el.style.bottom='auto';
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    e.preventDefault(); e.stopPropagation();
    el.style.left=(origLeft+(e.clientX-startX))+'px';
    el.style.top=(origTop+(e.clientY-startY))+'px';
    updateCalibReadout();
  });
  const stop=e=>{ if(!dragging) return; dragging=false; if(e){e.preventDefault();e.stopPropagation();} updateCalibReadout(); };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
}
function calibElLabel(el){
  if(el.classList.contains('map-nav-hud-left')) return 'Ліва картка (стрілка)';
  if(el.classList.contains('map-nav-hud-right')) return 'Права картка (швидкість/двигун)';
  if(el.classList.contains('map-nav-sound-btn')) return '🔊 Звук';
  if(el.classList.contains('map-nav-center-btn')) return '🎯 Центр';
  if(el.classList.contains('map-nav-route-btn')) return '🗺️ Маршрут';
  if(el.classList.contains('map-nav-poi-btn')) return '🔍 Пошук місць';
  if(el.classList.contains('map-nav-plan-btn')) return '<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg> Точки';
  if(el.classList.contains('map-nav-cammark-btn')) return '<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9 4L7.5 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.5L15 4H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/></svg> Камера';
  return '?';
}
function updateCalibReadout(){
  const list=document.getElementById('calibList');
  if(!list) return;
  const orient = (typeof computeIsLandscape==='function' && computeIsLandscape()) ? 'АЛЬБОМНА' : 'ПОРТРЕТНА';
  const els=Array.from(document.querySelectorAll('.map-nav-hud-left,.map-nav-hud-right,.map-nav-sound-btn,.map-nav-center-btn,.map-nav-route-btn,.map-nav-poi-btn,.map-nav-plan-btn,.map-nav-cammark-btn'))
    .filter(el=>el.style.display==='flex');
  if(!els.length){ list.innerHTML='Відкрий fullscreen (потрійний тап по плитці карти).'; return; }
  let html = `<b>${orient} (${window.innerWidth}×${window.innerHeight})</b><br>`;
  els.forEach(el=>{
    const r=el.getBoundingClientRect();
    const left=Math.round(r.left), top=Math.round(r.top);
    const right=Math.round(window.innerWidth-r.right), bottom=Math.round(window.innerHeight-r.bottom);
    html += `${calibElLabel(el)}: L${left} T${top} R${right} B${bottom}<br>`;
  });
  list.innerHTML = html;
}
function copyCalibNumbers(){
  const list=document.getElementById('calibList');
  const text = list ? list.innerText : '';
  if(!text){ sht('Немає чисел — відкрий fullscreen спочатку'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>sht('📋 Скопійовано')).catch(()=>sht('Не вдалось скопіювати — прочитай з екрана'));
  } else {
    sht('Копіювання недоступне — прочитай числа з екрана');
  }
}

// Експорт ПОТОЧНОГО активного маршруту (mapRouteLatLngs) у GPX — байдуже,
// звідки він узявся: імпорт файлом, Google-посилання, чи ручне планування
// точками (Старт/Проміжні/Фініш через 🚩). Той самий надійний патерн
// "Поділитися" (Web Share API з одним File), що й у exportPoiBrandsDB —
// на iOS відкриває системний шер-шіт із "Зберегти у Файли", один файл,
// правильна назва й розширення .gpx.
function exportCurrentRouteGpx(){
  if(!mapRouteLatLngs || !mapRouteLatLngs.length){ sht('Спершу потрібен активний маршрут'); return; }
  const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  const fileName='vracer_route_'+stamp+'.gpx';
  const trkpts=mapRouteLatLngs.map(function(p){ return '<trkpt lat="'+p[0]+'" lon="'+p[1]+'"></trkpt>'; }).join('');
  const gpxText='<?xml version="1.0" encoding="UTF-8"?>\n'
    +'<gpx xmlns="http://www.topografix.com/GPX/1/1" version="1.1" creator="vRacer">\n'
    +'<trk><name>vRacer '+new Date().toLocaleString()+'</name><trkseg>'+trkpts+'</trkseg></trk>\n'
    +'</gpx>';
  const blob=new Blob([gpxText], {type:'application/gpx+xml'});

  function fallbackDownload(){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 5h8v4H6V5z"/></svg> Завантажено '+fileName);
  }

  let file=null;
  try{ file=new File([blob], fileName, {type:'application/gpx+xml'}); }catch(e){ file=null; }

  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    // 25.08.2026: прибрано title з navigator.share (той самий фікс, що вже
    // був зроблений у tripExportGPX/exportMbtiles/exportSettings, але його
    // пропустили саме тут) — title поруч із files на iOS деякі цілі
    // "Поділитися" (в т.ч. "Зберегти у Файли") трактують як ОКРЕМИЙ
    // текстовий об'єкт і створюють поруч із .gpx ще й зайвий крихітний
    // файл. Без title лишається рівно один файл.
    navigator.share({files:[file]})
      .then(function(){ sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 5h8v4H6V5z"/></svg> Маршрут передано в "Поділитися"'); })
      .catch(function(e){
        if(e && e.name==='AbortError') return;
        console.warn('[route export] navigator.share не вдався, фолбек на завантаження:', e);
        fallbackDownload();
      });
  } else {
    fallbackDownload();
  }
}

  }
  if(!routeVisible){
    // Приховали — одразу гасимо всю навігацію, не чекаючи наступного
    // GPS-тіку (processNavHudStep і так більше нічого не порахує, поки
    // routeVisible===false, але без цього стара картинка/озвучка ще
    // могла б "висіти" на екрані до наступного оновлення).
    navOffRoute=false;
    rerouteAcknowledged=false;
    clearRerouteState();
    _rerouteStraightAnnounced=false;
    Object.values(mapInstances).forEach(st=>{
      if(st.navOffEl) st.navOffEl.style.display='none';
      if(st.miniOffEl) st.miniOffEl.style.display='none';
      if(st.miniRerouteEl) st.miniRerouteEl.style.display='none';
      clearNavReroute(st);
    });
    updateMiniTurnIndicators(null, 0);
  } else {
    navProgressIndex=-1; // показали знову — прив'язуємось до позиції заново
  }
  updateRouteBtnUI();
  if(routeVisible && (!mapRouteLatLngs || !mapRouteLatLngs.length)){
    sht('Маршрут не знайдено — імпортуй файл у Налаштування → Карта');
  }
}
function updateRouteBtnUI(){
  const b=document.getElementById('routeBtnTop');
  if(!b) return;
  const hasRoute = mapRouteLatLngs && mapRouteLatLngs.length>0;
  b.classList.toggle('on', routeVisible && hasRoute);
  b.textContent = (routeVisible && hasRoute) ? 'Маршрут' : (hasRoute ? 'Маршрут (сховано)' : 'Маршрут');
}

// ── Кнопка "Звук" у топбарі — той самий вимикач, що й у Налаштування →
// СИГНАЛИ (AL.Sound_enabled), просто продубльований для швидкого доступу
// без входу в модалку. Обидва місця лишаються синхронізовані.
function toggleSoundBtn(){
  AL.Sound_enabled = (AL.Sound_enabled===false); // якщо зараз вимкнено(false) — вмикаємо, і навпаки
  ls('al',AL);
  updateSoundBtnUI();
  if(AL.Sound_enabled) unlockSpeechOnGesture(); // саме тут гарантовано є user-gesture — розблоковуємо голос так само, як AudioContext
  sht(AL.Sound_enabled ? 'Звук увімкнено' : 'Звук вимкнено');
}
function updateSoundBtnUI(){
  const on = AL.Sound_enabled!==false;
  const b=document.getElementById('sndBtnTop');
  if(b){
    b.classList.toggle('on', on);
    b.textContent = on ? 'Звук' : 'Звук (off)';
  }
  // Кнопка звуку в повноекранному режимі карти — той самий AL.Sound_enabled,
  // просто продубльована іконка, щоб не виходити з навігації заради тогла.
  document.querySelectorAll('.map-nav-sound-btn').forEach(btn=>{
    btn.classList.toggle('on', on);
    btn.textContent = on ? '🔊' : '🔇';
  });
}
updateSoundBtnUI(); // початковий стан при завантаженні сторінки

      </label>
      ${mapRouteLatLngs ? '<button class="ab dn" style="flex:1;" onclick="clearMapRoute()"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg> Прибрати</button>' : ''}

    <div class="gt" style="margin-top:16px;">Навігація — Google API ключ (1-й у черзі)</div>

    <div id="ai_gkey_status" style="font-size:11px;color:var(--muted);padding:6px 5px 0;"></div>
    <div style="display:flex;gap:7px;margin-top:7px;">
      <button class="ab dn" style="flex:1;" onclick="clearGoogleApiKeyUI()"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg> Видалити</button>
      <button class="ab pr" style="flex:1;" onclick="saveGoogleApiKeyUI()"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 5h8v4H6V5z"/></svg> Зберегти</button>
    </div>

    <div class="gt" style="margin-top:16px;">Навігація — TomTom (2-й у черзі, з живим трафіком)</div>
    <div style="font-size:12px;color:var(--muted);padding:2px 5px 8px;">
      Пробується, якщо Google не задано чи недоступний. На відміну від ORS —
      враховує ЖИВИЙ трафік (заторний час), тож саме цей рушій дає реальний
      час поїздки, а не "чистий" вільний шлях. Безкоштовний тариф

    <div style="display:flex;gap:8px;align-items:center;">
      <input type="password" id="ai_ttkey" placeholder="Встав TomTom API ключ" value="${getTomTomApiKey()}"

      <button class="ab" style="width:42px;padding:10px 0;" id="ai_ttkey_eye" onclick="toggleTomTomKeyVisibility()">👁️</button>
    </div>
    <div id="ai_ttkey_status" style="font-size:11px;color:var(--muted);padding:6px 5px 0;"></div>
    <div style="display:flex;gap:7px;margin-top:7px;">
      <button class="ab dn" style="flex:1;" onclick="clearTomTomApiKeyUI()"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg> Видалити</button>
      <button class="ab pr" style="flex:1;" onclick="saveTomTomApiKeyUI()"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 5h8v4H6V5z"/></svg> Зберегти</button>
    </div>

    <div class="gt" style="margin-top:16px;">Навігація — OpenRouteService (3-й у черзі, без трафіку)</div>

      Пробується, якщо і Google, і TomTom не задано чи недоступні. Трафік НЕ
      враховує (тільки "чистий" вільний шлях). Безкоштовний тариф
      openrouteservice.org — 2000 запитів/день, потрібна лише проста
      реєстрація по email (без картки).
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="password" id="ai_orskey" placeholder="Встав OpenRouteService API ключ" value="${getOrsApiKey()}"
        style="flex:1;background:#000;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;">
      <button class="ab" style="width:42px;padding:10px 0;" id="ai_orskey_eye" onclick="toggleOrsKeyVisibility()">👁️</button>
    </div>
    <div id="ai_orskey_status" style="font-size:11px;color:var(--muted);padding:6px 5px 0;"></div>
    <div style="display:flex;gap:7px;margin-top:7px;">
      <button class="ab dn" style="flex:1;" onclick="clearOrsApiKeyUI()"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg> Видалити</button>
      <button class="ab pr" style="flex:1;" onclick="saveOrsApiKeyUI()"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 5h8v4H6V5z"/></svg> Зберегти</button>

    <div class="gt" style="margin-top:16px;">Імпорт з Google Maps — unshorten.me (опційно)</div>
    <div style="font-size:12px;color:var(--muted);padding:2px 5px 8px;">
      Розпакування коротких посилань (maps.app.goo.gl). Токен — з
      <a href="https://unshorten.me/social_accounts/login" target="_blank" rel="noopener" onclick="openExternal('https://unshorten.me/social_accounts/login');return false;" style="color:var(--cyan);">профілю unshorten.me</a>,
      ліміт 10 запитів/год. Якщо токена нема, ліміт вичерпано чи сервіс
      недоступний — автоматично йде на безкоштовні дзеркала без ключа
      (allorigins.win → r.jina.ai), без жодних дій з твого боку.
    </div>

      <input type="password" id="ai_unshortenkey" placeholder="Встав токен unshorten.me" value="${getUnshortenToken()}"

      <button class="ab dn" style="flex:1;" onclick="clearUnshortenKeyUI()"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M9.5 3h5l.8 1.5H19v1.7H5V4.5h3.7L9.5 3zM6.3 8h11.4l-.9 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6.3 8zm3.2 2v8h1.4v-8H9.5zm3 0v8h1.4v-8H12.5zm3 0v8h1.4v-8H15.5z"/></svg> Видалити</button>
      <button class="ab pr" style="flex:1;" onclick="saveUnshortenKeyUI()"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 5h8v4H6V5z"/></svg> Зберегти</button>
    </div>

    <div class="gt" style="margin-top:16px;">🔧 Калібрування HUD (тест)</div>
    <div style="font-size:12px;color:var(--muted);padding:2px 5px 8px;">
      Тимчасовий інструмент — вмикає режим перетягування для HUD-картки й
      кнопок (звук/центр/маршрут) у повноекранному режимі карти. Перейди
      у fullscreen (потрійний тап по плитці карти), перетягни елементи туди,
      куди треба, і зчитай точні числа з панелі внизу — окремо для
      портретної й альбомної орієнтації.
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:3px 5px 12px;">
      <label class="tsw"><input type="checkbox" id="ai_calib" ${calibMode?'checked':''}><span class="sldr"></span></label>
      <span id="ai_calib_v" style="font-size:14px;font-weight:600;">${calibMode?'🔧 Увімкнено':'Вимкнено'}</span>
    </div>
  `;
  idbCountTiles().then(n=>{ const el=document.getElementById('ai_tcnt'); if(el) el.textContent=n; });
  const mdark=document.getElementById('ai_mdark');
  mdark.addEventListener('change',()=>{
    MapCfg.dark = mdark.checked;
    document.getElementById('ai_mdark_v').textContent = MapCfg.dark ? '🌙 Темна' : '☀️ Світла';
    applyMapThemeAll(); // живий перегляд на будь-якій відкритій зараз плитці карти
    ls('mapcfg', MapCfg); // тогл — не потребує окремої кнопки "Зберегти", зберігаємо одразу
  });
  const z1=document.getElementById('ai_mz1'), z2=document.getElementById('ai_mz2');
  z1.addEventListener('input',()=>{
    document.getElementById('ai_mz1_v').textContent=z1.value;
    Object.values(mapInstances).forEach(st=>st.map.setZoom(parseInt(z1.value))); // живий перегляд на відкритій плитці
  });
  z2.addEventListener('input',()=>{
    document.getElementById('ai_mz2_v').textContent=z2.value;
    Object.values(mapInstances).forEach(st=>st.map.setZoom(parseInt(z2.value))); // теж живий перегляд — щоб було видно, наскільки це "близько"
  });
  const czmin=document.getElementById('ai_czmin'), czmax=document.getElementById('ai_czmax');
  czmin.addEventListener('input',()=>{ document.getElementById('ai_czmin_v').textContent=czmin.value; });
  czmax.addEventListener('input',()=>{ document.getElementById('ai_czmax_v').textContent=czmax.value; });
  document.getElementById('ai_mbf').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    sht('Завантажую .mbtiles…');
    try{
      const buf=await f.arrayBuffer();
      await loadMbtilesFromBytes(buf, f.name);
      await idbSet('mbtilesFile', {bytes:buf, name:f.name});
      Object.values(mapInstances).forEach(st=>st.map.eachLayer(l=>{ if(HybridTileLayer && l instanceof HybridTileLayer) l.redraw(); }));
      refreshMapBadges();
      sht('Офлайн-карту завантажено: '+f.name);
      renderMapSettingsTab(body);
    }catch(err){ sht('Помилка читання .mbtiles: '+err.message); }
  });
  document.getElementById('ai_rtf').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    await importRouteFile(f);
    renderMapSettingsTab(body);
  });
  document.getElementById('poiBrandsInput').addEventListener('change', e=>{
    loadPoiBrandsFile(e.target.files[0]);
    e.target.value=''; // щоб той самий файл можна було обрати повторно (додати ще раз/наступний бренд)
  });
  renderPoiDbStatus();
  renderPoiBrandsStatus();
  renderPoiCorruptedLines(); // 20.08.2026: оновлює лічильник на кнопці "🩹 Пошкоджені рядки (N)" одразу при відкритті Налаштувань
  refreshApiKeyStatusUI();
  refreshTomTomStatusUI();
  refreshOrsStatusUI();
  refreshUnshortenStatusUI();
  const calibCb=document.getElementById('ai_calib');
  calibCb.addEventListener('change',()=>{
    calibMode = calibCb.checked;
    document.getElementById('ai_calib_v').textContent = calibMode ? '🔧 Увімкнено' : 'Вимкнено';
    setCalibModeUI(calibMode);
  });
}
function refreshApiKeyStatusUI(){
  const el=document.getElementById('ai_gkey_status');
  if(!el) return;
  el.textContent = getGoogleApiKey()
    ? '<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg> Ключ збережено — Google буде першим у черзі на перерахунок.'
    : 'ℹ️ Ключ не задано — перерахунок піде далі по черзі (TomTom → ORS → пряма лінія).';
}
function toggleApiKeyVisibility(){

// Спільна логіка імпорту маршруту — використовується і з Налаштування →
// Карта, і з довгого натискання на кнопку "Маршрут" у топбарі.
async function importRouteFile(f){
  const nameLC=f.name.toLowerCase();
  // accept у самого <input> навмисно широкий (баг iOS-пікера: GPX без
  // зареєстрованого системного типу файлу — інакше система сіріла сам
  // файл), тому тут перевіряємо розширення самі й одразу відсіюємо явно
  // не те, замість спроби розпарсити випадковий файл як маршрут.
  let kind=null;
  if(nameLC.endsWith('.gpx')) kind='gpx';
  else if(nameLC.endsWith('.json') || nameLC.endsWith('.geojson')) kind='json';
  else { sht('Це не GPX і не GeoJSON (за розширенням файлу) — обери інший файл'); return; }
  const text=await f.text();
  try{
    mapRouteLatLngs = kind==='gpx' ? parseGpxToLatLngs(text) : parseGeoJsonToLatLngs(text);
    if(!mapRouteLatLngs.length) throw new Error('у файлі не знайдено жодної точки маршруту');
    generateRouteManeuvers(mapRouteLatLngs); navProgressIndex=-1; // озвучка поворотів працює одразу, без відкриття fullscreen
    await idbSet('routeFile', {text, kind, name:f.name});
    routeVisible=true; // новоімпортований маршрут показуємо одразу
    applyRouteToAllMaps();
    updateRouteBtnUI();
    sht('Маршрут завантажено ('+mapRouteLatLngs.length+' точок)');
  }catch(err){ sht('Помилка читання маршруту: '+err.message); }
}
