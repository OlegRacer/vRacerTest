function calculateBearing(p1, p2){
  const lat1=p1[0]*Math.PI/180, lat2=p2[0]*Math.PI/180, dLon=(p2[1]-p1[1])*Math.PI/180;
  const y=Math.sin(dLon)*Math.cos(lat2);
  const x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
// Чиста функція: рахує маневри з БУДЬ-яких координат і повертає масив, не
// чіпаючи жодних глобальних змінних. Використовується і для основного
// маршруту (routeManeuvers нижче), і для лінії перерахунку (rerouteManeuvers) —
// та сама логіка "поворот-за-поворотом" працює однаково для обох.
function computeManeuversFromCoords(coords){
  const result=[];
  if(!coords || coords.length<3) return result;

  // Порівнюємо напрямок ДО і ПІСЛЯ точки на фіксованій дистанції (18м), а
  // не просто між сусідніми точками GPX. РАНІШЕ порівняння велось лише між
  // сусідніми точками — якщо трек записаний густо (кожні 2-5м, типово для
  // логу з телефону), реальний поворот "розмазується" на кілька точок, і
  // кожна окремо дає лише невеликий кут, ніколи не долаючи поріг 35° — тому
  // повороти часто взагалі не розпізнавались (звідси й тиша замість
  // озвучки). Порівняння на фіксованій відстані стійке до густоти точок.
  const LOOK_M = 18;
  function pointAtDistance(fromIndex, dir){
    let acc=0, i=fromIndex;
    while(true){
      const j=i+dir;
      if(j<0 || j>=coords.length) return coords[i];
      const d=haversineM(coords[i][0],coords[i][1],coords[j][0],coords[j][1]);
      if(acc+d>=LOOK_M) return coords[j];
      acc+=d; i=j;
    }
  }

  const raw=[];
  for(let i=1;i<coords.length-1;i++){
    const back=pointAtDistance(i,-1), fwd=pointAtDistance(i,1);
    if((back[0]===coords[i][0]&&back[1]===coords[i][1]) || (fwd[0]===coords[i][0]&&fwd[1]===coords[i][1])) continue; // край маршруту — недостатньо треку в один з боків
    let angle=calculateBearing(coords[i],fwd)-calculateBearing(back,coords[i]);
    if(angle>180) angle-=360; if(angle<-180) angle+=360;
    let type=null, text='';
    // 15.08.2026: додано "легкий" діапазон 15-35° — раніше кути ДО 35°
    // взагалі не створювали жодного маневру (тиша), хоча дорога реально
    // вигинається і водій має триматись певного боку. RIGHT/LEFT лишились
    // 35-115°, UTURN — від 115° (як і було, без змін порогів).
    if(angle>=115 || angle<=-115){ type='UTURN'; text='Зробіть розворот'; }
    else if(angle>=35){ type='RIGHT'; text='Поверніть праворуч'; }
    else if(angle<=-35){ type='LEFT'; text='Поверніть ліворуч'; }
    else if(angle>=15){ type='SLIGHT_RIGHT'; text='Тримайтесь правіше'; }
    else if(angle<=-15){ type='SLIGHT_LEFT'; text='Тримайтесь лівіше'; }
    if(type) raw.push({index:i, coords:coords[i], type, text, absAngle:Math.abs(angle)});
  }

  // Той самий реальний поворот міг спрацювати на кількох сусідніх індексах
  // підряд — лишаємо в кожному такому кластері лише точку з найбільшим
  // кутом (найгостріший момент повороту), щоб не оголошувати той самий
  // поворот двічі-тричі поспіль.
  for(const m of raw){
    const last=result[result.length-1];
    if(last && last.type===m.type && (m.index-last.index)<=6){
      if(m.absAngle>last.absAngle) result[result.length-1]=m;
      continue;
    }
    result.push(m);
  }
  result.forEach(m=>{ m.announcedFar=false; m.announcedMid=false; m.announcedClose=false; });
  return result;
}
function generateRouteManeuvers(coords){ routeManeuvers = computeManeuversFromCoords(coords); }

// Відстань від точки до ВІДРІЗКА [v→w] (перпендикуляр, з клемпінгом на
// кінцях) у локальній пласкій проекції — точно на масштабі однієї ділянки
// дороги. Той самий виправлений алгоритм, що й у тестовій версії: рахувати
// до найближчої ТОЧКИ маршруту (а не відрізка) на прямих ділянках між
// рідкими GPX-точками давало хибні спрацювання "відхилення від маршруту".
function distPointToSegmentM(p, v, w){
  if(v[0]===w[0] && v[1]===w[1]) return { dist: haversineM(p[0],p[1],v[0],v[1]), point:v };
  const R=6371000, refLatRad=v[0]*Math.PI/180;
  const toXY=c=>[ R*(c[1]*Math.PI/180)*Math.cos(refLatRad), R*(c[0]*Math.PI/180) ];
  const P=toXY(p), V=toXY(v), W=toXY(w);
  const dx=W[0]-V[0], dy=W[1]-V[1], l2=dx*dx+dy*dy;
  let t=((P[0]-V[0])*dx+(P[1]-V[1])*dy)/l2;
  t=Math.max(0,Math.min(1,t));
  const projX=V[0]+t*dx, projY=V[1]+t*dy;
  // 15.08.2026: назад у lat/lon (обернено до toXY вище) — потрібно для
  // "прилипання" маркера до лінії маршруту (route-snapping, plavний рух).
  const projLat = projY/R*180/Math.PI;
  const projLon = projX/(R*Math.cos(refLatRad))*180/Math.PI;
  return { dist: Math.sqrt((P[0]-projX)**2+(P[1]-projY)**2), point:[projLat, projLon] };
}
// Узагальнена версія — приймає БУДЬ-який масив координат і поточний
// прогрес по ньому (щоб працювала і для основного маршруту, і для лінії
// повернення при відхиленні — та сама логіка, різні дані).
function findClosestSegmentIn(pos, coords, progressIndex, forceFull){
  const n=coords.length;
  let startI, endI;
  if(forceFull || progressIndex<0){ startI=0; endI=n-2; }
  else{
    startI=Math.max(0, progressIndex-NAV_PROGRESS_WINDOW_BEHIND);
    endI=Math.min(n-2, progressIndex+NAV_PROGRESS_WINDOW_AHEAD);
  }
  let bestDist=Infinity, bestIndex=startI, bestPoint=coords[startI];
  for(let i=startI;i<=endI;i++){
    const {dist,point}=distPointToSegmentM(pos, coords[i], coords[i+1]);
    if(dist<bestDist){ bestDist=dist; bestIndex=i; bestPoint=point; }
  }
  return { segIndex:bestIndex, dist:bestDist, point:bestPoint };
}
// Шукає найближчий відрізок mapRouteLatLngs — у вузькому вікні навколо
// вже відомого прогресу (не по всьому маршруту щоразу — і саме це не дає
// "перескочити" на геометрично близьку, але зовсім іншу за прогресом
// ділянку маршруту, напр. на петлі чи перехресті власного треку).
function findClosestRouteSegment(pos, forceFull){
  return findClosestSegmentIn(pos, mapRouteLatLngs, navProgressIndex, forceFull);
}

function showNavHud(st, show){ st.navHudEl.style.display = show?'flex':'none'; }
// Показує "Відхилення від маршруту" — банер у fullscreen-плитці, міні-
// бейдж у звичайній маленькій. Раніше це стосувалось ЛИШЕ fullscreen —
// у маленькій плитці про відхилення не було видно взагалі.
function showOffRouteIndicators(show){
  Object.values(mapInstances).forEach(st=>{
    if(st.routeViewMode){
      if(st.navOffEl) st.navOffEl.style.display = show?'flex':'none';
    } else {
      if(st.miniOffEl) st.miniOffEl.style.display = show?'flex':'none';
      // 25.08.2026 (за проханням): "Перебудувати" з'являється РАЗОМ із
      // бейджем "Відхилення" — не окремо (раніше було прив'язано до
      // показника повороту, це було неправильне сполучення).
      if(st.miniRerouteEl) st.miniRerouteEl.style.display = show?'flex':'none';
    }
  });
}
function clearNavReroute(st){
  if(st.navReroute){ try{ st.map.removeLayer(st.navReroute); }catch(e){} st.navReroute=null; }
}
// Скидає ГЛОБАЛЬНИЙ стан лінії повернення (координати/маневри/прогрес) —
// окремо від clearNavReroute(st), який лише прибирає намальований шар з
// ОДНІЄЇ конкретної карти. Викликається раз: перед новим перерахунком і
// коли користувач фізично повернувся на основний маршрут.
function clearRerouteState(){
  rerouteCoords=null; rerouteManeuvers=[]; rerouteProgressIndex=-1; rerouteIsStraightLine=false;
}
// Стандартний декодер Google Encoded Polyline.
// 15.08.2026: "фейкова" проміжна точка ~40м попереду за поточним курсом —
// змушує маршрутизатор ПОЧАТИ шлях у напрямку, куди водій УЖЕ їде, замість
// одразу пропонувати розворот на 180° при кожному дрібному відхиленні.
// Розворот лишається можливим ДАЛІ по маршруту (якщо це справді єдиний
// розумний шлях, напр. глухий кут чи одностороння вулиця в інший бік) —
// ми лише прибираємо його як "миттєвий рефлекс" перерахунку. Якщо курс
// невідомий (headingDeg==null/NaN, типово коли стоїмо на місці) — фейкової
// точки просто НЕМА, поводимось як раніше (без вигаданого напряму краще
// нічого не вигадувати, ніж вигадати неправильно).
const REROUTE_PHANTOM_AHEAD_M = 40;
function phantomAheadPoint(fromCoords, headingDeg){
  if(headingDeg==null || isNaN(headingDeg)) return null;
  return destPoint(fromCoords[0], fromCoords[1], headingDeg, REROUTE_PHANTOM_AHEAD_M);
}
function decodeGooglePolyline(encoded){
  const points=[]; let index=0, lat=0, lng=0;
  while(index<encoded.length){
    let b, shift=0, result=0;
    do{ b=encoded.charCodeAt(index++)-63; result|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lat += (result&1) ? ~(result>>1) : (result>>1);
    shift=0; result=0;
    do{ b=encoded.charCodeAt(index++)-63; result|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lng += (result&1) ? ~(result>>1) : (result>>1);
    points.push([lat/1e5, lng/1e5]);
  }
  return points;
}
// Каскад перерахунку: Google (якщо є ключ) → TomTom (якщо є ключ, враховує
// живий трафік) → ORS (якщо є ключ) → пряма лінія-компас (завжди працює,
// навіть офлайн).
// Кожен наступний рівень — лише якщо попередній недоступний чи не дав
// результату; нічого не "ламається", просто деградує до того, що вже
// гарантовано працює.
function drawRerouteLine(st, points, dashed){
  st.navReroute = dashed
    ? L.polyline(points,{color:'#37e0e6',weight:5,dashArray:'8,8',opacity:0.9}).addTo(st.map)
    : L.polyline(points,{color:'#37e0e6',weight:6,opacity:0.9}).addTo(st.map);
  st.marker.bringToFront();
}
// 15.08.2026: усі три try*Reroute тепер приймають необов'язковий `viaCoords`
// (фейкова точка попереду курсу, [lat,lon] або null) — якщо задано,
// проїжджаємо через неї як проміжну зупинку ПЕРЕД справжнім призначенням.
async function tryGoogleReroute(fromCoords, toCoords, viaCoords){
  const apiKey=getGoogleApiKey();
  if(!apiKey) return null;
  try{
    let url=`https://maps.googleapis.com/maps/api/directions/json?origin=${fromCoords[0]},${fromCoords[1]}&destination=${toCoords[0]},${toCoords[1]}&key=${apiKey}`;
    if(viaCoords) url+=`&waypoints=${viaCoords[0]},${viaCoords[1]}`;
    const resp=await fetch(url);
    const data=await resp.json();
    if(data.status==='OK') return decodeGooglePolyline(data.routes[0].overview_polyline.points);
    if(data.status==='REQUEST_DENIED') sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Google API відхилив ключ — перевір у Налаштування → Карта');
  }catch(e){ console.warn('[nav] Google Directions недоступний:', e); }
  return null;
}
async function tryTomTomReroute(fromCoords, toCoords, viaCoords){
  const apiKey=getTomTomApiKey();
  if(!apiKey) return null;
  try{
    // TomTom хоче lat,lon (на відміну від ORS/колишнього OSRM), точки
    // маршруту розділені двокрапкою.
    const legs=[fromCoords]; if(viaCoords) legs.push(viaCoords); legs.push(toCoords);
    const coordsPath=legs.map(c=>c[0]+','+c[1]).join(':');
    // 25.08.2026: перерахунок під час навігації тепер поважає ті самі
    // granular-параметри "⚙️ TomTom" (avoid/travelMode/routeType), що й
    // побудова плану — інакше, наприклад, скутер 249cc в режимі "без
    // автомагістралей" міг би отримати перерахунок ПРЯМО на автомагістраль
    // при відхиленні від маршруту.
    const rt=MapCfg.ttRouteType||'fastest';
    let url=`https://api.tomtom.com/routing/1/calculateRoute/${coordsPath}/json?key=${encodeURIComponent(apiKey)}&routeType=${encodeURIComponent(rt)}&traffic=true`;
    if(MapCfg.ttTravelMode && MapCfg.ttTravelMode!=='car') url+='&travelMode='+encodeURIComponent(MapCfg.ttTravelMode);
    getTomTomAvoidList().forEach(f=>{ url+='&avoid='+encodeURIComponent(f); });
    const resp=await fetch(url);
    const data=await resp.json();
    if(data.routes && data.routes[0]){
      const pts=[];
      data.routes[0].legs.forEach(leg=>leg.points.forEach(p=>pts.push([p.latitude,p.longitude])));
      return pts;
    }
    if(data.error) console.warn('[nav] TomTom відхилив запит:', data.error.description||data.error);
  }catch(e){ console.warn('[nav] TomTom недоступний:', e); }
  return null;
}
async function tryOrsReroute(fromCoords, toCoords, viaCoords){
  const apiKey=getOrsApiKey();
  if(!apiKey) return null;
  try{
    // ORS хоче lon,lat (GeoJSON-порядок), і віддає геометрію теж у lon,lat.
    // Простий GET (start/end) не підтримує проміжні точки — з фейковою
    // точкою переходимо на POST з масивом coordinates (той самий ключ, у
    // заголовку Authorization замість query-параметра — ORS приймає обидва
    // способи автентифікації однаково).
    let resp;
    if(viaCoords){
      const coords=[[fromCoords[1],fromCoords[0]],[viaCoords[1],viaCoords[0]],[toCoords[1],toCoords[0]]];
      resp=await fetch('https://api.openrouteservice.org/v2/directions/driving-car/geojson', {
        method:'POST',
        headers:{'Authorization':apiKey, 'Content-Type':'application/json'},
        body:JSON.stringify({coordinates:coords})
      });
    } else {
      const url=`https://api.openrouteservice.org/v2/directions/driving-car?api_key=${encodeURIComponent(apiKey)}&start=${fromCoords[1]},${fromCoords[0]}&end=${toCoords[1]},${toCoords[0]}`;
      resp=await fetch(url);
    }
    const data=await resp.json();
    if(data.features && data.features[0]){
      return data.features[0].geometry.coordinates.map(c=>[c[1],c[0]]); // назад у [lat,lon]
    }
    if(data.error) console.warn('[nav] OpenRouteService відхилив запит:', data.error.message||data.error);
  }catch(e){ console.warn('[nav] OpenRouteService недоступний:', e); }
  return null;
}
// РАНІШЕ приймала конкретний st і малювала лише на ОДНІЙ карті — через це
// маленька плитка ніколи не бачила лінію перерахунку, тільки fullscreen.
// Тепер маршрут рахується ОДИН раз (один мережевий запит), а малюється на
// ВСІХ активних інстансах карти одразу (мала плитка + fullscreen, якщо
// відкритий) — обидва завжди показують той самий актуальний перерахунок.
// 15.08.2026: додає фейкову проміжну точку за поточним курсом (_lastHeading)
// у ВСІ три рушії — пріоритет "не розвертатись одразу" (див. phantomAheadPoint).
async function recalculateNavReroute(fromCoords, toCoords){
  Object.values(mapInstances).forEach(clearNavReroute);
  const viaCoords=phantomAheadPoint(fromCoords, _lastHeading);
  let points = await tryGoogleReroute(fromCoords, toCoords, viaCoords);
  let dashed = false;
  if(!points) points = await tryTomTomReroute(fromCoords, toCoords, viaCoords);
  if(!points) points = await tryOrsReroute(fromCoords, toCoords, viaCoords);
  if(!points){ points=[fromCoords, toCoords]; dashed=true; }
  Object.values(mapInstances).forEach(st=>drawRerouteLine(st, points, dashed));

  // Зберігаємо для перемикання підказок (processNavHudStep нижче): якщо
  // лінія РЕАЛЬНА (не пряма) — рахуємо в ній маневри так само, як і в
  // основному маршруті, щоб було що озвучувати ("поверніть праворуч", а
  // не тільки "ви відхилились"). Пряма лінія поворотів не має — для неї
  // окрема, проста фраза "прямуйте N метрів" (див. нижче).
  rerouteCoords = points;
  rerouteIsStraightLine = dashed;
  rerouteManeuvers = dashed ? [] : computeManeuversFromCoords(points);
  rerouteProgressIndex = -1;
}

// Викликається на кожен GPS-тік (startGPS() нижче) — але рахує щось лише
// якщо ЗАРАЗ є плитка карти в активному режимі навігації (навчання/огляд
// без завантаженого маршруту цей код взагалі не займає).
// Викликається на кожен GPS-тік (startGPS() нижче). РАНІШЕ рахувала щось
// лише якщо є плитка в режимі fullscreen (navHudActive) — тому в маленькій
// плитці на дашборді озвучка поворотів взагалі не працювала, хоча маршрут
// уже й був завантажений. Тепер детекція відхилення й озвучка працюють
// ЗАВЖДИ, коли є mapRouteLatLngs, незалежно від розміру плитки; HUD-картка
// (стрілка/відстань/офф-роут банер) оновлюється додатково, ТІЛЬКИ якщо
// зараз є fullscreen-плитка — їй просто нема куди інакше поміститись.
let _rerouteStraightAnnounced = false; // щоб "Прямуйте N метрів" не повторювалось щотіку

function processNavHudStep(lat, lon){
  if(!mapRouteLatLngs || mapRouteLatLngs.length<2) return;
  if(!routeVisible){
    // Маршрут приховано кнопкою "Маршрут" (не видалено — дані лишаються,
    // просто лінія й уся навігація вимкнені). Раніше приховування лінії
    // не зупиняло озвучку/показник повороту — вони й далі говорили "поверніть",
    // хоча маршрут на екрані вже нема. Тепер приховане = повністю вимкнена
    // навігація: жодних оголошень, індикатори гасимо одразу.
    updateMiniTurnIndicators(null, 0);
    return;
  }
  const fsSt = Object.values(mapInstances).find(s=>s.navHudActive); // може бути null — це ОК
  const userCoords=[lat,lon];

  // Прогрес по ОСНОВНОМУ маршруту рахуємо ЗАВЖДИ, незалежно від того, чи
  // зараз активне відхилення — саме це дозволяє миттєво "відпустити" назад
  // на основний маршрут і його підказки, щойно фізично до нього наблизились
  // (без затримки чи ручної дії).
  let {segIndex, dist, point} = findClosestRouteSegment(userCoords);
  if(navProgressIndex>=0 && dist > NAV_OFF_ROUTE_THRESHOLD_M*NAV_FULL_RESEARCH_MULTIPLIER){
    const full=findClosestRouteSegment(userCoords, true);
    if(full.dist<dist){ segIndex=full.segIndex; dist=full.dist; point=full.point; }
  }
  navProgressIndex = segIndex;
  // 15.08.2026: для дистанції до маневру беремо СПРОЄКТОВАНУ на лінію
  // маршруту точку (route-snapping), а не сирий GPS — прибирає джиттер
  // (±5-15м GPS), який і був справжньою причиною "оголошує за 34м
  // замість очікуваних ~4" (сира точка "гуляла" навколо реальної позиції
  // на дорозі). Якщо ми вже далеко від маршруту (>NAV_SNAP_MAX_M) —
  // "притягувати" було б оманливо, лишаємо сирий GPS.
  const snapLat = dist<=NAV_SNAP_MAX_M ? point[0] : lat;
  const snapLon = dist<=NAV_SNAP_MAX_M ? point[1] : lon;

  if(dist > NAV_OFF_ROUTE_THRESHOLD_M){
    if(!navOffRoute){
      navOffRoute=true;
      rerouteAcknowledged=false;
      showOffRouteIndicators(true);
      speak('Відхилення від маршруту');
      if(AUTO_REROUTE_ENABLED){
        const rejoin=findMaxCutRejoinPoint(userCoords, segIndex);
        recalculateNavReroute(userCoords, mapRouteLatLngs[rejoin.index]);
        if(rejoin.cutM>50) sht('✂️ Зрізка ~'+Math.round(rejoin.cutM)+'м маршруту');
      }
      // AUTO_REROUTE_ENABLED=false (тест ручного режиму): бейдж/озвучка
      // спрацьовують як завжди, але сам перерахунок чекає тапу користувача
      // на бейдж/кнопку 🔁 (ці обробники самі викликають recalculateNavReroute).
    }
  } else if(navOffRoute){
    navOffRoute=false;
    rerouteAcknowledged=false;
    showOffRouteIndicators(false);
    Object.values(mapInstances).forEach(clearNavReroute);
    clearRerouteState();
    _rerouteStraightAnnounced=false;
    speak('Ви повернулися на маршрут');
  }

  const distEl = fsSt ? document.getElementById('navHudDist_'+fsSt.tileId) : null;
  const pathEl = fsSt ? document.getElementById('navHudArrowPath_'+fsSt.tileId) : null;

  // ГОЛОВНЕ ПЕРЕМИКАННЯ: поки активне відхилення — підказки йдуть з лінії
  // ПОВЕРНЕННЯ (бірюзова), а не з основного маршруту. Раніше цього
  // розділення не було: озвучувався наступний поворот ОСНОВНОГО маршруту,
  // навіть коли користувач уже фізично з'їхав з нього — марна підказка
  // "поверніть праворуч" для дороги, якою він більше не їде.
  if(navOffRoute){
    processRerouteGuidance(userCoords, lat, lon, distEl, pathEl);
  } else {
    let nextManeuver=null;
    for(const m of routeManeuvers){ if(m.index>=navProgressIndex-1){ nextManeuver=m; break; } }
    announceAndShowManeuver(nextManeuver, snapLat, snapLon, distEl, pathEl);
  }
}

// Підказки, поки триває відхилення — джерело даних: rerouteCoords/
// rerouteManeuvers (лінія повернення), НЕ основний маршрут.
function processRerouteGuidance(userCoords, lat, lon, distEl, pathEl){
  if(!rerouteCoords || rerouteCoords.length<2){
    // Запит перерахунку ще "в польоті" — просто нічого не показуємо цей тік.
    if(distEl) distEl.textContent='---';
    if(pathEl) pathEl.setAttribute('d', NAV_ARROW_PATHS.STRAIGHT);
    updateMiniTurnIndicators(null, 0);
    return;
  }

  // "Відхилення від відхилення" — якщо навіть від САМОЇ лінії повернення
  // відійшли задалеко (проїхали повз неї, чи вона вже застаріла):
  // з увімкненим авто-режимом — просимо свіжий перерахунок автоматично.
  // У ручному режимі (тестуємо зараз, AUTO_REROUTE_ENABLED=false) —
  // просто знову показуємо бейдж/банер (rerouteAcknowledged скидається),
  // щоб користувач сам тапнув, коли буде готовий.
  let {segIndex: rSeg, dist: rDist, point: rPoint} = findClosestSegmentIn(userCoords, rerouteCoords, rerouteProgressIndex);
  if(rDist > REROUTE_OFF_ROUTE_THRESHOLD_M){
    if(AUTO_REROUTE_ENABLED){
      const targetIndex=Math.min(rSeg+2, rerouteCoords.length-1);
      recalculateNavReroute(userCoords, rerouteCoords[targetIndex]);
      return; // наступний GPS-тік уже піде по свіжій лінії
    } else if(rerouteAcknowledged){
      rerouteAcknowledged=false;
      showOffRouteIndicators(true);
    }
  }
  rerouteProgressIndex = rSeg;
  // 15.08.2026: та сама ідея route-snapping, що й для основного маршруту
  // (processNavHudStep) — тільки тут прилипаємо до ЛІНІЇ ПОВЕРНЕННЯ, а не
  // до основного маршруту (інше джерело координат, той самий принцип).
  const snapLat = rDist<=NAV_SNAP_MAX_M ? rPoint[0] : lat;
  const snapLon = rDist<=NAV_SNAP_MAX_M ? rPoint[1] : lon;

  if(rerouteIsStraightLine || !rerouteManeuvers.length){
    // Жоден маршрутизатор не спрацював (чи немає інтернету) — пряма лінія,
    // поворотів у ній немає. Кажемо просто скільки лишилось прямо, один
    // раз (не повторюємо щотіку, інакше це такий самий спам, як і скасований
    // відлік по 10м).
    const last=rerouteCoords[rerouteCoords.length-1];
    const d=haversineM(snapLat,snapLon,last[0],last[1]);
    if(distEl) distEl.textContent = d>999 ? (d/1000).toFixed(1)+' км' : Math.round(d)+' м';
    if(pathEl) pathEl.setAttribute('d', NAV_ARROW_PATHS.STRAIGHT);
    updateMiniTurnIndicators({type:'STRAIGHT'}, d);
    if(!_rerouteStraightAnnounced){
      _rerouteStraightAnnounced=true;
      speak(`Прямуйте ${Math.round(d)} метрів, щоб повернутись на маршрут`);
    }
    return;
  }
  _rerouteStraightAnnounced=false;

  let nextManeuver=null;
  for(const m of rerouteManeuvers){ if(m.index>=rerouteProgressIndex-1){ nextManeuver=m; break; } }
  announceAndShowManeuver(nextManeuver, snapLat, snapLon, distEl, pathEl);
}

// Спільна логіка озвучки/відображення — та сама трифазна схема, незалежно
// від того, з якого джерела прийшов maneuver (основний маршрут чи лінія
// повернення). Кожен maneuver зберігає власні прапорці "вже озвучено",
// тож перемикання джерела не плутає й не дублює оголошення.
// Короткий напрямок для CLOSE-фрази ("праворуч"/"лівіше"/"розворот") —
// без слів "поверніть"/"тримайтесь", просто саме слово, як просив
// користувач ("55, право", а не "55, поверніть праворуч").
function maneuverShortDir(type){
  if(type==='RIGHT') return 'праворуч';
  if(type==='LEFT') return 'ліворуч';
  if(type==='SLIGHT_RIGHT') return 'правіше';
  if(type==='SLIGHT_LEFT') return 'лівіше';
  if(type==='UTURN') return 'розворот';
  return 'прямо';
}
// Порогові відстані (метри) для трифазної (тепер точніше — 3+1 з
// ланцюжком) озвучки. 15.08.2026: CLOSE підняли з 4м до 30м — на 4м
// GPS-тік фізично міг спрацювати вже ПІСЛЯ повороту (звідси й скарга
// "оголошує за 34м, а не за 4"); 30м — реалістичний запас навіть на
// швидкості скутера, особливо тепер, коли позиція для дистанції рахується
// зі згладженого (route-snapped) треку, а не сирого GPS (див. частину
// "плавний рух" нижче).
const NAV_FAR_M = 300, NAV_MID_M = 100, NAV_CLOSE_M = 30;
// Якщо новий "наступний" маневр стає актуальним УЖЕ близько (<= цієї
// відстані) — тобто попередній поворот щойно проїхали, і наступний вже
// от-от — кажемо ОДРАЗУ компактно ("55, право"), а не чекаємо порогів
// FAR/MID (для яких просто нема часу/відстані). Це і є "після повороту —
// одразу наступний поворот і скільки метрів", про що просив користувач.
const NAV_CHAIN_GAP_M = 80;
function announceAndShowManeuver(nextManeuver, lat, lon, distEl, pathEl){
  if(!nextManeuver){
    if(distEl) distEl.textContent='---';
    if(pathEl) pathEl.setAttribute('d', NAV_ARROW_PATHS.STRAIGHT);
    updateMiniTurnIndicators(null, 0);
    _lastAnnouncedManeuverRef=null;
    return;
  }
  const d=haversineM(lat,lon,nextManeuver.coords[0],nextManeuver.coords[1]);
  if(distEl) distEl.textContent = d>999 ? (d/1000).toFixed(1)+' км' : Math.round(d)+' м';
  if(pathEl) pathEl.setAttribute('d', NAV_ARROW_PATHS[nextManeuver.type]||NAV_ARROW_PATHS.STRAIGHT);

  // ЛАНЦЮЖОК: щойно проїхали попередній маневр, і ЦЕЙ став "наступним"
  // ВПЕРШЕ (об'єкт maneuver змінився з попереднього тіку) — якщо він уже
  // близько, кажемо компактно одразу, минаючи звичайні пороги нижче.
  if(_lastAnnouncedManeuverRef!==nextManeuver){
    _lastAnnouncedManeuverRef=nextManeuver;
    if(d<=NAV_CHAIN_GAP_M && !nextManeuver.announcedFar && !nextManeuver.announcedMid && !nextManeuver.announcedClose){
      speak(`${Math.round(d)}, ${maneuverShortDir(nextManeuver.type)}`);
      nextManeuver.announcedFar=true;
      nextManeuver.announcedMid=true;
      if(d<=NAV_CLOSE_M) nextManeuver.announcedClose=true; // вже сказали і відстань, і напрям — окремий CLOSE-кий зайвий
    }
  }

  // ЗВИЧАЙНІ ТРИ ФАЗИ (якщо ланцюжок вище не спрацював):
  // 1) >300м, один раз, щойно маневр стає "наступним" — повна дистанція.
  // 2) перетин 100м — фіксована фраза-нагадування.
  // 3) перетин 30м — ОДИН раз, короткий напрямок без числа й без "поворот".
  if(d>NAV_FAR_M && !nextManeuver.announcedFar){
    nextManeuver.announcedFar=true;
    const distTxt = d>=1000 ? `${(d/1000).toFixed(1)} кілометри` : `${Math.round(d)} метрів`;
    speak(`Наступний поворот — ${nextManeuver.text.toLowerCase()} — через ${distTxt}`);
  }
  if(d<=NAV_MID_M && d>NAV_CLOSE_M && !nextManeuver.announcedMid){
    nextManeuver.announcedMid=true;
    speak(`Через сто метрів ${nextManeuver.text.toLowerCase()}`);
  }
  if(d<=NAV_CLOSE_M && !nextManeuver.announcedClose){
    nextManeuver.announcedClose=true;
    speak(maneuverShortDir(nextManeuver.type));
  }
  updateMiniTurnIndicators(nextManeuver, d);
}

// Міні-індикатор повороту на ЗВИЧАЙНИХ (не fullscreen) плитках карти —
// та сама інформація, що й у великій HUD-картці, просто компактно (за
// схемою користувача). У fullscreen-плитки цей елемент навмисно
// прихований у enterMapFullscreen (там уже є велика картка).
function updateMiniTurnIndicators(nextManeuver, distMeters){
  Object.values(mapInstances).forEach(st=>{
    if(!st.turnMiniEl || st.routeViewMode) return;
    if(!nextManeuver){ st.turnMiniEl.style.display='none'; return; }
    st.turnMiniEl.style.display='flex';
    const pathEl=document.getElementById('turnMiniArrowPath_'+st.tileId);
    const distEl=document.getElementById('turnMiniDist_'+st.tileId);
    if(pathEl) pathEl.setAttribute('d', NAV_ARROW_PATHS[nextManeuver.type]||NAV_ARROW_PATHS.STRAIGHT);
    if(distEl) distEl.textContent = distMeters>999 ? (distMeters/1000).toFixed(1)+' км' : Math.round(distMeters)+' м';
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v16M4 21h8M4 10h8M14 9l2.5 2v6a1.3 1.3 0 0 0 2.6 0V9.8a1.8 1.8 0 0 0-.53-1.28L16 6"/></svg>🏪 POI-ПОШУК (АЗС + 7-Eleven/convenience) — Overpass API з дзеркалами
   ───────────────────────────────────────────────────────────────────────
   Публічний overpass-api.de сам по собі нестабільний (падає/лімітить), тому
   тут перебираємо кілька публічних дзеркал по черзі — перше, що відповість
   успішно, і використовуємо. Радіус пошуку — від поточного центру карти
   (map.getCenter()), НЕ від GPS-позиції користувача (щоб можна було
   попередньо роздивитись POI, посунувши карту вперед по маршруту).
   ═══════════════════════════════════════════════════════════════════════ */
const OVERPASS_MIRRORS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.openstreetmap.ru/api/interpreter'
];
const POI_RADIUS_M = 3000;
const POI_FETCH_TIMEOUT_MS = 9000;

function buildOverpassPoiQuery(lat, lon, radius){
  // shop=convenience — навмисно БЕЗ фільтра по бренду (як у вихідній
  // специфікації): покаже всі "convenience"-магазини (7-Eleven, FamilyMart
  // і т.д. в Тайвані переважно й так тегуються цим значенням), а не тільки
  // 7-Eleven. За потреби звузити пізніше — додати ["brand"~"7-Eleven",i].
  return '[out:json][timeout:15];('
    + 'node["amenity"="fuel"](around:'+radius+','+lat+','+lon+');'
    + 'node["shop"="convenience"](around:'+radius+','+lat+','+lon+');'
    + ');out body;';
}

// Пробує дзеркала по черзі; повертає масив Overpass "elements" або null,
// якщо ЖОДНЕ дзеркало не відповіло (мережа лежить/усі три лімітять).
async function queryOverpassPOI(lat, lon){
  const q = buildOverpassPoiQuery(lat, lon, POI_RADIUS_M);
  for (let i=0; i<OVERPASS_MIRRORS.length; i++){
    const base = OVERPASS_MIRRORS[i];
    try{
      const controller = new AbortController();
      const timer = setTimeout(()=>{ controller.abort(); }, POI_FETCH_TIMEOUT_MS);
      const resp = await fetch(base+'?data='+encodeURIComponent(q), {signal:controller.signal});
      clearTimeout(timer);
      if(!resp.ok) continue; // це дзеркало відмовило — пробуємо наступне
      const data = await resp.json();
      if(data && data.elements) return data.elements;
    }catch(e){
      console.warn('[poi] дзеркало Overpass недоступне:', base, e);
      // і тайм-аут (AbortError), і мережева помилка — просто йдемо до наступного дзеркала
    }
  }
  return null;
}

function escapePoiText(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    if(c==='&') return '&amp;';
    if(c==='<') return '&lt;';
    if(c==='>') return '&gt;';
    if(c==='"') return '&quot;';
    return '&#39;';
  });
}

// АЗС чи convenience-магазин? Повертає null для тегів, що не пасують під
// жоден з двох типів (Overpass-запит вище й так фільтрує на сервері, це —
// друга страховка на випадок дивного результату).
// Overpass повертає "elements" (node/way з tags) — приводимо до того ж
// плаского формату {lat,lon,kind,icon,label}, що й офлайн-GPX-база
// (filterPoiDbNear вище), щоб drawPoiMarkers нижче не знав, звідки точки.
function normalizePoiFromOverpassElements(elements){
  const out=[];
  elements.forEach(function(el){
    const tags=el.tags || {};
    let kind=null, icon=null;
    if(tags.amenity==='fuel'){ kind='fuel'; icon='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v16M4 21h8M4 10h8M14 9l2.5 2v6a1.3 1.3 0 0 0 2.6 0V9.8a1.8 1.8 0 0 0-.53-1.28L16 6"/></svg>'; }
    else if(tags.shop==='convenience'){ kind='shop'; icon='🏪'; }
    else return; // не наш тип — пропускаємо (друга страховка, запит і так фільтрує на сервері)
    let lat=null, lon=null;
    if(el.type==='node' && el.lat!=null && el.lon!=null){ lat=el.lat; lon=el.lon; }
    else if(el.center && el.center.lat!=null){ lat=el.center.lat; lon=el.center.lon; } // way/relation з центроїдом
    if(lat==null) return;
    out.push({ lat:lat, lon:lon, kind:kind, icon:icon, label:(tags.name || tags.brand || (kind==='fuel'?'АЗС':'Магазин')) });
  });
  return out;
}

function clearPoiMarkers(st){
  if(!st.poiMarkers) st.poiMarkers=[];
  st.poiMarkers.forEach(function(m){ try{ st.map.removeLayer(m); }catch(e){} });
  st.poiMarkers=[];
}

// list — уже нормалізований масив {lat,lon,kind,icon,label}, байдуже звідки
// (офлайн-GPX-база чи Overpass).
function drawPoiMarkers(st, list){
  clearPoiMarkers(st);
  let count=0;
  list.forEach(function(p){
    const icon=L.divIcon({className:'poi-div-icon', html:'<div style="font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));">'+p.icon+'</div>', iconSize:[26,26], iconAnchor:[13,13]});
    const marker=L.marker([p.lat,p.lon], {icon:icon}).addTo(st.map);
    marker.bindPopup('<div class="poi-popup-name">'+p.icon+' '+escapePoiText(p.label)+'</div><div class="poi-popup-type">'+(p.kind==='fuel'?'АЗС':'Магазин')+'</div>');
    st.poiMarkers.push(marker);
    count++;
  });
  return count;
}

// Тап на кнопку ⛽: якщо маркери вже на карті — просто прибрати (дешево,
// без мережі). Інакше: якщо є хоч одна офлайн-GPX-база (POI_FUEL/POI_SHOP) — шукаємо в ній,
// БЕЗ жодного мережевого запиту. Тільки якщо бази нема — йдемо в Overpass
// (з дзеркалами-фолбеком, як і раніше).
// ═══════════════════════════════════════════════════════════════════════
// 🔍 ПОШУК МІСЦЬ (TomTom Fuzzy Search) — 18.08.2026
// Замінює стару ⛽-кнопку (Overpass, офлайн-база заправок) — та лишається
// в коді нижче незайманою (POI_FUEL/POI_SHOP/queryOverpassPOI), просто
// більше нікуди не підключена, як і задокументовано для попередніх
// подібних замін. Результати ТИМЧАСОВІ (st.placeSearchResults/Markers) —
// очищаються при новому пошуку чи закритті панелі, у POI_BRANDS_DB не
// потрапляють НІКОЛИ.
// ═══════════════════════════════════════════════════════════════════════

// TomTom Fuzzy Search — https://api.tomtom.com/search/2/search/{query}.json
// lat/lon — точка зміщення (BIAS), НЕ жорсткий фільтр: якщо поруч мало
// збігів, TomTom все одно поверне найближчі за межами radius. limit=20 —
// щоб "IKEA" повернула ВСІ магазини поруч, а не один найближчий.
async function tomtomPlaceSearch(query, lat, lon){
  const apiKey=getTomTomApiKey();
  if(!apiKey) return null;
  const radius=20000; // 20км навколо GPS — розумний радіус для "усі точки поруч"
  const url='https://api.tomtom.com/search/2/search/'+encodeURIComponent(query)+'.json?key='+encodeURIComponent(apiKey)
    +'&lat='+lat+'&lon='+lon+'&radius='+radius+'&limit=20';
  const resp=await fetch(url);
  const data=await resp.json();
  if(!data || !data.results){
    if(data && data.detailedError) console.warn('[search] TomTom відхилив запит:', data.detailedError.message||data.detailedError);
    return [];
  }
  return data.results.map(function(r){
    const name = (r.poi && r.poi.name) ? r.poi.name : (r.address ? (r.address.freeformAddress||query) : query);
    const address = r.address ? r.address.freeformAddress : '';
    const rlat=r.position.lat, rlon=r.position.lon;
    const distanceM = r.dist!=null ? r.dist : haversineM(lat, lon, rlat, rlon);
    return { name, address, lat:rlat, lon:rlon, distanceM };
  }).sort(function(a,b){ return a.distanceM-b.distanceM; });
}

async function runPlaceSearch(st){
  const query=(st.placeSearchInput.value||'').trim();
  if(!query){ sht('Введи назву місця чи адресу'); return; }
  if(!getTomTomApiKey()){ sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Спершу встав TomTom ключ у Налаштування → Карта'); return; }
  clearPlaceSearchResults(st);
  sht('🔍 Шукаю "'+query+'"…');
  // Радіус — навколо ЖИВОЇ GPS-позиції (_lastLat/_lastLon), а не центру
  // карти, як просив користувач. Якщо GPS ще не зловився — фолбек на
  // поточний центр карти, щоб пошук усе одно спрацював.
  const haveGps = (typeof _lastLat==='number' && typeof _lastLon==='number' && !isNaN(_lastLat) && !isNaN(_lastLon));
  const center=st.map.getCenter();
  const lat = haveGps ? _lastLat : center.lat;
  const lon = haveGps ? _lastLon : center.lng;
  try{
    const results=await tomtomPlaceSearch(query, lat, lon);
    if(results==null){ sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> TomTom Search недоступний'); return; }
    if(!results.length){ sht('Нічого не знайдено поруч для "'+query+'"'); return; }
    renderPlaceSearchResults(st, results);
    sht('Знайдено '+results.length+' — тапни картку, щоб прокласти маршрут');
  }catch(e){
    console.warn('[search] помилка пошуку місць:', e);
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Помилка пошуку — перевір інтернет і ключ TomTom');
  }
}

function renderPlaceSearchResults(st, results){
  st.placeSearchResults=results;
  results.forEach(function(r, i){
    const m=L.marker([r.lat,r.lon],{icon:placeSearchDivIcon(i+1,false)}).addTo(st.map);
    m.on('click', function(){ selectPlaceSearchResult(st, i); });
    st.placeSearchMarkers.push(m);
  });
  st.placeSearchCardsEl.innerHTML = results.map(function(r, i){
    const km=(r.distanceM/1000).toFixed(1);
    const name=(r.name||'').replace(/</g,'&lt;');
    const addr=(r.address||'').replace(/</g,'&lt;');
    return '<div class="psc-card" data-idx="'+i+'"><div class="psc-name">'+(i+1)+'. '+name+'</div>'
      +'<div class="psc-addr">'+addr+'</div><div class="psc-dist">📍 '+km+' км</div></div>';
  }).join('');
  st.placeSearchCardsEl.querySelectorAll('.psc-card').forEach(function(card){
    card.addEventListener('click', function(){ selectPlaceSearchResult(st, parseInt(card.dataset.idx,10)); });
  });
  updatePlaceSearchUI(st);
}

// Тап по картці/маркеру — "як гугл": центрує карту, підсвічує обране, і
// одразу прокладає маршрут туди (Фініш=це місце; Старт — з живого GPS,
// якщо ще не заданий вручну; той самий патерн, що вже є для імпорту з
// Google Maps лінка, applyGmapsPoints/applyGmapsSaddrDaddr).
function selectPlaceSearchResult(st, idx){
  const r=st.placeSearchResults[idx];
  if(!r) return;
  st.placeSearchActiveIdx=idx;
  st.placeSearchMarkers.forEach(function(m, i){ m.setIcon(placeSearchDivIcon(i+1, i===idx)); });
  st.placeSearchCardsEl.querySelectorAll('.psc-card').forEach(function(card){
    card.classList.toggle('active', parseInt(card.dataset.idx,10)===idx);
  });
  st.map.panTo([r.lat, r.lon]);
  planEndPoint=[r.lat, r.lon];
  renderWaypointMarkers();
  if(planStartPoint){
    sht('🔴 Фініш: '+r.name);
    buildPlanRoute();
    return;
  }
  if(!navigator.geolocation){
    sht('🔴 Фініш встановлено ('+r.name+'). GPS недоступний — постав Старт вручну через <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>');
    return;
  }
  sht('🔴 Фініш: '+r.name+'. Визначаю Старт з GPS…');
  navigator.geolocation.getCurrentPosition(function(pos){
    planStartPoint=[pos.coords.latitude, pos.coords.longitude];
    renderWaypointMarkers();
    buildPlanRoute();
  }, function(err){
    console.warn('[search] геолокація недоступна:', err);
    sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Не вдалось визначити GPS для Старту — постав його вручну через <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg>');
  }, {enableHighAccuracy:true, timeout:8000});
}

   прапорців (POI_TOGGLES), і персональна логіка "відкрито/зачинено/

function clearBrandMarkers(st){
  if(!st.brandMarkers) st.brandMarkers=[];
  st.brandMarkers.forEach(function(m){ try{ st.map.removeLayer(m); }catch(e){} });
  st.brandMarkers=[];
}

// status: 'open' → суцільна кольорова обводка; 'unknown' → сіро-жовта
// пунктирна обводка (так домовились); 'closed' сюди не доходить — такі
// точки просто не малюємо (фільтруються раніше).
function shopDivIcon(brandKey, status){
  const st2=POI_BRAND_STYLE[brandKey] || {color:'#888', label:'?'};
  // 20.08.2026: додано статус 'closed' — раніше такі точки взагалі не
  // доходили сюди (фільтрувались ще в refreshBrandMarkers), тепер
  // показуємо їх притлумленими (сірий бордер + прозорість + 💤), щоб
  // відрізнити "зачинено зараз" від "невідомо" (пунктир) і "відкрито"
  // (суцільна біла рамка), не ховаючи точку з карти повністю.
  const border = status==='closed' ? '2px solid #666' : (status==='unknown' ? '2px dashed #bbb' : '2px solid #fff');
  const opacity = status==='closed' ? '0.5' : '1';
  // 14.08.2026: "7/11" (4 символи) не влазить читабельно при тому ж
  // font-size:9px, розрахованому на 2-символьні лейбли ("11","FM","OK",
  // "CC") — зменшуємо шрифт і трохи стискаємо міжлітерний інтервал ТІЛЬКИ
  // для довших лейблів, коло лишається тим самим 24px (щоб не ламати
  // компоновку інших брендів на карті).
  const fontSize = st2.label.length>2 ? '6.5px' : '9px';
  const letterSpacing = st2.label.length>2 ? 'letter-spacing:-0.3px;' : '';
  const closedBadge = status==='closed' ? '<div style="position:absolute;bottom:-3px;right:-3px;font-size:10px;line-height:1;">💤</div>' : '';
  return L.divIcon({
    className:'poi-brand-div-icon',
    html:'<div style="position:relative;opacity:'+opacity+';width:24px;height:24px;border-radius:50%;background:'+st2.color+';border:'+border+';'
      +'display:flex;align-items:center;justify-content:center;color:#fff;font-size:'+fontSize+';font-weight:700;'+letterSpacing
      +'box-shadow:0 1px 3px rgba(0,0,0,.6);">'+st2.label+closedBadge+'</div>',
    iconSize:[24,24], iconAnchor:[12,12]
  });
}

function toiletDivIcon(){
  return L.divIcon({className:'poi-toilet-div-icon', html:'<div style="font-size:18px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><circle cx="7" cy="4.2" r="1.8"/><path d="M4.3 10.2C4.6 8.7 5.7 8 7 8s2.4.7 2.7 2.2L11 16H9.3l-.5 5H5.2l-.5-5H3l1.3-5.8z"/><circle cx="17" cy="4.2" r="1.8"/><path d="M14.5 10c0-1.1.9-2 2-2h1c1.1 0 2 .9 2 2v6.5h-1.5V21h-2v-4.5H14.5V10z"/></svg></div>', iconSize:[20,20], iconAnchor:[10,10]});
}

// 25.08.2026: значок "Улюблене" — SVG-зірка з коду (path намальований
// вручну, п'ятикутна зірка у viewBox 0 0 24 24), а НЕ емодзі-символ ★/⭐ —
// за окремим проханням, щоб вигляд не залежав від емодзі-шрифту WebView і
// колір/тінь керувались тим самим CSS, що й решта значків цього файлу.
// Та сама пара "колір рамки + притлумлення" за статусом, що й у shopDivIcon
// (закрито/невідомо/відкрито), про всяк випадок — якщо колись з'явиться
// "улюблене з розкладом" (напр. улюблена кав'ярня).
function favoriteDivIcon(status){
  const border = status==='closed' ? '2px solid #666' : (status==='unknown' ? '2px dashed #bbb' : '2px solid #fff');
  const opacity = status==='closed' ? '0.5' : '1';
  const closedBadge = status==='closed' ? '<div style="position:absolute;bottom:-3px;right:-3px;font-size:10px;line-height:1;">💤</div>' : '';
  const starSvg='<svg viewBox="0 0 24 24" width="14" height="14"><path fill="#fff" d="M12 2.5l2.98 6.04 6.67.97-4.83 4.7 1.14 6.65L12 17.77l-5.96 3.13 1.14-6.65-4.83-4.7 6.67-.97z"/></svg>';
  return L.divIcon({
    className:'poi-brand-div-icon',
    html:'<div style="position:relative;opacity:'+opacity+';width:24px;height:24px;border-radius:50%;background:#f1c40f;border:'+border+';'
      +'display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.6);">'+starSvg+closedBadge+'</div>',
    iconSize:[24,24], iconAnchor:[12,12]
  });
}

// Публічні туалети з OSM (Overpass, amenity=toilets) — той самий підхід
// дзеркал/тайм-ауту, що й для АЗС/крамниць вище. Викликається окремо
// (асинхронно), не блокує показ уже завантажених брендових точок.
async function fetchAndDrawPublicToilets(st){
  const center=st.map.getCenter();
  const q='[out:json][timeout:15];node["amenity"="toilets"](around:'+POI_RADIUS_M+','+center.lat+','+center.lng+');out body;';
  for(let i=0;i<OVERPASS_MIRRORS.length;i++){
    try{
      const controller=new AbortController();
      const timer=setTimeout(function(){ controller.abort(); }, POI_FETCH_TIMEOUT_MS);
      const resp=await fetch(OVERPASS_MIRRORS[i]+'?data='+encodeURIComponent(q), {signal:controller.signal});
      clearTimeout(timer);
      if(!resp.ok) continue;
      const data=await resp.json();
      if(!POI_TOGGLES.toilets) return; // користувач встиг вимкнути, поки чекали відповідь
      let n=0;
      (data.elements||[]).forEach(function(el){
        if(el.lat==null || el.lon==null) return;
        const marker=L.marker([el.lat,el.lon], {icon:toiletDivIcon()}).addTo(st.map);
        marker.bindPopup('<div class="poi-popup-name"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><circle cx="7" cy="4.2" r="1.8"/><path d="M4.3 10.2C4.6 8.7 5.7 8 7 8s2.4.7 2.7 2.2L11 16H9.3l-.5 5H5.2l-.5-5H3l1.3-5.8z"/><circle cx="17" cy="4.2" r="1.8"/><path d="M14.5 10c0-1.1.9-2 2-2h1c1.1 0 2 .9 2 2v6.5h-1.5V21h-2v-4.5H14.5V10z"/></svg> Громадський туалет</div><div class="poi-popup-type">OpenStreetMap</div>');
        st.brandMarkers.push(marker);
        n++;
      });
      if(n===0) sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><circle cx="7" cy="4.2" r="1.8"/><path d="M4.3 10.2C4.6 8.7 5.7 8 7 8s2.4.7 2.7 2.2L11 16H9.3l-.5 5H5.2l-.5-5H3l1.3-5.8z"/><circle cx="17" cy="4.2" r="1.8"/><path d="M14.5 10c0-1.1.9-2 2-2h1c1.1 0 2 .9 2 2v6.5h-1.5V21h-2v-4.5H14.5V10z"/></svg> Публічних туалетів (OSM) поблизу не знайдено');
      return;
    }catch(e){ console.warn('[toilets] дзеркало недоступне:', OVERPASS_MIRRORS[i], e); }
  }
  console.warn('[toilets] жодне дзеркало Overpass не відповіло');
  sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><circle cx="7" cy="4.2" r="1.8"/><path d="M4.3 10.2C4.6 8.7 5.7 8 7 8s2.4.7 2.7 2.2L11 16H9.3l-.5 5H5.2l-.5-5H3l1.3-5.8z"/><circle cx="17" cy="4.2" r="1.8"/><path d="M14.5 10c0-1.1.9-2 2-2h1c1.1 0 2 .9 2 2v6.5h-1.5V21h-2v-4.5H14.5V10z"/></svg> Не вдалось завантажити публічні туалети (Overpass недоступний)');
}

// Головна функція оновлення сітки — викликається при кожному тапі по
// квадратику меню, і одразу після завантаження нової CSV/GPX-бази. Малює
// ТІЛЬКИ увімкнені бренди, у радіусі POI_RADIUS_M від центру карти,
// пропускаючи status==='closed' повністю.
//
// 14.08.2026 (виправлення): "Туалети" мали бути САМОДОСТАТНЬОЮ кнопкою —
// показувати одразу і чисто публічні туалети (офлайн + живий OSM-фетч),
// І туалети всередині магазинів (7-Eleven/Family Mart/OK Mart/CoCo/АЗС) з
// toilet==='yes', НЕЗАЛЕЖНО від того, чи увімкнений перемикач самого
// магазину. До цього виправлення такі точки магазинів вимагали ОБИДВА
// перемикачі увімкненими одночасно (і "Туалети", і, напр., "7-Eleven") —
// звідси скарга "працює тільки як фільтр і показує тільки публічні".
// 15.08.2026 (доповнення): "невідомо" (toilet==='') теж має ЛИШАТИСЬ
// видимим при фільтрі "Туалети" — раніше вимагалось СТРОГО toilet==='yes',
// через що (а) щойно доданий у "✏️ Редакторі" магазин без заповненого
// поля туалету зникав з карти одразу після збереження (виглядало як "не
// зберігся" — хоча насправді зберігся, просто відфільтрувався), і (б)
// більшість імпортованих GPX-точок узагалі не мають цього поля, тож із
// суворим "yes" фільтр "Туалети" відсікав майже все. Виключаємо тепер
// ЛИШЕ явне "no" — невідоме вважаємо "можливо є" (репутаційно виправдано:
// в Тайвані практично кожен 7-Eleven/OK/FamilyMart має доступний туалет,
// навіть якщо це не позначено в OSM).
// Дві окремі поведінки для магазинного бренду тепер:
//   (а) власний перемикач увімкнено, І "Туалети" теж увімкнено → звужує
//       ЦЕЙ бренд, ховаючи лише toilet==='no' (не строго "yes");
//   (б) власний перемикач ВИМКНЕНО, але "Туалети" увімкнено → точку всеодно
//       показуємо, ЯКЩО toilet!=='no' (yes або невідомо) — самодостатня
//       кнопка "Туалети".
// Категорія "Туалети" сама на себе цей фільтр не накладає (у неї немає
// і не повинно бути власного поля toilet) — виняток лишається як був.
function refreshBrandMarkers(st){
  clearBrandMarkers(st);
  const anyBrandOn = Object.keys(POI_BRAND_KEY).some(function(b){ return POI_TOGGLES[POI_BRAND_KEY[b]]; });
  if(!anyBrandOn) return 0;
  const center=st.map.getCenter();
  let count=0;
  const now=new Date();
  const toiletsOn = POI_TOGGLES.toilets;
  POI_BRANDS_DB.forEach(function(p){
    const key=POI_BRAND_KEY[p.brand];
    if(!key) return;
    const brandOn = !!POI_TOGGLES[key];
    if(key==='toilets'){
      if(!toiletsOn) return; // сама категорія "Туалети" — показуємо лише коли вона увімкнена
    } else if(brandOn){
      if(toiletsOn && p.toilet==='no') return; // (а) звуження вже увімкненого бренду — ховаємо лише явне "нема"
    } else {
      if(!(toiletsOn && p.toilet!=='no')) return; // (б) бренд вимкнено — витягуємо, якщо "Туалети" увімкнено і туалет НЕ позначений явно "нема"
    }
    // 25.08.2026: "Улюблене" — БЕЗ прив'язки до POI_RADIUS_M (3км від
    // центру карти). Це особисті мітки (не мережа магазинів на кожному
    // розі) — їх мало, і саме тому вони мають лишатись видимими завжди,
    // незалежно від того, куди зараз дивиться карта. Раніше та сама
    // радіус-перевірка, що відсіює далекі 7-Eleven/АЗС, так само ховала й
    // щойно додану улюблену точку, як тільки центр карти зміщувався далі
    // 3км — саме це виглядало як "точка пропала".
    if(key!=='favorite' && haversineM(center.lat, center.lng, p.lat, p.lon) > POI_RADIUS_M) return;
    // 20.08.2026: раніше "зачинено зараз" повністю ХОВАЛО точку —
    // виглядало як "імпорт ніби спрацював, а на карті нічого нема" для
    // будь-якого бренду з розкладом (не 24/7), якщо тестувати до/після
    // робочих годин. Тепер показуємо і закриті точки теж, просто
    // притлумленим кольором (shopDivIcon сам розрізняє статус).
    const status=isOpenNow(p.hours, now);
    const icon = key==='toilets' ? toiletDivIcon() : key==='favorite' ? favoriteDivIcon(status) : shopDivIcon(key, status);
    // 15.08.2026: маркер тепер draggable, ПОКИ активний "✏️ Редактор" —
    // дозволяє скоригувати координати вже ІСНУЮЧОЇ точки перетягуванням
    // (позиція комітиться лише при "💾 Зберегти" у showEditPoiForm, не
    // одразу на drag — випадковий зсув без збереження зникне при
    // наступному refreshBrandMarkers, бо маркер перемальовується з p.lat/p.lon).
    const marker=L.marker([p.lat,p.lon], {icon:icon, draggable:!!poiEditorActive}).addTo(st.map);
    const hoursLine = p.hours ? p.hours : 'графік невідомий';
    const toiletLine = p.toilet==='yes' ? '<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><circle cx="7" cy="4.2" r="1.8"/><path d="M4.3 10.2C4.6 8.7 5.7 8 7 8s2.4.7 2.7 2.2L11 16H9.3l-.5 5H5.2l-.5-5H3l1.3-5.8z"/><circle cx="17" cy="4.2" r="1.8"/><path d="M14.5 10c0-1.1.9-2 2-2h1c1.1 0 2 .9 2 2v6.5h-1.5V21h-2v-4.5H14.5V10z"/></svg> є туалет' : (p.toilet==='no' ? 'без туалету' : 'туалет: невідомо');
    // 20.08.2026: явна позначка "зараз зачинено" у попапі — маркер тепер
    // видимий і для закритих точок (притлумлений колір), тож текстова
    // підказка тут пояснює, чому саме він виглядає інакше.
    const statusLine = key!=='toilets' && status==='closed' ? '<br><span style="color:#e07a7a;">💤 зараз зачинено</span>' : '';
    const popupBody = key==='toilets' ? '' : ('<div class="poi-popup-type">'+escapePoiText(hoursLine)+'<br>'+toiletLine+statusLine+'</div>');
    const popupHtml='<div class="poi-popup-name">'+escapePoiText(p.name||p.brand)+'</div>'+popupBody;
    // 15.08.2026: тап по вже ІСНУЮЧІЙ точці — звичайний попап (як і було),
    // АЛЕ якщо "✏️ Редактор" зараз активний, замість нього відкривається
    // форма редагування (showEditPoiForm) — бренд/назва/години/туалет
    // можна змінити, і є "🗑 Видалити". bindPopup тут НЕ використовуємо
    // навмисно (він сам вішає свій click-listener) — інакше довелось би
    // якось "вимикати" стандартний попап лише для режиму редактора.
    let poiLongFired=false;
    marker.on('click', function(){
      if(poiLongFired){ poiLongFired=false; return; } // довге натискання вже відкрило редагування — не відкривати ще й попап поверх
      // 25.08.2026: у режимі "булавки" (routePlanMode) тап по вже наявній
      // точці (магазин/Улюблене/туалет) МАЄ поводитись так само, як тап по
      // порожньому місцю на карті — відкривати меню вибору Старт/Проміжна/
      // Фініш саме в координатах цієї точки. За замовчуванням Leaflet-івський
      // click маркера НЕ бульбашить у map.on('click',...) (де ця перевірка
      // вже є для порожньої карти), тому без цього тап по магазину в режимі
      // булавки просто відкривав би звичайний попап/редагування, ігноруючи
      // routePlanMode повністю.
      if(routePlanMode){ showPointContextMenu(st, marker.getLatLng()); return; }
      if(poiEditorActive) showEditPoiForm(st, p, marker);
      else L.popup({closeButton:true}).setLatLng(marker.getLatLng()).setContent(popupHtml).openOn(st.map);
    });
    // 25.08.2026: довге натискання по будь-якій точці — відкриває
    // редагування НАПРЯМУ, без потреби спершу вмикати "✏️ Редактор" (та
    // ще й перемикати його назад після). За проханням, конкретно для
    // "⭐ Улюблене" (особисті мітки, які хочеться підправити швидко), але
    // працює однаково для всіх брендів — той самий pointerdown/pointerup
    // таймер (550мс), що вже використовується для інших довгих натискань
    // у застосунку (LONG_PRESS_MS/ROUTE_LONG_PRESS_MS/TRIP_LONG_PRESS_MS).
    const poiIconEl = marker.getElement();
    if(poiIconEl){
      let poiPressTimer=null;
      poiIconEl.addEventListener('pointerdown', function(){
        poiLongFired=false;
        poiPressTimer=setTimeout(function(){
          if(routePlanMode) return; // 25.08.2026: у режимі булавки довге натискання не повинно відкривати редагування — лише звичайний тап веде до меню Старт/Проміжна/Фініш
          poiLongFired=true;
          if(navigator.vibrate) try{navigator.vibrate(30);}catch(e){}
          showEditPoiForm(st, p, marker);
        }, 550);
      });
      const cancelPoiPress=function(){ if(poiPressTimer){ clearTimeout(poiPressTimer); poiPressTimer=null; } };
      poiIconEl.addEventListener('pointerup', cancelPoiPress);
      poiIconEl.addEventListener('pointerleave', cancelPoiPress);
      poiIconEl.addEventListener('pointercancel', cancelPoiPress);
    }
    st.brandMarkers.push(marker);
    count++;
  });
  // 20.08.2026 (Фіча А): точки з нерозпізнаним/порожнім брендом — раніше
  // такі рядки взагалі не потрапляли в базу (mergePoiRows їх відкидав), а
  // тепер зберігаються, але НІКОЛИ не показуються серед звичайних брендів
  // (жоден POI_BRAND_KEY[...] на них не спрацює). Щоб вони не губились
  // "у нікуди" — показуємо їх "❓"-маркером, АЛЕ ТІЛЬКИ поки активний
  // "✏️ Редактор" (не засмічуємо звичайну карту діагностичним сміттям), і
  // БЕЗ жодної прив'язки до радіуса POI_RADIUS_M чи тумблерів фільтрів —
  // мета тут "знайти й полагодити", а не "показати асортимент поруч".
  // Тап відкриває ту саму форму редагування — обираєш правильний бренд,
  // зберігаєш, і точка стає звичайною (маркер "❓" зникає при наступному
  // refreshBrandMarkers, бо вже пройде повз перевірку POI_BRAND_KEY[key]).
  if(poiEditorActive){
    POI_BRANDS_DB.forEach(function(p){
      if(POI_BRAND_KEY.hasOwnProperty(p.brand)) return; // розпізнаний — уже показаний вище звичайним маркером
      const icon=L.divIcon({className:'poi-unmatched-div-icon', html:'<div style="font-size:20px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));">❓</div>', iconSize:[24,24], iconAnchor:[12,12]});
      const marker=L.marker([p.lat,p.lon], {icon:icon, draggable:true}).addTo(st.map);
      marker.on('click', function(){ showEditPoiForm(st, p, marker); });
      st.brandMarkers.push(marker);
      count++;
    });
  }
  // Стара generic-база АЗС (legacy, без hours/toilet) — лишається як фолбек
  // для тих, хто раніше завантажив офлайн-GPX. Не показується під час
  // фільтра "Туалети" (бо для неї невідомо, є там туалет чи ні).
  if(POI_TOGGLES.fuel && !POI_TOGGLES.toilets){
    POI_FUEL.forEach(function(p){
      if(haversineM(center.lat, center.lng, p.lat, p.lon) > POI_RADIUS_M) return;
      const icon=L.divIcon({className:'poi-div-icon', html:'<div style="font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v16M4 21h8M4 10h8M14 9l2.5 2v6a1.3 1.3 0 0 0 2.6 0V9.8a1.8 1.8 0 0 0-.53-1.28L16 6"/></svg></div>', iconSize:[26,26], iconAnchor:[13,13]});
      const marker=L.marker([p.lat,p.lon], {icon:icon}).addTo(st.map);
      marker.bindPopup('<div class="poi-popup-name"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v16M4 21h8M4 10h8M14 9l2.5 2v6a1.3 1.3 0 0 0 2.6 0V9.8a1.8 1.8 0 0 0-.53-1.28L16 6"/></svg> '+escapePoiText(p.label||'АЗС (стара база)')+'</div>');
      st.brandMarkers.push(marker);
      count++;
    });
  }
  if(POI_TOGGLES.toilets){
    fetchAndDrawPublicToilets(st); // доповнює офлайн-точки живими даними з OSM
  }
  return count;
}

function refreshBrandMarkersEverywhere(){
  Object.values(mapInstances).forEach(function(s){
    if(s && s.map) refreshBrandMarkers(s);
  });
}

// Тап по квадратику мережі/категорії в новому меню "Маршрут".
function togglePoiBrand(key){
  POI_TOGGLES[key] = !POI_TOGGLES[key];
  savePoiToggles();
  refreshBrandMarkersEverywhere();
  try{ renderPoiToggleGrid(); }catch(e){}
}

   <svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg> ПОБУДОВА МАРШРУТУ (Старт/Проміжні/Фініш → TomTom → ORS-фолбек)

// ── Контекстне меню точки (Старт/Проміжна/Фініш) — відкривається тапом по
// карті, ПОКИ активний режим 🚩 (routePlanMode). Кнопки — звичайні DOM-
// елементи з addEventListener (а не inline-рядки в HTML попапа), щоб не
// возитись з екрануванням координат у розмітці. ──
function showPointContextMenu(st, latlng){
  const div=document.createElement('div');
  // Контррот: st.wrapEl обертається rotate(${-st.heading}deg) під час навігації
  // (щоб напрям руху завжди дивився вгору) — Leaflet-попап живе ВСЕРЕДИНІ
  // цього ж елемента і обертався б разом з ним. Компенсуємо на +heading,
  // щоб меню лишалось читабельним і кнопки — там, де їх візуально тицяють.
  // Прим.: рахуємо один раз на момент відкриття; якщо курс зміниться, поки
  // попап відкритий (рідкісний випадок — вибір точки триває секунду), кут
  // не підхопиться, доки не відкриють меню заново.
  const counterRotateDeg = (st.heading!=null) ? st.heading : 0;
  div.style.cssText='display:flex;flex-direction:column;gap:6px;min-width:150px;transform:rotate('+counterRotateDeg+'deg);';
  function mkBtn(label, kind){
    const b=document.createElement('button');
    b.type='button'; b.textContent=label;
    // Popup Leaflet завжди білий (у застосунку нема темної теми саме для
    // попапів) — тому текст МАЄ бути темним, а не білим по білому.
    b.style.cssText='padding:8px 10px;border-radius:8px;border:1px solid #ccc;background:#f2f2f2;color:#111;font-size:14px;font-weight:600;text-align:left;';
    b.addEventListener('click', function(){ setPlanPoint(kind, latlng); st.map.closePopup(); });
    return b;
  }
  div.appendChild(mkBtn('🟢 Старт', 'start'));
  div.appendChild(mkBtn('🟡 Проміжна', 'waypoint'));
  div.appendChild(mkBtn('🔴 Фініш', 'finish'));
  L.popup({closeButton:true, className:'plan-point-popup'}).setLatLng(latlng).setContent(div).openOn(st.map);
}

function toggleRoutePlanMode(st){
  routePlanMode=!routePlanMode;

    if(s.navPlanBtnEl) s.navPlanBtnEl.classList.toggle('on', routePlanMode);
  });
  try{ renderWaypointMarkers(); }catch(e){} // 15.08.2026: перемальовує точки плану — щоб draggable/клік на видалення одразу увімкнулись/вимкнулись разом з режимом
  // Той САМИЙ 🚩 обслуговує два режими тапу — режими не працюють одночасно,
  // тож дивимось, чи саме на ЦІЙ плитці зараз показані камери (st.camEditorMode),
  // і підказуємо відповідний тост. Якщо викликано без st (напр. з іншого
  // місця коду) — st не передано, орієнтуємось лише на сам routePlanMode.
  const camCtx = st && st.camEditorMode;

  else sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M6 2v20h1.6v-7.2h9L14 11l2.6-3.8h-9V2H6z"/></svg> Режим точок вимкнено');
}

// Показує/ховає панель адреси на конкретній плитці: ОБИДВІ умови мають
// збігтись — карта в fullscreen (st.routeViewMode) І редактор увімкнено
// (poiEditorActive). Викликається і з togglePoiEditor (для всіх плиток),
// і з enterMapFullscreen/exitMapFullscreen (для тієї, що входить/виходить).
function updatePoiEditorBarVisibility(st){
  if(!st.poiEditorBarEl) return;
  const show = (st.routeViewMode && poiEditorActive);
  st.poiEditorBarEl.style.display = show ? 'flex' : 'none';
  if(!show) st.poiEditorBarEl.classList.remove('kb-top'); // ховаємо панель — скидаємо й "піднятий вгору під час набору" стан, щоб наступного разу почала зі звичайної позиції
}

// 15.08.2026 (друга спроба, перша через visualViewport не спрацювала — у
// власній WKWebView-обгортці цього застосунку window.visualViewport дає
// хибні числа, розрахунок "висоти клавіатури" через них лише ЗАВАЖАВ:
// панель відлітала аж угору, під панель налагодження "З'єднання"). Нове
// рішення НЕ рахує висоту клавіатури взагалі — замість цього просто
// переносить панель у ЗАЗДАЛЕГІДЬ відому безпечну зону (клас .kb-top,
// top:60px — під панеллю налагодження) на весь час, поки в полі є фокус,
// і повертає назад на звичну CSS-позицію (bottom:...) одразу на blur.
// Ніякої математики про висоту клавіатури — тому нічому "з'їжджати".
function wirePoiEditorInputKbSafeZone(input, bar){
  input.addEventListener('focus', function(){ bar.classList.add('kb-top'); });
  input.addEventListener('blur', function(){ bar.classList.remove('kb-top'); });
}

// 15.08.2026: у Bluefy (WKWebView-браузер із Web Bluetooth, саме через
// нього тестується застосунок — звідси кнопка "З'єднання" на скріншотах)
// сам по собі font-size:16px+ на полях (уже застосовано скрізь) НЕ
// повністю прибирає баг WebKit "автозум сторінки при фокусі поля вводу" —
// ширина застосунку лишається зменшеною й ПІСЛЯ закриття клавіатури.
// Відомий обхідний прийом: примусово "смикнути" meta[viewport] (зняти й
// одразу повернути той самий content) — це змушує WebKit перерахувати
// масштаб/ширину сторінки наново. Робимо це для БУДЬ-ЯКОГО текстового
// поля в застосунку (не лише "✏️ Редактора") через document-рівневий
// capture-listener на 'blur' (це подія, що не бульбашить сама — тому
// саме capture:true на document, інакше не спрацює).
function forceResetViewportZoom(){
  const vp=document.querySelector('meta[name="viewport"]');
  if(!vp) return;
  const original=vp.getAttribute('content');
  // 20.08.2026: ВІДКОТЖЕНО назад до простого toggle атрибута. Був
  // експериментальний варіант (видалення+вставка НОВОГО meta-елемента),
  // ПІСЛЯ якого з'явився серйозніший симптом — справжній крах WebView
  // (вихід у стартовий екран Bluefy) при відкритті клавіатури в полі
  // пошуку. Прямий причинно-наслідковий зв'язок НЕ підтверджено (не
  // встигли протестувати попередню збірку окремо), але оскільки той
  // трюк був "непідтверджений експеримент" з підвищеним ризиком (живе
  // видалення/вставка <meta> в DOM під час активної роботи клавіатури —
  // нетиповий для WKWebView сценарій), відкочуємо його першим, поки не
  // з'ясуємо, чи це усуває крах.
  vp.setAttribute('content', original+', maximum-scale=1');
  requestAnimationFrame(function(){ vp.setAttribute('content', original); });
}
// 20.08.2026: спільний хелпер — кілька повторних спроб
// forceResetViewportZoom() на зростаючих затримках, кожна поважає "тихе
// вікно". Один постріл виявився недостатнім — WKWebView продовжує СВІЙ
// власний reflow (під закриття клавіатури АБО під поворот екрана)
// довше за перші ~350мс, і звужує вьюпорт ще РАЗ уже ПІСЛЯ нашого
// відновлення. Використовується і на blur поля, і на orientationchange.
function scheduleViewportZoomResets(delays){
  delays.forEach(function(delay){
    setTimeout(function tryResetZoom(){
      if(isViewportBusy()){ setTimeout(tryResetZoom, VIEWPORT_BUSY_MS); return; }
      forceResetViewportZoom();
    }, delay);
  });
}
document.addEventListener('blur', function(e){
  const t=e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT')){
    scheduleViewportZoomResets([350, 600, 900, 1300]);
    // 15.08.2026: поле вводу втратило фокус — клавіатура (найімовірніше)
    // закривається, тож "scroll hack" (ховає хром Bluefy) знову можна
    // безпечно запускати — під час самого друкування ми його свідомо
    // гальмували (guard на document.activeElement у triggerHack вище).
    setTimeout(function(){ if(window._scrollHack) window._scrollHack.forceRun(); }, 400);
    // 20.08.2026 (варіант 2): якщо resize мапи був "заборгований" (див.
    // scheduleMapResize вище) — відпрацьовуємо його ТЕПЕР, коли поле вже
    // втратило фокус і клавіатура закривається. Затримка 400мс — щоб не
    // впіймати мапу серед самої анімації закриття клавіатури.
    if(_mapResizePendingOnBlur){
      _mapResizePendingOnBlur=false;
      setTimeout(()=>scheduleMapResize(200), 400);
    }
  }
}, true);

// 20.08.2026: та сама "стрибає з широкого у вузьке" — але при ПОВОРОТІ
// ЕКРАНА, не лише при клавіатурі. forceResetViewportZoom() досі

// Тимчасова (ще не збережена) мітка — рівно ОДНА на плитку одночасно;
// новий тап по порожній карті чи новий пошук адреси просто ПЕРЕСУВАЄ її,
// а не плодить кілька (щоб не було "де я щойно тапнув" плутанини).
function placePoiEditorTempMarker(st, latlng){
  clearPoiEditorTemp(st);
  clearPoiEditorCandidates(st); // 15.08.2026: обрали конкретний варіант із кількох кандидатів — решта більше не потрібні
  const icon=L.divIcon({
    className:'poi-editor-temp-icon',
    html:'<div style="width:26px;height:26px;border-radius:50%;background:#ff6b00;border:2px solid #fff;'
      +'display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;'
      +'box-shadow:0 1px 4px rgba(0,0,0,.6);"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
  const marker=L.marker([latlng.lat, latlng.lng], {icon:icon, draggable:true}).addTo(st.map);
  // Leaflet marker click НЕ бульбашить у map.on('click', ...) за замовчуванням —
  // тому це єдине місце, де відкривається форма (тап по порожній карті йде
  // в гілку poiEditorActive вище і лише пересуває мітку).
  marker.on('click', function(){ showAddPoiForm(st, marker.getLatLng()); });
  st.poiEditorTempMarker=marker;
}
function clearPoiEditorTemp(st){
  if(st.poiEditorTempMarker){ try{ st.map.removeLayer(st.poiEditorTempMarker); }catch(e){} st.poiEditorTempMarker=null; }
}
// 15.08.2026: кандидати — коли Nominatim повернув КІЛЬКА адрес одразу
// (напр. однойменна вулиця в різних містах Тайваню) — окремий масив
// маркерів, ЩОБ НЕ ПЛУТАТИ з єдиною "справжньою" тимчасовою міткою вище
// (див. placePoiEditorCandidates/poiEditorGeocode).
function clearPoiEditorCandidates(st){
  if(st.poiEditorCandidateMarkers && st.poiEditorCandidateMarkers.length){
    st.poiEditorCandidateMarkers.forEach(function(m){ try{ st.map.removeLayer(m); }catch(e){} });
  }
  st.poiEditorCandidateMarkers=[];
}
// Прибирає майже-дублікати кандидатів (той самий будинок, різні OSM-теги
// в межах ~30м) — інакше "3 варіанти" на екрані могли б виявитись однією
// й тією самою точкою тричі. Nominatim вже сортує за релевантністю —
// лишаємо ПЕРШЕ входження в кожному кластері.
function dedupPoiCandidates(list){
  const out=[];
  list.forEach(function(c){
    const dup=out.some(function(o){ return haversineM(o.lat,o.lon,c.lat,c.lon) < 30; });
    if(!dup) out.push(c);
  });
  return out;
}
// Малює пронумеровані сині мітки-кандидати (макс. 3, обмежено самим
// запитом limit=3). Тап по будь-якій — вона стає ЗВИЧАЙНОЮ тимчасовою
// міткою (placePoiEditorTempMarker), решта прибираються автоматично.
// Центрування: за проханням НЕ fitBounds по всіх одразу (щоб не
// вискакував різкий відзум, якщо один варіант в іншому місті) — просто
// панорамуємо на найближчого до поточного вигляду карти кандидата, зум
// лишається як є.
function placePoiEditorCandidates(st, candidates){
  clearPoiEditorTemp(st);
  clearPoiEditorCandidates(st);
  candidates.forEach(function(c, idx){
    const icon=L.divIcon({
      className:'poi-editor-candidate-icon',
      html:'<div style="width:24px;height:24px;border-radius:50%;background:#2979ff;border:2px solid #fff;'
        +'display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;'
        +'box-shadow:0 1px 4px rgba(0,0,0,.6);">'+(idx+1)+'</div>',
      iconSize:[24,24], iconAnchor:[12,12]
    });
    const marker=L.marker([c.lat, c.lon], {icon:icon}).addTo(st.map);
    marker.bindPopup('<div style="font-size:12px;max-width:220px;">'+escapePoiText(c.label||('Варіант '+(idx+1)))+'</div>');
    marker.on('click', function(){
      st.map.closePopup();
      placePoiEditorTempMarker(st, {lat:c.lat, lng:c.lon});
    });
    st.poiEditorCandidateMarkers.push(marker);
  });
  const center=st.map.getCenter();
  let nearest=candidates[0], nearestD=Infinity;
  candidates.forEach(function(c){
    const d=haversineM(center.lat, center.lng, c.lat, c.lon);
    if(d<nearestD){ nearestD=d; nearest=c; }
  });
  try{ st.map.panTo([nearest.lat, nearest.lon]); }catch(e){}
}

// Геокодинг через Nominatim (OpenStreetMap) — той самий проєкт, що й
// Overpass, звідки й береться сама GPX-база магазинів. Прив'язка до
// Тайваню (countrycodes=tw) — короткі місцеві адреси інакше можуть
// збігтись із однойменним місцем деінде у світі. Китайська адреса йде
// тим самим шляхом — просто інший Unicode-текст у тому самому query
// параметрі, окремого "режиму" не треба.
// 15.08.2026: повертає МАСИВ (до 3 кандидатів, лімітовано самим запитом
// limit=3) — не одну точку, бо однойменна вулиця в різних містах Тайваню
// (чи різних районах) дає кілька валідних збігів одразу. `exact` у
// кожному — чи Nominatim реально підтвердив ТОЙ САМИЙ номер будинку, що
// був у запиті (addressdetails=1 → address.house_number присутній, лише
// якщо він знайдений/інтерпольований по цій вулиці) — якщо ні, точка це
// лише "десь на цій вулиці", а не конкретний будинок; це і є причина
// скарги "мажe по номеру дому" — сама база OSM для того будинку може
// просто не мати точки, і жоден запит цього не полагодить, тільки чесно
// попередить.
async function poiEditorNominatimQuery(q){
  const url='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=3&countrycodes=tw&q='+encodeURIComponent(q);
  const res=await fetch(url, {headers:{'Accept-Language':'uk,zh-TW,en'}});
  const data=await res.json();
  if(!data || !data.length) return [];
  return data.map(function(d){
    const lat=parseFloat(d.lat), lon=parseFloat(d.lon);
    return {lat:lat, lon:lon, exact:!!(d.address && d.address.house_number), label:d.display_name||''};
  }).filter(function(r){ return !isNaN(r.lat) && !isNaN(r.lon); });
}

async function poiEditorGeocode(st, addressText){
  addressText=(addressText||'').trim();
  if(!addressText){ sht('Введи адресу'); return; }
  sht('🔎 Шукаю адресу…');
  let results=[];
  try{
    results = dedupPoiCandidates(await poiEditorNominatimQuery(addressText));
    if(!results.length){
      // Фолбек: тайванські адреси у форматі "No. 156, Sec. 2, ... Rd,
      // District, City" — номер будинку й секція часто НЕ проіндексовані
      // в Nominatim разом з англійською назвою вулиці (сама вулиця в OSM
      // здебільшого тегована китайською, "No./Sec." — суто англійський
      // додаток, якого в даних просто нема) — один запит з усім рядком
      // одразу може повернути 0 результатів. Пробуємо ще раз БЕЗ "No. X,"
      // і "Sec. Y," — лишаємо вулицю+район+місто, це гірше за точністю
      // (влучає в вулицю, не в конкретний будинок), але краще, ніж зовсім
      // нічого — мітку можна дотягнути пальцем (вона draggable).
      const simplified=addressText.replace(/^\s*no\.?\s*\d+\s*,?\s*/i,'').replace(/^\s*sec\.?\s*\d+\s*,?\s*/i,'').trim();
      if(simplified && simplified!==addressText){
        results = dedupPoiCandidates(await poiEditorNominatimQuery(simplified));
      }
    }
  }catch(e){
    sht('❌ Не вдалось пошукати адресу (нема інтернету?)');
    return;
  }
  if(!results.length){ sht('❌ Адресу не знайдено — спробуй точніше (можна й китайською), або став мітку тапом по карті'); return; }
  if(results.length===1){
    const r=results[0];
    placePoiEditorTempMarker(st, {lat:r.lat, lng:r.lon});
    try{ st.map.setView([r.lat,r.lon], Math.max(st.map.getZoom(), 17)); }catch(e){}
    sht(r.exact ? '📍 Знайдено — тицяй по мітці, щоб заповнити деталі' : '📍 Знайдено вулицю, але НЕ точний номер будинку (нема в базі OSM) — дотягни мітку пальцем перед збереженням');
  } else {
    // Кілька валідних збігів (напр. однойменна вулиця в різних містах) —
    // показуємо ВСІ пронумерованими мітками, обираєш сам (placePoiEditorCandidates).
    placePoiEditorCandidates(st, results);
    sht('📍 Знайдено '+results.length+' варіантів — тицяй на потрібний на карті (мітки з номерами)');
  }
}

      // камінь, що й для GPX/CSV-імпорту, п.4 доповнення 14.08.2026), і
      // виглядало б так, ніби кнопка "нічого не зробила".
      const key=POI_BRAND_KEY[brand];
      if(key && !POI_TOGGLES[key]){ POI_TOGGLES[key]=true; savePoiToggles(); try{ renderPoiToggleGrid(); }catch(e){} }
    } else {
      sht('<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;" fill="currentColor"><path d="M12 2L1 21h22L12 2zm-1 7h2v6h-2V9zm0 8h2v2h-2v-2z"/></svg> Точку не додано (можливо, дублікат)');
    }
    try{ renderPoiBrandsStatus(); }catch(e){}
    refreshBrandMarkersEverywhere();
    if(st.poiEditorAddrInput) st.poiEditorAddrInput.value='';
  });
  cancelBtn.addEventListener('click', function(){
    st.map.closePopup();
    clearPoiEditorTemp(st);
  });

  L.popup({closeButton:true, className:'plan-point-popup'}).setLatLng(latlng).setContent(div).openOn(st.map);
}

// раніше доданої цим самим редактором) — відкривається тапом по звичайній

// showAddPoiForm, але поля ПРЕЗаповнені поточними значеннями `p`, і замість

    if(idx!==-1) POI_BRANDS_DB.splice(idx,1);

  L.popup({closeButton:true, className:'plan-point-popup'}).setLatLng(marker.getLatLng()).setContent(div).openOn(st.map);
