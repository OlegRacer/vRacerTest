<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>PWA Fullscreen Keyboard Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* Вимикаємо стандартне відскочування скролу в iOS */
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100vw;
      height: 100dvh; /* Використовуємо dynamic viewport height */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: linear-gradient(135deg, #1e1e2f, #111119);
    }

    header {
      padding: 20px;
      text-align: center;
    }

    .status {
      font-size: 14px;
      color: #00ffcc;
      margin-top: 8px;
    }

    main {
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border-radius: 12px;
      border: 2px solid #333355;
      background-color: #252538;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #00ffcc;
    }

    footer {
      padding: 20px;
      font-size: 12px;
      color: #8888aa;
    }
  </style>
</head>
<body>

  <div class="app-container" id="app">
    <header>
      <h2>Тест повноекранного режиму</h2>
      <div class="status" id="status">Клавіатуру закрито</div>
    </header>

    <main>
      <input type="text" id="testInput" placeholder="Торкніться для тесту клавіатури..." autocomplete="off">
    </main>

    <footer>
      <p>Перевірка Safe Area при відкритій клавіатурі</p>
    </footer>
  </div>

  <script>
    const input = document.getElementById('testInput');
    const status = document.getElementById('status');
    const app = document.getElementById('app');

    // Хак 1: Примусове повернення вьюпорту при фокусі
    input.addEventListener('focus', () => {
      status.textContent = 'Клавіатуру відкрито';
      
      // Запобігаємо зсуву сторінки iOS Safari
      setTimeout(() => {
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
      }, 100);
    });

    input.addEventListener('blur', () => {
      status.textContent = 'Клавіатуру закрито';
      window.scrollTo(0, 0);
    });

    // Хак 2: Динамічне коригування розмірів через VisualViewport API
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        // Оновлюємо розмір контейнера точно під видиму область без виходу із fullscreen
        app.style.height = `${window.visualViewport.height}px`;
        window.scrollTo(0, 0);
      });

      window.visualViewport.addEventListener('scroll', () => {
        // Примусово блокуємо спроби Safari проскролити сторінку вгору/вниз
        window.scrollTo(0, 0);
      });
    }
  </script>
</body>
</html>
