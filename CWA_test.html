<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CWA тест</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#e8e8ea;font:15px -apple-system,Helvetica,Arial,sans-serif;padding:12px;padding-bottom:40px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:#8a8a90;font-size:13px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#16161a;color:#fff;font-size:15px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
button{flex:1 1 140px;padding:12px;border-radius:10px;border:1px solid #2a2a30;background:#1d1d23;color:#fff;font-size:15px}
button:active{background:#2c2c35}
button.pr{background:#0e5a8a;border-color:#1b7ab3}
button.ok{background:#1b5e20;border-color:#2e7d32}
#out{white-space:pre-wrap;word-break:break-word;background:#111115;border:1px solid #222;border-radius:10px;padding:10px;font:12px ui-monospace,Menlo,monospace;min-height:120px;margin-top:6px}
.ok{color:#3ddc84}.er{color:#ff6b6b}.wr{color:#ffd54f}
#img{margin-top:8px;max-width:100%;border-radius:8px;display:none;background:#222}
</style>
</head>
<body>
<h1>CWA Open Data — тест</h1>
<div class="sub">Окрема програма для перевірки ключа, CORS і форми відповіді. Основний застосунок не чіпає.</div>

<input id="key" type="password" placeholder="Ключ CWA (CWA-XXXXXXXX-…)" autocomplete="off">
<div class="row">
  <button class="pr" onclick="runAll()">▶ Перевірити все</button>
  <button onclick="testRadar()">Радар</button>
  <button onclick="testRain()">Дощоміри</button>
</div>
<input id="cust" placeholder="Свій ID набору (напр. O-A0058-001)" autocomplete="off" autocapitalize="off">
<div class="row">
  <button onclick="testCustom(true)">Свій ID · fileapi</button>
  <button onclick="testCustom(false)">Свій ID · datastore</button>
  <button onclick="testGrid()">Сітка QPESUMS</button>
  <button class="ok" onclick="copyReport()">📋 Копіювати звіт</button>
  <button onclick="clearOut()">Очистити</button>
</div>
<div id="out">Вставте ключ і натисніть «Перевірити все».</div>
<img id="img" alt="">

<script>
var BASE='https://opendata.cwa.gov.tw/api/v1/rest/datastore/';
var FILEBASE='https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/'; // «файловий» API: радар лежить тут, а не в datastore
var RADAR_IDS=['O-A0058-001','O-A0058-003']; // радарна картинка; пробуємо fileapi, потім datastore
var GRID_ID='O-A0059-001';                    // сітка QPESUMS (важка), лише кнопкою   // кандидати: радарна картинка Тайваню (ID підтверджуємо цим тестом)
var RAIN_ID='O-A0002-001';                      // дощомірні станції, раз на 10 хв
var out=document.getElementById('out');
var report='';

function lg(txt,cls){
  report+=txt+'\n';
  var s=document.createElement('span');
  if(cls) s.className=cls;
  s.textContent=txt+'\n';
  if(out.getAttribute('data-first')!=='0'){ out.textContent=''; out.setAttribute('data-first','0'); }
  out.appendChild(s);
}
function clearOut(){ out.textContent=''; out.setAttribute('data-first','0'); report=''; document.getElementById('img').style.display='none'; }
function getKey(){
  var k=document.getElementById('key').value.trim();
  if(k){ try{ localStorage.setItem('cwaKey',k); }catch(e){} }
  return k;
}
(function(){ try{ var k=localStorage.getItem('cwaKey'); if(k) document.getElementById('key').value=k; }catch(e){} })();

function keys(o){ try{ return Object.keys(o).join(', '); }catch(e){ return ''; } }

// Рекурсивно шукаємо в JSON цікаві поля: посилання на картинку, межі координат, розміри, час
function scan(node, path, found, depth){
  if(depth>8 || node===null || node===undefined) return;
  if(typeof node==='string'){
    if(/^https?:\/\//i.test(node) && /\.(png|jpg|jpeg|gif)|ProductURL|image/i.test(node+path)) found.urls.push([path,node]);
    return;
  }
  if(typeof node!=='object') return;
  if(Array.isArray(node)){
    if(node.length>0 && node.length<=12){ for(var q=0;q<node.length;q++) scan(node[q], path+'['+q+']', found, depth+1); }
    else if(node.length>0) scan(node[0], path+'[0]', found, depth+1);
    return;
  }
  Object.keys(node).forEach(function(k){
    var v=node[k], p=path+'.'+k;
    if(/Range|Dimension|DateTime|Resolution|StartPoint|ProductURL|URL|mimeType|resourceDesc|parameterName|parameterValue/i.test(k) && (typeof v!=='object' || v===null)){
      found.fields.push([p,String(v).slice(0,160)]);
    }
    if(/Range|Dimension|parameter/i.test(k) && v && typeof v==='object'){
      found.fields.push([p,JSON.stringify(v).slice(0,260)]);
    }
    scan(v,p,found,depth+1);
  });
}

async function call(id, extra, isFile){
  var key=getKey();
  if(!key){ lg('❌ Немає ключа','er'); return null; }
  var url=(isFile ? FILEBASE : BASE)+encodeURIComponent(id)+'?Authorization='+encodeURIComponent(key)+(isFile ? '&downloadType=WEB' : '')+'&format=JSON'+(extra||'');
  var t0=Date.now();
  var resp;
  try{
    resp=await fetch(url);
  }catch(e){
    lg('❌ '+id+(isFile?' [fileapi]':' [datastore]')+': запит не вдався ('+(e&&e.message?e.message:e)+') за '+(Date.now()-t0)+' мс','er');
    lg('   Це може бути і неіснуючий шлях/ID (404 без CORS-заголовків теж дає «Load failed»), і справжній CORS. Дощоміри з цього ж хоста працюють — перевіряємо інший шлях.','wr');
    return null;
  }
  var txt=await resp.text();
  lg((resp.ok?'✅ ':'⚠️ ')+id+(isFile?' [fileapi]':' [datastore]')+': HTTP '+resp.status+', '+Math.round(txt.length/1024)+' КБ, '+(Date.now()-t0)+' мс', resp.ok?'ok':'wr');
  var data=null;
  try{ data=JSON.parse(txt); }catch(e){
    lg('   Відповідь не JSON: '+txt.slice(0,200),'er');
    return null;
  }
  return data;
}

async function testRadar(){
  lg('— РАДАР —','wr');
  var okAny=false;
  for(var i=0;i<RADAR_IDS.length && !okAny;i++){
    for(var m=0;m<2 && !okAny;m++){
      var isFile=(m===0);
      var d=await call(RADAR_IDS[i], '', isFile);
      if(!d) continue;
      lg('   верхній рівень: '+keys(d));
      var f={urls:[],fields:[]};
      scan(d,'',f,0);
      f.fields.slice(0,30).forEach(function(x){ lg('   '+x[0]+' = '+x[1]); });
      if(f.urls.length){
        okAny=true;
        lg('   🖼 Знайдено посилання на картинку: '+f.urls[0][1],'ok');
        lg('   ➜ ПРАЦЮЄ: '+RADAR_IDS[i]+(isFile?' через fileapi':' через datastore'),'ok');
        var im=document.getElementById('img');
        im.onload=function(){ lg('   🖼 Картинка завантажилась у <img>: '+im.naturalWidth+'×'+im.naturalHeight+' (CORS для неї не потрібен)','ok'); };
        im.onerror=function(){ lg('   🖼 Картинка НЕ завантажилась у <img>','er'); };
        im.style.display='block';
        im.src=f.urls[0][1]+(f.urls[0][1].indexOf('?')>=0?'&':'?')+'_='+Date.now();
      } else {
        lg('   Посилання на картинку не знайдено — початок відповіді:','wr');
        lg('   '+JSON.stringify(d).slice(0,500));
      }
    }
  }
  if(!okAny) lg('ℹ️ Радар: жоден варіант не дав картинку. Введіть ID у поле нижче (кнопки «fileapi» / «datastore»).','wr');
}

async function testGrid(){
  lg('— СІТКА QPESUMS (важка) —','wr');
  var d=await call(GRID_ID,'',true);
  if(!d) return;
  lg('   верхній рівень: '+keys(d));
  var f={urls:[],fields:[]}; scan(d,'',f,0);
  f.fields.slice(0,20).forEach(function(x){ lg('   '+x[0]+' = '+x[1]); });
}

function dist(a,b,c,d){ var t=Math.PI/180,R=6371,dl=(c-a)*t,dn=(d-b)*t; var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dn/2)*Math.sin(dn/2); return 2*R*Math.asin(Math.sqrt(x)); }

function getPos(){
  return new Promise(function(res){
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(function(p){ res([p.coords.latitude,p.coords.longitude]); }, function(){ res(null); }, {enableHighAccuracy:false,timeout:6000});
  });
}

async function testRain(){
  lg('— ДОЩОМІРИ —','wr');
  var d=await call(RAIN_ID);
  if(!d) return;
  lg('   success: '+d.success+'; верхній рівень: '+keys(d));
  var recs=d.records||{};
  lg('   records: '+keys(recs));
  var arr=recs.Station||recs.station||recs.location||[];
  lg('   станцій: '+arr.length);
  if(!arr.length){ lg('   '+JSON.stringify(d).slice(0,400)); return; }
  lg('   приклад: '+JSON.stringify(arr[0]).slice(0,500));
  var pos=await getPos();
  if(!pos){ lg('   (геолокація недоступна — найближчу станцію не рахую)','wr'); return; }
  var best=null,bd=1e9;
  arr.forEach(function(s){
    var g=s.GeoInfo||{}; var la=parseFloat(g.Coordinates&&g.Coordinates[0]?g.Coordinates[0].StationLatitude:s.StationLatitude);
    var lo=parseFloat(g.Coordinates&&g.Coordinates[0]?g.Coordinates[0].StationLongitude:s.StationLongitude);
    if(isNaN(la)||isNaN(lo)) return;
    var dd=dist(pos[0],pos[1],la,lo); if(dd<bd){ bd=dd; best=s; }
  });
  if(best) lg('   Найближча станція: '+(best.StationName||best.stationName||'?')+', '+bd.toFixed(1)+' км\n   '+JSON.stringify(best.RainfallElement||best.weatherElement||best).slice(0,400),'ok');
  else lg('   Координати станцій не розпізнано — див. приклад вище','wr');
}

async function testCustom(isFile){
  var id=document.getElementById('cust').value.trim();
  if(!id){ lg('❌ Введіть ID набору','er'); return; }
  lg('— '+id+(isFile?' (fileapi)':' (datastore)')+' —','wr');
  var d=await call(id,'',isFile);
  if(!d) return;
  lg('   верхній рівень: '+keys(d));
  var f={urls:[],fields:[]};
  scan(d,'',f,0);
  f.fields.slice(0,30).forEach(function(x){ lg('   '+x[0]+' = '+x[1]); });
  f.urls.slice(0,3).forEach(function(x){ lg('   🖼 '+x[0]+' = '+x[1],'ok'); });
  lg('   початок відповіді: '+JSON.stringify(d).slice(0,500));
}

async function runAll(){
  clearOut();
  lg('CWA тест, '+new Date().toLocaleString('uk-UA'));
  lg('Браузер: '+navigator.userAgent.slice(0,120));
  await testRadar();
  await testRain();
  lg('\nГотово. Натисніть «Копіювати звіт» і надішліть мені.','ok');
}

function copyReport(){
  var safe=report.replace(/CWA-[A-Z0-9-]{8,}/g,'CWA-***');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(safe).then(function(){ alert('Скопійовано (ключ приховано)'); }, function(){ fallbackCopy(safe); });
  } else fallbackCopy(safe);
}
function fallbackCopy(t){
  var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); alert('Скопійовано (ключ приховано)'); }catch(e){ alert('Не вдалось скопіювати — виділіть текст вручну'); }
  document.body.removeChild(ta);
}
</script>
</body>
</html>
