<script>
var BASE='https://opendata.cwa.gov.tw/api/v1/rest/datastore/';
var FILEBASE='https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/'; // «файловий» API: радар лежить тут, а не в datastore
var RADAR_IDS=['O-A0058-001','O-A0058-003']; // радарна картинка; пробуємо fileapi, потім datastore
var GRID_ID='O-A0059-001';                    // сітка QPESUMS (важка), лише кнопкою
var RAIN_ID='O-A0002-001';                      // дощомірні станції, раз на 10 хв
var out=document.getElementById('out');
var report='';
window.addEventListener('error',function(e){ try{ lg('❌ Помилка скрипта: '+e.message,'er'); }catch(x){} });
window.addEventListener('unhandledrejection',function(e){ try{ lg('❌ Необроблена помилка: '+(e.reason&&e.reason.message?e.reason.message:e.reason),'er'); }catch(x){} });

function lg(txt,cls){
  report+=txt+'\n';
  var s=document.createElement('span');
  if(cls) s.className=cls;
  s.textContent=txt+'\n';
  if(out.getAttribute('data-first')!=='0'){ out.textContent=''; out.setAttribute('data-first','0'); }
  out.appendChild(s);
}
function clearOut(){ document.getElementById('imgs').textContent=''; out.textContent=''; out.setAttribute('data-first','0'); report=''; document.getElementById('img').style.display='none'; }
function getKey(){
  var k=document.getElementById('key').value.trim();
  if(k){ try{ localStorage.setItem('cwaKey',k); }catch(e){} }
  return k;
}
(function(){ try{ var k=localStorage.getItem('cwaKey'); if(k) document.getElementById('key').value=k; }catch(e){} })();

function keys(o){ try{ return Object.keys(o).join(', '); }catch(e){ return ''; } }

// Рекурсивно шукаємо в JSON цікаві поля: посилання на картинку, межі координат, розміри, час
function scan(node, path, found, depth){
  if(depth>8 || node===null || node===undefined) return;
  if(typeof node==='string'){
    if(/^https?:\/\//i.test(node) && /\.(png|jpg|jpeg|gif)|ProductURL|image/i.test(node+path)) found.urls.push([path,node]);
    return;
  }
  if(typeof node!=='object') return;
  if(Array.isArray(node)){
    if(node.length>0 && node.length<=12){ for(var q=0;q<node.length;q++) scan(node[q], path+'['+q+']', found, depth+1); }
    else if(node.length>0) scan(node[0], path+'[0]', found, depth+1);
    return;
  }
  Object.keys(node).forEach(function(k){
    var v=node[k], p=path+'.'+k;
    if(/Range|Dimension|DateTime|Resolution|StartPoint|ProductURL|URL|mimeType|resourceDesc|parameterName|parameterValue/i.test(k) && (typeof v!=='object' || v===null)){
      found.fields.push([p,String(v).slice(0,160)]);
    }
    if(/Range|Dimension|parameter/i.test(k) && v && typeof v==='object'){
      found.fields.push([p,JSON.stringify(v).slice(0,260)]);
    }
    scan(v,p,found,depth+1);
  });
}

async function call(id, extra, isFile){
  var key=getKey();
  if(!key){ lg('❌ Немає ключа','er'); return null; }
  var url=(isFile ? FILEBASE : BASE)+encodeURIComponent(id)+'?Authorization='+encodeURIComponent(key)+(isFile ? '&downloadType=WEB' : '')+'&format=JSON'+(extra||'');
  var t0=Date.now();
  var resp;
  try{
    resp=await fetch(url);
  }catch(e){
    lg('❌ '+id+(isFile?' [fileapi]':' [datastore]')+': запит не вдався ('+(e&&e.message?e.message:e)+') за '+(Date.now()-t0)+' мс','er');
    lg('   Це може бути і неіснуючий шлях/ID (404 без CORS-заголовків теж дає «Load failed»), і справжній CORS. Дощоміри з цього ж хоста працюють — перевіряємо інший шлях.','wr');
    return null;
  }
  // 06.10.2026: показуємо, чи стискає сервер відповідь (для сітки O-A0059-001 це важливо: 8.7 МБ — розпаковані чи ні)
  var enc=''; try{ enc=resp.headers.get('content-encoding')||''; }catch(e){}
  var txt=await resp.text();
  lg((resp.ok?'✅ ':'⚠️ ')+id+(isFile?' [fileapi]':' [datastore]')+': HTTP '+resp.status+', '+Math.round(txt.length/1024)+' КБ (розпаковано), '+(Date.now()-t0)+' мс'+(enc?', стиснення: '+enc:', стиснення: не видно (або заголовок прихований CORS)'), resp.ok?'ok':'wr');
  var data=null;
  try{ data=JSON.parse(txt); }catch(e){
    lg('   Відповідь не JSON: '+txt.slice(0,200),'er');
    return null;
  }
  return data;
}

function loadImg(url, label){
  return new Promise(function(res){
    var t0=Date.now(), im=new Image();
    im.onload=function(){
      lg('   🖼 '+label+': '+im.naturalWidth+'×'+im.naturalHeight+', завантажено за '+(Date.now()-t0)+' мс, у пам\'яті ≈ '+Math.round(im.naturalWidth*im.naturalHeight*4/1048576)+' МБ після декодування','ok');
      res(im);
    };
    im.onerror=function(){ lg('   🖼 '+label+': НЕ завантажилась','er'); res(null); };
    im.src=url+(url.indexOf('?')>=0?'&':'?')+'_='+Date.now();
  });
}
async function testRadar(){
  lg('— РАДАР (fileapi) —','wr');
  var shown=false;
  for(var i=0;i<RADAR_IDS.length;i++){
    var d=await call(RADAR_IDS[i], '', true);
    if(!d) continue;
    var f={urls:[],fields:[]};
    scan(d,'',f,0);
    f.fields.forEach(function(x){
      if(/LongitudeRange|LatitudeRange|ImageDimension|resourceDesc|DateTime|mimeType/.test(x[0])) lg('   '+x[0].split('.').pop()+' = '+x[1]);
    });
    if(f.urls.length){
      lg('   URL: '+f.urls[0][1]);
      var im=await loadImg(f.urls[0][1], RADAR_IDS[i]);
      if(im && !shown){ var el=document.getElementById('img'); el.src=im.src; el.style.display='block'; shown=true; }
    } else lg('   посилання на картинку немає: '+JSON.stringify(d).slice(0,300),'wr');
  }
}

function longestString(node, depth, best){
  if(depth>9 || node===null || node===undefined) return best;
  if(typeof node==='string'){ if(node.length>best.len) { best.len=node.length; best.val=node; } return best; }
  if(typeof node!=='object') return best;
  Object.keys(node).forEach(function(k){ longestString(node[k], depth+1, best); });
  return best;
}
// Чи можна читати пікселі PNG (потрібні CORS-заголовки від S3)? Якщо так — можна лишити тільки кольори дощу фільтром.
async function testCors(){
  lg('— CORS ПІКСЕЛІВ КАРТИНКИ —','wr');
  var d=await call('O-A0058-003','',true);
  if(!d) return;
  var url=d.cwaopendata.dataset.resource.ProductURL;
  await new Promise(function(res){
    var im=new Image(); im.crossOrigin='anonymous';
    im.onload=function(){
      try{
        var c=document.createElement('canvas'); c.width=64; c.height=64;
        var x=c.getContext('2d'); x.drawImage(im,0,0,64,64);
        x.getImageData(0,0,1,1);
        lg('   ✅ Пікселі ЧИТАЮТЬСЯ (CORS дозволено) — можна фільтрувати кольори дощу','ok');
      }catch(e){ lg('   ❌ Картинка завантажилась, але пікселі заблоковано: '+e.message,'er'); }
      res();
    };
    im.onerror=function(){ lg('   ❌ З crossOrigin=anonymous картинка не завантажилась — S3 не віддає CORS. Фільтр кольору неможливий, лишається числова сітка.','er'); res(); };
    im.src=url+'?_='+Date.now();
  });
}

// ── 06.10.2026: ПРОЗОРІ PNG-ШАРИ РАДАРА CWA (O-A0058-006 прилегла область, O-A0058-005 велика область) ──
// Відповідає на питання: який РЕАЛЬНИЙ розмір файлу, розмір картинки в пікселях (→ пам'ять після декодування),
// чи справді прозорий фон (без підложки/підписів) і чи палітра чиста (мало різних кольорів → інтенсивність відновлюється за кольором).
var TR_IDS=['O-A0058-006','O-A0058-005'];
async function testTransparent(){
  lg('— ПРОЗОРІ PNG-ШАРИ РАДАРА —','wr');
  var box=document.getElementById('imgs'); box.textContent='';
  for(var n=0;n<TR_IDS.length;n++){
    var id=TR_IDS[n];
    lg('\n▸ '+id,'wr');
    var d=await call(id,'',true);
    if(!d) continue;
    var f={urls:[],fields:[]}; scan(d,'',f,0);
    f.fields.forEach(function(x){ if(/LongitudeRange|LatitudeRange|ImageDimension|resourceDesc|DateTime|mimeType|Resolution/.test(x[0])) lg('   '+x[0].split('.').pop()+' = '+x[1]); });
    var url=null;
    try{ url=d.cwaopendata.dataset.resource.ProductURL; }catch(e){}
    if(!url && f.urls.length) url=f.urls[0][1];
    if(!url){ lg('   посилання на картинку немає: '+JSON.stringify(d).slice(0,300),'er'); continue; }
    lg('   URL: '+url);
    // 1) качаємо файл як є — справжній розмір у мережі
    var blob=null, t0=Date.now();
    try{
      var r=await fetch(url+(url.indexOf('?')>=0?'&':'?')+'_='+Date.now());
      lg('   HTTP '+r.status+', content-type: '+(r.headers.get('content-type')||'?')+', content-length: '+(r.headers.get('content-length')||'?')+', content-encoding: '+(r.headers.get('content-encoding')||'—'));
      blob=await r.blob();
      lg('   ⬇ файл: '+(blob.size/1024).toFixed(0)+' КБ ('+(blob.size/1048576).toFixed(2)+' МБ), завантажено за '+(Date.now()-t0)+' мс', blob.size<1500*1024?'ok':'wr');
    }catch(e){
      lg('   ❌ fetch картинки не вдався ('+(e&&e.message?e.message:e)+') — ймовірно, без CORS; розмір не дізнатись, пробую через <img>','er');
    }
    // 2) декодуємо
    var im=await new Promise(function(res){
      var i=new Image(); if(!blob) i.crossOrigin='anonymous';
      i.onload=function(){ res(i); }; i.onerror=function(){ res(null); };
      i.src=blob ? URL.createObjectURL(blob) : url+'?_='+Date.now();
    });
    if(!im){ lg('   ❌ картинка не декодується','er'); continue; }
    var W=im.naturalWidth, H=im.naturalHeight;
    lg('   🖼 '+W+'×'+H+', у пам\'яті після декодування ≈ '+Math.round(W*H*4/1048576)+' МБ', (W*H*4/1048576)>30?'wr':'ok');
    var cap=document.createElement('div'); cap.className='cap'; cap.textContent=id+' · '+W+'×'+H;
    var show=document.createElement('img'); show.src=im.src;
    box.appendChild(cap); box.appendChild(show);
    // 3) аналіз пікселів (зменшення БЕЗ згладжування, щоб не змішувати кольори)
    try{
      var cw=Math.min(1200,W), ch=Math.max(1,Math.round(H*cw/W));
      var c=document.createElement('canvas'); c.width=cw; c.height=ch;
      var x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingEnabled=false;
      x.drawImage(im,0,0,cw,ch);
      var px=x.getImageData(0,0,cw,ch).data, tot=cw*ch, tr=0, semi=0, op=0, map={}, uniq=0;
      for(var q=0;q<px.length;q+=4){
        var a=px[q+3];
        if(a===0){ tr++; continue; }
        if(a<255) semi++; else op++;
        var key=px[q]+','+px[q+1]+','+px[q+2]+','+a;
        if(map[key]===undefined){ if(uniq<20000){ map[key]=1; uniq++; } } else map[key]++;
      }
      lg('   аналіз (вибірка '+cw+'×'+ch+'): повністю прозорих '+(tr*100/tot).toFixed(1)+'%, напівпрозорих '+(semi*100/tot).toFixed(1)+'%, непрозорих '+(op*100/tot).toFixed(1)+'%');
      lg('   різних кольорів: '+uniq+(uniq>=20000?'+':'')+(uniq<=60?' — це ЧИСТА палітра, інтенсивність відновлюється точно':uniq<=400?' — палітра з легким згладженням':' — багато відтінків, є згладжування/підписи; відновлення за кольором буде приблизним'), uniq<=400?'ok':'wr');
      var top=Object.keys(map).sort(function(a,b){ return map[b]-map[a]; }).slice(0,14);
      lg('   найчастіші кольори (R,G,B,A : % від непрозорих):');
      var nonT=Math.max(1,semi+op);
      top.forEach(function(k){ lg('     '+k+' : '+(map[k]*100/nonT).toFixed(1)+'%'); });
    }catch(e){ lg('   ❌ аналіз пікселів не вдався: '+(e&&e.message?e.message:e),'er'); }
  }
  lg('\nЯкщо файл < 1.5 МБ, прозорих пікселів багато, а кольорів небагато — PNG підходить. Дивись «у пам\'яті ≈ … МБ» (понад ~30 МБ для iPhone важко).','wr');
}


// ── 06.10.2026: ЗВІРКА PNG O-A0058-006 З ЧИСЛОВОЮ СІТКОЮ O-A0059-001 ──
// Мета: (1) з'ясувати проєкцію PNG (рівнокутна чи Меркатор по вертикалі) і порядок рядків сітки — вибираємо комбінацію, де кольори PNG найкраще збігаються з дощем у сітці;
// (2) ЕМПІРИЧНО побудувати палітру «колір PNG → dBZ», усереднюючи значення сітки під кожним кольором. Потрібен дощ у зоні Тайваню (інакше мало точок для звірки).
// Вантажить сітку (~9 МБ, ~13 с) і PNG (~150 КБ). PNG зменшується до 1800×1800 БЕЗ згладжування (як і планується в застосунку).
function tgMercY(lat){ return Math.log(Math.tan(Math.PI/4+lat*Math.PI/360)); }
function tgInvMerc(m){ return (2*Math.atan(Math.exp(m))-Math.PI/2)*180/Math.PI; }
async function testPngVsGrid(){
  try{ await testPngVsGridInner(); }
  catch(e){ lg('❌ ТЕСТ ВПАВ: '+(e&&e.message?e.message:e)+(e&&e.stack?'\n'+String(e.stack).slice(0,400):''),'er'); }
}
async function testPngVsGridInner(){
  lg('— ЗВІРКА PNG (O-A0058-006) З СІТКОЮ (O-A0059-001) —','wr');
  var t00=Date.now();
  // 1) PNG
  var dp=await call('O-A0058-006','',true); if(!dp) return;
  var fp={urls:[],fields:[]}; scan(dp,'',fp,0);
  var pngTime='?'; fp.fields.forEach(function(x){ if(/DateTime$/.test(x[0])) pngTime=x[1]; });
  var url=null; try{ url=dp.cwaopendata.dataset.resource.ProductURL; }catch(e){}
  if(!url){ lg('❌ нема ProductURL','er'); return; }
  var blob; try{ var r=await fetch(url+'?_='+Date.now()); blob=await r.blob(); }catch(e){ lg('❌ PNG не завантажився: '+e.message,'er'); return; }
  var im=await new Promise(function(res){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){res(null);}; i.src=URL.createObjectURL(blob); });
  if(!im){ lg('❌ PNG не декодується','er'); return; }
  var N=1800, c=document.createElement('canvas'); c.width=N; c.height=N;
  var x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingEnabled=false; x.drawImage(im,0,0,N,N);
  var px=x.getImageData(0,0,N,N).data;
  im=null;
  lg('   PNG '+(blob.size/1024).toFixed(0)+' КБ, час '+pngTime+', зменшено до '+N+'×'+N);
  // 2) сітка
  lg('   качаю сітку (~13 с)…');
  var dg=await call('O-A0059-001','',true); if(!dg) return;
  var fg={urls:[],fields:[]}; scan(dg,'',fg,0);
  var gridTime='?'; fg.fields.forEach(function(x){ if(/DateTime$/.test(x[0])) gridTime=x[1]; });
  lg('   сітка отримана за '+((Date.now()-t00)/1000).toFixed(0)+' с, розбираю…');
  var best=longestString(dg,0,{len:0,val:''});
  var NX=921, NY=881, RES=0.0125, LON0=115, LAT0=18;
  // прямий прохід по рядку (як у застосунку), підтримує наукові числа «2.45E+01»; без split на 800 тис. шматків
  var gv=new Float32Array(NX*NY); gv.fill(-999);
  var sv=best.val, sl=sv.length, gk=0, gi=0, gc;
  while(gi<sl && gk<NX*NY){
    gc=sv.charCodeAt(gi);
    if(gc===45 || gc===46 || (gc>=48 && gc<=57)){
      var gj=gi+1;
      while(gj<sl){
        gc=sv.charCodeAt(gj);
        if(gc===46 || (gc>=48 && gc<=57)) gj++;
        else if(gc===101 || gc===69){ gj++; var g2=sv.charCodeAt(gj); if(g2===43 || g2===45) gj++; }
        else break;
      }
      gv[gk++]=parseFloat(sv.substring(gi,gj)); gi=gj;
    } else gi++;
  }
  dg=null; best=null; sv=null;
  if(gk!==NX*NY){ lg('❌ у сітці розібрано '+gk+' значень, очікувалось '+(NX*NY),'er'); return; }
  lg('   сітка розібрана: '+gk+' значень');
  lg('   час PNG: '+pngTime+' | час сітки: '+gridTime+(pngTime===gridTime?' — ЗБІГАЮТЬСЯ':' — РІЗНІ (звірка буде менш точною)'), pngTime===gridTime?'ok':'wr');
  // 3) PNG: межі за метаданими
  var LONW=118, LONE=124, LATS=20.5, LATN=26.5;
  // 4) вибираємо «дощові» пікселі PNG: майже непрозорі й не чорні
  var rain=[]; // [px, py, key]
  for(var py=0;py<N;py++){
    for(var pxx=0;pxx<N;pxx++){
      var o=(py*N+pxx)*4, a=px[o+3];
      if(a<200) continue;
      if(px[o]+px[o+1]+px[o+2]<60) continue;
      rain.push(py*N+pxx);
    }
  }
  lg('   «дощових» пікселів у PNG (непрозорі, не чорні): '+rain.length);
  if(rain.length<300){ lg('⚠️ Замало дощу в зоні для надійної звірки. Повтори тест, коли над Тайванем є дощ.','wr'); return; }
  // 5) 4 комбінації: проєкція PNG × порядок рядків сітки
  var mT=tgMercY(LATN), mB=tgMercY(LATS);
  function geo(idx, merc){
    var py=Math.floor(idx/N), pxx=idx%N;
    var lon=LONW+(pxx+0.5)/N*(LONE-LONW);
    var t=(py+0.5)/N;
    var lat = merc ? tgInvMerc(mT-t*(mT-mB)) : (LATN-t*(LATN-LATS));
    return [lat,lon];
  }
  function gridAt(lat,lon,flip){
    var i=Math.round((lon-LON0)/RES), j=Math.round((lat-LAT0)/RES);
    if(i<0||i>=NX||j<0||j>=NY) return null;
    if(flip) j=NY-1-j;
    return gv[j*NX+i];
  }
  var combos=[['рівнокутна','sou→nor',false,false],['рівнокутна','nor→sou',false,true],['Меркатор','sou→nor',true,false],['Меркатор','nor→sou',true,true]];
  var step=Math.max(1,Math.floor(rain.length/20000)), bestC=null, bestScore=-1;
  combos.forEach(function(cb){
    var hit=0, tot=0;
    for(var k=0;k<rain.length;k+=step){
      var g=geo(rain[k],cb[2]), v=gridAt(g[0],g[1],cb[3]);
      if(v===null) continue; tot++;
      if(v>=10) hit++;
    }
    var sc=tot?hit/tot:0;
    lg('   проєкція PNG: '+cb[0]+', рядки сітки '+cb[1]+' → збіг '+(sc*100).toFixed(1)+'% (дощових пікселів PNG, під якими в сітці ≥10 dBZ)', sc>0.6?'ok':'');
    if(sc>bestScore){ bestScore=sc; bestC=cb; }
  });
  lg('   ▶ Найкраща комбінація: '+bestC[0]+' + '+bestC[1]+' ('+(bestScore*100).toFixed(1)+'%)', bestScore>0.6?'ok':'wr');
  if(bestScore<0.6) lg('   ⚠️ Збіг низький — або час даних різний, або дощу мало, або проєкція інша. Не довіряти палітрі нижче без повтору.','wr');
  // 6) палітра: колір → dBZ (за найкращою комбінацією)
  var pal={};
  for(var k2=0;k2<rain.length;k2++){
    var idx=rain[k2], o2=idx*4;
    var g2=geo(idx,bestC[2]), v2=gridAt(g2[0],g2[1],bestC[3]);
    if(v2===null || v2<=-900) continue;
    var key=px[o2]+','+px[o2+1]+','+px[o2+2];
    var e=pal[key]; if(!e){ e=pal[key]={n:0,sum:0,mn:1e9,mx:-1e9}; }
    e.n++; e.sum+=v2; if(v2<e.mn) e.mn=v2; if(v2>e.mx) e.mx=v2;
  }
  var keysP=Object.keys(pal);
  var totN=0; keysP.forEach(function(k){ totN+=pal[k].n; });
  lg('   різних кольорів серед дощових пікселів: '+keysP.length);
  var rows=keysP.filter(function(k){ return pal[k].n>=Math.max(5,totN*0.002); }).map(function(k){ var e=pal[k]; return {k:k,n:e.n,mean:e.sum/e.n,mn:e.mn,mx:e.mx}; });
  rows.sort(function(a,b){ return a.mean-b.mean; });
  lg('   ПАЛІТРА (колір R,G,B → середній dBZ у сітці [мін…макс], кількість), за зростанням dBZ:');
  rows.slice(0,40).forEach(function(r){ lg('     '+r.k+' → '+r.mean.toFixed(1)+' ['+r.mn.toFixed(0)+'…'+r.mx.toFixed(0)+'], n='+r.n); });
  lg('   Зверніть увагу: вузький діапазон [мін…макс] для кольору означає, що колір однозначно відповідає рівню.');
  // 7) простий підсумок: скільки пікселів PNG без дощу в сітці (хибні)
  var fp2=0, ck=0;
  for(var k3=0;k3<rain.length;k3+=step){ var g3=geo(rain[k3],bestC[2]), v3=gridAt(g3[0],g3[1],bestC[3]); if(v3===null) continue; ck++; if(v3<5) fp2++; }
  lg('   Дощових пікселів PNG, де в сітці майже сухо (<5 dBZ): '+(ck?(fp2*100/ck).toFixed(1):'?')+'% (мало = добре)');
  lg('   Загалом '+((Date.now()-t00)/1000).toFixed(0)+' с','ok');
  lg('\nНадішли звіт: за ним зафіксую проєкцію і таблицю «колір → мм/год» для застосунку.','wr');
}

async function testGrid(){
  lg('— СІТКА QPESUMS O-A0059-001 —','wr');
  var d=await call(GRID_ID,'',true);
  if(!d) return;
  lg('   верхній рівень: '+keys(d));
  var f={urls:[],fields:[]}; scan(d,'',f,0);
  f.fields.slice(0,30).forEach(function(x){ lg('   '+x[0]+' = '+x[1]); });
  var best=longestString(d,0,{len:0,val:''});
  lg('   найдовший рядок: '+best.len+' символів');
  if(best.len>1000){
    var vals=best.val.split(/[\s,]+/).filter(function(v){ return v!==''; }).map(parseFloat);
    var mn=1e9,mx=-1e9,over=0,bad=0;
    vals.forEach(function(v){ if(isNaN(v)){ bad++; return; } if(v<mn) mn=v; if(v>mx) mx=v; if(v>15) over++; });
    lg('   значень: '+vals.length+' (не числа: '+bad+'), мін '+mn+', макс '+mx+', понад 15: '+over);
    lg('   перші 12: '+vals.slice(0,12).join(', '));
    lg('   очікувано X*Y: див. GridDimensionX/Y вище','wr');
  }
}

function dist(a,b,c,d){ var t=Math.PI/180,R=6371,dl=(c-a)*t,dn=(d-b)*t; var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dn/2)*Math.sin(dn/2); return 2*R*Math.asin(Math.sqrt(x)); }

function getPos(){
  return new Promise(function(res){
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(function(p){ res([p.coords.latitude,p.coords.longitude]); }, function(){ res(null); }, {enableHighAccuracy:false,timeout:6000});
  });
}

async function testRain(){
  lg('— ДОЩОМІРИ —','wr');
  var d=await call(RAIN_ID);
  if(!d) return;
  lg('   success: '+d.success+'; верхній рівень: '+keys(d));
  var recs=d.records||{};
  lg('   records: '+keys(recs));
  var arr=recs.Station||recs.station||recs.location||[];
  lg('   станцій: '+arr.length);
  if(!arr.length){ lg('   '+JSON.stringify(d).slice(0,400)); return; }
  lg('   приклад: '+JSON.stringify(arr[0]).slice(0,500));
  var pos=await getPos();
  if(!pos){ lg('   (геолокація недоступна — найближчу станцію не рахую)','wr'); return; }
  var best=null,bd=1e9;
  arr.forEach(function(s){
    var g=s.GeoInfo||{}; var la=parseFloat(g.Coordinates&&g.Coordinates[0]?g.Coordinates[0].StationLatitude:s.StationLatitude);
    var lo=parseFloat(g.Coordinates&&g.Coordinates[0]?g.Coordinates[0].StationLongitude:s.StationLongitude);
    if(isNaN(la)||isNaN(lo)) return;
    var dd=dist(pos[0],pos[1],la,lo); if(dd<bd){ bd=dd; best=s; }
  });
  if(best) lg('   Найближча станція: '+(best.StationName||best.stationName||'?')+', '+bd.toFixed(1)+' км\n   '+JSON.stringify(best.RainfallElement||best.weatherElement||best).slice(0,400),'ok');
  else lg('   Координати станцій не розпізнано — див. приклад вище','wr');
}

function copyReport(){
  var safe=report.replace(/CWA-[A-Z0-9-]{8,}/g,'CWA-***');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(safe).then(function(){ alert('Скопійовано (ключ приховано)'); }, function(){ fallbackCopy(safe); });
  } else fallbackCopy(safe);
}
function fallbackCopy(t){
  var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); alert('Скопійовано (ключ приховано)'); }catch(e){ alert('Не вдалось скопіювати — виділіть текст вручну'); }
  document.body.removeChild(ta);
}
