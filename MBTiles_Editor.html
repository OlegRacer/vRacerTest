<script>
// ── ЯДРО (без UI; тестується в node) ──
const KEYMUL = 2097152; // 2^21: ключ тайла = x*KEYMUL + tms_row
const tkey = (x, row) => x * KEYMUL + row;
function lonLatToN(lon, lat){ const s=Math.sin(lat*Math.PI/180); return [(lon+180)/360, 0.5-Math.log((1+s)/(1-s))/(4*Math.PI)]; }
function pointInPoly(px, py, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function polyBBox(poly){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const p of poly){ if(p[0]<a)a=p[0]; if(p[0]>c)c=p[0]; if(p[1]<b)b=p[1]; if(p[1]>d)d=p[1]; }
  return [a,b,c,d];
}
function polyArea(poly){ let s=0; for(let i=0,j=poly.length-1;i<poly.length;j=i++) s+=(poly[j][0]*poly[i][1]-poly[i][0]*poly[j][1]); return Math.abs(s)/2; }
function qAll(db, sql, params){
  const st=db.prepare(sql);
  try{ if(params) st.bind(params); const out=[]; while(st.step()) out.push(st.get()); return out; }
  finally{ st.free(); }
}
// 'table' | 'view' | null (нема tiles)
function dbTilesKind(db){
  const r=db.exec("SELECT type FROM sqlite_master WHERE name='tiles'");
  if(!r.length || !r[0].values.length) return null;
  return r[0].values[0][0]==='view' ? 'view' : 'table';
}
// Без індексу кожен DELETE = повний прохід по таблиці. Додаємо, лише якщо індексів нема взагалі.
function ensureIndex(db, kind){
  if(kind!=='table') return false;
  const r=db.exec("PRAGMA index_list(tiles)");
  if(r.length && r[0].values.length) return false;
  db.run("CREATE INDEX IF NOT EXISTS idx_tiles_zxy ON tiles(zoom_level,tile_column,tile_row)");
  return true;
}
function dbStats(db){
  const rows=qAll(db,"SELECT zoom_level,COUNT(*),COALESCE(SUM(LENGTH(tile_data)),0) FROM tiles GROUP BY zoom_level ORDER BY zoom_level");
  const zooms={}; let total=0, bytes=0, minZ=null, maxZ=null;
  for(const r of rows){ zooms[r[0]]={n:r[1],bytes:r[2]}; total+=r[1]; bytes+=r[2]; if(minZ===null||r[0]<minZ)minZ=r[0]; if(maxZ===null||r[0]>maxZ)maxZ=r[0]; }
  return {zooms,total,bytes,minZ,maxZ};
}
// Зібрати тайли (існуючі в базі), центр яких лежить у будь-якій із зон, на вказаних зумах.
// zones: [{poly:[[nx,ny],...]}] у нормалізованих меркаторських координатах 0..1.
function collectTiles(db, zones, zooms){
  const per={}; let total=0, bytes=0;
  for(const z of zooms){
    const N=Math.pow(2,z), found=new Map();
    for(const zone of zones){
      const bb=zone.bbox||(zone.bbox=polyBBox(zone.poly));
      const x0=Math.max(0,Math.floor(bb[0]*N)), x1=Math.min(N-1,Math.floor(bb[2]*N));
      const y0=Math.max(0,Math.floor(bb[1]*N)), y1=Math.min(N-1,Math.floor(bb[3]*N));
      if(x1<x0||y1<y0) continue;
      const st=db.prepare("SELECT tile_column,tile_row,LENGTH(tile_data) FROM tiles WHERE zoom_level=? AND tile_column BETWEEN ? AND ? AND tile_row BETWEEN ? AND ?");
      try{
        st.bind([z,x0,x1,N-1-y1,N-1-y0]);
        while(st.step()){
          const r=st.get(), y=N-1-r[1];
          if(pointInPoly((r[0]+0.5)/N,(y+0.5)/N,zone.poly)) found.set(tkey(r[0],r[1]),[r[0],r[1],r[2]||0]);
        }
      } finally { st.free(); }
    }
    let b=0; for(const v of found.values()) b+=v[2];
    per[z]={rows:Array.from(found.values()), n:found.size, bytes:b};
    total+=found.size; bytes+=b;
  }
  return {per,total,bytes};
}
const _tick=()=>new Promise(r=>setTimeout(r,0));
async function deleteTiles(db, kind, per, onProgress){
  const tbl = kind==='view' ? 'map' : 'tiles';
  let done=0, all=0; for(const z in per) all+=per[z].n;
  db.run('BEGIN');
  try{
    const st=db.prepare('DELETE FROM '+tbl+' WHERE zoom_level=? AND tile_column=? AND tile_row=?');
    try{
      for(const z in per){
        for(const r of per[z].rows){
          st.run([+z,r[0],r[1]]); done++;
          if(done%4000===0){ if(onProgress) onProgress(done,all); await _tick(); }
        }
      }
    } finally { st.free(); }
    if(kind==='view') db.run('DELETE FROM images WHERE tile_id NOT IN (SELECT tile_id FROM map)');
    db.run('COMMIT');
  }catch(e){ try{db.run('ROLLBACK');}catch(_){ } throw e; }
  return done;
}

</script>
<script>
'use strict';
// ───────── sql.js: JS+wasm кешуються в IndexedDB, тож після першого запуску працює офлайн ─────────
const SQLJS_CDN='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/';
function kvOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('mbedit',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function kvGet(k){ try{ const d=await kvOpen(); return await new Promise(res=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function kvSet(k,v){ try{ const d=await kvOpen(); await new Promise(res=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
let SQL=null;
async function ensureSql(){
  if(SQL) return SQL;
  let js=await kvGet('sqljs'), wasm=await kvGet('sqlwasm');
  if(!js||!wasm){
    toast('Перший запуск: завантажую sql.js (потрібен інтернет)…',0);
    const r=await Promise.all([fetch(SQLJS_CDN+'sql-wasm.js'), fetch(SQLJS_CDN+'sql-wasm.wasm')]);
    if(!r[0].ok||!r[1].ok) throw new Error('не вдалося завантажити sql.js');
    js=await r[0].text(); wasm=await r[1].arrayBuffer();
    kvSet('sqljs',js); kvSet('sqlwasm',wasm);
  }
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=URL.createObjectURL(new Blob([js],{type:'text/javascript'})); s.onload=res; s.onerror=()=>rej(new Error('sql.js не запустився')); document.head.appendChild(s); });
  const wurl=URL.createObjectURL(new Blob([wasm],{type:'application/wasm'}));
  SQL=await initSqlJs({locateFile:f=>f.endsWith('.wasm')?wurl:f});
  toast('',-1);
  return SQL;
}

// ───────── стан ─────────
const $=id=>document.getElementById(id);
const S={db:null,kind:null,name:'',size:0,stats:null,zones:[],mode:'pan',showTiles:true,scope:'cur',dirty:false,cov:new Map(),outBlob:null,tstmt:null};
const V={cx:0.5,cy:0.5,z:4};
let W=0,H=0,DPR=1,zid=0;
const covLoading=new Set(), IMG=new Map(), inflight=new Set();
let Q=[];
const fmt=n=>Number(n).toLocaleString('uk');
const mb=b=>(b/1048576).toFixed(1);
const tick=ms=>new Promise(r=>setTimeout(r,ms||0));
let toastT=0;
function toast(msg,ms){ const t=$('toast'); clearTimeout(toastT); if(ms<0||!msg){t.style.display='none';return;} t.textContent=msg; t.style.display='block'; if(ms!==0) toastT=setTimeout(()=>t.style.display='none',ms||2500); }
function setBar(p){ const b=$('bar'); if(p==null){b.style.display='none';return;} b.style.display='block'; b.firstChild.style.width=Math.round(p*100)+'%'; }

// ───────── полотно ─────────
const cv=$('cv'), ctx=cv.getContext('2d');
let _raf=0;
function dirty(){ if(!_raf) _raf=requestAnimationFrame(render); }
function resize(){ DPR=window.devicePixelRatio||1; W=cv.clientWidth; H=cv.clientHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); dirty(); }
window.addEventListener('resize',resize);
const SC=()=>256*Math.pow(2,V.z);
const nToScr=(nx,ny)=>{ const s=SC(); return [(nx-V.cx)*s+W/2,(ny-V.cy)*s+H/2]; };
const scrToN=(px,py)=>{ const s=SC(); return [V.cx+(px-W/2)/s, V.cy+(py-H/2)/s]; };
const tileZoom=()=>S.stats? Math.max(S.stats.minZ,Math.min(S.stats.maxZ,Math.round(V.z))) : 0;

// ───────── покриття (множина існуючих тайлів на зумі) ─────────
function resetStmts(){ try{ if(S.tstmt) S.tstmt.free(); }catch(e){} S.tstmt=null; }
function getCov(zt){
  if(S.cov.has(zt)) return S.cov.get(zt);
  if(!covLoading.has(zt) && S.db) loadCov(zt);
  return null;
}
async function loadCov(zt){
  const db=S.db; covLoading.add(zt);
  let st=null; const set=new Set(); let n=0;
  try{
    toast('Завантажую покриття зуму '+zt+'…',0);
    st=db.prepare('SELECT tile_column,tile_row FROM tiles WHERE zoom_level=?'); st.bind([zt]);
    while(st.step()){ const r=st.get(); set.add(tkey(r[0],r[1])); if(++n%100000===0) await tick(); if(S.db!==db) return; }
    S.cov.set(zt,set);
    while(S.cov.size>3){ const k=S.cov.keys().next().value; if(k===zt) break; S.cov.delete(k); }
  }catch(e){ console.warn('loadCov',e); }
  finally{ try{ if(st) st.free(); }catch(e){} covLoading.delete(zt); if(!covLoading.size) toast('',-1); dirty(); updateInfo(); }
}
async function idleCov(){ while(covLoading.size) await tick(50); }

// ───────── картинки тайлів ─────────
function readTile(z,x,y){
  if(!S.tstmt) S.tstmt=S.db.prepare('SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=?');
  const st=S.tstmt; st.bind([z,x,(1<<z)-1-y]);
  let d=null; if(st.step()) d=st.get()[0]; st.reset(); return d;
}
function pumpQueue(){
  let n=0;
  while(Q.length && n<6){
    const j=Q.shift(); if(IMG.has(j.k)||inflight.has(j.k)) continue; n++;
    let bytes=null; try{ bytes=readTile(j.z,j.x,j.y); }catch(e){ bytes=null; }
    if(!bytes){ IMG.set(j.k,null); continue; }
    inflight.add(j.k);
    createImageBitmap(new Blob([bytes])).then(b=>{ IMG.set(j.k,b); }).catch(()=>{ IMG.set(j.k,null); }).finally(()=>{ inflight.delete(j.k); dirty(); });
  }
  while(IMG.size>600){ const k=IMG.keys().next().value; const b=IMG.get(k); try{ if(b&&b.close) b.close(); }catch(e){} IMG.delete(k); }
  if(Q.length) dirty();
}
function clearImgs(){ IMG.forEach(b=>{ try{ if(b&&b.close) b.close(); }catch(e){} }); IMG.clear(); Q=[]; }

// ───────── превʼю зони: які існуючі тайли потраплять під видалення на зумі zt ─────────
function zonePrev(zone,zt,cov){
  zone.prev=zone.prev||{};
  if(zone.prev[zt]) return zone.prev[zt];
  const N=Math.pow(2,zt), bb=zone.bbox||(zone.bbox=polyBBox(zone.poly));
  const x0=Math.max(0,Math.floor(bb[0]*N)), x1=Math.min(N-1,Math.floor(bb[2]*N));
  const y0=Math.max(0,Math.floor(bb[1]*N)), y1=Math.min(N-1,Math.floor(bb[3]*N));
  const out=new Set();
  if(x1>=x0 && y1>=y0){
    const area=(x1-x0+1)*(y1-y0+1);
    const test=(x,row)=>{ const y=N-1-row; if(pointInPoly((x+0.5)/N,(y+0.5)/N,zone.poly)) out.add(tkey(x,row)); };
    if(area<=cov.size){ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){ const row=N-1-y; if(cov.has(tkey(x,row))) test(x,row); } }
    else { for(const k of cov){ const x=Math.floor(k/KEYMUL), row=k-x*KEYMUL, y=N-1-row; if(x>=x0&&x<=x1&&y>=y0&&y<=y1) test(x,row); } }
  }
  zone.prev[zt]=out; return out;
}
function clearPrev(){ S.zones.forEach(z=>{ z.prev={}; }); }
function curPrevUnion(){
  const zt=tileZoom(), cov=S.cov.get(zt); if(!cov) return null;
  const u=new Set(); S.zones.forEach(z=>{ zonePrev(z,zt,cov).forEach(k=>u.add(k)); }); return u;
}

// ───────── малювання ─────────
let maskC=null;
function render(){
  _raf=0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#14161a'; ctx.fillRect(0,0,W,H);
  if(!S.db){ ctx.fillStyle='#667'; ctx.font='16px system-ui'; ctx.textAlign='center'; ctx.fillText('Відкрийте файл .mbtiles',W/2,H/2); return; }
  const sc=SC(), zt=tileZoom(), N=Math.pow(2,zt), tp=sc/N;
  const nx0=V.cx-W/2/sc, nx1=V.cx+W/2/sc, ny0=V.cy-H/2/sc, ny1=V.cy+H/2/sc;
  const tx0=Math.max(0,Math.floor(nx0*N)), tx1=Math.min(N-1,Math.floor(nx1*N));
  const ty0=Math.max(0,Math.floor(ny0*N)), ty1=Math.min(N-1,Math.floor(ny1*N));
  const cnt=(tx1-tx0+1)*(ty1-ty0+1);
  const ox=(V.cx)*sc-W/2, oy=(V.cy)*sc-H/2; // світові піксельні координати лівого верхнього кута екрана
  const cov=getCov(zt);
  const visible=(set,cb)=>{
    if(!set||cnt<=0) return;
    if(cnt<=set.size){ for(let y=ty0;y<=ty1;y++) for(let x=tx0;x<=tx1;x++){ if(set.has(tkey(x,N-1-y))) cb(x,y); } }
    else { for(const k of set){ const x=Math.floor(k/KEYMUL), y=N-1-(k-x*KEYMUL); if(x>=tx0&&x<=tx1&&y>=ty0&&y<=ty1) cb(x,y); } }
  };
  const paint=(set,r,g,b,a)=>{
    if(tp>=3){ ctx.fillStyle='rgba('+r+','+g+','+b+','+a+')'; visible(set,(x,y)=>ctx.fillRect(x*tp-ox,y*tp-oy,tp+0.4,tp+0.4)); return; }
    // дрібні тайли — через піксельну маску (швидко навіть для сотень тисяч)
    if(!maskC||maskC.width!==Math.ceil(W)||maskC.height!==Math.ceil(H)){ maskC=document.createElement('canvas'); maskC.width=Math.ceil(W); maskC.height=Math.ceil(H); }
    const mc=maskC.getContext('2d'), id=mc.createImageData(maskC.width,maskC.height), d=id.data, w=maskC.width, h=maskC.height, s=Math.max(1,Math.ceil(tp)), al=Math.round(a*255);
    visible(set,(x,y)=>{ const px=Math.floor(x*tp-ox), py=Math.floor(y*tp-oy);
      for(let j=0;j<s;j++){ const yy=py+j; if(yy<0||yy>=h) continue; for(let i=0;i<s;i++){ const xx=px+i; if(xx<0||xx>=w) continue; const o=(yy*w+xx)*4; d[o]=r; d[o+1]=g; d[o+2]=b; d[o+3]=al; } } });
    mc.putImageData(id,0,0); ctx.drawImage(maskC,0,0);
  };
  // 1) картинки тайлів
  Q=[];
  const imgOn=S.showTiles && V.z>=S.stats.minZ-0.5 && cov && cnt>0 && cnt<=400;
  if(imgOn){
    visible(cov,(x,y)=>{
      const k=zt+'/'+x+'/'+y, im=IMG.get(k);
      if(im===undefined){ Q.push({k:k,z:zt,x:x,y:y}); return; }
      if(im) ctx.drawImage(im,x*tp-ox,y*tp-oy,tp+0.5,tp+0.5);
    });
  }
  // 2) покриття червоним
  if(cov) paint(cov,255,40,40,imgOn?0.22:0.55);
  // 3) що піде під видалення (жовтим)
  if(cov && S.zones.length){
    const u=new Set();
    if(S.scope==='cur'||true){ S.zones.forEach(z=>{ zonePrev(z,zt,cov).forEach(k=>u.add(k)); }); }
    paint(u,255,214,10,0.65);
  }
  // 4) контури зон
  S.zones.forEach(z=>{
    ctx.beginPath(); z.poly.forEach((p,i)=>{ const q=nToScr(p[0],p[1]); if(i) ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]); }); ctx.closePath();
    ctx.fillStyle='rgba(255,214,10,0.10)'; ctx.fill(); ctx.setLineDash([7,5]); ctx.lineWidth=2; ctx.strokeStyle='#ffd60a'; ctx.stroke(); ctx.setLineDash([]);
  });
  if(lasso && lasso.length>1){
    ctx.beginPath(); lasso.forEach((p,i)=>{ const q=nToScr(p[0],p[1]); if(i) ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]); });
    ctx.lineWidth=3; ctx.strokeStyle='#38d0ff'; ctx.stroke();
  }
  // легенда масштабу
  ctx.fillStyle='#fff9'; ctx.font='11px system-ui'; ctx.textAlign='left'; ctx.fillText('z '+V.z.toFixed(1)+' · тайли z'+zt+(cov?'':' (вантажу…)'),8,H-175);
  pumpQueue();
}

// ───────── жести ─────────
const P=new Map(); let lasso=null, pinch=null;
const clampV=()=>{ V.z=Math.max(3,Math.min(21,V.z)); V.cy=Math.max(0,Math.min(1,V.cy)); };
cv.addEventListener('pointerdown',e=>{
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  P.set(e.pointerId,[e.clientX,e.clientY]);
  if(P.size===1){ if(S.mode==='draw'&&S.db) lasso=[scrToN(e.clientX,e.clientY)]; }
  else if(P.size===2){ lasso=null; const a=[...P.values()]; pinch={mid:[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2],dist:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1}; }
  dirty();
});
cv.addEventListener('pointermove',e=>{
  if(!P.has(e.pointerId)) return;
  const old=P.get(e.pointerId); P.set(e.pointerId,[e.clientX,e.clientY]);
  if(P.size===1){
    if(lasso){ const last=nToScr(lasso[lasso.length-1][0],lasso[lasso.length-1][1]); if(Math.hypot(e.clientX-last[0],e.clientY-last[1])>=4) lasso.push(scrToN(e.clientX,e.clientY)); }
    else { const s=SC(); V.cx-=(e.clientX-old[0])/s; V.cy-=(e.clientY-old[1])/s; clampV(); }
  } else if(P.size===2 && pinch){
    const a=[...P.values()], mid=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2], dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1;
    const n=scrToN(pinch.mid[0],pinch.mid[1]); V.z+=Math.log2(dist/pinch.dist); clampV();
    const s=SC(); V.cx=n[0]-(mid[0]-W/2)/s; V.cy=n[1]-(mid[1]-H/2)/s; clampV();
    pinch={mid:mid,dist:dist};
  }
  dirty();
});
const endPtr=e=>{
  if(!P.has(e.pointerId)) return;
  if(P.size===1 && lasso) finishLasso();
  P.delete(e.pointerId); if(P.size<2) pinch=null; dirty();
};
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',e=>{ lasso=null; endPtr(e); });
cv.addEventListener('wheel',e=>{ e.preventDefault(); const n=scrToN(e.clientX,e.clientY); V.z+=(e.deltaY<0?0.25:-0.25); clampV(); const s=SC(); V.cx=n[0]-(e.clientX-W/2)/s; V.cy=n[1]-(e.clientY-H/2)/s; clampV(); dirty(); },{passive:false});
function zoomBy(d){ V.z+=d; clampV(); dirty(); }
$('zIn').onclick=()=>zoomBy(0.5); $('zOut').onclick=()=>zoomBy(-0.5);

function finishLasso(){
  const pts=lasso; lasso=null;
  if(!pts||pts.length<8||polyArea(pts)*SC()*SC()<900){ toast('Замало — обведіть ширше',1800); return; }
  S.zones.push({id:++zid,poly:pts,prev:{}});
  toast('Зона '+S.zones.length+' додана',1200); updateInfo(); dirty();
}

// ───────── відкриття файлу ─────────
function fitView(){
  if(!S.db||!S.stats||S.stats.minZ==null) return;
  const z=S.stats.minZ, N=Math.pow(2,z);
  const r=qAll(S.db,'SELECT MIN(tile_column),MAX(tile_column),MIN(tile_row),MAX(tile_row) FROM tiles WHERE zoom_level='+z)[0];
  const xa=r[0]/N, xb=(r[1]+1)/N, ya=(N-1-r[3])/N, yb=(N-r[2])/N;
  V.cx=(xa+xb)/2; V.cy=(ya+yb)/2;
  const need=Math.min(W/Math.max(xb-xa,1e-9), (H-200)/Math.max(yb-ya,1e-9))*0.9;
  V.z=Math.max(3,Math.min(21,Math.log2(need/256))); dirty();
}
$('f').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  if(S.dirty && !confirm('Є незбережені зміни в поточному файлі. Відкрити інший?')){ e.target.value=''; return; }
  try{
    toast('Читаю файл…',0); setBar(0.1);
    await ensureSql();
    const buf=await f.arrayBuffer(); setBar(0.5); toast('Відкриваю базу…',0); await tick(30);
    const db=new SQL.Database(new Uint8Array(buf));
    const kind=dbTilesKind(db); if(!kind){ db.close(); throw new Error('у файлі нема таблиці tiles — це не .mbtiles'); }
    if(S.db){ resetStmts(); try{S.db.close();}catch(_){ } }
    clearImgs(); S.cov.clear(); S.zones=[]; S.outBlob=null; $('bShare').style.display='none';
    S.db=db; S.kind=kind; S.name=f.name; S.size=f.size; S.dirty=false;
    if(ensureIndex(db,kind)) toast('Додано індекс для швидкого видалення',1800);
    S.stats=dbStats(db); setBar(null);
    $('fn').textContent=f.name+' · '+mb(f.size)+' МБ · '+fmt(S.stats.total)+' тайлів · z'+S.stats.minZ+'–'+S.stats.maxZ;
    fitView(); updateInfo(); toast('Готово',1200);
  }catch(err){ setBar(null); console.error(err); toast('Помилка: '+err.message,6000); }
  e.target.value='';
};

// ───────── інтерфейс ─────────
function updateInfo(){
  let t='';
  if(!S.db){ $('info').textContent='Відкрийте .mbtiles — червоним покажу, де є тайли.'; return; }
  t+='Зон: '+S.zones.length;
  const u=curPrevUnion();
  if(S.zones.length){ t+=u? ' · на поточному зумі (z'+tileZoom()+') під видалення: '+fmt(u.size)+' тайлів' : ' · рахую…'; }
  t+=S.scope==='cur' ? '\nВидалення: ЛИШЕ зум z'+tileZoom()+' (змінюється разом із наближенням)' : '\nВидалення: УСІ зуми z'+S.stats.minZ+'–'+S.stats.maxZ;
  if(S.dirty) t+='\n⚠️ Є незбережені зміни — натисніть «Підготувати файл»';
  $('info').innerText=t;
}
$('bPan').onclick=()=>{ S.mode='pan'; $('bPan').classList.add('on'); $('bDraw').classList.remove('on'); };
$('bDraw').onclick=()=>{ S.mode='draw'; $('bDraw').classList.add('on'); $('bPan').classList.remove('on'); toast('Обведіть пальцем зону. Двома пальцями — масштаб і рух.',2600); };
$('bScope').onclick=()=>{ S.scope=S.scope==='cur'?'all':'cur'; $('bScope').textContent=S.scope==='cur'?'Зум: поточний':'Зум: усі'; updateInfo(); };
$('bTiles').onclick=()=>{ S.showTiles=!S.showTiles; $('bTiles').classList.toggle('on',S.showTiles); dirty(); };
$('bFit').onclick=fitView;
$('bUndo').onclick=()=>{ S.zones.pop(); updateInfo(); dirty(); };
function showModal(html){ $('mbody').innerHTML=html; $('modal').style.display='flex'; }
$('mOk').onclick=()=>{ $('modal').style.display='none'; };
$('bStat').onclick=()=>{
  if(!S.db){ toast('Спершу відкрийте файл'); return; }
  let h='<b>'+S.name+'</b><br><span style="color:#999">'+mb(S.size)+' МБ на диску</span><table><tr><th>Зум</th><th>Тайлів</th><th>МБ</th></tr>';
  for(const z in S.stats.zooms) h+='<tr><td>z'+z+'</td><td>'+fmt(S.stats.zooms[z].n)+'</td><td>'+mb(S.stats.zooms[z].bytes)+'</td></tr>';
  h+='<tr><th>Разом</th><th>'+fmt(S.stats.total)+'</th><th>'+mb(S.stats.bytes)+'</th></tr></table>';
  showModal(h);
};
function targetZooms(){
  if(S.scope==='cur') return [tileZoom()];
  const out=[]; for(let z=S.stats.minZ;z<=S.stats.maxZ;z++) if(S.stats.zooms[z]) out.push(z); return out;
}
function resTable(res){
  let h='<table><tr><th>Зум</th><th>Тайлів</th><th>МБ</th></tr>';
  for(const z in res.per) h+='<tr><td>z'+z+'</td><td>'+fmt(res.per[z].n)+'</td><td>'+mb(res.per[z].bytes)+'</td></tr>';
  return h+'<tr><th>Разом</th><th>'+fmt(res.total)+'</th><th>'+mb(res.bytes)+'</th></tr></table>';
}
function needZones(){ if(!S.db){ toast('Спершу відкрийте файл'); return false; } if(!S.zones.length){ toast('Спершу обведіть зону (✏️)'); return false; } return true; }
$('bCount').onclick=async()=>{
  if(!needZones()) return;
  toast('Рахую…',0); await tick(30);
  try{ const res=collectTiles(S.db,S.zones,targetZooms()); toast('',-1); showModal('<b>Під видалення потрапить</b>'+resTable(res)+'<span style="color:#999;font-size:12px">Тайл видаляється, якщо його центр лежить усередині зони.</span>'); }
  catch(e){ toast('Помилка: '+e.message,6000); }
};
let busy=false;
$('bDel').onclick=async()=>{
  if(!needZones()||busy) return;
  busy=true;
  try{
    await idleCov(); toast('Рахую…',0); await tick(30);
    const res=collectTiles(S.db,S.zones,targetZooms()); toast('',-1);
    if(!res.total){ toast('У зонах тайлів нема'); return; }
    if(!confirm('Видалити '+fmt(res.total)+' тайлів (~'+mb(res.bytes)+' МБ) у '+S.zones.length+' зонах?\nУ файл на диску нічого не пишеться, доки ви не збережете новий.')) return;
    setBar(0); 
    await deleteTiles(S.db,S.kind,res.per,(d,a)=>{ setBar(d/a); toast('Видаляю '+fmt(d)+' / '+fmt(a),0); });
    setBar(null); toast('Видалено '+fmt(res.total),2500);
    S.stats=dbStats(S.db); S.dirty=true; S.zones=[]; S.cov.clear(); clearImgs(); S.outBlob=null; $('bShare').style.display='none';
    $('fn').textContent=S.name+' · '+fmt(S.stats.total)+' тайлів · ~'+mb(S.stats.bytes)+' МБ даних (змінено)';
    updateInfo(); dirty();
  }catch(e){ setBar(null); console.error(e); toast('Помилка: '+e.message,7000); }
  finally{ busy=false; }
};
// Збереження — двокроково (iOS): «Підготувати» (VACUUM + export) → «Поділитися» (один share у дотику)
$('bSave').onclick=async()=>{
  if(!S.db||busy){ if(!S.db) toast('Спершу відкрийте файл'); return; }
  busy=true;
  try{
    await idleCov(); toast('Стискаю базу (VACUUM)…',0); setBar(0.3); await tick(50);
    let vac=true; try{ S.db.run('VACUUM'); }catch(e){ vac=false; console.warn('VACUUM',e); }
    setBar(0.6); await tick(30);
    resetStmts();
    const bytes=S.db.export(); resetStmts();
    let nm=S.name.replace(/\.mbtiles$/i,'')+'_edited.mbtiles';
    S.outBlob=new Blob([bytes],{type:'application/octet-stream'}); S.outName=nm;
    setBar(null); toast('',-1);
    $('bShare').style.display=''; $('bShare').textContent='📤 Поділитися ('+mb(S.outBlob.size)+' МБ)';
    showModal('Файл готовий: <b>'+nm+'</b><br>'+mb(S.outBlob.size)+' МБ (було '+mb(S.size)+' МБ)'+(vac?'':'<br><span style="color:#ffb340">VACUUM не вдався (мало памʼяті) — файл збережено без стиснення, розмір не зменшиться.</span>')+'<br><br>Тепер натисніть «📤 Поділитися» → «Зберегти у Файли».');
  }catch(e){ setBar(null); console.error(e); toast('Помилка: '+e.message,7000); }
  finally{ busy=false; }
};
$('bShare').onclick=async()=>{
  if(!S.outBlob) return;
  try{
    const file=new File([S.outBlob],S.outName,{type:'application/octet-stream'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); S.dirty=false; updateInfo(); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(S.outBlob); a.download=S.outName; document.body.appendChild(a); a.click(); a.remove(); S.dirty=false; updateInfo(); }
  }catch(e){ if(e.name!=='AbortError') toast('Не вдалося поділитись: '+e.message,6000); }
};
window.addEventListener('beforeunload',e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });
resize(); updateInfo();
</script>
</body>
</html>
